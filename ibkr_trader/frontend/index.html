function ManualTraderTab() {
  const [status,  setStatus]  = useState(null);
  const [loading, setLoading] = useState(true);
  const [addOpen, setAddOpen] = useState(false);
  const emptyLeg = () => ({local_symbol:"", ticker:"", expiry:"", strike:"", right:"C", action:"BUY", qty:1, fill_price:"", multiplier:100});
  const [form, setForm] = useState({
    name:"", ticker:"", strategy:"iron_condor", expiry:"",
    profit_target_usd:"", stop_loss_usd:"", hard_close_time:"15:45", notes:"",
    legs: [emptyLeg(), emptyLeg(), emptyLeg(), emptyLeg()],
  });

  const load = async () => {
    try { setStatus(await apiFetch("/manual-trader/status")); }
    catch(_e) {}
    finally { setLoading(false); }
  };
  useEffect(() => { load(); const id = setInterval(load, 10000); return () => clearInterval(id); }, []);

  const toggle    = async () => {
    await apiFetch("/manual-trader/enable", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({enabled:!status.enabled})});
    load();
  };
  const manualClose = async (pos_id) => {
    if (!confirm(`Close position ${pos_id}?`)) return;
    await apiFetch(`/manual-trader/positions/${pos_id}/close`, {method:"POST"});
    load();
  };
  const deletePos = async (pos_id) => {
    if (!confirm(`Delete (without closing) position ${pos_id}?`)) return;
    await apiFetch(`/manual-trader/positions/${pos_id}`, {method:"DELETE"});
    load();
  };
  const updateField = async (pos_id, field, val) => {
    const body = {[field]: val === "" ? null : parseFloat(val)};
    await apiFetch(`/manual-trader/positions/${pos_id}`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    load();
  };

  const pnlColor = v => v == null ? C.muted : v > 0 ? "#22c55e" : v < 0 ? "#ef4444" : C.muted;
  const actionColor = a => a === "REGISTERED" ? "#93c5fd" : a === "CLOSING" ? "#f59e0b"
                          : a === "CLOSED" ? "#4ade80" : a === "ERROR" ? "#f87171"
                          : a === "DELETED" ? "#a78bfa" : a === "MONITOR" ? "#475569" : C.muted;
  const reasonColor = r => !r ? C.muted : r.startsWith("profit") ? "#4ade80"
                          : r.startsWith("stop") ? "#ef4444" : r.startsWith("hard_close") ? "#f59e0b"
                          : r === "manual_close" ? "#a78bfa" : C.muted;

  if (loading) return <div style={{color:C.muted,...sans,fontSize:13}}>Loading...</div>;
  if (!status)  return <div style={{color:C.muted,...sans,fontSize:13}}>Backend unavailable</div>;

  const { enabled, positions, closed, decisions } = status;
  const openPositions  = Object.values(positions || {});
  const closedList     = [...(closed || [])].reverse().slice(0, 30);
  const totalLivePnl   = openPositions.reduce((s, p) => s + (p.live_pnl || 0), 0);
  // close_pnl is 0 when fills were empty (order didn't execute) — fall back to live_pnl (mark at close time)
  const effPnl = pos => {
    const hasFills = pos.close_fills && Object.keys(pos.close_fills).length > 0;
    return hasFills ? (pos.close_pnl ?? 0) : (pos.live_pnl ?? pos.close_pnl ?? 0);
  };
  const totalClosedPnl = closedList.reduce((s, p) => s + effPnl(p), 0);

  // ── Add Position Form helpers ────────────────────────────────────────────
  const setFormField = (k, v) => setForm(f => ({...f, [k]: v}));
  const setLegField  = (i, k, v) => setForm(f => { const legs=[...f.legs]; legs[i]={...legs[i],[k]:v}; return {...f, legs}; });
  const addLeg  = () => setForm(f => ({...f, legs:[...f.legs, emptyLeg()]}));
  const remLeg  = (i) => setForm(f => { const legs=f.legs.filter((_,j)=>j!==i); return {...f, legs}; });
  const submitPosition = async () => {
    const legsPayload = form.legs
      .filter(l => l.ticker && l.fill_price !== "")
      .map(l => ({
        local_symbol: l.local_symbol || `${l.ticker}_${l.expiry}_${l.action}`,
        ticker:       l.ticker,
        expiry:       l.expiry || null,
        strike:       l.strike ? parseFloat(l.strike) : null,
        right:        l.right  || null,
        action:       l.action,
        qty:          parseInt(l.qty) || 1,
        fill_price:   parseFloat(l.fill_price),
        multiplier:   parseInt(l.multiplier) || 100,
      }));
    const body = {
      name:              form.name,
      ticker:            form.ticker,
      strategy:          form.strategy,
      expiry:            form.expiry || null,
      legs:              legsPayload,
      profit_target_usd: form.profit_target_usd !== "" ? parseFloat(form.profit_target_usd) : null,
      stop_loss_usd:     form.stop_loss_usd     !== "" ? parseFloat(form.stop_loss_usd)     : null,
      hard_close_time:   form.hard_close_time   || null,
      notes:             form.notes             || null,
    };
    try {
      await apiFetch("/manual-trader/positions", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
      setAddOpen(false);
      load();
    } catch(e) { alert("Error adding position: " + e.message); }
  };

  const inpStyle = {background:"#1e293b", border:"1px solid #334155", borderRadius:4, color:C.white, padding:"4px 8px", fontSize:12, width:"100%", ...sans};
  const labelSt  = {fontSize:11, color:C.muted, ...sans, marginBottom:2};

  return (
    <div>
      {/* Header */}
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16}}>
        <div>
          <div style={{...sans, fontSize:17, fontWeight:700, color:C.white}}>Manual Trader</div>
          <div style={{...sans, fontSize:12, color:C.muted, marginTop:2}}>
            Track, monitor, and auto-exit any manually-placed position
          </div>
          <div style={{...sans, fontSize:11, color:"#fb923c", marginTop:2}}>
            Stop loss · Profit target · Hard close on expiry day · Multi-leg support
          </div>
        </div>
        <div style={{display:"flex", gap:10, alignItems:"center"}}>
          <div style={{...sans, fontSize:12, color:C.muted}}>
            {openPositions.length} open · Live P&L:&nbsp;
            <span style={{color:pnlColor(totalLivePnl), fontWeight:600}}>
              {totalLivePnl >= 0 ? "+" : ""}{totalLivePnl.toFixed(2)}
            </span>
          </div>
          <button onClick={() => setAddOpen(!addOpen)}
            style={{padding:"6px 14px", borderRadius:6, border:"none", cursor:"pointer",
                    background:"#3b82f6", color:"#fff", ...sans, fontSize:13, fontWeight:600}}>
            + Add Position
          </button>
          <button onClick={toggle}
            style={{padding:"6px 14px", borderRadius:6, border:"none", cursor:"pointer",
                    background: enabled ? "#22c55e22" : "#ef444422",
                    color: enabled ? "#4ade80" : "#ef4444", ...sans, fontSize:13, fontWeight:600,
                    border: `1px solid ${enabled ? "#4ade8044" : "#ef444444"}`}}>
            {enabled ? "Enabled" : "Disabled"}
          </button>
        </div>
      </div>

      {/* Add Position Form */}
      {addOpen && (
        <div style={{background:"#0f172a", border:"1px solid #1e3a5f", borderRadius:8, padding:16, marginBottom:20}}>
          <div style={{...sans, fontSize:14, fontWeight:700, color:"#93c5fd", marginBottom:12}}>
            Register New Position
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:10, marginBottom:12}}>
            {[["Name / Label","name","text"],["Underlying","ticker","text"],["Strategy","strategy","text"],["Expiry (YYYYMMDD)","expiry","text"]].map(([lbl,k,t]) => (
              <div key={k}>
                <div style={labelSt}>{lbl}</div>
                <input style={inpStyle} type={t} value={form[k]} onChange={e=>setFormField(k,e.target.value)} />
              </div>
            ))}
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:12}}>
            <div>
              <div style={labelSt}>Profit Target ($)</div>
              <input style={inpStyle} type="number" placeholder="e.g. 88" value={form.profit_target_usd}
                     onChange={e=>setFormField("profit_target_usd",e.target.value)} />
            </div>
            <div>
              <div style={labelSt}>Stop Loss ($ negative)</div>
              <input style={inpStyle} type="number" placeholder="e.g. -177" value={form.stop_loss_usd}
                     onChange={e=>setFormField("stop_loss_usd",e.target.value)} />
            </div>
            <div>
              <div style={labelSt}>Hard Close Time (HH:MM ET)</div>
              <input style={inpStyle} type="text" placeholder="15:45" value={form.hard_close_time}
                     onChange={e=>setFormField("hard_close_time",e.target.value)} />
            </div>
          </div>

          {/* Legs */}
          <div style={{...sans, fontSize:12, color:C.muted, marginBottom:6}}>Legs</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%", borderCollapse:"collapse", fontSize:12, ...sans}}>
              <thead>
                <tr style={{color:C.muted}}>
                  {["Local Symbol","Ticker","Expiry","Strike","Right","Action","Qty","Fill $","Mult",""].map(h=>(
                    <th key={h} style={{textAlign:"left", padding:"4px 6px", whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {form.legs.map((leg, i) => (
                  <tr key={i}>
                    {[["local_symbol","text","INTC 260724P00085000"],["ticker","text","INTC"],["expiry","text","20260724"],
                      ["strike","number","85"],["right","text","P/C"],
                      ["fill_price","number","1.57"],["multiplier","number","100"]
                    ].map(([k,t,ph]) => (
                      <td key={k} style={{padding:"3px 4px"}}>
                        <input style={{...inpStyle, width: k==="local_symbol" ? 160 : k==="ticker" ? 60 : 70}}
                               type={t} placeholder={ph} value={leg[k]}
                               onChange={e=>setLegField(i,k,e.target.value)} />
                      </td>
                    ))}
                    <td style={{padding:"3px 4px"}}>
                      <select style={{...inpStyle, width:60}} value={leg.action} onChange={e=>setLegField(i,"action",e.target.value)}>
                        <option>BUY</option><option>SELL</option>
                      </select>
                    </td>
                    <td style={{padding:"3px 4px"}}>
                      <input style={{...inpStyle, width:40}} type="number" value={leg.qty} onChange={e=>setLegField(i,"qty",e.target.value)} />
                    </td>
                    <td style={{padding:"3px 4px"}}>
                      <button onClick={()=>remLeg(i)}
                        style={{padding:"2px 8px", borderRadius:4, border:"none", cursor:"pointer", background:"#7f1d1d", color:"#fca5a5", ...sans, fontSize:11}}>
                        ✕
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{display:"flex", gap:8, marginTop:10}}>
            <button onClick={addLeg}
              style={{padding:"4px 12px", borderRadius:4, border:"1px solid #334155", cursor:"pointer", background:"transparent", color:C.muted, ...sans, fontSize:12}}>
              + Add Leg
            </button>
            <button onClick={submitPosition}
              style={{padding:"4px 16px", borderRadius:4, border:"none", cursor:"pointer", background:"#3b82f6", color:"#fff", ...sans, fontSize:12, fontWeight:600}}>
              Register
            </button>
            <button onClick={()=>setAddOpen(false)}
              style={{padding:"4px 12px", borderRadius:4, border:"1px solid #334155", cursor:"pointer", background:"transparent", color:C.muted, ...sans, fontSize:12}}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {/* Open Positions */}
      <div style={{...sans, fontSize:13, fontWeight:600, color:C.muted, marginBottom:8, textTransform:"uppercase", letterSpacing:1}}>
        Open Positions ({openPositions.length})
      </div>
      {openPositions.length === 0 ? (
        <div style={{...sans, fontSize:13, color:C.muted, marginBottom:20}}>No open positions. Use "+ Add Position" to register one.</div>
      ) : openPositions.map(pos => (
        <div key={pos.pos_id} style={{background:"#0f172a", border:"1px solid #1e3a5f", borderRadius:8, padding:14, marginBottom:12}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8}}>
            <div>
              <span style={{...sans, fontSize:14, fontWeight:700, color:"#93c5fd"}}>{pos.name}</span>
              <span style={{...sans, fontSize:11, color:C.muted, marginLeft:8}}>{pos.ticker} · {pos.strategy}</span>
              <span style={{...sans, fontSize:11, color:C.muted, marginLeft:8}}>entered {pos.entry_time ? new Date(pos.entry_time).toLocaleTimeString() : "—"}</span>
            </div>
            <div style={{display:"flex", gap:8, alignItems:"center"}}>
              <span style={{...sans, fontSize:15, fontWeight:700, color:pnlColor(pos.live_pnl)}}>
                {pos.live_pnl >= 0 ? "+" : ""}{(pos.live_pnl || 0).toFixed(2)}
              </span>
              <button onClick={()=>manualClose(pos.pos_id)}
                style={{padding:"3px 10px", borderRadius:4, border:"none", cursor:"pointer", background:"#7f1d1d", color:"#fca5a5", ...sans, fontSize:11, fontWeight:600}}>
                Close
              </button>
              <button onClick={()=>deletePos(pos.pos_id)}
                style={{padding:"3px 10px", borderRadius:4, border:"none", cursor:"pointer", background:"#1e293b", color:C.muted, ...sans, fontSize:11}}>
                Delete
              </button>
            </div>
          </div>
          {/* Legs table */}
          <div style={{overflowX:"auto", marginBottom:10}}>
            <table style={{width:"100%", borderCollapse:"collapse", fontSize:12, ...sans}}>
              <thead>
                <tr style={{color:C.muted, borderBottom:"1px solid #1e293b"}}>
                  {["Symbol","Action","Qty","Fill","Mult"].map(h=>(
                    <th key={h} style={{textAlign:"left", padding:"3px 8px"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(pos.legs||[]).map((leg,i) => (
                  <tr key={i} style={{borderBottom:"1px solid #0f172a"}}>
                    <td style={{padding:"3px 8px", color:C.white}}>{leg.local_symbol}</td>
                    <td style={{padding:"3px 8px", color: leg.action==="BUY"?"#4ade80":"#f87171"}}>{leg.action}</td>
                    <td style={{padding:"3px 8px", color:C.muted}}>{leg.qty}</td>
                    <td style={{padding:"3px 8px", color:C.white}}>${(leg.fill_price||0).toFixed(2)}</td>
                    <td style={{padding:"3px 8px", color:C.muted}}>{leg.multiplier}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {/* Controls row */}
          <div style={{display:"flex", gap:16, alignItems:"center", flexWrap:"wrap"}}>
            {[["profit_target_usd","Profit Target $"],["stop_loss_usd","Stop Loss $"]].map(([field,lbl])=>(
              <div key={field} style={{display:"flex", gap:6, alignItems:"center"}}>
                <span style={{...sans, fontSize:11, color:C.muted}}>{lbl}:</span>
                <input style={{...inpStyle, width:70}} type="number"
                       defaultValue={pos[field] ?? ""}
                       onBlur={e=>updateField(pos.pos_id, field, e.target.value)}
                       placeholder="none" />
              </div>
            ))}
            <div style={{display:"flex", gap:6, alignItems:"center"}}>
              <span style={{...sans, fontSize:11, color:C.muted}}>Hard Close:</span>
              <input style={{...inpStyle, width:60}} type="text"
                     defaultValue={pos.hard_close_time || ""}
                     onBlur={e=>updateField(pos.pos_id, "hard_close_time", e.target.value)}
                     placeholder="15:45" />
            </div>
            <div style={{...sans, fontSize:11, color:C.muted}}>
              net_entry: <span style={{color:pnlColor(pos.net_entry)}}>${(pos.net_entry||0).toFixed(2)}</span>
            </div>
            {pos.notes && <div style={{...sans, fontSize:11, color:"#94a3b8"}}>{pos.notes}</div>}
          </div>
        </div>
      ))}

      {/* Closed Positions */}
      {closedList.length > 0 && (
        <>
          <div style={{...sans, fontSize:13, fontWeight:600, color:C.muted, margin:"20px 0 4px", textTransform:"uppercase", letterSpacing:1}}>
            Recently Closed ({closedList.length})  · Total P&L:&nbsp;
            <span style={{color:pnlColor(totalClosedPnl), fontWeight:600}}>
              {totalClosedPnl >= 0 ? "+" : ""}{totalClosedPnl.toFixed(2)}
            </span>
          </div>
          <div style={{...sans, fontSize:10, color:C.muted, marginBottom:8}}>
            * mark-to-market at close time (no fills recorded)
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%", borderCollapse:"collapse", fontSize:12, ...sans}}>
              <thead>
                <tr style={{color:C.muted, borderBottom:"1px solid #1e293b"}}>
                  {["Position","Ticker","Strategy","Net Entry","Close P&L","Reason","Closed At"].map(h=>(
                    <th key={h} style={{textAlign:"left", padding:"5px 10px", whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {closedList.map((pos,i) => (
                  <tr key={i} style={{borderBottom:"1px solid #0f172a"}}>
                    <td style={{padding:"5px 10px", color:"#93c5fd"}}>{pos.name}</td>
                    <td style={{padding:"5px 10px", color:C.white}}>{pos.ticker}</td>
                    <td style={{padding:"5px 10px", color:C.muted}}>{pos.strategy}</td>
                    <td style={{padding:"5px 10px", color:pnlColor(pos.net_entry), fontVariantNumeric:"tabular-nums"}}>
                      {pos.net_entry >= 0 ? "+" : ""}{(pos.net_entry||0).toFixed(2)}
                    </td>
                    <td style={{padding:"5px 10px", color:pnlColor(effPnl(pos)), fontWeight:600, fontVariantNumeric:"tabular-nums"}}>
                      {(() => {
                        const v = effPnl(pos);
                        const hasFills = pos.close_fills && Object.keys(pos.close_fills).length > 0;
                        return v != null
                          ? (v >= 0 ? "+" : "") + v.toFixed(2) + (!hasFills ? "*" : "")
                          : "—";
                      })()}
                    </td>
                    <td style={{padding:"5px 10px", color:reasonColor(pos.close_reason)}}>{pos.close_reason || "—"}</td>
                    <td style={{padding:"5px 10px", color:C.muted, whiteSpace:"nowrap"}}>
                      {pos.closed_at ? new Date(pos.closed_at).toLocaleString() : "—"}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}

      {/* Decisions log */}
      {(decisions||[]).length > 0 && (
        <>
          <div style={{...sans, fontSize:13, fontWeight:600, color:C.muted, margin:"20px 0 8px", textTransform:"uppercase", letterSpacing:1}}>
            Activity Log
          </div>
          <div style={{background:"#0a0f1a", borderRadius:6, padding:10, maxHeight:240, overflowY:"auto"}}>
            {[...(decisions||[])].reverse().map((d, i) => {
              const parts = d.split(" ");
              const time   = parts[0];
              const action = parts[1];
              const rest   = parts.slice(2).join(" ");
              return (
                <div key={i} style={{...sans, fontSize:11, color:C.muted, marginBottom:3, display:"flex", gap:8}}>
                  <span style={{color:"#475569", minWidth:60}}>{time}</span>
                  <span style={{color:actionColor(action), minWidth:90}}>{action}</span>
                  <span>{rest}</span>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}


// ── Day Trader Tab ────────────────────────────────────────────────────────────
function DayTraderTab() {
  const [status,   setStatus]   = useState(null);
  const [goal,     setGoal]     = useState(null);
  const [history,  setHistory]  = useState(null);
  const [loading,  setLoading]  = useState(true);
  const [targetIn, setTargetIn] = useState("");
  const [saving,   setSaving]   = useState(false);
  const [histDays, setHistDays] = useState(30);

  const load = async () => {
    try {
      const [s, g] = await Promise.all([
        apiFetch("/day-trader/status"),
        apiFetch("/day-trader/goal"),
      ]);
      setStatus(s);
      setGoal(g);
      if (targetIn === "") setTargetIn(String(s.config.daily_profit_target || ""));
    } catch(_) {}
    finally { setLoading(false); }
  };

  const loadHistory = async (d) => {
    try {
      const h = await apiFetch(`/day-trader/history?days=${d}`);
      setHistory(h);
    } catch(_) {}
  };

  useEffect(() => {
    load();
    loadHistory(30);
    const id = setInterval(load, 15000);
    return () => clearInterval(id);
  }, []);

  const toggle = async () => {
    await apiFetch(`/day-trader/enable?enabled=${!status.enabled}`, { method:"POST" });
    load();
  };

  const updateTarget = async () => {
    const v = parseFloat(targetIn);
    if (isNaN(v) || v <= 0) return;
    setSaving(true);
    try {
      await apiFetch("/day-trader/config", { method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ daily_profit_target: v }) });
      load();
    } finally { setSaving(false); }
  };

  const updateCfg = async (key, val) => {
    await apiFetch("/day-trader/config", { method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ [key]: val }) });
    load();
  };

  const closePos = async (ticker) => {
    await apiFetch(`/day-trader/close/${ticker}`, { method:"POST" });
    load();
  };

  const pnlColor = v => v == null ? C.muted : v >= 0 ? "#22c55e" : "#ef4444";
  const phaseLabel = p => p === 0 ? "Pending" : p === 1 ? "Active" : "Closing";
  const phaseColor = p => p === 0 ? C.muted : p === 1 ? "#22c55e" : "#f59e0b";

  if (loading) return <div style={{ color:C.muted, ...sans, fontSize:13 }}>Loading…</div>;
  if (!status) return <div style={{ color:C.muted, ...sans, fontSize:13 }}>Backend unavailable</div>;

  const { config: cfg, summary, positions, watching, closed_today, decisions, eod_summary: eod } = status;
  const goalPct = Math.min(100, summary.goal_pct || 0);

  return (
    <div>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div>
          <div style={{ ...sans, fontSize:17, fontWeight:700, color:C.white }}>Day Trader ⚡</div>
          <div style={{ ...sans, fontSize:12, color:C.muted, marginTop:2 }}>
            Same breakout signals as Stock Trader · all positions force-closed by {cfg.force_close_time} ET
          </div>
        </div>
        <button onClick={toggle} style={{
          ...sans, fontSize:13, padding:"8px 18px", borderRadius:6, cursor:"pointer", fontWeight:700,
          background: status.enabled ? "#14532d" : "#1e293b",
          border: `1px solid ${status.enabled ? "#16a34a" : C.border}`,
          color: status.enabled ? "#4ade80" : C.muted,
        }}>
          {status.enabled ? "● LIVE" : "○ Disabled"}
        </button>
      </div>

      {/* Daily Goal Card */}
      {goal && (
        <div style={{ background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:8, padding:16, marginBottom:16 }}>
          <div style={{ ...sans, fontSize:13, fontWeight:700, color:C.white, marginBottom:12 }}>
            Daily Profit Goal
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:12, marginBottom:14 }}>
            {[
              { label:"Target", value:`$${cfg.daily_profit_target.toLocaleString()}`, color:C.white },
              { label:"Today P&L", value:`${summary.today_pnl >= 0?"+":""}$${summary.today_pnl.toFixed(2)}`, color:pnlColor(summary.today_pnl) },
              { label:"Remaining", value:`$${goal.remaining_target.toFixed(2)}`, color: goal.remaining_target > 0 ? "#f59e0b" : "#22c55e" },
              { label:"Capital Needed", value:`$${goal.required_capital.toLocaleString()}`, color:C.muted },
            ].map(({ label, value, color }) => (
              <div key={label} style={{ textAlign:"center" }}>
                <div style={{ ...sans, fontSize:11, color:C.muted, marginBottom:4 }}>{label}</div>
                <div style={{ ...mono, fontSize:16, fontWeight:700, color }}>{value}</div>
              </div>
            ))}
          </div>

          {/* Progress bar */}
          <div style={{ background:"#1e293b", borderRadius:4, height:8, marginBottom:10, overflow:"hidden" }}>
            <div style={{ height:"100%", borderRadius:4, width:`${goalPct}%`,
              background: goalPct >= 100 ? "#22c55e" : goalPct >= 50 ? "#f59e0b" : "#3b82f6",
              transition:"width 0.5s" }} />
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", ...sans, fontSize:11, color:C.muted, marginBottom:12 }}>
            <span>{goalPct.toFixed(1)}% of daily goal</span>
            <span>EV/position: ${goal.ev_per_position} · Need {goal.required_positions} trades</span>
          </div>

          {/* Goal input */}
          <div style={{ display:"flex", gap:8, alignItems:"center" }}>
            <span style={{ ...sans, fontSize:12, color:C.muted }}>Set daily target: $</span>
            <input value={targetIn} onChange={e => setTargetIn(e.target.value)}
              style={{ ...mono, fontSize:13, width:90, padding:"4px 8px", borderRadius:4,
                background:"#1e293b", border:`1px solid ${C.border}`, color:C.white, outline:"none" }} />
            <button onClick={updateTarget} disabled={saving} style={{
              ...sans, fontSize:12, padding:"5px 14px", borderRadius:4, cursor:"pointer",
              background:"#1e3a5f", border:"1px solid #2563eb", color:"#93c5fd" }}>
              {saving ? "Saving…" : "Update"}
            </button>
            {goal.positions_gap > 0 && (
              <span style={{ ...sans, fontSize:11, color:"#f59e0b", marginLeft:8 }}>
                ⚠ max_positions ({cfg.max_positions}) is {goal.positions_gap} below what's needed
              </span>
            )}
          </div>
        </div>
      )}

      {/* Config Row */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:10, marginBottom:16 }}>
        {[
          { label:"Position $", key:"position_size", type:"number", step:100 },
          { label:"Max Positions", key:"max_positions", type:"number", step:1 },
          // Trailing stop replaced the fixed target/stop pair (2026-08-07) --
          // show whichever pair is actually active so this never displays a
          // dead number. use_trailing_stop:false reverts to the old fields
          // for instant rollback, so both variants stay wired up.
          ...(cfg.use_trailing_stop
            ? [
                { label:"Trailing Stop %", key:"trailing_stop_pct", type:"number", step:0.1 },
                { label:"Confirm Move %",  key:"confirm_pct",       type:"number", step:0.05 },
              ]
            : [
                { label:"Hard Stop %",     key:"hard_stop_pct",     type:"number", step:0.5 },
                { label:"Profit Target %", key:"profit_target_pct", type:"number", step:0.25 },
              ]),
          { label:"Force Close", key:"force_close_time", type:"text" },
        ].map(({ label, key, type, step }) => (
          <div key={key} style={{ background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:6, padding:"8px 10px" }}>
            <div style={{ ...sans, fontSize:10, color:C.muted, marginBottom:4 }}>{label}</div>
            <input defaultValue={cfg[key]} type={type} step={step}
              style={{ ...mono, fontSize:13, width:"100%", background:"none", border:"none",
                color:C.white, outline:"none" }}
              onBlur={e => {
                const v = type === "number" ? parseFloat(e.target.value) : e.target.value;
                if (v !== cfg[key]) updateCfg(key, v);
              }} />
          </div>
        ))}
      </div>

      {/* Summary Row */}
      <div style={{ display:"flex", gap:10, marginBottom:16 }}>
        {[
          { label:"Open", value:summary.open_positions },
          { label:"Watching", value:summary.watching || 0, color: (summary.watching||0) > 0 ? "#f59e0b" : undefined },
          { label:"Capital Deployed", value:`$${summary.capital_deployed.toLocaleString()}` },
          { label:"Open P&L", value:`${(summary.open_pnl||0)>=0?"+":""}$${(summary.open_pnl||0).toFixed(2)}`, color:pnlColor(summary.open_pnl||0) },
          { label:"Closed P&L", value:`${(summary.closed_pnl||0)>=0?"+":""}$${(summary.closed_pnl||0).toFixed(2)}`, color:pnlColor(summary.closed_pnl||0) },
          { label:"Today P&L", value:`${summary.today_pnl>=0?"+":""}$${summary.today_pnl.toFixed(2)}`, color:pnlColor(summary.today_pnl) },
          { label:"Closed Today", value:summary.today_trades },
        ].map(({ label, value, color }) => (
          <div key={label} style={{ flex:1, background:"#0f172a", border:`1px solid ${C.border}`,
            borderRadius:6, padding:"10px 14px", textAlign:"center" }}>
            <div style={{ ...sans, fontSize:10, color:C.muted, marginBottom:4 }}>{label}</div>
            <div style={{ ...mono, fontSize:18, fontWeight:700, color: color || C.white }}>{value}</div>
          </div>
        ))}
      </div>

      {/* Open Positions */}
      <div style={{ ...sans, fontSize:13, fontWeight:700, color:C.white, marginBottom:8 }}>Open Positions</div>
      {Object.keys(positions).length === 0 ? (
        <div style={{ color:C.muted, ...sans, fontSize:13, padding:"20px 0" }}>No open day trader positions</div>
      ) : (
        <div style={{ overflowX:"auto", marginBottom:20 }}>
          <table style={{ width:"100%", borderCollapse:"collapse", ...sans, fontSize:13 }}>
            <thead>
              <tr style={{ background:"#0f172a" }}>
                {["Ticker","Phase","Entry $","Target / Trail","Stop $","Current $","P&L","P&L %","Shares",""].map(h => (
                  <th key={h} style={{ padding:"7px 10px", textAlign:"left", color:C.muted,
                    fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:0.5,
                    borderBottom:`1px solid ${C.border}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {Object.entries(positions).map(([tk, p]) => (
                <tr key={tk} style={{ borderBottom:`1px solid ${C.border}` }}>
                  <td style={{ padding:"8px 10px", fontWeight:700, color:C.white, fontFamily:"monospace" }}>{tk}</td>
                  <td style={{ padding:"8px 10px" }}>
                    <span style={{ fontSize:11, fontWeight:700, color:phaseColor(p.phase),
                      background:`${phaseColor(p.phase)}22`, borderRadius:4, padding:"2px 7px" }}>
                      {phaseLabel(p.phase)}
                    </span>
                  </td>
                  <td style={{ padding:"8px 10px", ...mono }}>${(p.entry_price||0).toFixed(2)}</td>
                  {/* Trailing positions have no fixed profit_price -- show the running
                      high they're trailing from instead of a misleading $0.00 */}
                  <td style={{ padding:"8px 10px", ...mono, color:"#22c55e" }}>
                    {p.is_trailing
                      ? `↑$${(p.running_high||p.entry_price||0).toFixed(2)}`
                      : `$${(p.profit_price||0).toFixed(2)}`}
                  </td>
                  <td style={{ padding:"8px 10px", ...mono, color:"#ef4444" }}>${(p.stop_price||0).toFixed(2)}</td>
                  <td style={{ padding:"8px 10px", ...mono, fontWeight:600,
                    color: p.live_price ? C.white : C.muted }}>
                    {p.live_price ? `$${p.live_price.toFixed(2)}` : "—"}
                  </td>
                  <td style={{ padding:"8px 10px", ...mono, fontWeight:700, color:pnlColor(p.live_pnl) }}>
                    {p.live_pnl != null ? `${p.live_pnl>=0?"+":""}$${p.live_pnl.toFixed(2)}` : "—"}
                  </td>
                  <td style={{ padding:"8px 10px", ...mono, fontWeight:700,
                    color: p.live_price && p.entry_price ? pnlColor(p.live_price - p.entry_price) : C.muted }}>
                    {p.live_price && p.entry_price
                      ? (() => { const pct = (p.live_price - p.entry_price) / p.entry_price * 100;
                                 return `${pct>=0?"+":""}${pct.toFixed(2)}%`; })()
                      : "—"}
                  </td>
                  <td style={{ padding:"8px 10px", color:C.muted }}>{p.shares}</td>
                  <td style={{ padding:"8px 10px" }}>
                    <button onClick={() => closePos(tk)} style={{
                      ...sans, fontSize:11, padding:"3px 8px", borderRadius:4, cursor:"pointer",
                      background:"#450a0a", border:"1px solid #7f1d1d", color:"#fca5a5" }}>
                      Close
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* Watching — candidates that cleared the entry-quality gates but haven't
          bought yet; only fires once price + volume actually confirm the move
          (added 2026-08-07, see trailing_stop_pct's config comment). */}
      <div style={{ ...sans, fontSize:13, fontWeight:700, color:C.white, marginBottom:8 }}>
        Watching <span style={{ color:C.muted, fontWeight:400, fontSize:12 }}>
          — needs ≥{cfg.confirm_pct}% move from open + volume confirmation within {cfg.confirm_window_min}min
        </span>
      </div>
      {!watching || Object.keys(watching).length === 0 ? (
        <div style={{ color:C.muted, ...sans, fontSize:13, padding:"20px 0" }}>No candidates awaiting confirmation</div>
      ) : (
        <div style={{ overflowX:"auto", marginBottom:20 }}>
          <table style={{ width:"100%", borderCollapse:"collapse", ...sans, fontSize:13 }}>
            <thead>
              <tr style={{ background:"#0f172a" }}>
                {["Ticker","Day Open","Live $","Move %","Score","Registered"].map(h => (
                  <th key={h} style={{ padding:"7px 10px", textAlign:"left", color:C.muted,
                    fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:0.5,
                    borderBottom:`1px solid ${C.border}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {Object.entries(watching).map(([tk, w]) => {
                const movePct = w.live_price ? (w.live_price / w.day_open - 1) * 100 : null;
                return (
                  <tr key={tk} style={{ borderBottom:`1px solid ${C.border}` }}>
                    <td style={{ padding:"8px 10px", fontWeight:700, color:C.white, fontFamily:"monospace" }}>{tk}</td>
                    <td style={{ padding:"8px 10px", ...mono }}>${(w.day_open||0).toFixed(2)}</td>
                    <td style={{ padding:"8px 10px", ...mono, fontWeight:600, color: w.live_price ? C.white : C.muted }}>
                      {w.live_price ? `$${w.live_price.toFixed(2)}` : "—"}
                    </td>
                    <td style={{ padding:"8px 10px", ...mono, fontWeight:700,
                      color: movePct == null ? C.muted : movePct >= cfg.confirm_pct ? "#22c55e" : C.white }}>
                      {movePct == null ? "—" : `${movePct>=0?"+":""}${movePct.toFixed(2)}%`}
                    </td>
                    <td style={{ padding:"8px 10px", color:C.muted }}>
                      {w.composite_score != null ? w.composite_score.toFixed(0) : "—"}
                    </td>
                    <td style={{ padding:"8px 10px", color:C.muted, fontSize:12 }}>
                      {w.registered_at ? new Date(w.registered_at).toLocaleTimeString() : "—"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* Closed Today */}
      {closed_today.length > 0 && (
        <>
          <div style={{ ...sans, fontSize:13, fontWeight:700, color:C.white, marginBottom:8 }}>Closed Today</div>
          <div style={{ overflowX:"auto", marginBottom:20 }}>
            <table style={{ width:"100%", borderCollapse:"collapse", ...sans, fontSize:12 }}>
              <thead>
                <tr style={{ background:"#0f172a" }}>
                  {["Ticker","Entry $","Exit $","Shares","P&L","P&L %","Exit Type"].map(h => (
                    <th key={h} style={{ padding:"7px 10px", textAlign:"left", color:C.muted,
                      fontSize:11, fontWeight:600, textTransform:"uppercase",
                      borderBottom:`1px solid ${C.border}` }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[...closed_today].reverse().map((r, i) => (
                  <tr key={i} style={{ borderBottom:`1px solid ${C.border}` }}>
                    <td style={{ padding:"8px 10px", fontWeight:700, fontFamily:"monospace", color:C.white }}>{r.ticker}</td>
                    <td style={{ padding:"8px 10px", ...mono }}>${(r.entry_price||0).toFixed(2)}</td>
                    <td style={{ padding:"8px 10px", ...mono }}>${(r.exit_price||0).toFixed(2)}</td>
                    <td style={{ padding:"8px 10px", color:C.muted }}>{r.shares}</td>
                    <td style={{ padding:"8px 10px", ...mono, fontWeight:700, color:pnlColor(r.pnl) }}>
                      {r.pnl>=0?"+":""}${r.pnl.toFixed(2)}
                    </td>
                    <td style={{ padding:"8px 10px", ...mono, color:pnlColor(r.pnl_pct) }}>
                      {r.pnl_pct>=0?"+":""}{r.pnl_pct.toFixed(2)}%
                    </td>
                    <td style={{ padding:"8px 10px" }}>
                      <span style={{ fontSize:11, padding:"2px 7px", borderRadius:4, fontWeight:700,
                        color: r.exit_type==="profit_target" ? "#4ade80"
                             : r.exit_type==="hard_stop"     ? "#f87171"
                             : r.exit_type==="force_close"   ? "#f59e0b" : C.muted,
                        background: r.exit_type==="profit_target" ? "#14532d44"
                                  : r.exit_type==="hard_stop"     ? "#450a0a44"
                                  : r.exit_type==="force_close"   ? "#78350f44" : "#1e293b" }}>
                        {r.exit_type?.replace(/_/g," ")}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}

      {/* EOD Performance Summary */}
      {eod && eod.total_trades > 0 && (() => {
        const exitColors = { profit_target:"#4ade80", hard_stop:"#f87171", force_close:"#f59e0b", manual_close:"#94a3b8" };
        const goalBar = Math.min(100, (summary.today_pnl / eod.daily_profit_target) * 100);
        const goalColor = goalBar >= 100 ? "#4ade80" : goalBar >= 60 ? "#f59e0b" : "#ef4444";
        return (
          <div style={{ marginBottom:20 }}>
            <div style={{ ...sans, fontSize:13, fontWeight:700, color:C.white, marginBottom:10,
              display:"flex", alignItems:"center", gap:8 }}>
              📊 Day Summary
              {eod.goal_achieved && <span style={{ fontSize:11, padding:"2px 8px", borderRadius:4,
                background:"#14532d", color:"#4ade80", fontWeight:700 }}>🎯 Goal Achieved</span>}
            </div>

            {/* Goal progress bar */}
            <div style={{ marginBottom:14 }}>
              <div style={{ display:"flex", justifyContent:"space-between", ...sans, fontSize:11,
                color:C.muted, marginBottom:4 }}>
                <span>Daily Goal: ${eod.daily_profit_target}</span>
                <span style={{ color:goalColor }}>{goalBar.toFixed(1)}% complete</span>
              </div>
              <div style={{ height:6, background:"#1e293b", borderRadius:3 }}>
                <div style={{ height:"100%", width:`${goalBar}%`, background:goalColor,
                  borderRadius:3, transition:"width 0.4s" }} />
              </div>
            </div>

            {/* Key stats grid */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap:8, marginBottom:10 }}>
              {[
                { label:"Trades", value: eod.total_trades },
                { label:"Win Rate", value:`${eod.win_rate}%`,
                  color: eod.win_rate >= 60 ? "#4ade80" : eod.win_rate >= 40 ? "#f59e0b" : "#ef4444" },
                { label:"Avg Return", value:`${eod.avg_return_pct >= 0?"+":""}${eod.avg_return_pct.toFixed(2)}%`,
                  color: pnlColor(eod.avg_return_pct) },
                { label:"Profit Factor",
                  value: eod.profit_factor != null ? eod.profit_factor.toFixed(2) : "—",
                  color: eod.profit_factor == null ? C.muted : eod.profit_factor >= 1.5 ? "#4ade80"
                       : eod.profit_factor >= 1.0 ? "#f59e0b" : "#ef4444" },
                { label:"Gross Profit", value:`+$${eod.gross_profit.toFixed(2)}`, color:"#4ade80" },
                { label:"Gross Loss",   value:`-$${Math.abs(eod.gross_loss).toFixed(2)}`, color:"#ef4444" },
                { label:"Net P&L", value:`${summary.today_pnl>=0?"+":""}$${summary.today_pnl.toFixed(2)}`,
                  color: pnlColor(summary.today_pnl) },
                { label:"Capital Used", value:`$${eod.total_capital_traded.toLocaleString(undefined,{maximumFractionDigits:0})}` },
              ].map(({ label, value, color }) => (
                <div key={label} style={{ background:"#0f172a", border:`1px solid ${C.border}`,
                  borderRadius:6, padding:"8px 12px", textAlign:"center" }}>
                  <div style={{ ...sans, fontSize:10, color:C.muted, marginBottom:3 }}>{label}</div>
                  <div style={{ ...mono, fontSize:15, fontWeight:700, color: color || C.white }}>{value}</div>
                </div>
              ))}
            </div>

            {/* Avg win/loss + best/worst row */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8, marginBottom:10 }}>
              <div style={{ background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:6, padding:"8px 12px" }}>
                <div style={{ ...sans, fontSize:10, color:C.muted, marginBottom:2 }}>Avg Win</div>
                <div style={{ ...mono, fontSize:13, fontWeight:700, color:"#4ade80" }}>
                  +{eod.avg_win_pct.toFixed(2)}% ({eod.wins}W)
                </div>
              </div>
              <div style={{ background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:6, padding:"8px 12px" }}>
                <div style={{ ...sans, fontSize:10, color:C.muted, marginBottom:2 }}>Avg Loss</div>
                <div style={{ ...mono, fontSize:13, fontWeight:700, color:"#ef4444" }}>
                  {eod.avg_loss_pct.toFixed(2)}% ({eod.losses}L)
                </div>
              </div>
              {eod.best_trade && (
                <div style={{ background:"#0f172a", border:`1px solid #14532d`, borderRadius:6, padding:"8px 12px" }}>
                  <div style={{ ...sans, fontSize:10, color:C.muted, marginBottom:2 }}>Best Trade</div>
                  <div style={{ ...mono, fontSize:13, fontWeight:700, color:"#4ade80" }}>
                    {eod.best_trade.ticker} +${eod.best_trade.pnl.toFixed(2)} ({eod.best_trade.pnl_pct >= 0?"+":""}{eod.best_trade.pnl_pct.toFixed(2)}%)
                  </div>
                </div>
              )}
              {eod.worst_trade && (
                <div style={{ background:"#0f172a", border:`1px solid #450a0a`, borderRadius:6, padding:"8px 12px" }}>
                  <div style={{ ...sans, fontSize:10, color:C.muted, marginBottom:2 }}>Worst Trade</div>
                  <div style={{ ...mono, fontSize:13, fontWeight:700, color:"#ef4444" }}>
                    {eod.worst_trade.ticker} ${eod.worst_trade.pnl.toFixed(2)} ({eod.worst_trade.pnl_pct >= 0?"+":""}{eod.worst_trade.pnl_pct.toFixed(2)}%)
                  </div>
                </div>
              )}
            </div>

            {/* Strategy settings + exit breakdown */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <div style={{ background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:6, padding:"10px 14px" }}>
                <div style={{ ...sans, fontSize:11, fontWeight:700, color:C.muted, marginBottom:6 }}>STRATEGY SETTINGS</div>
                {[
                  ["Profit Target / trade", `+${eod.profit_target_pct}%`],
                  ["Hard Stop / trade",     `-${eod.hard_stop_pct}%`],
                  ["Daily Goal",            `$${eod.daily_profit_target}`],
                  ["Risk/Reward",           `1 : ${(eod.profit_target_pct / eod.hard_stop_pct).toFixed(2)}`],
                ].map(([k, v]) => (
                  <div key={k} style={{ display:"flex", justifyContent:"space-between",
                    ...sans, fontSize:12, padding:"2px 0", borderBottom:`1px solid ${C.border}` }}>
                    <span style={{ color:C.muted }}>{k}</span>
                    <span style={{ ...mono, color:C.white }}>{v}</span>
                  </div>
                ))}
              </div>
              <div style={{ background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:6, padding:"10px 14px" }}>
                <div style={{ ...sans, fontSize:11, fontWeight:700, color:C.muted, marginBottom:6 }}>EXIT BREAKDOWN</div>
                {Object.entries(eod.exit_breakdown).map(([type, count]) => (
                  <div key={type} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                    ...sans, fontSize:12, padding:"2px 0", borderBottom:`1px solid ${C.border}` }}>
                    <span style={{ color: exitColors[type] || C.muted }}>{type.replace(/_/g," ")}</span>
                    <span style={{ ...mono, fontWeight:700, color: exitColors[type] || C.white }}>
                      {count} ({(count/eod.total_trades*100).toFixed(0)}%)
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Recent Decisions */}
      {decisions.length > 0 && (
        <>
          <div style={{ ...sans, fontSize:13, fontWeight:700, color:C.white, marginBottom:8 }}>Decisions</div>
          <div style={{ background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:6,
            padding:10, maxHeight:200, overflowY:"auto" }}>
            {[...decisions].reverse().map((d, i) => (
              <div key={i} style={{ ...mono, fontSize:11, color:C.muted, padding:"2px 0",
                borderBottom: i < decisions.length-1 ? `1px solid ${C.border}` : "none" }}>
                <span style={{ color:C.muted }}>{d.time}</span>
                {" "}<span style={{ color: d.action==="FILLED"||d.action==="PROFIT_TARGET" ? "#4ade80"
                  : d.action==="HARD_STOP" ? "#f87171"
                  : d.action==="SKIPPED"   ? C.muted : C.text, fontWeight:700 }}>{d.action}</span>
                {" "}<span style={{ color:C.white }}>{d.ticker}</span>
                {" "}<span style={{ color:C.muted }}>{d.detail}</span>
              </div>
            ))}
          </div>
        </>
      )}

      {/* Trade History */}
      <div style={{ marginTop:24 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
          <div style={{ ...sans, fontSize:13, fontWeight:700, color:C.white }}>Trade History</div>
          <div style={{ display:"flex", gap:6, alignItems:"center" }}>
            {[7, 30, 90].map(d => (
              <button key={d} onClick={() => { setHistDays(d); loadHistory(d); }} style={{
                ...sans, fontSize:11, padding:"3px 10px", borderRadius:4, cursor:"pointer",
                background: histDays === d ? "#1e3a5f" : "#1e293b",
                border: `1px solid ${histDays === d ? "#2563eb" : C.border}`,
                color: histDays === d ? "#93c5fd" : C.muted,
              }}>{d}d</button>
            ))}
          </div>
        </div>

        {history && history.total > 0 ? (
          <>
            {/* Summary stats */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8, marginBottom:12 }}>
              {[
                { label:"Trades", value: history.total, color: C.white },
                { label:"Win Rate", value:`${history.win_rate}%`,
                  color: history.win_rate >= 60 ? "#4ade80" : history.win_rate >= 40 ? "#f59e0b" : "#ef4444" },
                { label:"Total P&L", value:`${history.total_pnl >= 0 ? "+" : ""}$${history.total_pnl.toFixed(2)}`,
                  color: pnlColor(history.total_pnl) },
                { label:"Wins / Losses", value:`${history.wins}W / ${history.total - history.wins}L`, color: C.muted },
              ].map(({ label, value, color }) => (
                <div key={label} style={{ background:"#0f172a", border:`1px solid ${C.border}`,
                  borderRadius:6, padding:"8px 12px", textAlign:"center" }}>
                  <div style={{ ...sans, fontSize:10, color:C.muted, marginBottom:3 }}>{label}</div>
                  <div style={{ ...mono, fontSize:14, fontWeight:700, color }}>{value}</div>
                </div>
              ))}
            </div>

            {/* Trades table */}
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", ...sans, fontSize:12 }}>
                <thead>
                  <tr style={{ background:"#0f172a" }}>
                    {["Date","Ticker","Entry $","Exit $","Shares","P&L","P&L %","Exit Type"].map(h => (
                      <th key={h} style={{ padding:"6px 10px", textAlign:"left", color:C.muted,
                        fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:0.5,
                        borderBottom:`1px solid ${C.border}` }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {history.trades.map((t, i) => {
                    const exitColor = t.exit_reason === "profit_target" ? "#4ade80"
                                    : t.exit_reason === "hard_stop"     ? "#f87171"
                                    : t.exit_reason === "force_close"   ? "#f59e0b" : C.muted;
                    return (
                      <tr key={i} style={{ borderBottom:`1px solid ${C.border}`,
                        background: i % 2 === 0 ? "transparent" : "#0f172a22" }}>
                        <td style={{ padding:"7px 10px", color:C.muted }}>{t.closed_at}</td>
                        <td style={{ padding:"7px 10px", fontWeight:700, fontFamily:"monospace", color:C.white }}>{t.ticker}</td>
                        <td style={{ padding:"7px 10px", ...mono }}>${(t.entry_price||0).toFixed(2)}</td>
                        <td style={{ padding:"7px 10px", ...mono }}>${(t.exit_price||0).toFixed(2)}</td>
                        <td style={{ padding:"7px 10px", color:C.muted }}>{t.qty}</td>
                        <td style={{ padding:"7px 10px", ...mono, fontWeight:700, color:pnlColor(t.pnl) }}>
                          {t.pnl >= 0 ? "+" : ""}${(t.pnl||0).toFixed(2)}
                        </td>
                        <td style={{ padding:"7px 10px", ...mono, color:pnlColor(t.pnl_pct) }}>
                          {t.pnl_pct >= 0 ? "+" : ""}{(t.pnl_pct||0).toFixed(2)}%
                        </td>
                        <td style={{ padding:"7px 10px" }}>
                          <span style={{ fontSize:11, padding:"2px 7px", borderRadius:4, fontWeight:700,
                            color: exitColor, background: `${exitColor}22` }}>
                            {(t.exit_reason||"").replace(/_/g," ")}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </>
        ) : (
          <div style={{ color:C.muted, ...sans, fontSize:13, padding:"16px 0" }}>
            {history ? `No day trades in the last ${histDays} days` : "Loading history…"}
          </div>
        )}
      </div>
    </div>
  );
}


// ── Watchlist Tab (Breakout Scanner) ─────────────────────────────────────
function WatchlistTab() {
  const [entries,  setEntries]  = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [clearing, setClearing] = useState(false);

  const load = async () => {
    try {
      const r = await apiFetch("/watchlist");
      setEntries(r.entries || []);
    } catch(_) {}
    finally { setLoading(false); }
  };

  useEffect(() => {
    load();
    const id = setInterval(load, 30000);
    return () => clearInterval(id);
  }, []);

  const remove = async (ticker) => {
    try {
      await apiFetch(`/watchlist/${ticker}`, { method: "DELETE" });
      setEntries(e => e.filter(x => x.ticker !== ticker));
    } catch(_) {}
  };

  const clearAll = async () => {
    setClearing(true);
    try {
      await apiFetch("/watchlist", { method: "DELETE" });
      setEntries([]);
    } catch(_) {}
    finally { setClearing(false); }
  };

  const sigColor = s => s === "BREAKOUT" ? "#ef4444" : "#f59e0b";
  const sigEmoji = s => s === "BREAKOUT" ? "🚨" : "⚡";

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>

        <div style={{ display:"flex", gap:8 }}>

              cursor:"pointer" }}>

            </button>

      </div>

      {loading ? (
        <div style={{ color:C.muted, ...sans, fontSize:13 }}>Loading…</div>

          <div style={{ fontSize:32, marginBottom:12 }}>📡</div>
          <div style={{ ...sans, fontSize:15, color:C.muted }}>No breakout alerts yet</div>
          <div style={{ ...sans, fontSize:12, color:C.muted, marginTop:6 }}>

                  <th key={h} style={{ padding:"8px 10px", textAlign:"left", color:C.muted,
                    fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:0.5,
                    borderBottom:`1px solid ${C.border}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {entries.map(e => {
                const chgColor = e.pct_change == null ? C.muted
                  : e.pct_change >= 2 ? "#22c55e"

                    </td>
                    <td style={{ padding:"8px 10px", textAlign:"center" }}>
                      {e.above_sma50 === true

                    <td style={{ padding:"8px 10px", textAlign:"center", whiteSpace:"nowrap" }}>

                        >
                          {e.vwap_above ? "↑" : "↓"}

                    </td>
                    <td style={{ padding:"8px 10px" }}>
                      {e.tape_label && e.tape_label !== "NO DATA" ? (
                        <span title={`CVD score: ${e.tape_score != null ? e.tape_score.toFixed(4) : "—"}`}
                          style={{
                            background: e.tape_label.includes("BULL") ? "#14532d44"
                              : e.tape_label.includes("BEAR") ? "#450a0a44" : "#1e293b",
                            color: e.tape_label.includes("STRONGLY BULL") ? "#4ade80"
                              : e.tape_label.includes("BULL") ? "#86efac"
                              : e.tape_label.includes("STRONGLY BEAR") ? "#f87171"
