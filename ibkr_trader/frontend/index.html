function AlertsTab() {
  const [alerts,      setAlerts]      = useState([]);
  const [transitions, setTransitions] = useState([]);
  const [loading,     setLoading]     = useState(true);
  const [filterDate,  setFilterDate]  = useState("");
  const [view,        setView]        = useState("alerts"); // "alerts" | "transitions"
  const [, tick]                      = useState(0);

  const load = () => {
    const dateQ = filterDate ? `&session_date=${filterDate}` : "";
    Promise.all([
      fetch(API + `/alerts/history?limit=300${dateQ}`).then(r => r.json()).catch(() => ({alerts:[]})),
      fetch(API + `/scanner/state-transitions?days=1${filterDate ? `&session_date=${filterDate}` : ""}`).then(r => r.json()).catch(() => ({transitions:[]})),
    ]).then(([ah, st]) => {
      setAlerts(ah.alerts || []);
      setTransitions(st.transitions || []);
      setLoading(false);
    });
  };

  useEffect(() => { load(); const iv = setInterval(load, 30000); return () => clearInterval(iv); }, [filterDate]);
  useEffect(() => { const iv = setInterval(() => tick(n => n+1), 60000); return () => clearInterval(iv); }, []);

  const card = { background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: "16px 20px", marginBottom: 12 };
  const hdr  = { ...sans, fontSize: 11, color: C.muted, textAlign: "left", paddingBottom: 6, paddingRight: 10, fontWeight: 600 };
  const cell = { ...mono, fontSize: 11, paddingTop: 4, paddingRight: 10, whiteSpace: "nowrap" };

  const sigBadge = (sig) => {
    const isBO = sig === "BREAKOUT";
    return <span style={{ background: isBO ? "#7c3aed22" : "#f0883e22",
      color: isBO ? "#a78bfa" : C.orange, border: `1px solid ${isBO ? "#7c3aed" : C.orange}`,
      borderRadius: 4, padding: "1px 6px", fontSize: 10, fontWeight: 700, ...sans }}>
      {isBO ? "🚨 BREAKOUT" : "⚡ PRE-BO"}
    </span>;
  };

  const stateBadge = (s) => {
    if (!s || s === "—") return <span style={{color: C.muted, fontSize: 11}}>—</span>;
    const col = s === "BREAKOUT" ? "#a78bfa" : s === "PRE-BREAKOUT" ? C.orange : s === "EXTENDED" ? "#34d399" : C.muted;
    return <span style={{ color: col, fontSize: 11, fontWeight: 600 }}>{s}</span>;
  };

  const pctBColor = (v) => v == null ? C.muted : v >= 95 ? "#a78bfa" : v >= 75 ? C.orange : v >= 50 ? C.bull : C.muted;

  // fmtTs: parse any UTC ISO string (with or without offset/Z) → local browser time HH:MM
  const fmtTs = (iso) => {
    if (!iso) return "—";
    try {
      // new Date() handles "+00:00", "Z", and bare ISO (treated as UTC per spec for date-only;
      // for datetime we normalise by appending "Z" only when there is no existing offset marker)
      const normalised = /[Z+\-]\d{2}:?\d{2}$/.test(iso) ? iso : iso + "Z";
      const d = new Date(normalised);
      if (isNaN(d)) return iso.slice(11, 16);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    } catch(_e) { return iso.slice(11, 16); }
  };
  // fmtTime kept for backward compat; now delegates to fmtTs
  const fmtTime = fmtTs;

  const fmtDate = (s) => s ? s.slice(5) : "—"; // MM-DD from YYYY-MM-DD

  const todayEt = () => {
    const d = new Date();
    return d.toLocaleDateString("en-CA", { timeZone: "America/New_York" }); // YYYY-MM-DD
  };

  const viewBtn = (id, label) => (
    <button onClick={() => setView(id)} style={{
      background: view === id ? C.accent : "transparent",
      color: view === id ? "#fff" : C.muted,
      border: `1px solid ${view === id ? C.accent : C.border}`,
      borderRadius: 4, padding: "4px 14px", ...sans, fontSize: 12, cursor: "pointer"
    }}>{label}</button>
  );

  return (
    <div style={{ padding: 16, maxWidth: 1400, margin: "0 auto" }}>

      {/* Header row */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
        <div style={{ ...sans, fontSize: 16, fontWeight: 700, color: C.text }}>Scanner Alerts</div>
        <div style={{ display: "flex", gap: 6 }}>
          {viewBtn("alerts",      "Alerts")}
          {viewBtn("transitions", "State Changes")}
        </div>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ ...sans, fontSize: 12, color: C.muted }}>Date:</span>
          <input type="date" value={filterDate}
            onChange={e => setFilterDate(e.target.value)}
            style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 4,
              color: C.text, padding: "3px 8px", ...sans, fontSize: 12 }} />
          {filterDate && (
            <button onClick={() => setFilterDate("")}
              style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 4,
                color: C.muted, padding: "3px 10px", ...sans, fontSize: 12, cursor: "pointer" }}>
              Today
            </button>
          )}
          <button onClick={load}
            style={{ background: C.accent, border: "none", borderRadius: 4,
              color: "#fff", padding: "4px 12px", ...sans, fontSize: 12, cursor: "pointer" }}>
            Refresh
          </button>
        </div>
      </div>

      {loading && <div style={{ ...sans, fontSize: 13, color: C.muted, padding: 20 }}>Loading…</div>}

      {/* ── Alerts table ── */}
      {view === "alerts" && !loading && (
        <div style={card}>
          <div style={{ ...sans, fontSize: 12, color: C.muted, marginBottom: 10, fontWeight: 600 }}>
            {alerts.length} alert{alerts.length !== 1 ? "s" : ""}
            {filterDate ? ` on ${filterDate}` : ` (last 300)`}
          </div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                  {["Date", "Time", "Ticker", "Signal", "Daily State", "Prev State", "%B", "RSI", "Vol×",
                    "Tape", "State Path"].map(h => (
                    <th key={h} style={hdr}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {alerts.length === 0 ? (
                  <tr><td colSpan={11} style={{ ...sans, fontSize: 12, color: C.muted, paddingTop: 16 }}>
                    No alerts{filterDate ? ` for ${filterDate}` : ""}.</td></tr>
                ) : alerts.map(a => (
                  <tr key={a.id} style={{ borderBottom: `1px solid ${C.border}22` }}>
                    <td style={{ ...cell, color: C.muted }}>{fmtDate(a.session_date)}</td>
                    <td style={{ ...cell, color: C.muted }}>{fmtTime(a.fired_at)}</td>
                    <td style={{ ...cell, color: "#60a5fa", fontWeight: 700 }}>{a.ticker}</td>
                    <td style={{ ...cell, paddingTop: 2 }}>{sigBadge(a.signal_type)}</td>
                    <td style={{ ...cell }}>{stateBadge(a.curr_daily_state)}</td>
                    <td style={{ ...cell, color: C.muted, fontSize: 11 }}>{a.prev_state || "—"}</td>
                    <td style={{ ...cell, color: pctBColor(a.pct_b) }}>{a.pct_b != null ? a.pct_b.toFixed(1) : "—"}</td>
                    <td style={{ ...cell, color: C.muted }}>{a.rsi != null ? a.rsi.toFixed(1) : "—"}</td>
                    <td style={{ ...cell, color: C.muted }}>{a.vol_ratio != null ? a.vol_ratio.toFixed(2) + "×" : "—"}</td>
                    <td style={{ ...cell, color: a.tape_label === "NO DATA" ? C.muted :
                      a.tape_label?.includes("BULL") ? C.bull : a.tape_label?.includes("BEAR") ? C.bear : C.muted,
                      fontSize: 11 }}>
                      {a.tape_label || "—"}
                    </td>
                    <td style={{ ...mono, fontSize: 10, paddingTop: 4, color: C.muted, maxWidth: 200,
                      overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      {a.state_path || "—"}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ── State transitions table ── */}
      {view === "transitions" && !loading && (
        <div style={card}>
          <div style={{ ...sans, fontSize: 12, color: C.muted, marginBottom: 10, fontWeight: 600 }}>
            {transitions.length} transition{transitions.length !== 1 ? "s" : ""}
            {filterDate ? ` on ${filterDate}` : " (today)"}
          </div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                  {["Date", "Time ET", "Ticker", "Transition", "%B", "RSI", "Mins in Prev", "Close"].map(h => (
                    <th key={h} style={hdr}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {transitions.length === 0 ? (
                  <tr><td colSpan={8} style={{ ...sans, fontSize: 12, color: C.muted, paddingTop: 16 }}>
                    No transitions{filterDate ? ` for ${filterDate}` : " today"}.</td></tr>
                ) : transitions.map(t => {
                  return (
                    <tr key={t.id} style={{ borderBottom: `1px solid ${C.border}22` }}>
                      <td style={{ ...cell, color: C.muted }}>{fmtDate(t.session_date)}</td>
                      <td style={{ ...cell, color: C.muted }}>{t.transition_time_et || "—"}</td>
                      <td style={{ ...cell, color: "#60a5fa", fontWeight: 700 }}>{t.ticker}</td>
                      <td style={{ ...cell }}>
                        <span style={{ color: C.muted }}>{t.prev_state}</span>
                        <span style={{ color: C.muted, margin: "0 6px" }}>{"→"}</span>
                        {stateBadge(t.new_state)}
                      </td>
                      <td style={{ ...cell, color: pctBColor(t.pct_b) }}>{t.pct_b != null ? t.pct_b.toFixed(1) : "—"}</td>
                      <td style={{ ...cell, color: C.muted }}>{t.rsi != null ? t.rsi.toFixed(1) : "—"}</td>
                      <td style={{ ...cell, color: C.muted }}>{t.mins_in_prev_state != null ? `${t.mins_in_prev_state}m` : "—"}</td>
                      <td style={{ ...cell, color: C.muted }}>{t.close_price != null ? `$${t.close_price.toFixed(2)}` : "—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Risk Monitor Tab ──────────────────────────────────────────────────────
function RiskMonitorTab() {
  const [data,      setData]    = useState(null);
  const [loading,   setLoading] = useState(false);
  const [runLoading,setRunLoad] = useState(false);
  const [msg,       setMsg]     = useState("");
  const [cfg,       setCfg]     = useState({});
  const [editCfg,   setEditCfg] = useState(false);

  const fetchStatus = () => {
    setLoading(true);
    fetch(API + "/risk/status", {signal: AbortSignal.timeout(15000)})
      .then(r => r.json())
      .then(d => { setData(d); setCfg(d.config || {}); })
      .catch(e => setMsg("Fetch error: " + e.message))
      .finally(() => setLoading(false));
  };

  useEffect(() => {
    fetchStatus();
    const t = setInterval(fetchStatus, 30000);
    return () => clearInterval(t);
  }, []);

  const runNow = async () => {
    setRunLoad(true);
    try {
      const r = await fetch(API + "/risk/run-now", {method:"POST",
        signal: AbortSignal.timeout(30000)});
      const d = await r.json();
      setData(prev => prev ? {...prev, violations: d.violations, last_check: d.last_check} : prev);
      setMsg("Check complete — " + (d.violations?.length || 0) + " violation(s)");
    } catch(e) { setMsg("Error: " + e.message); }
    finally { setRunLoad(false); }
  };

  const saveConfig = async () => {
    try {
      const r = await fetch(API + "/risk/config", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(cfg)});
      const d = await r.json();
      setCfg(d.config);
      setEditCfg(false);
      setMsg("Config saved");
    } catch(e) { setMsg("Save error: " + e.message); }
  };

  const toggleEnabled = async (val) => {
    await fetch(`${API}/risk/enable?enabled=${val}`, {method:"POST"});
    setData(prev => prev ? {...prev, enabled: val} : prev);
  };

  const sevColor = (sev) => {
    if (sev === "CRITICAL") return "#f87171";
    if (sev === "WARNING")  return "#fbbf24";
    return C.muted;
  };

  const ruleLabel = (r) => ["", "CSP 2x Stop", "LEAP Cost", "VIX Spike",
    "Stock Loser 3d+", "Concentration"][r] || `Rule ${r}`;

  const cardStyle = { background: C.card, border: `1px solid ${C.border}`,
    borderRadius: 8, padding: "16px 20px", marginBottom: 12 };

  const numField = (label, key, step=0.1, min=0) => (
    <div style={{display:"flex", flexDirection:"column", gap:4, minWidth:140}}>
      <label style={{...sans, fontSize:11, color:C.muted}}>{label}</label>
      <input type="number" value={cfg[key] ?? ""} step={step} min={min}
        onChange={e => setCfg(p => ({...p, [key]: parseFloat(e.target.value)}))}
        style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:4,
          color:C.text, padding:"4px 8px", fontSize:13, width:120}} />
    </div>
  );

  if (!data) return <div style={{...sans, color:C.muted, padding:32}}>
    {loading ? "Loading…" : "No data"}</div>;

  const {violations=[], summary={}, log=[]} = data;

  return (
    <div style={{maxWidth:900}}>
      {/* Header row */}
      <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:20, flexWrap:"wrap"}}>
        <h2 style={{...mono, color:C.text, margin:0, fontSize:18}}>Risk Monitor</h2>
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <span style={{...sans, fontSize:12, color:C.muted}}>Active</span>
          <div onClick={() => toggleEnabled(!data.enabled)}
            style={{width:36, height:20, borderRadius:10, cursor:"pointer",
              background: data.enabled ? "#22c55e" : C.border,
              position:"relative", transition:"background 0.2s"}}>
            <div style={{position:"absolute", top:2, left: data.enabled ? 18 : 2,
              width:16, height:16, borderRadius:"50%", background:"#fff",
              transition:"left 0.2s"}} />
          </div>
        </div>
        <span style={{...sans, fontSize:12, color:C.muted}}>
          VIX: {data.vix != null ? <b style={{color: data.vix > (cfg.vix_threshold||25) ? "#f87171":"#4ade80"}}>
            {data.vix.toFixed(1)}</b> : "—"}
        </span>
        <span style={{...sans, fontSize:12, color:C.muted}}>
          Last check: {data.last_check ? data.last_check.split("T").join(" ").slice(0,16) : "never"}
        </span>
        <button onClick={runNow} disabled={runLoading}
          style={{background:"#3b82f6", color:"#fff", border:"none", borderRadius:4,
            padding:"4px 14px", ...sans, fontSize:12, cursor:"pointer"}}>
          {runLoading ? "Checking…" : "Check Now"}
        </button>
        <button onClick={() => setEditCfg(p => !p)}
          style={{background:C.surface, color:C.text, border:`1px solid ${C.border}`,
            borderRadius:4, padding:"4px 14px", ...sans, fontSize:12, cursor:"pointer"}}>
          {editCfg ? "Cancel" : "Config"}
        </button>
        {msg && <span style={{...sans, fontSize:12, color:"#fbbf24"}}>{msg}</span>}
      </div>

      {/* Summary badges */}
      <div style={{display:"flex", gap:12, marginBottom:16, flexWrap:"wrap"}}>
        {[
          {label:"Critical", val:summary.critical, color:"#f87171"},
          {label:"Warnings", val:summary.warnings,  color:"#fbbf24"},
          {label:"Total",    val:summary.total_violations, color:C.text},
        ].map(b => (
          <div key={b.label} style={{...cardStyle, padding:"10px 16px",
            marginBottom:0, textAlign:"center", minWidth:90}}>
            <div style={{...mono, fontSize:22, color:b.color, fontWeight:700}}>{b.val ?? 0}</div>
            <div style={{...sans, fontSize:11, color:C.muted}}>{b.label}</div>
          </div>
        ))}
      </div>

      {/* Active violations */}
      <div style={cardStyle}>
        <div style={{...sans, fontSize:12, color:C.muted, marginBottom:8, fontWeight:600,
          letterSpacing:"0.05em", textTransform:"uppercase"}}>Active Violations</div>
        {violations.length === 0
          ? <div style={{...sans, fontSize:13, color:"#4ade80"}}>No active violations — all rules passing.</div>
          : violations.map((v, i) => (
            <div key={i} style={{borderLeft:`3px solid ${sevColor(v.severity)}`,
              paddingLeft:12, marginBottom:10}}>
              <div style={{display:"flex", gap:8, alignItems:"baseline", flexWrap:"wrap"}}>
                <span style={{...mono, fontSize:11, fontWeight:700, color:sevColor(v.severity)}}>
                  {v.severity}</span>
                <span style={{...sans, fontSize:12, color:C.text, fontWeight:600}}>
                  {ruleLabel(v.rule)}</span>
                <span style={{...mono, fontSize:12, color:"#60a5fa"}}>{v.position}</span>
                {v.action && <span style={{...sans, fontSize:11, color:"#fbbf24"}}>
                  [{v.action}]</span>}
                <span style={{...sans, fontSize:11, color:C.muted}}>{v.ts}</span>
              </div>
              <div style={{...sans, fontSize:12, color:C.muted, marginTop:3}}>{v.detail}</div>
            </div>
          ))
        }
      </div>

      {/* Config editor */}
      {editCfg && (
        <div style={cardStyle}>
          <div style={{...sans, fontSize:12, color:C.muted, marginBottom:12, fontWeight:600,
            letterSpacing:"0.05em", textTransform:"uppercase"}}>Configuration</div>
          <div style={{display:"flex", gap:16, flexWrap:"wrap", marginBottom:12}}>
            {numField("Account Value ($)", "account_value", 1000, 0)}
            {numField("CSP Stop Mult (x)", "csp_stop_mult", 0.25, 0.5)}
            {numField("CSP Warn Mult (x)", "csp_warn_mult", 0.25, 0.5)}
            {numField("LEAP Max Cost ($)", "leap_max_cost", 100, 0)}
            {numField("VIX Threshold", "vix_threshold", 1, 10)}
            {numField("Stock Stop %", "stock_stop_pct", 0.5, 1)}
            {numField("Max Position %", "max_position_pct", 0.5, 1)}
            {numField("Check Interval (s)", "check_interval_s", 30, 60)}
          </div>
          <div style={{display:"flex", gap:16, marginBottom:12, alignItems:"center"}}>
            <label style={{...sans, fontSize:12, color:C.muted, display:"flex", gap:6, alignItems:"center"}}>
              <input type="checkbox" checked={!!cfg.auto_close_csp}
                onChange={e => setCfg(p => ({...p, auto_close_csp: e.target.checked}))} />
              Auto-close CSP on 2x stop
            </label>
            <label style={{...sans, fontSize:12, color:C.muted, display:"flex", gap:6, alignItems:"center"}}>
              <input type="checkbox" checked={!!cfg.auto_disable_dt}
                onChange={e => setCfg(p => ({...p, auto_disable_dt: e.target.checked}))} />
              Auto-disable day trader on VIX spike
            </label>
          </div>
          <button onClick={saveConfig}
            style={{background:"#22c55e", color:"#000", border:"none", borderRadius:4,
              padding:"6px 18px", ...sans, fontSize:12, cursor:"pointer", fontWeight:600}}>
            Save Config
          </button>
        </div>
      )}

      {/* Audit log */}
      <div style={cardStyle}>
        <div style={{...sans, fontSize:12, color:C.muted, marginBottom:8, fontWeight:600,
          letterSpacing:"0.05em", textTransform:"uppercase"}}>Audit Log (last 50)</div>
        <div style={{maxHeight:320, overflowY:"auto"}}>
          <table style={{width:"100%", borderCollapse:"collapse"}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${C.border}`}}>
                {["Time","Sev","Rule","Position","Detail","Action"].map(h => (
                  <th key={h} style={{...sans, fontSize:11, color:C.muted, textAlign:"left",
                    paddingBottom:6, paddingRight:12, fontWeight:600}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {log.slice().reverse().map((entry, i) => (
                <tr key={i} style={{borderBottom:`1px solid ${C.border}22`}}>
                  <td style={{...mono, fontSize:11, color:C.muted, paddingRight:8, whiteSpace:"nowrap", paddingTop:4}}>
                    {entry.ts}</td>
                  <td style={{...mono, fontSize:11, color:sevColor(entry.severity), paddingRight:8, paddingTop:4}}>
                    {entry.severity}</td>
                  <td style={{...sans, fontSize:11, color:C.muted, paddingRight:8, paddingTop:4}}>
                    {ruleLabel(entry.rule)}</td>
                  <td style={{...mono, fontSize:11, color:"#60a5fa", paddingRight:8, paddingTop:4}}>
                    {entry.position}</td>
                  <td style={{...sans, fontSize:11, color:C.text, paddingRight:8, paddingTop:4,
                    maxWidth:300, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
                    {entry.detail}</td>
                  <td style={{...sans, fontSize:11, color:"#fbbf24", paddingTop:4}}>
                    {entry.action || "—"}</td>
                </tr>
              ))}
              {log.length === 0 && (
                <tr><td colSpan={6} style={{...sans, fontSize:12, color:C.muted, paddingTop:12}}>
                  No log entries yet.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── IBKR Live News Panel (appears on all tabs) ─────────────────────────────
function LiveNewsPanel() {
  const [data,    setData]    = useState(null);
  const [open,    setOpen]    = useState(false);
  const [badge,   setBadge]   = useState(0);
  const prevCount = React.useRef(0);
  const [ticker,  setTicker]  = useState("");
  const [editTick,setEditTick]= useState(false);

  const fetchNews = React.useCallback(() => {
    fetch(API + "/news/ibkr?limit=50", {signal: AbortSignal.timeout(10000)})
      .then(r => r.json())
      .then(d => {
        const prev  = prevCount.current;
        const total = d.count || 0;
        if (total > prev && prev > 0) setBadge(b => b + (total - prev));
        prevCount.current = total;
        setData(d);
      })
      .catch(() => {});
  }, []);

  useEffect(() => { fetchNews(); const t = setInterval(fetchNews, 30000); return () => clearInterval(t); }, [fetchNews]);

  const handleToggle = () => { setOpen(o => !o); setBadge(0); };

  const saveTickers = async () => {
    const list = ticker.split(/[\s,]+/).map(t => t.trim().toUpperCase()).filter(Boolean);
    await fetch(API + "/news/ibkr/tickers", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({tickers: list}),
    });
    setEditTick(false);
    fetchNews();
  };

  const feed = data?.feed || [];
  const subs = data?.tickers || [];

  const providerColor = p => {
    if (!p) return C.muted;
    const h = p.split("").reduce((a,c) => (a * 31 + c.charCodeAt(0)) | 0, 0);
    const palette = ["#60a5fa","#34d399","#fbbf24","#f472b6","#a78bfa","#38bdf8"];
    return palette[Math.abs(h) % palette.length];
  };

  return (
    <div style={{
      marginTop:20, border:`1px solid ${C.border}`, borderRadius:8,
      overflow:"hidden", background:C.surface,
    }}>
      {/* ── Header bar (always visible) ── */}
      <div onClick={handleToggle} style={{
        display:"flex", alignItems:"center", gap:8,
        padding:"7px 14px", cursor:"pointer", userSelect:"none",
        background: open ? C.surface : C.bg,
        borderBottom: open ? `1px solid ${C.border}` : "none",
      }}>
        <span style={{...mono, fontSize:11, fontWeight:700, color:C.accent, letterSpacing:1}}>
          IBKR NEWS
        </span>
        {badge > 0 && (
          <span style={{background:"#ef4444", color:"#fff", borderRadius:10,
            padding:"1px 6px", fontSize:9, fontWeight:700, lineHeight:1.6}}>
            +{badge}
          </span>
        )}
        {!editTick && (
          <span style={{...mono, fontSize:10, color:C.muted, marginLeft:2}}>
            {subs.length > 0 ? subs.join(" · ") : "no tickers"}
          </span>
        )}
        <div style={{flex:1}} />
        <span onClick={e => { e.stopPropagation(); setEditTick(v => !v); if (!open) setOpen(true); }}
          style={{...mono, fontSize:10, color:C.muted, padding:"1px 6px",
            border:`1px solid ${C.border}`, borderRadius:4, cursor:"pointer"}}>
          edit tickers
        </span>
        <span style={{...mono, fontSize:10, color:C.muted}}>
          {feed.length > 0 ? `${feed.length} headlines` : "no headlines"}
        </span>
        <span style={{...mono, fontSize:10, color:C.muted}}>{open ? "▲" : "▼"}</span>
      </div>

      {/* ── Ticker editor ── */}
      {open && editTick && (
        <div style={{padding:"8px 14px", borderBottom:`1px solid ${C.border}`,
          background:C.bg, display:"flex", gap:8, alignItems:"center"}}>
          <input
            style={{...mono, fontSize:12, background:C.surface, border:`1px solid ${C.border}`,
              borderRadius:4, padding:"3px 8px", color:C.text, flex:1}}
            defaultValue={subs.join(", ")}
            placeholder="AMZN, META, NVDA, …"
            onChange={e => setTicker(e.target.value)}
            onKeyDown={e => e.key === "Enter" && saveTickers()}
          />
          <button onClick={saveTickers}
            style={{...mono, fontSize:11, background:C.accent, color:"#fff",
              border:"none", borderRadius:4, padding:"3px 10px", cursor:"pointer"}}>
            Save
          </button>
          <button onClick={() => setEditTick(false)}
            style={{...mono, fontSize:11, background:C.surface, color:C.muted,
              border:`1px solid ${C.border}`, borderRadius:4, padding:"3px 8px", cursor:"pointer"}}>
            Cancel
          </button>
        </div>
      )}

      {/* ── Headlines list ── */}
      {open && (
        <div style={{maxHeight:260, overflowY:"auto"}}>
          {feed.length === 0 ? (
            <div style={{...sans, color:C.muted, padding:"14px 18px", fontSize:12}}>
              No headlines yet — subscriptions activate on market open.
            </div>
          ) : feed.map((item, i) => (
            <div key={i} style={{
              display:"flex", alignItems:"flex-start", gap:10,
              padding:"6px 14px",
              borderBottom: i < feed.length-1 ? `1px solid ${C.border}` : "none",
            }}>
              <span style={{...mono, fontSize:11, fontWeight:700, color:C.accent,
                flexShrink:0, minWidth:48}}>
                {item.ticker}
              </span>
              <span style={{...mono, fontSize:10, color:C.muted, flexShrink:0, minWidth:58}}>
                {item.time}
              </span>
              <span style={{...sans, fontSize:12, color:C.text, flex:1, lineHeight:1.45}}>
                {item.headline}
              </span>
              <span style={{...mono, fontSize:9,
                color: providerColor(item.provider), flexShrink:0}}>
                {item.provider}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]         = useState("pnl");
  const [connected, setConn]  = useState(false);
  const [netDelta, setDelta]  = useState(null);

  useEffect(() => {
    const check = async () => {
      try { const s = await apiFetch("/status"); setConn(s.connected); } catch(_) { setConn(false); }
    };
    check();
    const iv = setInterval(check, 10000);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    if (!connected) return;
    const load = async () => {
      try { const d = await apiFetch("/portfolio/delta"); setDelta(d.total_delta); } catch(_) {}
    };
    load();
    const iv = setInterval(load, 60000);
    return () => clearInterval(iv);
  }, [connected]);

  const tabGroups = [
    { id:"live",     label:"Live Trading", tabs: [
      { id:"pnl",         label:"P&L"          },
      { id:"autotrader",  label:"CSP-Leap"      },
      { id:"stocktrader", label:"Stock Trader"  },
      { id:"daytrader",   label:"Day Trader"    },
      { id:"spx0dte",     label:"SPX 0DTE"      },
      { id:"evc",         label:"Earnings"      },
      { id:"sigtrader",   label:"Sig Trader"    },
      { id:"fxtrader",      label:"FX Trader"     },
      { id:"manualtrader", label:"Manual Trader" },
      { id:"risk",        label:"Risk Monitor"  },
    ]},
    { id:"research", label:"Research", tabs: [
      { id:"signals",   label:"Signals"    },
      { id:"csp",       label:"CSP Scan"   },
      { id:"leaps",     label:"LEAPs"      },
      { id:"backtest",  label:"Backtest"   },
      { id:"0dte",      label:"0DTE / EIV" },
      { id:"orcl",      label:"ORCL"       },
    ]},
    { id:"market",   label:"Market Data", tabs: [
      { id:"watchlist",  label:"Watchlist"  },
      { id:"tape",       label:"Live Tape"  },
      { id:"instflow",   label:"Inst. Flow" },
      { id:"gexvex",     label:"GEX/VEX"    },
      { id:"technicals", label:"Technicals" },
      { id:"news",       label:"News Feed"  },
      { id:"alerts",     label:"Alerts"     },
    ]},
    { id:"analytics",label:"Analytics", tabs: [
      { id:"universe",    label:"Universe"     },
      { id:"learning",    label:"Learning"     },
      { id:"performance", label:"Performance"  },
      { id:"decisions",   label:"Decisions"    },
    ]},
  ];

  const activeGroup = tabGroups.find(g => g.tabs.some(t => t.id === tab)) || tabGroups[0];
  const deltaCol = netDelta == null ? C.muted : netDelta >= 0 ? C.bull : C.bear;

  const switchGroup = (g) => { setTab(g.tabs[0].id); };

  return (
    <div style={{ minHeight:"100vh", background:C.bg }}>
      <IndexBanner />

      {/* ── Fixed top navbar (sits below the 40px IndexBanner ticker) ── */}
      <div style={{
        position:"fixed", top:40, left:0, right:0, zIndex:200,
        background:C.surface, borderBottom:`1px solid ${C.border}`,
        height:48, display:"flex", alignItems:"center",
        padding:"0 24px", gap:16,
      }}>
        <div style={{ flex:1 }}>
          <span style={{ ...mono, fontSize:11, fontWeight:700, color:C.accent, letterSpacing:2, textTransform:"uppercase" }}>
            IBKR Algo
          </span>
          <span style={{ ...sans, fontSize:12, color:C.muted, marginLeft:10 }}>
            CSP · LEAP · Stock · Day · SPX 0DTE
          </span>
        </div>
        <div style={{ display:"flex", gap:12, alignItems:"center" }}>
          {netDelta != null && (
            <div style={{ ...mono, fontSize:12, fontWeight:700, color:deltaCol,
              padding:"3px 10px", borderRadius:12, background:`${deltaCol}18`, border:`1px solid ${deltaCol}40` }}>
              Net Δ {netDelta >= 0 ? "+" : ""}{netDelta}
            </div>
          )}
          <StatusPill connected={connected} />
        </div>
      </div>

      <div style={{ maxWidth:1280, margin:"0 auto", padding:"104px 20px 32px" }}>

        {/* ── Group row ── */}
        <div style={{ display:"flex", gap:2, marginBottom:0, borderBottom:`1px solid ${C.border}` }}>
          {tabGroups.map(g => {
            const isActive = g.id === activeGroup.id;
            return (
              <button key={g.id} onClick={() => switchGroup(g)} style={{
                ...sans, fontSize:12, fontWeight:700, padding:"7px 18px", cursor:"pointer",
                background: isActive ? C.accent : "transparent",
                border:"none", borderRadius:"6px 6px 0 0",
                color: isActive ? "#fff" : C.muted,
                letterSpacing:0.3, transition:"all 0.15s",
              }}>{g.label}</button>
            );
          })}
        </div>

        {/* ── Tab row (shows tabs of active group) ── */}
        <div style={{
          display:"flex", gap:0, marginBottom:20,
          background:C.surface, borderBottom:`1px solid ${C.border}`,
          borderRadius:"0 0 0 0", padding:"0 4px",
        }}>
          {activeGroup.tabs.map(t => {
            const isActive = t.id === tab;
            return (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                ...sans, fontSize:13, fontWeight:600, padding:"9px 18px", cursor:"pointer",
                background:"transparent", border:"none",
                color: isActive ? C.white : C.muted,
                borderBottom: isActive ? `2px solid ${C.accent}` : "2px solid transparent",
                marginBottom:-1, transition:"color 0.15s",
              }}>{t.label}</button>
            );
          })}
        </div>

        {/* ── Tab content — always mounted so scan state survives tab switches ── */}
        <div style={{display: tab==="pnl"         ? "" : "none"}}><PnLTab /></div>
        <div style={{display: tab==="signals"      ? "" : "none"}}><SignalsTab    connected={connected} /></div>
        <div style={{display: tab==="csp"          ? "" : "none"}}><CSPTab        connected={connected} /></div>
        <div style={{display: tab==="leaps"        ? "" : "none"}}><LEAPTab       connected={connected} /></div>
        <div style={{display: tab==="autotrader"   ? "" : "none"}}><AutoTraderTab /></div>
        <div style={{display: tab==="stocktrader"  ? "" : "none"}}><StockTraderTab /></div>
        <div style={{display: tab==="daytrader"    ? "" : "none"}}><DayTraderTab /></div>
        <div style={{display: tab==="spx0dte"      ? "" : "none"}}><SPX0DTETab /></div>
        <div style={{display: tab==="evc"          ? "" : "none"}}><EVCTab /></div>
        <div style={{display: tab==="sigtrader"    ? "" : "none"}}><SigTraderTab /></div>
        <div style={{display: tab==="fxtrader"      ? "" : "none"}}><FXTraderTab /></div>
        <div style={{display: tab==="manualtrader" ? "" : "none"}}><ManualTraderTab /></div>
        <div style={{display: tab==="orcl"         ? "" : "none"}}><ORCLResearchTab /></div>
        <div style={{display: tab==="risk"         ? "" : "none"}}><RiskMonitorTab /></div>
        <div style={{display: tab==="backtest"     ? "" : "none"}}><BacktestTab   connected={connected} /></div>
        <div style={{display: tab==="0dte"         ? "" : "none"}}><ZeroDTETab    connected={connected} /></div>
        <div style={{display: tab==="learning"     ? "" : "none"}}><LearningTab /></div>
        <div style={{display: tab==="universe"     ? "" : "none"}}><UniverseTab /></div>
        <div style={{display: tab==="decisions"    ? "" : "none"}}><DecisionsTab /></div>
        <div style={{display: tab==="technicals"   ? "" : "none"}}><TechnicalsTab /></div>
        <div style={{display: tab==="watchlist"    ? "" : "none"}}><WatchlistTab /></div>
        <div style={{display: tab==="tape"         ? "" : "none"}}><TapeTab /></div>
        <div style={{display: tab==="instflow"     ? "" : "none"}}><InstFlowTab /></div>
        <div style={{display: tab==="gexvex"       ? "" : "none"}}><GexVexTab /></div>
        <div style={{display: tab==="news"         ? "" : "none"}}><NewsMonitorTab /></div>
        <div style={{display: tab==="alerts"       ? "" : "none"}}><AlertsTab /></div>
        <div style={{display: tab==="performance"  ? "" : "none"}}><PerformanceTab /></div>

        {/* ── IBKR News Panel (persistent across all tabs) ── */}
        <LiveNewsPanel />

        {/* ── Footer ── */}
        <div style={{ marginTop:32, paddingTop:16, borderTop:`1px solid ${C.border}`,
          display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
          <span style={{ ...sans, fontSize:11, color:C.muted }}>
            CSP-Leap: Kelly sizing · 50% target · IV-adjusted stops · 21 DTE roll · 48h cooldown
          </span>
          <span style={{ ...sans, fontSize:11, color:C.muted }}>
            IBKR Algo Trading · v6
          </span>
        </div>

        {/* ── Disclaimer ── */}
        <div style={{
          marginTop: 16, padding: "12px 16px",
          background: "#1a1200", border: "1px solid #78350f", borderRadius: 8,
          display: "flex", alignItems: "flex-start", gap: 10,
        }}>
          <span style={{ fontSize: 16, flexShrink: 0 }}>⚠️</span>
          <div style={{ ...sans, fontSize: 11, color: "#fbbf24", lineHeight: 1.7 }}>
            <b>Not Financial or Investment Advice.</b>{" "}
            For informational and educational purposes only. Algorithms carry no guarantee of accuracy or profitability.
            Options trading involves substantial risk of loss. You are solely responsible for all trading decisions.{" "}
            <b>Use at your own risk.</b>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
