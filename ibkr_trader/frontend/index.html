            style={{ ...sans, flex:1, padding:"8px 12px", borderRadius:8, border:`1px solid ${C.border}`,
                     fontSize:13, color:C.text, background:C.card, outline:"none" }}
          />
          <button
            onClick={analyze}
            disabled={loading || !ticker.trim()}
            style={{ ...sans, padding:"8px 20px", borderRadius:8, border:"none", cursor:"pointer",
                     background:C.accent, color:"#fff", fontWeight:700, fontSize:13,
                     opacity: (loading || !ticker.trim()) ? 0.6 : 1 }}
          >{loading ? "Analyzing…" : "Analyze"}</button>
        </div>
        <div style={{ fontSize:12, color:C.muted }}>
          Pulls 1 year of daily OHLCV from IBKR. Computes RSI-14, MACD (12/26/9),
          Bollinger Bands (20,2), SMA-20/50/200, and volume breakout. Requires active connection.
        </div>
      </Card>

      {error && (
        <Card style={{ borderColor:"#dc2626", marginTop:12 }}>
          <div style={{ color:"#dc2626", fontWeight:600 }}>{error}</div>
        </Card>
      )}

      {result && (
        <>
          {/* Header row */}
          <div style={{ display:"flex", alignItems:"center", gap:12, marginTop:12, marginBottom:12, flexWrap:"wrap" }}>
            <span style={{ ...sans, fontSize:22, fontWeight:800, color:C.text }}>{result.ticker}</span>
            <span style={{ ...sans, fontSize:20, fontWeight:700, color:C.text }}>${result.price?.toFixed(2)}</span>
            <span style={{ ...sans, fontSize:14, fontWeight:600,
                           color: result.change_pct >= 0 ? C.bull : C.bear }}>
              {result.change_pct >= 0 ? "+" : ""}{result.change_pct?.toFixed(2)}%
            </span>
            <Pill label={oc.label} color={oc.col} bg={oc.bg} />
            <Pill label={(sum.trend || "").toUpperCase()} color={trendColors[sum.trend] || C.muted} />
            {brk.signal !== "NORMAL" && (
              <Pill label={brk.signal} color={brk.confirmed ? "#7c3aed" : "#f97316"} />
            )}
            <span style={{ ...sans, fontSize:11, color:C.muted, marginLeft:"auto" }}>
              {result.bars_used} bars
            </span>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            {/* RSI + MACD */}
            <Card title="Momentum">
              <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                <GaugeBar
                  label="RSI-14"
                  value={ind.rsi14 || 50}
                  thresholds={[
                    { at:0,  color:"#dc2626" },
                    { at:30, color:"#64748b" },
                    { at:70, color:"#f97316" },
                  ]}
                />
                <div style={{ fontSize:11, color:C.muted, marginTop:-6 }}>
                  Zone: <span style={{ fontWeight:700, color:
                    ind.rsi_zone==="overbought" ? "#f97316" :
                    ind.rsi_zone==="oversold"   ? "#dc2626" : C.muted }}>
                    {sum.rsi_zone?.toUpperCase()}
                  </span>
                </div>
                <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:10 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:C.muted, marginBottom:6 }}>MACD (12/26/9)</div>
                  <div style={{ display:"flex", gap:16, fontSize:12 }}>
                    <div><span style={{ color:C.muted }}>Line </span>
                      <span style={{ fontWeight:700, color:C.text }}>{ind.macd?.toFixed(4)}</span></div>
                    <div><span style={{ color:C.muted }}>Signal </span>
                      <span style={{ fontWeight:700, color:C.text }}>{ind.macd_signal?.toFixed(4)}</span></div>
                    <div><span style={{ color:C.muted }}>Hist </span>
                      <span style={{ fontWeight:700, color: (ind.macd_hist||0)>0 ? C.bull : C.bear }}>
                        {ind.macd_hist?.toFixed(4)}
                      </span></div>
                  </div>
                  <div style={{ marginTop:6 }}>
                    <Pill label={(sum.macd_bias || "").toUpperCase()} color={(sum.macd_bias==="bullish") ? C.bull : C.bear} />
                  </div>
                </div>
              </div>
            </Card>

            {/* Bollinger Bands */}
            <Card title="Bollinger Bands (20, 2)">
              {ind.bb_upper != null ? (
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                    <span style={{ color:C.muted }}>Upper</span>
                    <span style={{ fontWeight:700, color:C.bear }}>${ind.bb_upper?.toFixed(2)}</span>
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                    <span style={{ color:C.muted }}>Mid (SMA-20)</span>
                    <span style={{ fontWeight:700, color:C.accent }}>${ind.bb_mid?.toFixed(2)}</span>
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                    <span style={{ color:C.muted }}>Lower</span>
                    <span style={{ fontWeight:700, color:C.bull }}>${ind.bb_lower?.toFixed(2)}</span>
                  </div>
                  <div style={{ marginTop:4 }}>
                    <GaugeBar
                      label="%B (price position in band)"
                      value={ind.pct_b || 50}
                      thresholds={[
                        { at:0,  color:"#16a34a" },
                        { at:40, color:"#64748b" },
                        { at:75, color:"#f97316" },
                        { at:90, color:"#dc2626" },
                      ]}
                    />
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:C.muted, marginTop:2 }}>
                      <span>lower band</span><span>mid</span><span>upper band</span>
                    </div>
                  </div>
                </div>
              ) : <div style={{ color:C.muted, fontSize:12 }}>Insufficient data</div>}
            </Card>

            {/* Moving Averages */}
            <Card title="Moving Averages">
              {[
                { label:"SMA-20",  value:ind.sma20,   above:ind.above_sma20  },
                { label:"SMA-50",  value:ind.sma50,   above:ind.above_sma50  },
                { label:"SMA-200", value:ind.sma200,  above:ind.above_sma200 },
              ].map(({ label, value, above }) => (
                <div key={label} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                                          fontSize:12, padding:"5px 0", borderBottom:`1px solid ${C.border}` }}>
                  <span style={{ color:C.muted, fontWeight:600 }}>{label}</span>
                  <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                    <span style={{ fontWeight:700, color:C.text }}>
                      {value != null ? `$${value.toFixed(2)}` : "—"}
                    </span>
                    {above != null && (
                      <span style={{ fontSize:10, fontWeight:700, padding:"1px 7px", borderRadius:8,
                                     background: above ? "#16a34a22" : "#dc262622",
                                     color: above ? C.bull : C.bear }}>
                        {above ? "ABOVE" : "BELOW"}
                      </span>
                    )}
                  </div>
                </div>
              ))}
              <div style={{ marginTop:8, fontSize:11, color:C.muted }}>
                {ind.above_sma20 && ind.above_sma50 && ind.above_sma200
                  ? "Full bullish MA stack — strong uptrend"
                  : !ind.above_sma20 && !ind.above_sma50 && ind.above_sma200 === false
                  ? "Full bearish MA stack — strong downtrend"
                  : "Mixed MA alignment — choppy or transitioning"}
              </div>
            </Card>

            {/* Volume & Breakout */}
            <Card title="Volume & Breakout">
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                  <span style={{ color:C.muted }}>Volume ratio (vs 20d avg)</span>
                  <span style={{ fontWeight:700, color: (ind.vol_ratio||1) >= (ind.vol_90pct||1.5) ? "#7c3aed" : C.text }}>
                    {ind.vol_ratio?.toFixed(2)}×
                  </span>
                </div>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.muted }}>
                  <span>Breakout threshold (90th-pct, trailing 252d)</span>
                  <span style={{ fontWeight:600, color:"#7c3aed" }}>{ind.vol_90pct?.toFixed(2)}×</span>
                </div>
                <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                  <Pill
                    label={brk.signal}
                    color={ brk.signal==="BREAKOUT" ? "#7c3aed" : brk.signal==="WATCH" ? "#f97316" : C.muted }
                  />
                  <span style={{ fontSize:11, color:C.muted }}>
                    {brk.signal==="BREAKOUT" && `Vol ${ind.vol_ratio?.toFixed(2)}× ≥ ${ind.vol_90pct?.toFixed(2)}× threshold + upper BB`}
                    {brk.signal==="WATCH"    && "Price at upper BB, volume not above 90th-pct threshold"}
                    {brk.signal==="NORMAL"   && "No breakout pattern"}
                  </span>
                </div>
                <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:10 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:C.muted, marginBottom:8 }}>
                    IV Rank
                  </div>
                  {ivr.rank != null ? (
                    <>
                      <GaugeBar
                        label={`IV Rank — current IV ${ivr.iv != null ? ivr.iv.toFixed(1)+"%" : "N/A"}`}
                        value={ivr.rank}
                        thresholds={[
                          { at:0,  color:"#16a34a" },
                          { at:30, color:"#f97316" },
                          { at:50, color:"#dc2626" },
                        ]}
                      />
                      <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:C.muted, marginTop:2 }}>
                        <span>low IV (cheap premium)</span>
                        <span>50%</span>
                        <span>high IV (rich premium)</span>
                      </div>
                      {ivr.rv_lo != null && ivr.rv_hi != null && (
                        <div style={{ fontSize:11, color:C.muted, marginTop:4 }}>
                          52-week RV range: {ivr.rv_lo.toFixed(1)}% – {ivr.rv_hi.toFixed(1)}%
                        </div>
                      )}
                    </>
                  ) : (
                    <div style={{ fontSize:11, color:C.muted }}>IV rank unavailable (yfinance options data not fetched)</div>
                  )}
                </div>
                <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:10, marginTop:4 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:C.muted, marginBottom:6 }}>
                    CSP Implication
                  </div>
                  <div style={{ fontSize:12, color:C.text, lineHeight:1.6 }}>
                    {(() => {
                      const rank   = ivr.rank;
                      const bbLow  = ind.pct_b != null && ind.pct_b < 30;
                      const bbHigh = ind.pct_b != null && ind.pct_b > 80;
                      const rsiOs  = (ind.rsi14 || 50) < 45;
                      const ivHigh = rank != null && rank >= 50;
                      const ivMod  = rank != null && rank >= 30;

                      if (rank == null) {
                        // IV rank not available — fall back to pure technical signal
                        if (bbLow && rsiOs)
                          return "Price near lower BB + RSI oversold → technically set up for a bounce. Check IV rank in the Universe tab before selling puts.";
                        if (bbHigh)
                          return "Price near upper BB → extended move. CSP assignment risk elevated; wait for a pullback.";
                        if (brk.signal === "BREAKOUT")
                          return "Volume-confirmed breakout → underlying strength. CSP on a pullback to upper BB.";
                        return "Normal range. Standard CSP criteria apply — confirm IV rank ≥ 50% before entry.";
                      }

                      const rankLabel = rank >= 50 ? "HIGH" : rank >= 30 ? "MODERATE" : "LOW";
                      const rankCol   = rank >= 50 ? "#dc2626" : rank >= 30 ? "#f97316" : "#16a34a";
                      const rankSpan  = <span style={{ fontWeight:700, color:rankCol }}>IV rank {rank.toFixed(0)}% ({rankLabel})</span>;

                      if (ivHigh && bbLow && rsiOs)
                        return <>{rankSpan} + price near lower BB + RSI oversold → strong CSP setup. Elevated premium with underlying near support — high-conviction entry.</>;
                      if (ivHigh && bbHigh)
                        return <>{rankSpan} but price near upper BB → premium is rich but assignment risk is elevated on a reversal. Consider a lower strike.</>;
                      if (ivHigh && brk.signal === "BREAKOUT")
                        return <>{rankSpan} + volume breakout → strong momentum. CSP on a pullback to upper BB rather than chasing here.</>;
                      if (ivHigh)
                        return <>{rankSpan} → good time to sell premium. Standard CSP entry criteria apply (delta ≤ 0.20, 30–50 DTE).</>;
                      if (ivMod && bbLow && rsiOs)
                        return <>{rankSpan} — premium is thin but technicals are supportive. Viable if strike selection is conservative (delta ≤ 0.15).</>;
                      if (ivMod)
                        return <>{rankSpan} — premium is below ideal. Consider waiting for IV rank ≥ 50% before selling puts.</>;
                      return <>{rankSpan} → premium is compressed. Hold off; wait for a vol expansion event before selling puts.</>;
                    })()}
                  </div>
                </div>
              </div>
            </Card>
          </div>

          {/* ── Support & Resistance ───────────────────────────────────────── */}
          {result.support_resistance && (() => {
            const sr  = result.support_resistance;
            const sw  = sr.swing    || {};
            const pv  = sr.pivots   || {};
            const fib = sr.fibonacci || {};
            const fibLevels = fib.levels || {};
            const price = result.price;

            const LevelRow = ({ label, value, tag, tagColor }) => (
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                            fontSize:12, padding:"5px 0", borderBottom:`1px solid ${C.border}33` }}>
                <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                  <span style={{ ...mono, fontSize:10, fontWeight:700, padding:"1px 7px", borderRadius:8,
                                 background:`${tagColor}22`, color:tagColor, minWidth:28, textAlign:"center" }}>
                    {tag}
                  </span>
                  <span style={{ color:C.muted }}>{label}</span>
                </div>
                <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                  <span style={{ ...mono, fontWeight:700, color:C.text }}>${value?.toFixed(2)}</span>
                  <span style={{ ...mono, fontSize:10, color: value > price ? C.bear : C.bull }}>
                    {value > price ? `+${((value/price-1)*100).toFixed(1)}%` : `-${((1-value/price)*100).toFixed(1)}%`}
                  </span>
                </div>
              </div>
            );

            return (
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginTop:12 }}>

                {/* Swing S/R */}
                <Card title="Swing Levels (60-bar, 5-bar confirm)">
                  {(sw.resistance || []).length === 0 && (sw.support || []).length === 0
                    ? <div style={{ fontSize:12, color:C.muted }}>No swing levels detected</div>
                    : <>
                        {(sw.resistance || []).map((v, i) => (
                          <LevelRow key={`r${i}`} label={`Resistance ${i+1}`} value={v} tag="R" tagColor={C.bear} />
                        ))}
                        <div style={{ padding:"4px 0", textAlign:"center" }}>
                          <span style={{ ...mono, fontSize:11, color:C.accent }}>▶ ${price?.toFixed(2)} current</span>
                        </div>
                        {(sw.support || []).map((v, i) => (
                          <LevelRow key={`s${i}`} label={`Support ${i+1}`} value={v} tag="S" tagColor={C.bull} />
                        ))}
                      </>
                  }
                </Card>

                {/* Pivot Points */}
                <Card title={`Pivot Points (prior session)`}>
                  {[
                    { tag:"R3", label:"Resistance 3", value:pv.r3, color:C.bear   },
                    { tag:"R2", label:"Resistance 2", value:pv.r2, color:C.bear   },
                    { tag:"R1", label:"Resistance 1", value:pv.r1, color:C.bear   },
                    { tag:"PP", label:"Pivot",        value:pv.pp, color:C.accent },
                    { tag:"S1", label:"Support 1",    value:pv.s1, color:C.bull   },
                    { tag:"S2", label:"Support 2",    value:pv.s2, color:C.bull   },
                    { tag:"S3", label:"Support 3",    value:pv.s3, color:C.bull   },
                  ].map(({ tag, label, value, color }) => (
                    <div key={tag} style={{ display:"flex", justifyContent:"space-between",
                                           alignItems:"center", fontSize:12, padding:"4px 0",
                                           borderBottom:`1px solid ${C.border}33`,
                                           background: Math.abs((value||0) - price) < 0.5 ? `${C.accent}11` : "transparent" }}>
                      <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                        <span style={{ ...mono, fontSize:10, fontWeight:700, padding:"1px 7px",
                                       borderRadius:8, background:`${color}22`, color, minWidth:28, textAlign:"center" }}>
                          {tag}
                        </span>
                        <span style={{ color:C.muted }}>{label}</span>
                      </div>
                      <span style={{ ...mono, fontWeight:700, color }}>${value?.toFixed(2)}</span>
                    </div>
                  ))}
                </Card>

                {/* Fibonacci */}
                <Card title={`Fibonacci — ${(fib.direction||"").toUpperCase()} (60-bar swing)`}>
                  <div style={{ fontSize:11, color:C.muted, marginBottom:8 }}>
                    Swing: ${fib.swing_low?.toFixed(2)} → ${fib.swing_high?.toFixed(2)}
                    &nbsp;·&nbsp;
                    <span style={{ color: fib.direction==="uptrend" ? C.bull : C.bear }}>
                      {fib.direction === "uptrend" ? "↑ retracement support" : "↓ retracement resistance"}
                    </span>
                  </div>
                  {[
                    { ratio:"0.000", label:"0%"    },
                    { ratio:"0.236", label:"23.6%" },
                    { ratio:"0.382", label:"38.2%" },
                    { ratio:"0.500", label:"50%"   },
                    { ratio:"0.618", label:"61.8%" },
                    { ratio:"0.786", label:"78.6%" },
                    { ratio:"1.000", label:"100%"  },
                  ].map(({ ratio, label }) => {
                    const v = fibLevels[ratio];
                    const isKey = ["0.382","0.500","0.618"].includes(ratio);
                    const nearPrice = v != null && Math.abs(v - price) / price < 0.015;
                    return (
                      <div key={ratio} style={{ display:"flex", justifyContent:"space-between",
                                                alignItems:"center", fontSize:12, padding:"3px 0",
                                                borderBottom:`1px solid ${C.border}33`,
                                                background: nearPrice ? `${C.accent}15` : "transparent" }}>
                        <span style={{ color: isKey ? C.text : C.muted, fontWeight: isKey ? 700 : 400 }}>
                          {label}{nearPrice && " ◀"}
                        </span>
                        <span style={{ ...mono, fontWeight: isKey ? 700 : 400,
                                       color: isKey ? C.accent : C.muted }}>
                          {v != null ? `$${v.toFixed(2)}` : "—"}
                        </span>
                      </div>
                    );
                  })}
                </Card>

              </div>
            );
          })()}
        </>
      )}
    </div>
  );
}


// ── Decisions Tab ─────────────────────────────────────────────────────────
function DecisionsTab() {
  const [decisions, setDecisions] = useState([]);
  const [loading,   setLoading]   = useState(true);
  const [filter,    setFilter]    = useState("ALL");

  const load = async () => {
    try {
      const r = await apiFetch("/autotrader/decisions?limit=200");
      setDecisions(r.decisions || []);
    } catch(_) {}
    finally { setLoading(false); }
  };

  useEffect(() => {
    load();
    const id = setInterval(load, 10000);
    return () => clearInterval(id);
  }, []);

  const ACTION_META = {
    ENTER:        { label:"Entry",         color:"#27ae60", bg:"#0d3321" },
    ROLL:         { label:"Roll",          color:"#3b82f6", bg:"#0c1a3a" },
    CLOSE_PROFIT: { label:"Profit ✓",      color:"#f1c40f", bg:"#2d2600" },
    CLOSE_STOP:   { label:"Stop ⚠",        color:"#e74c3c", bg:"#2d0b0b" },
    CLOSE_21DTE:  { label:"21 DTE",        color:"#f39c12", bg:"#2d1c00" },
    CLOSE_ROLL:   { label:"Roll-Close",    color:"#64748b", bg:"#1e293b" },
    CLOSE_ROTATE: { label:"Rotate",        color:"#a855f7", bg:"#1e1033" },
    CLOSE_MANUAL: { label:"Manual",        color:"#94a3b8", bg:"#1e293b" },
  };
  const ALL_FILTERS = ["ALL","ENTER","ROLL","CLOSE_PROFIT","CLOSE_STOP","CLOSE_21DTE","CLOSE_ROLL","CLOSE_ROTATE"];

  const filtered = filter === "ALL" ? decisions : decisions.filter(d => d.action === filter);

  // Render markdown-lite: **bold** and \n\n as paragraphs
  const renderBody = body => {
    if (!body) return null;
    return body.split("\n\n").map((para, i) => {
      const parts = para.split(/(\*\*[^*]+\*\*)/g).map((p, j) =>
        p.startsWith("**") ? <strong key={j}>{p.slice(2,-2)}</strong> : p
      );
      return <p key={i} style={{ margin:"4px 0", lineHeight:1.65 }}>{parts}</p>;
    });
  };

  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16, flexWrap:"wrap" }}>
        <div style={{ ...sans, fontSize:14, fontWeight:700, color:"#f1f5f9" }}>
          Trade Decision Log
        </div>
        <div style={{ ...mono, fontSize:11, color:"#64748b" }}>
          {filtered.length} decision{filtered.length !== 1 ? "s" : ""}
          {filter !== "ALL" ? ` · ${filter}` : ""}
        </div>
        <div style={{ display:"flex", gap:6, marginLeft:"auto", flexWrap:"wrap" }}>
          {ALL_FILTERS.map(f => {
            const m = ACTION_META[f] || {};
            return (
              <button key={f} onClick={() => setFilter(f)} style={{
                ...sans, fontSize:11, padding:"3px 10px", borderRadius:12,
                cursor:"pointer", fontWeight: filter===f ? 700 : 400,
                border: `1px solid ${filter===f ? (m.color||"#3b82f6") : "#334155"}`,
                background: filter===f ? (m.bg||"#1e293b") : "transparent",
                color: filter===f ? (m.color||"#93c5fd") : "#64748b",
              }}>{f==="ALL" ? "All" : (m.label||f)}</button>
            );
          })}
        </div>
        <button onClick={load} style={{
          ...sans, fontSize:11, padding:"3px 10px", borderRadius:6,
          background:"#1e293b", color:"#94a3b8", border:"1px solid #334155", cursor:"pointer",
        }}>Refresh</button>
      </div>

      {loading && <div style={{ color:"#64748b", ...mono }}>Loading decisions…</div>}
      {!loading && filtered.length === 0 && (
        <Card>
          <div style={{ color:"#64748b", ...sans, fontSize:13 }}>
            No decisions recorded yet. The CSP-Leap Trader logs a plain-English explanation
            every time it enters, rolls, or exits a trade.
          </div>
        </Card>
      )}

      <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
        {filtered.map((d, i) => {
          const m = ACTION_META[d.action] || { label:d.action, color:"#94a3b8", bg:"#1e293b" };
          return (
            <Card key={i} style={{ borderLeft:`3px solid ${m.color}`, padding:"14px 18px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                <span style={{
                  ...mono, fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:8,
                  background: m.bg, color: m.color, border:`1px solid ${m.color}55`,
                }}>{m.label}</span>
                <span style={{ ...mono, fontSize:13, fontWeight:700, color:"#f1f5f9" }}>
                  {d.ticker}
                </span>
                <span style={{ flex:1, ...sans, fontSize:13, color:"#cbd5e1" }}>
                  {d.headline}
                </span>
                <span style={{ ...mono, fontSize:11, color:C.muted, whiteSpace:"nowrap" }}>
                  {d.time}
                </span>
              </div>
              <div style={{ ...sans, fontSize:12, color:"#94a3b8", paddingLeft:4 }}>
                {renderBody(d.body)}
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}


// ── Stock Trader Tab ──────────────────────────────────────────────────────
function StockTraderTab() {
  const [status,      setStatus]      = useState(null);
  const [loading,     setLoading]     = useState(true);
  const [toggling,    setToggling]    = useState(false);
  const [showConfig,  setShowConfig]  = useState(false);
  const [cfgEdit,     setCfgEdit]     = useState({});
  const [saving,      setSaving]      = useState(false);
  const [closing,     setClosing]     = useState({});
  const [histDays,    setHistDays]    = useState(30);
  const [history,     setHistory]     = useState(null);
  const [histLoading, setHistLoading] = useState(false);

  const load = async () => {
    try {
      const r = await apiFetch("/stock-trader/status");
      setStatus(r);
    } catch(_) {}
    finally { setLoading(false); }
  };

  useEffect(() => {
    load();
    const id = setInterval(load, 10000);
    return () => clearInterval(id);
  }, []);

  const toggle = async () => {
    if (!status) return;
    setToggling(true);
    try {
      const next = !status.enabled;
      await apiFetch(`/stock-trader/enable?enabled=${next}`, { method: "POST" });
      await load();
    } catch(_) {}
    finally { setToggling(false); }
  };

  const openConfig = () => {
    if (!status) return;
    setCfgEdit({ ...status.config });
    setShowConfig(true);
  };

  const saveConfig = async () => {
    setSaving(true);
    try {
      const boolFields = new Set(["rotation_enabled"]);
      const patch = {};
      Object.entries(cfgEdit).forEach(([k, v]) => {
        if (boolFields.has(k)) { patch[k] = Boolean(v); return; }
        const n = Number(v);
        patch[k] = isNaN(n) ? v : n;
      });
      await apiFetch("/stock-trader/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      setShowConfig(false);
      await load();
    } catch(_) {}
    finally { setSaving(false); }
  };

  const closePos = async (ticker) => {
    setClosing(c => ({ ...c, [ticker]: true }));
    try {
      await apiFetch(`/stock-trader/close/${ticker}`, { method: "POST" });
      await load();
    } catch(_) {}
    finally { setClosing(c => ({ ...c, [ticker]: false })); }
  };

  const loadHistory = async () => {
    setHistLoading(true);
    try {
      const r = await apiFetch(`/stock-trader/history?days=${histDays}`);
      setHistory(r);
    } catch(_) {}
    finally { setHistLoading(false); }
  };

  const pnlColor = v => v > 0 ? C.bull : v < 0 ? C.bear : C.muted;
  const phaseLabel = p => p === 0 ? "PENDING" : p === 1 ? "STOP" : p === 2 ? "TRAIL" : "CLOSING";
  const phaseColor = p => p === 0 ? C.muted : p === 1 ? C.neutral : p === 2 ? C.bull : C.bear;
  const exitColor  = e => e === "hard_stop" ? C.bear : e === "trail_stop" ? C.neutral : e === "max_hold" ? C.bull : C.muted;

  if (loading) return <div style={{ color: C.muted, padding: 32, textAlign: "center", ...sans }}>Loading…</div>;

  const cfg     = status?.config || {};
  const pos     = status?.positions || {};
  const closed  = status?.closed_today || [];
  const dec     = status?.decisions || [];
  const summary = status?.summary || {};
  const enabled = status?.enabled || false;

  const posArr = Object.entries(pos).sort((a, b) => (b[1].entry_date || "").localeCompare(a[1].entry_date || ""));

  return (
    <div style={{ animation: "fadeIn 0.2s ease" }}>
      {/* ── Header ────────────────────────────────────────────────────── */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start",
          flexWrap: "wrap", gap: 12, marginBottom: 16 }}>
        <div>
          <div style={{ ...mono, fontSize: 10, color: C.accent, letterSpacing: 3,
              textTransform: "uppercase", marginBottom: 4 }}>
            Breakout Momentum · Stock Trader
          </div>
          <div style={{ ...sans, fontSize: 17, fontWeight: 700, color: C.white }}>
            Stock Trader
            <span style={{ ...mono, fontSize: 11, color: C.muted, marginLeft: 12, fontWeight: 400 }}>
              {summary.open_positions || 0} open · ${(summary.capital_deployed || 0).toLocaleString()} deployed
            </span>
          </div>
          <div style={{ ...sans, fontSize: 12, color: C.muted, marginTop: 3 }}>
            7% hard stop (d1-5) · 5% IBKR trail (d5-30) · ${cfg.position_size?.toLocaleString()} per trade ·
            max {cfg.max_positions} positions
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          {summary.today_pnl !== undefined && (
            <div style={{ ...mono, fontSize: 13, fontWeight: 700,
                color: pnlColor(summary.today_pnl),
                padding: "4px 12px", borderRadius: 16,
                background: `${pnlColor(summary.today_pnl)}11`,
                border: `1px solid ${pnlColor(summary.today_pnl)}33` }}>
              Today {summary.today_pnl >= 0 ? "+" : ""}${summary.today_pnl?.toFixed(2)}
            </div>
          )}
          <button onClick={openConfig} style={{ ...sans, fontSize: 12, padding: "7px 14px",
              borderRadius: 6, background: C.surface, border: `1px solid ${C.border}`,
              color: C.text, cursor: "pointer" }}>
            Config
          </button>
          <button onClick={toggle} disabled={toggling} style={{
              ...sans, fontSize: 13, fontWeight: 700, padding: "7px 20px", borderRadius: 8,
              cursor: "pointer", border: "none",
              background: enabled ? "#dc2626" : C.accent,
              color: "#fff", opacity: toggling ? 0.7 : 1,
          }}>
            {toggling ? "…" : enabled ? "● ENABLED" : "○ DISABLED"}
          </button>
        </div>
      </div>

      {/* ── Config Modal ──────────────────────────────────────────────── */}
      {showConfig && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)",
            zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12,
              padding: 28, minWidth: 380, maxWidth: 480, width: "90vw" }}>
            <div style={{ ...sans, fontSize: 15, fontWeight: 700, color: C.white, marginBottom: 18 }}>
              Stock Trader Config
            </div>
            {[
              ["position_size",        "Position Size ($)",        "number"],
              ["max_positions",        "Max Concurrent Positions", "number"],
              ["hard_stop_pct",        "Hard Stop % (phase 1)",    "number"],
              ["trail_pct",            "Trail Stop % (phase 2)",   "number"],
              ["max_hold_days",        "Max Hold (trading days)",  "number"],
              ["signal_freshness_min", "Signal Freshness (min)",   "number"],
              ["limit_buffer_pct",     "Limit Buffer % (0.10)",    "number"],
            ].map(([k, label]) => (
              <div key={k} style={{ marginBottom: 12 }}>
                <div style={{ ...sans, fontSize: 11, color: C.muted, marginBottom: 4 }}>{label}</div>
                <input
                  type="number" step="any"
                  value={cfgEdit[k] ?? ""}
                  onChange={e => setCfgEdit(c => ({ ...c, [k]: e.target.value }))}
                  style={{ width: "100%", padding: "7px 10px", borderRadius: 6,
                    border: `1px solid ${C.border}`, ...mono, fontSize: 13, background: C.bg }}
                />
              </div>
            ))}
            <div style={{ marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div>
                <div style={{ ...sans, fontSize: 13, fontWeight: 600, color: C.text }}>Auto-Rotate Weak Positions</div>
                <div style={{ ...sans, fontSize: 11, color: C.muted, marginTop: 2 }}>
                  When full, evict the deepest loser (≥3d held) if a stronger signal arrives in a different sector
                </div>
              </div>
              <div
                onClick={() => setCfgEdit(c => ({ ...c, rotation_enabled: !c.rotation_enabled }))}
                style={{ width: 44, height: 24, borderRadius: 12, cursor: "pointer", flexShrink: 0, marginLeft: 16,
                  background: cfgEdit.rotation_enabled ? C.accent : C.border, position: "relative", transition: "background 0.2s" }}>
                <div style={{ position: "absolute", top: 3, left: cfgEdit.rotation_enabled ? 23 : 3,
                    width: 18, height: 18, borderRadius: "50%", background: "#fff", transition: "left 0.2s" }} />
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 18, justifyContent: "flex-end" }}>
              <button onClick={() => setShowConfig(false)} style={{ ...sans, fontSize: 13,
                  padding: "7px 18px", borderRadius: 6, border: `1px solid ${C.border}`,
                  background: C.bg, cursor: "pointer", color: C.text }}>
                Cancel
              </button>
              <button onClick={saveConfig} disabled={saving} style={{ ...sans, fontSize: 13,
                  fontWeight: 700, padding: "7px 20px", borderRadius: 6, border: "none",
                  background: C.accent, color: "#fff", cursor: "pointer" }}>
                {saving ? "Saving…" : "Save"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Open Positions ────────────────────────────────────────────── */}
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10,
          padding: 18, marginBottom: 16 }}>
        <div style={{ ...sans, fontSize: 13, fontWeight: 700, color: C.white, marginBottom: 12 }}>
          Open Positions ({posArr.length})
        </div>
        {posArr.length === 0 ? (
          <div style={{ ...sans, fontSize: 13, color: C.muted, padding: "12px 0" }}>
            No open positions — waiting for BREAKOUT signals{!enabled && " (trader disabled)"}
          </div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ ...sans, fontSize: 12, minWidth: 720 }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                  {["Ticker","Entry","Shares","Cost","Live P&L","Phase","Day","Stop / Trail",""].map(h => (
                    <th key={h} style={{ ...sans, fontSize: 10, fontWeight: 600, color: C.muted,
                        textTransform: "uppercase", letterSpacing: 0.5, padding: "4px 10px",
                        textAlign: "left" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {posArr.map(([ticker, p]) => {
                  const entryPx = p.entry_price || 0;
                  const cost    = (p.shares || 0) * entryPx;
                  const stopLbl = p.stop_price ? `$${p.stop_price.toFixed(2)}` : (p.stop_type === "TRAIL" ? `${cfg.trail_pct}% trail` : "—");
                  return (
                    <tr key={ticker} style={{ borderBottom: `1px solid ${C.border}33` }}>
                      <td style={{ padding: "8px 10px", ...mono, fontWeight: 800, fontSize: 13, color: C.accent }}>{ticker}</td>
                      <td style={{ padding: "8px 10px", ...mono }}>${entryPx.toFixed(2)}</td>
                      <td style={{ padding: "8px 10px", ...mono }}>{p.shares}</td>
                      <td style={{ padding: "8px 10px", ...mono }}>${cost.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
                      <td style={{ padding: "8px 10px", ...mono,
                          color: p.live_pnl != null ? pnlColor(p.live_pnl) : C.muted }}>
                        {p.live_pnl != null
                          ? `${p.live_pnl >= 0 ? "+" : ""}$${p.live_pnl.toFixed(2)}`
                          : p.live_price != null && p.entry_price
                            ? (() => { const v = (p.live_price - p.entry_price) * (p.shares || 0);
                                       return `${v >= 0 ? "+" : ""}$${v.toFixed(2)}`; })()
                            : "—"}
                      </td>
                      <td style={{ padding: "8px 10px" }}>
                        <span style={{ ...mono, fontSize: 10, fontWeight: 700, color: phaseColor(p.phase),
                            background: `${phaseColor(p.phase)}15`, padding: "2px 8px", borderRadius: 10 }}>
                          {phaseLabel(p.phase)}
                        </span>
                      </td>
                      <td style={{ padding: "8px 10px", ...mono, color: C.muted }}>d{p.trading_days_held ?? 0}</td>
                      <td style={{ padding: "8px 10px", ...mono, fontSize: 11, color: C.muted }}>{stopLbl}</td>
                      <td style={{ padding: "8px 10px" }}>
                        <button onClick={() => closePos(ticker)} disabled={!!closing[ticker]}
                          style={{ ...sans, fontSize: 11, padding: "3px 10px", borderRadius: 5,
                            border: `1px solid ${C.bear}55`, background: `${C.bear}11`,
                            color: C.bear, cursor: "pointer", opacity: closing[ticker] ? 0.5 : 1 }}>
                          {closing[ticker] ? "…" : "Close"}
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* ── Decision Log + Closed Today (side by side) ────────────────── */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>

        {/* Decision Log */}
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ ...sans, fontSize: 13, fontWeight: 700, color: C.white, marginBottom: 10 }}>
            Decision Log
          </div>
          {dec.length === 0 ? (
            <div style={{ ...sans, fontSize: 12, color: C.muted }}>No decisions yet today</div>
          ) : (
            <div style={{ maxHeight: 280, overflowY: "auto" }}>
              {[...dec].reverse().map((d, i) => {
                const isRotation = d.action === "ROTATION";
                const actionColor = isRotation                                         ? "#f59e0b"
                                  : d.action === "ENTERED" || d.action === "FILLED"   ? C.bull
                                  : d.action === "SKIPPED"                            ? C.muted
                                  : d.action?.includes("STOP") || d.action === "HARD_STOP" ? C.bear
                                  : d.action === "PHASE2"                             ? C.accent
                                  : C.neutral;
                return (
                  <div key={i} style={{ borderBottom: `1px solid ${C.border}33`,
                      padding: "6px 0", display: "flex", gap: 10, alignItems: "flex-start",
                      background: isRotation ? "#78350f18" : "transparent", borderRadius: isRotation ? 4 : 0 }}>
                    <span style={{ ...mono, fontSize: 10, color: C.muted, flexShrink: 0, width: 70 }}>{d.time}</span>
                    <span style={{ ...mono, fontSize: 10, fontWeight: 700, color: actionColor,
                        flexShrink: 0, width: 80,
                        ...(isRotation ? { background: "#78350f", padding: "1px 5px", borderRadius: 3 } : {}) }}>
                      {d.action}
                    </span>
                    <span style={{ ...mono, fontSize: 10, color: C.accent, flexShrink: 0, width: 48 }}>{d.ticker}</span>
                    <span style={{ ...sans, fontSize: 11, color: isRotation ? "#fcd34d" : C.muted, lineHeight: 1.4 }}>{d.detail}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Closed Today */}
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ ...sans, fontSize: 13, fontWeight: 700, color: C.white, marginBottom: 10 }}>
            Closed Today ({closed.length})
          </div>
          {closed.length === 0 ? (
            <div style={{ ...sans, fontSize: 12, color: C.muted }}>No closed trades today</div>
          ) : (
            <div style={{ maxHeight: 280, overflowY: "auto" }}>
              {[...closed].reverse().map((t, i) => (
                <div key={i} style={{ borderBottom: `1px solid ${C.border}33`, padding: "7px 0",
                    display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <span style={{ ...mono, fontSize: 13, fontWeight: 700, color: C.accent }}>{t.ticker}</span>
                    <span style={{ ...mono, fontSize: 11, color: C.muted, marginLeft: 8 }}>
                      {t.entry_price?.toFixed(2)} → {t.exit_price?.toFixed(2)}
                    </span>
                    <span style={{ ...sans, fontSize: 10, color: exitColor(t.exit_type),
                        marginLeft: 8, padding: "1px 6px", borderRadius: 8,
                        background: `${exitColor(t.exit_type)}15` }}>
                      {t.exit_type?.replace("_", " ")} · d{t.days_held}
                    </span>
                  </div>
                  <div style={{ ...mono, fontSize: 13, fontWeight: 700,
                      color: pnlColor(t.pnl) }}>
                    {t.pnl >= 0 ? "+" : ""}${t.pnl?.toFixed(2)}
                    <span style={{ fontSize: 10, marginLeft: 4 }}>({t.pnl_pct >= 0 ? "+" : ""}{t.pnl_pct?.toFixed(2)}%)</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* ── EOD Summary ───────────────────────────────────────────────── */}
      {(() => {
        const eod = status?.eod_summary;
        if (!eod || eod.total_trades === 0) return null;
        const exitColors = { hard_stop:"#f87171", trail_stop:"#f59e0b", max_hold:"#4ade80", manual_close:"#94a3b8" };
        return (
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10,
              padding: 18, marginBottom: 16 }}>
            <div style={{ ...sans, fontSize: 13, fontWeight: 700, color: C.white, marginBottom: 12,
                display: "flex", alignItems: "center", gap: 8 }}>
              📊 Today's Summary
              {eod.profit_factor >= 1.5 && <span style={{ fontSize: 11, padding: "2px 8px", borderRadius: 4,
                background: "#14532d", color: "#4ade80", fontWeight: 700 }}>Strong Edge</span>}
            </div>

            {/* Key stats */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 10 }}>
              {[
                { label: "Trades",        value: eod.total_trades },
                { label: "Win Rate",      value: `${eod.win_rate}%`,
                  color: eod.win_rate >= 60 ? "#4ade80" : eod.win_rate >= 40 ? "#f59e0b" : "#ef4444" },
                { label: "Avg Return",    value: `${eod.avg_return_pct >= 0 ? "+" : ""}${eod.avg_return_pct.toFixed(2)}%`,
                  color: pnlColor(eod.avg_return_pct) },
                { label: "Profit Factor", value: eod.profit_factor != null ? eod.profit_factor.toFixed(2) : "—",
                  color: eod.profit_factor == null ? C.muted : eod.profit_factor >= 1.5 ? "#4ade80"
                       : eod.profit_factor >= 1.0 ? "#f59e0b" : "#ef4444" },
                { label: "Gross Profit",  value: `+$${eod.gross_profit.toFixed(2)}`, color: "#4ade80" },
                { label: "Gross Loss",    value: `-$${Math.abs(eod.gross_loss).toFixed(2)}`, color: "#ef4444" },
                { label: "Net P&L",       value: `${summary.today_pnl >= 0 ? "+" : ""}$${summary.today_pnl?.toFixed(2)}`,
                  color: pnlColor(summary.today_pnl) },
                { label: "Avg Hold",      value: `${eod.avg_days_held.toFixed(1)}d` },
              ].map(({ label, value, color }) => (
                <div key={label} style={{ background: "#0f172a", border: `1px solid ${C.border}`,
                    borderRadius: 6, padding: "8px 12px", textAlign: "center" }}>
                  <div style={{ ...sans, fontSize: 10, color: C.muted, marginBottom: 3 }}>{label}</div>
                  <div style={{ ...mono, fontSize: 15, fontWeight: 700, color: color || C.white }}>{value}</div>
                </div>
              ))}
            </div>

            {/* Win/loss detail + best/worst */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8, marginBottom: 10 }}>
              <div style={{ background: "#0f172a", border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px" }}>
                <div style={{ ...sans, fontSize: 10, color: C.muted, marginBottom: 2 }}>Avg Win</div>
                <div style={{ ...mono, fontSize: 13, fontWeight: 700, color: "#4ade80" }}>
                  +{eod.avg_win_pct.toFixed(2)}% ({eod.wins}W)
                </div>
              </div>
              <div style={{ background: "#0f172a", border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px" }}>
                <div style={{ ...sans, fontSize: 10, color: C.muted, marginBottom: 2 }}>Avg Loss</div>
                <div style={{ ...mono, fontSize: 13, fontWeight: 700, color: "#ef4444" }}>
                  {eod.avg_loss_pct.toFixed(2)}% ({eod.losses}L)
                </div>
              </div>
              {eod.best_trade && (
                <div style={{ background: "#0f172a", border: `1px solid #14532d`, borderRadius: 6, padding: "8px 12px" }}>
                  <div style={{ ...sans, fontSize: 10, color: C.muted, marginBottom: 2 }}>Best Trade</div>
                  <div style={{ ...mono, fontSize: 13, fontWeight: 700, color: "#4ade80" }}>
                    {eod.best_trade.ticker} +${eod.best_trade.pnl.toFixed(2)} ({eod.best_trade.pnl_pct >= 0 ? "+" : ""}{eod.best_trade.pnl_pct.toFixed(2)}%)
                  </div>
                </div>
              )}
              {eod.worst_trade && (
                <div style={{ background: "#0f172a", border: `1px solid #450a0a`, borderRadius: 6, padding: "8px 12px" }}>
                  <div style={{ ...sans, fontSize: 10, color: C.muted, marginBottom: 2 }}>Worst Trade</div>
                  <div style={{ ...mono, fontSize: 13, fontWeight: 700, color: "#ef4444" }}>
                    {eod.worst_trade.ticker} ${eod.worst_trade.pnl.toFixed(2)} ({eod.worst_trade.pnl_pct >= 0 ? "+" : ""}{eod.worst_trade.pnl_pct.toFixed(2)}%)
                  </div>
                </div>
              )}
            </div>

            {/* Strategy settings + exit breakdown */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              <div style={{ background: "#0f172a", border: `1px solid ${C.border}`, borderRadius: 6, padding: "10px 14px" }}>
                <div style={{ ...sans, fontSize: 11, fontWeight: 700, color: C.muted, marginBottom: 6 }}>STRATEGY SETTINGS</div>
                {[
                  ["Position Size",   `$${eod.position_size?.toLocaleString()}`],
                  ["Hard Stop (d1-5)", `-${eod.hard_stop_pct}%`],
                  ["Trail Stop (d5+)", `-${eod.trail_pct}%`],
                  ["Capital Used",     `$${eod.total_capital_traded.toLocaleString(undefined, { maximumFractionDigits: 0 })}`],
                ].map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between",
                      ...sans, fontSize: 12, padding: "2px 0", borderBottom: `1px solid ${C.border}` }}>
                    <span style={{ color: C.muted }}>{k}</span>
                    <span style={{ ...mono, color: C.white }}>{v}</span>
                  </div>
                ))}
              </div>
              <div style={{ background: "#0f172a", border: `1px solid ${C.border}`, borderRadius: 6, padding: "10px 14px" }}>
                <div style={{ ...sans, fontSize: 11, fontWeight: 700, color: C.muted, marginBottom: 6 }}>EXIT BREAKDOWN</div>
                {Object.entries(eod.exit_breakdown).map(([type, count]) => (
                  <div key={type} style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
                      ...sans, fontSize: 12, padding: "2px 0", borderBottom: `1px solid ${C.border}` }}>
                    <span style={{ color: exitColors[type] || C.muted }}>{type.replace(/_/g, " ")}</span>
                    <span style={{ ...mono, fontWeight: 700, color: exitColors[type] || C.white }}>
                      {count} ({(count / eod.total_trades * 100).toFixed(0)}%)
                    </span>
                  </div>
                ))}
                {eod.open_pnl !== 0 && (
                  <div style={{ marginTop: 8, ...sans, fontSize: 12, color: C.muted }}>
                    Open unrealised: <span style={{ ...mono, color: pnlColor(eod.open_pnl) }}>
                      {eod.open_pnl >= 0 ? "+" : ""}${eod.open_pnl.toFixed(2)}
                    </span>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      })()}

      {/* ── Trade History ─────────────────────────────────────────────── */}
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ ...sans, fontSize: 13, fontWeight: 700, color: C.white }}>
            Trade History
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            {["7","14","30","90"].map(d => (
              <button key={d} onClick={() => setHistDays(+d)} style={{
                  ...sans, fontSize: 11, padding: "3px 10px", borderRadius: 12, cursor: "pointer", border: "none",
                  background: histDays === +d ? C.accent : C.bg, color: histDays === +d ? "#fff" : C.muted }}>
                {d}d
              </button>
            ))}
            <button onClick={loadHistory} disabled={histLoading} style={{ ...sans, fontSize: 12,
                padding: "5px 14px", borderRadius: 6, background: "#1e293b",
                border: `1px solid ${C.border}`, color: C.text, cursor: "pointer" }}>
              {histLoading ? "…" : "Load"}
            </button>
          </div>
        </div>

        {history === null ? (
          <div style={{ ...sans, fontSize: 12, color: C.muted }}>Click Load to fetch trade history</div>
        ) : history.total === 0 ? (
          <div style={{ ...sans, fontSize: 12, color: C.muted }}>No closed stock trades in the last {histDays} days</div>
        ) : (
          <>
            {/* Summary row */}
            <div style={{ display: "flex", gap: 24, marginBottom: 14, flexWrap: "wrap" }}>
              {[
                { label: "Trades",   val: history.total },
                { label: "Win Rate", val: `${history.win_rate}%`, color: history.win_rate >= 50 ? C.bull : C.bear },
                { label: "Total P&L", val: `${history.total_pnl >= 0 ? "+" : ""}$${history.total_pnl?.toFixed(2)}`,
                  color: pnlColor(history.total_pnl) },
              ].map(({ label, val, color }) => (
                <div key={label}>
                  <div style={{ ...sans, fontSize: 10, color: C.muted, textTransform: "uppercase",
                      letterSpacing: 0.5, marginBottom: 2 }}>{label}</div>
                  <div style={{ ...mono, fontSize: 15, fontWeight: 700, color: color || C.white }}>{val}</div>
                </div>
              ))}
            </div>
            <div style={{ overflowX: "auto" }}>
              <table style={{ ...sans, fontSize: 12, minWidth: 600 }}>
                <thead>
                  <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                    {["Date","Ticker","Qty","Entry","Exit","P&L","P&L %","Exit Type"].map(h => (
                      <th key={h} style={{ ...sans, fontSize: 10, fontWeight: 600, color: C.muted,
                          textTransform: "uppercase", letterSpacing: 0.5, padding: "4px 10px",
                          textAlign: "left" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {history.trades.map((t, i) => (
                    <tr key={i} style={{ borderBottom: `1px solid ${C.border}33` }}>
                      <td style={{ padding: "6px 10px", ...mono, fontSize: 11, color: C.muted }}>
                        {t.closed_at?.slice(0, 10)}
                      </td>
                      <td style={{ padding: "6px 10px", ...mono, fontWeight: 700, color: C.accent }}>{t.ticker}</td>
                      <td style={{ padding: "6px 10px", ...mono }}>{t.qty}</td>
                      <td style={{ padding: "6px 10px", ...mono }}>${t.entry_price?.toFixed(2)}</td>
                      <td style={{ padding: "6px 10px", ...mono }}>${t.exit_price?.toFixed(2)}</td>
                      <td style={{ padding: "6px 10px", ...mono, fontWeight: 700, color: pnlColor(t.pnl) }}>
                        {t.pnl >= 0 ? "+" : ""}${t.pnl?.toFixed(2)}
                      </td>
                      <td style={{ padding: "6px 10px", ...mono, color: pnlColor(t.pnl_pct) }}>
                        {t.pnl_pct >= 0 ? "+" : ""}{t.pnl_pct?.toFixed(2)}%
                      </td>
                      <td style={{ padding: "6px 10px" }}>
                        <span style={{ ...mono, fontSize: 10, color: exitColor(t.exit_reason),
                            background: `${exitColor(t.exit_reason)}15`, padding: "2px 7px", borderRadius: 8 }}>
                          {t.exit_reason?.replace("_", " ") || "—"}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
        )}
      </div>
    </div>
  );
}


// ── SPX 0DTE Tab ──────────────────────────────────────────────────────────────
function SPX0DTETab() {
  const [status,  setStatus]  = useState(null);
  const [macro,   setMacro]   = useState(null);
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = async () => {
    try {
      const [s, h, m] = await Promise.all([
        apiFetch("/spx-0dte/status"),
        apiFetch("/spx-0dte/history?limit=50"),
        apiFetch("/spx-0dte/macro-calendar"),
      ]);
      setStatus(s);
      setHistory(h.history || []);
      setMacro(m);
    } catch(_) {}
    finally { setLoading(false); }
  };

  useEffect(() => { load(); const id = setInterval(load, 15000); return () => clearInterval(id); }, []);

  const toggle    = async () => { await apiFetch(`/spx-0dte/enable?enabled=${!status.enabled}`, {method:"POST"}); load(); };
  const updateCfg = async (key, val) => {
    await apiFetch("/spx-0dte/config", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({[key]: val})});
    load();
  };
  const closeSpread = async (sid) => { await apiFetch(`/spx-0dte/close/${sid}`, {method:"POST"}); load(); };

  const pnlColor  = v => v == null ? C.muted : v >= 0 ? "#22c55e" : "#ef4444";
  const exitColor = t => t === "profit_target" ? "#4ade80" : t === "stop_loss" ? "#f87171"
                       : t === "force_close" ? "#f59e0b" : C.muted;
  const phaseBadge = phase => {
    if (phase === "morning")   return <span style={{fontSize:10,padding:"2px 6px",borderRadius:4,fontWeight:700,background:"#172554",color:"#93c5fd",border:"1px solid #1d4ed8"}}>🌅 AM</span>;
    if (phase === "afternoon") return <span style={{fontSize:10,padding:"2px 6px",borderRadius:4,fontWeight:700,background:"#2e1065",color:"#c4b5fd",border:"1px solid #7c3aed"}}>🌆 THETA</span>;
    return null;
  };

  if (loading) return <div style={{color:C.muted,...sans,fontSize:13}}>Loading…</div>;
  if (!status)  return <div style={{color:C.muted,...sans,fontSize:13}}>Backend unavailable</div>;

  const { config:cfg, spreads, closed_today, decisions, summary } = status;
  const todayIso   = new Date().toISOString().slice(0,10);
  const macroToday = macro?.upcoming?.find(d => d.date === todayIso);
  const nextMacro  = macro?.upcoming?.find(d => d.date > todayIso);

  return (
    <div>
      {/* Header */}
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
        <div>
          <div style={{...sans, fontSize:17, fontWeight:700, color:C.white}}>SPX 0DTE Trader 🎯</div>
          <div style={{...sans, fontSize:12, color:C.muted, marginTop:2}}>
            🌅 Morning IC {cfg.entry_start_time}–{cfg.morning_entry_cutoff} · {cfg.profit_pct_morning}% of credit · tiered stops
            &nbsp;&nbsp;|&nbsp;&nbsp;
            🌆 Theta decay {cfg.afternoon_entry_start}–{cfg.afternoon_entry_cutoff} · {cfg.profit_pct_afternoon}% of credit · {cfg.stop_mult_afternoon}× stop
          </div>
        </div>
        <button onClick={toggle} style={{
          ...sans, fontSize:13, padding:"8px 18px", borderRadius:6, cursor:"pointer", fontWeight:700,
          background: status.enabled ? "#14532d" : "#1e293b",
          border:`1px solid ${status.enabled ? "#16a34a" : C.border}`,
          color: status.enabled ? "#4ade80" : C.muted,
        }}>{status.enabled ? "● LIVE" : "○ Disabled"}</button>
      </div>

      {/* Macro skip notice */}
      {macroToday ? (
        <div style={{background:"#431407", border:"1px solid #b45309", borderRadius:6, padding:"10px 14px", marginBottom:12, ...sans, fontSize:12}}>
          🚫 <b style={{color:"#fcd34d"}}>No trades today</b> — {macroToday.reason} ({todayIso}). System skips all entry attempts automatically.
        </div>
      ) : nextMacro ? (
        <div style={{background:"#0c1520", border:`1px solid ${C.border}`, borderRadius:6, padding:"8px 14px", marginBottom:12, ...sans, fontSize:11, color:C.muted}}>
          📅 Next macro skip: <b style={{color:"#f59e0b"}}>{nextMacro.date}</b> — {nextMacro.reason}
          {macro?.data_sources?.fomc_source && <span style={{marginLeft:10, color:"#475569"}}>· {macro.data_sources.fomc_source.split(" ")[0]}</span>}
        </div>
      ) : null}

      {/* Today summary */}
      <div style={{background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:8, padding:"12px 16px", marginBottom:14}}>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:12}}>
          {[
            {label:"Today P&L",   value:`${(summary.today_pnl||0)>=0?"+":""}$${(summary.today_pnl||0).toFixed(2)}`, color:pnlColor(summary.today_pnl)},
            {label:"Attempts",    value:`${summary.attempts_today||0} / ${cfg.max_attempts}`,                         color:C.muted},
            {label:"Floor PNL",   value:`$${cfg.daily_floor_pnl}`,                                                   color:"#64748b"},
            {label:"Force Close", value:`${cfg.force_close_time} ET`,                                                 color:C.muted},
          ].map(({label,value,color}) => (
            <div key={label} style={{textAlign:"center"}}>
              <div style={{...sans, fontSize:10, color:C.muted, marginBottom:3}}>{label}</div>
              <div style={{...mono, fontSize:15, fontWeight:700, color}}>{value}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Morning Phase Config */}
      <div style={{...sans, fontSize:11, fontWeight:700, color:"#93c5fd", marginBottom:6, letterSpacing:1, textTransform:"uppercase"}}>🌅 Morning Phase</div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:8, marginBottom:10}}>
        <div style={{background:"#0f172a", border:"1px solid #172554", borderRadius:6, padding:"8px 10px"}}>
          <div style={{...sans, fontSize:10, color:"#60a5fa", marginBottom:4}}>Entry Start</div>
          <input defaultValue={cfg.entry_start_time} type="text"
            style={{...mono, fontSize:13, width:"100%", background:"none", border:"none", color:C.white, outline:"none"}}
            onBlur={e => updateCfg("entry_start_time", e.target.value.trim())} />
        </div>
        <div style={{background:"#0f172a", border:"1px solid #172554", borderRadius:6, padding:"8px 10px"}}>
          <div style={{...sans, fontSize:10, color:"#60a5fa", marginBottom:4}}>Morning Cutoff</div>
          <input defaultValue={cfg.morning_entry_cutoff} type="text"
            style={{...mono, fontSize:13, width:"100%", background:"none", border:"none", color:C.white, outline:"none"}}
            onBlur={e => updateCfg("morning_entry_cutoff", e.target.value.trim())} />
        </div>
        <div style={{background:"#0f172a", border:"1px solid #172554", borderRadius:6, padding:"8px 10px"}}>
          <div style={{...sans, fontSize:10, color:"#60a5fa", marginBottom:4}}>Profit % of Credit</div>
          <input defaultValue={cfg.profit_pct_morning} type="number" step={5}
            style={{...mono, fontSize:13, width:"100%", background:"none", border:"none", color:C.white, outline:"none"}}
            onBlur={e => updateCfg("profit_pct_morning", parseFloat(e.target.value))} />
        </div>
        <div style={{background:"#0f172a", border:"1px solid #172554", borderRadius:6, padding:"8px 10px"}}>
          <div style={{...sans, fontSize:10, color:"#60a5fa", marginBottom:4}}>VIX Max</div>
          <input defaultValue={cfg.vix_max_morning} type="number" step={1}
            style={{...mono, fontSize:13, width:"100%", background:"none", border:"none", color:C.white, outline:"none"}}
            onBlur={e => updateCfg("vix_max_morning", parseFloat(e.target.value))} />
        </div>
        <div style={{background:"#0f172a", border:"1px solid #172554", borderRadius:6, padding:"8px 10px"}}>
          <div style={{...sans, fontSize:10, color:"#60a5fa", marginBottom:4}}>Stop Tiers × (csv)</div>
          <input defaultValue={(cfg.stop_loss_tiers||[]).join(", ")} type="text"
            style={{...mono, fontSize:13, width:"100%", background:"none", border:"none", color:C.white, outline:"none"}}
            onBlur={e => {
              const v = e.target.value.split(",").map(x=>parseFloat(x.trim())).filter(x=>!isNaN(x));
              if (v.length > 0) updateCfg("stop_loss_tiers", v);
            }} />
        </div>
      </div>

      {/* Afternoon Phase Config */}
      <div style={{...sans, fontSize:11, fontWeight:700, color:"#c4b5fd", marginBottom:6, letterSpacing:1, textTransform:"uppercase"}}>🌆 Afternoon Theta Phase</div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(6,1fr)", gap:8, marginBottom:10}}>
        {[
          {label:"Afternoon Start",  key:"afternoon_entry_start",  type:"text"},
          {label:"Afternoon Cutoff", key:"afternoon_entry_cutoff", type:"text"},
          {label:"Profit % of Cred", key:"profit_pct_afternoon",  step:5},
          {label:"Stop Mult",        key:"stop_mult_afternoon",    step:0.25},
          {label:"VIX Max",          key:"vix_max_afternoon",      step:1},
          {label:"Max Attempts",     key:"max_afternoon_attempts", step:1},
        ].map(({label, key, type="number", step}) => (
          <div key={key} style={{background:"#0f172a", border:"1px solid #2e1065", borderRadius:6, padding:"8px 10px"}}>
            <div style={{...sans, fontSize:10, color:"#a78bfa", marginBottom:4}}>{label}</div>
            <input defaultValue={cfg[key]} type={type} step={step}
              style={{...mono, fontSize:13, width:"100%", background:"none", border:"none", color:C.white, outline:"none"}}
              onBlur={e => {
                const v = type==="number" ? parseFloat(e.target.value) : e.target.value.trim();
                updateCfg(key, v);
              }} />
          </div>
        ))}
      </div>

      {/* Shared Config */}
      <div style={{...sans, fontSize:11, fontWeight:700, color:C.muted, marginBottom:6, letterSpacing:1, textTransform:"uppercase"}}>Shared</div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:8, marginBottom:16}}>
        {[
          {label:"Spread Width pts", key:"spread_width",           step:5},
          {label:"OTM %",            key:"otm_pct",                step:0.25},
          {label:"Max Margin $",     key:"max_margin",             step:1000},
          {label:"Rate Bps Max",     key:"rate_move_bps_max",      step:1},
          {label:"Trend Filter Pts", key:"trend_filter_pts",       step:5},
          {label:"Min Credit/Sprd",  key:"min_credit_per_spread",  step:0.05},
          {label:"Max Attempts",     key:"max_attempts",           step:1},
        ].map(({label, key, step}) => (
          <div key={key} style={{background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:6, padding:"8px 10px"}}>
            <div style={{...sans, fontSize:10, color:C.muted, marginBottom:4}}>{label}</div>
            <input defaultValue={cfg[key]} type="number" step={step}
              style={{...mono, fontSize:13, width:"100%", background:"none", border:"none", color:C.white, outline:"none"}}
              onBlur={e => updateCfg(key, parseFloat(e.target.value))} />
          </div>
        ))}
      </div>

      {/* Open Spreads */}
      <div style={{...sans, fontSize:13, fontWeight:700, color:C.white, marginBottom:8}}>Open Iron Condors</div>
      {Object.keys(spreads).length === 0 ? (
        <div style={{color:C.muted, ...sans, fontSize:13, padding:"14px 0"}}>
          {status.enabled
            ? (macroToday ? "🚫 Macro skip — no entry today" : "Waiting for entry window")
            : "Trader disabled"}
        </div>
      ) : (
        <div style={{overflowX:"auto", marginBottom:20}}>
          <table style={{width:"100%", borderCollapse:"collapse", ...sans, fontSize:12}}>
            <thead>
              <tr style={{background:"#0f172a"}}>
                {["Phase","ID","Entry","Put Spread","Call Spread","SPX @","Credit","Target","Live P&L",""].map(h=>(
                  <th key={h} style={{padding:"7px 10px", textAlign:"left", color:C.muted,
                    fontSize:11, fontWeight:600, textTransform:"uppercase",
                    borderBottom:`1px solid ${C.border}`}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {Object.entries(spreads).map(([sid, sp]) => (
                <tr key={sid} style={{borderBottom:`1px solid ${C.border}`}}>
                  <td style={{padding:"8px 10px"}}>{phaseBadge(sp.trade_phase)}</td>
                  <td style={{padding:"8px 10px", ...mono, fontWeight:700, color:C.white}}>{sid}</td>
                  <td style={{padding:"8px 10px", color:C.muted, fontSize:11}}>{sp.placed_at}</td>
                  <td style={{padding:"8px 10px", ...mono, color:"#86efac"}}>
                    {parseInt(sp.put_short_k)}/{parseInt(sp.put_long_k)}P
                    <span style={{color:C.muted, marginLeft:4}}>${sp.put_credit?.toFixed(2)}</span>
                  </td>
                  <td style={{padding:"8px 10px", ...mono, color:"#fca5a5"}}>
                    {parseInt(sp.call_short_k)}/{parseInt(sp.call_long_k)}C
                    <span style={{color:C.muted, marginLeft:4}}>${sp.call_credit?.toFixed(2)}</span>
                  </td>

                  <td style={{padding:"8px 10px", ...mono, fontWeight:700, color:pnlColor(sp.live_pnl)}}>

                </tr>

          </table>

      )}

      {/* Closed Today */}

          <div style={{overflowX:"auto", marginBottom:20}}>
            <table style={{width:"100%", borderCollapse:"collapse", ...sans, fontSize:12}}>
              <thead>
                <tr style={{background:"#0f172a"}}>
                  {["Phase","ID","Put Spread","Call Spread","Qty","Credit","P&L","P&L%","Exit"].map(h=>(
                    <th key={h} style={{padding:"7px 10px", textAlign:"left", color:C.muted,
                      fontSize:11, fontWeight:600, textTransform:"uppercase",
                      borderBottom:`1px solid ${C.border}`}}>{h}</th>

                </tr>
              </thead>
              <tbody>
                {[...closed_today].reverse().map((r,i)=>(
                  <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>

                    <td style={{padding:"8px 10px", ...mono, fontWeight:700, color:C.white}}>{r.spread_id}</td>
                    <td style={{padding:"8px 10px", ...mono, color:"#86efac"}}>{r.put_strikes}</td>
                    <td style={{padding:"8px 10px", ...mono, color:"#fca5a5"}}>{r.call_strikes}</td>
                    <td style={{padding:"8px 10px", color:C.muted}}>{r.qty}</td>
                    <td style={{padding:"8px 10px", ...mono}}>${r.total_credit?.toFixed(2)}</td>
                    <td style={{padding:"8px 10px", ...mono, fontWeight:700, color:pnlColor(r.pnl)}}>
                      {r.pnl>=0?"+":""}${r.pnl?.toFixed(2)}

                    <td style={{padding:"8px 10px", ...mono, color:pnlColor(r.pnl_pct)}}>
                      {r.pnl_pct>=0?"+":""}{r.pnl_pct?.toFixed(1)}%
                    </td>
                    <td style={{padding:"8px 10px"}}>
                      <span style={{fontSize:11, padding:"2px 7px", borderRadius:4, fontWeight:700,
                        color:exitColor(r.exit_type), background:`${exitColor(r.exit_type)}22`}}>
                        {r.exit_type?.replace(/_/g," ")}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}

      {/* Decisions */}
      {decisions.length > 0 && (
        <>
          <div style={{...sans, fontSize:13, fontWeight:700, color:C.white, marginBottom:8}}>Decisions</div>
          <div style={{background:"#0f172a", border:`1px solid ${C.border}`, borderRadius:6,
            padding:10, maxHeight:180, overflowY:"auto"}}>
            {[...decisions].reverse().map((d,i)=>(
              <div key={i} style={{...mono, fontSize:11, color:C.muted, padding:"2px 0",
                borderBottom: i<decisions.length-1 ? `1px solid ${C.border}` : "none"}}>
                <span style={{color:C.muted}}>{d.time}</span>
                {" "}<span style={{color:
                  d.action==="PROFIT_TARGET" ? "#4ade80" :
                  d.action==="STOP_LOSS"     ? "#f87171" :
                  d.action==="ENTRY"         ? "#93c5fd" :
                  d.action==="CLOSED"        ? "#c4b5fd" : C.muted, fontWeight:700}}>{d.action}</span>
                {" "}<span style={{color:"#94a3b8"}}>{d.spread_id}</span>
                {" "}<span style={{color:C.muted}}>{d.detail}</span>
              </div>
            ))}
          </div>
        </>
      )}

      {/* Trade History */}
      {history.length > 0 && (
        <>
          <div style={{...sans, fontSize:13, fontWeight:700, color:C.white, marginBottom:8, marginTop:20}}>
            Trade History
            <span style={{...sans, fontSize:11, fontWeight:400, color:C.muted, marginLeft:8}}>
              {history.length} trades · {history.filter(r=>r.win).length}W / {history.filter(r=>!r.win).length}L ·{" "}
              P&L: <span style={{color: history.reduce((s,r)=>s+(r.pnl||0),0) >= 0 ? "#22c55e" : "#ef4444"}}>

            </span>
          </div>
          <div style={{overflowX:"auto", marginBottom:20}}>
            <table style={{width:"100%", borderCollapse:"collapse", ...sans, fontSize:12}}>
              <thead>
                <tr style={{background:"#0f172a"}}>
                  {["Date","Qty","Credit","P&L","P&L%","SPX @","Phase","Exit"].map(h=>(

                      fontSize:11, fontWeight:600, textTransform:"uppercase",
                      borderBottom:`1px solid ${C.border}`}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {history.map((r,i)=>(
                  <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                    <td style={{padding:"7px 10px", color:C.muted, fontSize:11}}>{r.date}</td>
                    <td style={{padding:"7px 10px", ...mono, color:C.muted}}>{r.qty}</td>
                    <td style={{padding:"7px 10px", ...mono}}>${r.total_credit?.toFixed(2)}</td>
                    <td style={{padding:"7px 10px", ...mono, fontWeight:700,
                      color:r.pnl >= 0 ? "#22c55e" : "#ef4444"}}>
                      {r.pnl >= 0 ? "+" : ""}${r.pnl?.toFixed(2)}
                    </td>
                    <td style={{padding:"7px 10px", ...mono,
                      color:r.pnl_pct >= 0 ? "#22c55e" : "#ef4444"}}>
                      {r.pnl_pct >= 0 ? "+" : ""}{r.pnl_pct?.toFixed(1)}%
                    </td>
                    <td style={{padding:"7px 10px", ...mono, color:C.muted}}>{r.spot || "—"}</td>
                    <td style={{padding:"7px 10px"}}>{phaseBadge(r.trade_phase)}</td>
                    <td style={{padding:"7px 10px"}}>
                      <span style={{fontSize:11, padding:"2px 7px", borderRadius:4, fontWeight:700,
                        color: exitColor(r.exit_type), background:`${exitColor(r.exit_type)}22`}}>
                        {r.exit_type?.replace(/_/g," ")}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}


// ── Earnings Volatility Crush Tab ─────────────────────────────────────────────
function EVCTab() {
  const [status,  setStatus]  = useState(null);
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = async () => {
    try {
      const [s, h] = await Promise.all([
        apiFetch("/earnings-vol-crush/status"),
        apiFetch("/earnings-vol-crush/history?limit=50"),
      ]);
      setStatus(s);
      setHistory(h.history || []);
    } catch(_) {}
    finally { setLoading(false); }
  };

  useEffect(() => { load(); const id = setInterval(load, 15000); return () => clearInterval(id); }, []);

  const toggle    = async () => { await apiFetch(`/earnings-vol-crush/enable?enabled=${!status.enabled}`, {method:"POST"}); load(); };
  const updateCfg = async (key, val) => {
    await apiFetch("/earnings-vol-crush/config", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({[key]: val})});
    load();
  };
  const closePos = async (pid) => { await apiFetch(`/earnings-vol-crush/close/${pid}`, {method:"POST"}); load(); };

  const pnlColor  = v => v == null ? C.muted : v >= 0 ? "#22c55e" : "#ef4444";
  const exitColor = t => t === "iv_crush_exit" ? "#4ade80" : t === "max_loss_stop" ? "#f87171"
                       : t === "manual_close"  ? "#f59e0b" : C.muted;
  const actionColor = a => a === "ENTERED" ? "#93c5fd" : a === "CLOSED" ? "#4ade80"
                         : a === "STOP" ? "#f87171" : a === "SKIPPED" ? "#f59e0b"
                         : a === "CANDIDATE" ? "#a78bfa" : C.muted;

  if (loading) return <div style={{color:C.muted,...sans,fontSize:13}}>Loading...</div>;
  if (!status)  return <div style={{color:C.muted,...sans,fontSize:13}}>Backend unavailable</div>;

  const { config:cfg, positions, closed_today, decisions, summary } = status;

    <div>
      {/* Header */}
