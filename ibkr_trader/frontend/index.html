// ── Learning Tab ──────────────────────────────────────────────────────────
function LearningTab() {
  const [stats,    setStats]   = useState(null);
  const [journal,  setJournal] = useState(null);
  const [training, setTraining]= useState(false);

  const load = async () => {
    try {
      const [s, j] = await Promise.all([
        apiFetch("/journal/stats"),
        apiFetch("/journal?limit=30"),
      ]);
      setStats(s);
      setJournal(j);
    } catch(_) {}
  };

  useEffect(() => { load(); const id = setInterval(load, 15000); return () => clearInterval(id); }, []);

  const retrain = async () => {
    setTraining(true);
    try {
      const r = await apiFetch("/journal/retrain", { method: "POST" });
      if (r.error) alert(r.error);
      else alert(`Model v${r.version} trained: ${r.win_rate}% win rate, ${r.cv_accuracy}% CV accuracy`);
      await load();
    } catch(e) { alert("Retrain failed: " + e.message); }
    finally { setTraining(false); }
  };

  const pnlCol = v => v > 0 ? "#27ae60" : v < 0 ? "#e74c3c" : "#888";
  const thS = { padding:"7px 10px", textAlign:"left", color:"#64748b", borderBottom:"1px solid #e2e8f0", fontWeight:600 };
  const tdS = { padding:"7px 10px", borderBottom:"1px solid #e2e8f0", fontSize:12 };

  // Feature importance bar chart
  const FeatureBar = ({ name, val, max }) => (
    <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
      <div style={{ width:130, fontSize:12, color:"#475569", textAlign:"right" }}>{name}</div>
      <div style={{ flex:1, background:"#f1f5f9", borderRadius:4, height:16, position:"relative" }}>
        <div style={{ width:`${(val/max)*100}%`, background:"#3498db", borderRadius:4, height:"100%",
          minWidth:2, transition:"width 0.3s" }} />
      </div>
      <div style={{ width:45, fontSize:11, color:"#3498db", textAlign:"right" }}>{(val*100).toFixed(1)}%</div>
    </div>
  );

  const latestModel = stats?.model_log?.[0];
  const importances = latestModel?.importances
    ? (typeof latestModel.importances === "string"
        ? JSON.parse(latestModel.importances) : latestModel.importances)
    : null;
  const maxImp = importances ? Math.max(...Object.values(importances)) : 1;

  return (
    <div style={{ padding:"16px 0" }}>

      {/* KPI strip */}
      {stats && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:12, marginBottom:20 }}>
          {[
            { label:"Total Trades",    value: stats.total_trades,           col:"#eee" },
            { label:"Win Rate",        value: stats.win_rate != null ? `${stats.win_rate}%` : "—", col:"#27ae60" },
            { label:"Total P&L",       value: stats.total_pnl != null ? `$${stats.total_pnl}` : "—", col:pnlCol(stats.total_pnl) },
            { label:"Model Version",   value: `v${stats.model_version}`,   col:"#f1c40f" },
            { label:"Kelly Win Rate",  value: stats.assumed_win_rate ? `${(stats.assumed_win_rate*100).toFixed(1)}%` : "—", col:"#9b59b6" },
          ].map(s => (
            <div key={s.label} style={{ background:"#f1f5f9", borderRadius:8, padding:14, textAlign:"center" }}>
              <div style={{ color:"#64748b", fontSize:11, marginBottom:6 }}>{s.label}</div>
              <div style={{ color:s.col, fontWeight:700, fontSize:19 }}>{s.value}</div>
            </div>
          ))}
        </div>
      )}

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginBottom:20 }}>

        {/* Feature importances */}
        <Card title={`Feature Importances ${latestModel ? `(model v${latestModel.id})` : "(no model yet)"}`}>
          {!importances ? (
            <div style={{ color:"#64748b", fontStyle:"italic" }}>
              Need {20} completed trades to train first model.
              <br/>Run the auto-trader and come back after 20 closes.
            </div>
          ) : (
            <>
              {Object.entries(importances)
                .sort((a,b) => b[1]-a[1])
                .map(([name, val]) => (
                  <FeatureBar key={name} name={name} val={val} max={maxImp} />
                ))}
              <button onClick={retrain} disabled={training} style={{
                marginTop:12, background:"#2980b9", color:"#fff", border:"none",
                borderRadius:6, padding:"7px 18px", cursor:"pointer", fontSize:13,
              }}>
                {training ? "Training…" : "Retrain Now"}
              </button>
            </>
          )}
        </Card>

        {/* Exit breakdown */}
        <Card title="Exit Breakdown">
          {!stats?.exit_breakdown || Object.keys(stats.exit_breakdown).length === 0 ? (
            <div style={{ color:"#64748b", fontStyle:"italic" }}>No closed trades yet.</div>
          ) : (
            <>
              {Object.entries(stats.exit_breakdown).map(([reason, d]) => {
                const wr = d.total > 0 ? (d.wins/d.total*100).toFixed(0) : 0;
                const col = reason.includes("profit") || reason.includes("trailing") ? "#27ae60" : "#e74c3c";
                return (
                  <div key={reason} style={{ display:"flex", justifyContent:"space-between",
                    padding:"8px 0", borderBottom:"1px solid #e2e8f0" }}>
                    <span style={{ color:"#334155", fontSize:13 }}>{reason}</span>
                    <span style={{ color:"#64748b", fontSize:12 }}>{d.total} trades</span>
                    <span style={{ color:col, fontWeight:700, fontSize:13 }}>{wr}% win</span>
                  </div>
                );
              })}
              <div style={{ marginTop:14, fontSize:12, color:"#64748b" }}>
                Avg win: ${stats.avg_win_pnl?.toFixed(0) || "—"} &nbsp;|&nbsp;
                Avg loss: ${stats.avg_loss_pnl?.toFixed(0) || "—"}
              </div>
            </>
          )}
        </Card>
      </div>

      {/* Model training log */}
      {stats?.model_log?.length > 0 && (
        <Card title="Model Training History" style={{ marginBottom:20 }}>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
              <thead>
                <tr>{["Version","Trained","Trades","Win Rate","CV Accuracy","Top Feature"].map(h =>
                  <th key={h} style={thS}>{h}</th>)}</tr>
              </thead>
              <tbody>
                {stats.model_log.map((m, i) => {
                  const imp = m.importances ? (typeof m.importances === "string"
                    ? JSON.parse(m.importances) : m.importances) : {};
                  const top = Object.entries(imp).sort((a,b)=>b[1]-a[1])[0]?.[0] || "—";
                  return (
                    <tr key={i} style={{ background: i===0 ? "#f0fdf4" : "transparent" }}>
                      <td style={{ ...tdS, color:"#f1c40f", fontWeight:700 }}>{m.notes}</td>
                      <td style={tdS}>{m.trained_at?.slice(0,19)}</td>
                      <td style={tdS}>{m.n_trades}</td>
                      <td style={{ ...tdS, color:"#27ae60" }}>{(m.win_rate*100).toFixed(1)}%</td>
                      <td style={{ ...tdS, color:"#3498db" }}>{(m.cv_accuracy*100).toFixed(1)}%</td>
                      <td style={{ ...tdS, color:"#9b59b6" }}>{top}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* Trade journal */}
      <Card title={`Trade Journal (last ${journal?.trades?.length || 0})`}>
        {!journal?.trades?.length ? (
          <div style={{ color:"#64748b", fontStyle:"italic" }}>
            No trades recorded yet. Trades placed by the auto-trader appear here.
          </div>
        ) : (
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
              <thead>
                <tr style={{ color:"#64748b", borderBottom:"1px solid #e2e8f0" }}>
                  {["#","Ticker","Type","Strike","Expiry","Qty","Entry","Exit","P&L","Win","Exit Reason",
                    "IV Rank","Score","Learned","Opened","Closed"].map(h =>
                    <th key={h} style={{ padding:"6px 8px", textAlign:"left", fontWeight:600 }}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {journal.trades.map((t, i) => (
                  <tr key={i} style={{
                    background: t.win === 1 ? "#f0fdf4" : t.win === 0 ? "#fef2f2" : "transparent",
                    borderBottom:"1px solid #e2e8f0",
                  }}>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>{t.id}</td>
                    <td style={{ padding:"5px 8px", fontWeight:700 }}>{t.ticker}</td>
                    <td style={{ padding:"5px 8px", fontWeight:600,
                      color: t.right==="C"?"#27ae60":t.right==="P"?"#e74c3c":"#475569" }}>
                      {strategyLabel(t)}
                    </td>
                    <td style={{ padding:"5px 8px" }}>${t.strike}</td>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>{t.expiry}</td>
                    <td style={{ padding:"5px 8px" }}>{t.qty}</td>
                    <td style={{ padding:"5px 8px" }}>${t.entry_price?.toFixed(2) || "—"}</td>
                    <td style={{ padding:"5px 8px" }}>{t.exit_price ? `$${t.exit_price.toFixed(2)}` : "open"}</td>
                    <td style={{ padding:"5px 8px", color:pnlCol(t.pnl), fontWeight:700 }}>
                      {t.pnl != null ? `$${t.pnl.toFixed(0)}` : "—"}
                    </td>
                    <td style={{ padding:"5px 8px", color: t.win===1?"#27ae60":t.win===0?"#e74c3c":"#888", fontWeight:700 }}>
                      {t.win===1?"W":t.win===0?"L":"—"}
                    </td>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>{t.exit_reason || "—"}</td>
                    <td style={{ padding:"5px 8px" }}>{t.iv_rank?.toFixed(0) || "—"}</td>
                    <td style={{ padding:"5px 8px" }}>{t.score || "—"}</td>
                    <td style={{ padding:"5px 8px", color:"#9b59b6" }}>{t.learned_score != null ? t.learned_score : "—"}</td>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>{t.opened_at?.slice(0,16) || "—"}</td>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>{t.closed_at?.slice(0,16) || "open"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

// ── Universe Tab ──────────────────────────────────────────────────────────
function UniverseTab() {
  const [data,       setData]      = useState(null);
  const [screening,  setScreening] = useState(false);
  const [topN,       setTopN]      = useState(25);
  const [addTicker,  setAddTicker] = useState("");

  const load = async () => {
    try { setData(await apiFetch("/csp/universe")); } catch(_) {}
  };

  // Poll every 15 s so the tab picks up the startup screen once it completes
  useEffect(() => {
    load();
    const id = setInterval(load, 15000);
    return () => clearInterval(id);
  }, []);

  const runRefresh = async () => {
    setScreening(true);
    try {
      const r = await apiFetch(`/csp/universe/refresh?top_n=${topN}`, { method: "POST" });
      if (!r.ok) alert("Screen returned no results — universe unchanged");
      await load();
    } catch(e) { alert("Refresh failed: " + e.message); }
    finally { setScreening(false); }
  };

  const thS = { padding:"7px 12px", textAlign:"left", color:"#64748b",
                borderBottom:"1px solid #1e293b", fontWeight:600, fontSize:11, whiteSpace:"nowrap" };
  const tdS = { padding:"6px 12px", borderBottom:"1px solid #0f172a", fontSize:12 };

  const scores = data?.scores || [];
  const active = new Set(data?.universe || []);

  const fmtVol = v => {
    if (!v) return "—";
    if (v >= 1_000_000) return `${(v/1_000_000).toFixed(1)}M`;
    return `${(v/1_000).toFixed(0)}K`;
  };

  return (
    <div>
      {/* Header row */}
      <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:16, flexWrap:"wrap" }}>
        <div style={{ ...sans, fontSize:14, fontWeight:700, color:"#f1f5f9" }}>
          Dynamic Universe Screener
        </div>
        <div style={{ ...mono, fontSize:11, color:"#64748b" }}>
          Pool: {data?.candidate_pool ?? "…"} tickers →
          Active: {data?.count ?? "…"} tickers
        </div>
        {data?.last_screened && (
          <div style={{ ...mono, fontSize:11, color:"#94a3b8" }}>
            Last screened: {new Date(data.last_screened).toLocaleString()}
          </div>
        )}
        <div style={{ display:"flex", alignItems:"center", gap:8, marginLeft:"auto" }}>
          <label style={{ ...sans, fontSize:12, color:"#94a3b8" }}>Top</label>
          <select value={topN} onChange={e => setTopN(Number(e.target.value))}
            style={{ background:"#1e293b", color:"#f1f5f9", border:"1px solid #334155",
                     borderRadius:6, padding:"3px 8px", fontSize:12 }}>
            {[15,20,25,30].map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          <button onClick={runRefresh} disabled={screening} style={{
            ...sans, fontSize:12, fontWeight:700, padding:"6px 18px", borderRadius:8,
            cursor: screening ? "default" : "pointer", opacity: screening ? 0.6 : 1,
            background: screening ? "#334155" : "#3498db", color:"#fff", border:"none",
          }}>
            {screening ? "Screening…" : "Refresh Now"}
          </button>
        </div>
      </div>

      {/* Active universe chips with remove buttons */}
      <Card style={{ marginBottom:16 }}>
        <div style={{ ...sans, fontSize:11, color:"#64748b", marginBottom:8, fontWeight:600 }}>
          ACTIVE SCAN UNIVERSE ({(data?.universe || []).length} tickers)
        </div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
          {(data?.universe || []).map(t => (
            <span key={t} style={{
              ...mono, fontSize:12, fontWeight:700,
              padding:"3px 6px 3px 10px", borderRadius:12,
              background:"#0f4c8133", border:"1px solid #3498db55",
              color:"#93c5fd", display:"flex", alignItems:"center", gap:5,
            }}>
              {t}
              <span
                title={`Remove ${t}`}
                onClick={async () => {
                  await apiFetch("/csp/universe/remove", {
                    method:"POST", headers:{"Content-Type":"application/json"},
                    body: JSON.stringify({ ticker: t }),
                  });
                  load();
                }}
                style={{ cursor:"pointer", color:"#e74c3c", fontWeight:900, fontSize:13, lineHeight:1 }}
              >×</span>
            </span>
          ))}
          {!data && <span style={{ color:"#475569" }}>Loading…</span>}
        </div>
        {/* Add custom ticker */}
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          <input
            value={addTicker}
            onChange={e => setAddTicker(e.target.value.toUpperCase())}
            onKeyDown={async e => {
              if (e.key !== "Enter" || !addTicker.trim()) return;
              await apiFetch("/csp/universe/add", {
                method:"POST", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ ticker: addTicker.trim() }),
              });
              setAddTicker(""); load();
            }}
            placeholder="Add ticker (e.g. TSLA)"
            style={{ ...mono, fontSize:13, padding:"5px 10px", borderRadius:6,
                     border:"1px solid #334155", background:"#1e293b", color:"#f1f5f9",
                     width:160 }}
          />
          <button
            onClick={async () => {
              if (!addTicker.trim()) return;
              await apiFetch("/csp/universe/add", {
                method:"POST", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ ticker: addTicker.trim() }),
              });
              setAddTicker(""); load();
            }}
            style={{ ...sans, fontSize:12, padding:"5px 14px", borderRadius:6,
                     background:"#27ae60", color:"#fff", border:"none", cursor:"pointer" }}
          >+ Add</button>
          <span style={{ fontSize:11, color:"#64748b" }}>
            Add ticker to active scan universe · Enter key or click + Add
          </span>
        </div>
      </Card>

      {/* Scores table */}
      {scores.length > 0 && (
        <Card style={{ padding:0, overflow:"hidden" }}>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead>
                <tr style={{ background:"#0f172a" }}>
                  <th style={thS}>#</th>
                  <th style={thS}>Ticker</th>
                  <th style={{ ...thS, textAlign:"right" }}>Score</th>
                  <th style={{ ...thS, textAlign:"right" }}>Price</th>
                  <th style={{ ...thS, textAlign:"right" }}>RSI-14</th>
                  <th style={{ ...thS, textAlign:"center" }}>SMA50</th>
                  <th style={{ ...thS, textAlign:"right" }}
                      title="IV/HV Rank: real IV rank once 20+ daily scans accumulate; until then shows HV Rank (30-day realized vol percentile over 1 year) — tracks IV directionally and is available immediately.">
                    IV / HV Rank
                  </th>
                  <th style={{ ...thS, textAlign:"right" }}>30d ADV</th>
                  <th style={{ ...thS, textAlign:"center" }}>In Universe</th>
                </tr>
              </thead>
              <tbody>
                {scores.map((row, i) => {
                  const inUniverse = active.has(row.ticker);
                  const rsiCol = row.rsi14 >= 40 && row.rsi14 <= 65
                    ? "#27ae60" : row.rsi14 < 30 || row.rsi14 > 80
                    ? "#e74c3c" : "#f39c12";
                  const scoreCol = row.score >= 60 ? "#27ae60"
                    : row.score >= 40 ? "#f39c12" : "#94a3b8";
                  return (
                    <tr key={row.ticker} style={{
                      opacity: inUniverse ? 1 : 0.45,
                      background: inUniverse && i < 30 ? "#0f4c8108" : "transparent",
                    }}>
                      <td style={{ ...tdS, color:"#475569" }}>{i+1}</td>
                      <td style={{ ...tdS, ...mono, fontWeight:700, color: inUniverse ? "#93c5fd" : "#64748b" }}>
                        {row.ticker}
                      </td>
                      <td style={{ ...tdS, textAlign:"right", fontWeight:700, color: scoreCol }}>
                        {row.score}
                      </td>
                      <td style={{ ...tdS, textAlign:"right", color:"#f1f5f9" }}>
                        {fmt$(row.price)}
                      </td>
                      <td style={{ ...tdS, textAlign:"right", color: rsiCol }}>
                        {row.rsi14 != null ? row.rsi14.toFixed(1) : "—"}
                      </td>
                      <td style={{ ...tdS, textAlign:"center" }}>
                        {row.above_sma50 === true ? <span style={{color:"#27ae60"}}>↑ Yes</span>
                          : row.above_sma50 === false ? <span style={{color:"#e74c3c"}}>↓ No</span>
                          : <span style={{color:"#64748b"}}>—</span>}
                      </td>
                      <td style={{ ...tdS, textAlign:"right",
                          color: row.iv_rank != null
                            ? (row.iv_rank >= 25 ? "#f39c12" : "#94a3b8")
                            : "#334155" }}>
                        {row.iv_rank != null
                          ? <span>
                              {row.iv_rank}
                              {row.hv_proxy
                                ? <span style={{fontSize:9,color:"#64748b",marginLeft:2}}
                                    title="HV rank proxy — upgrades to real IV rank after 20 daily scans">HV</span>
                                : <span style={{fontSize:9,color:"#f39c12",marginLeft:2}}>IV</span>}
                              %
                            </span>
                          : <span title="Insufficient price history">—</span>}
                      </td>
                      <td style={{ ...tdS, textAlign:"right", color:"#94a3b8" }}>
                        {fmtVol(row.avg_vol_30d)}
                      </td>
                      <td style={{ ...tdS, textAlign:"center" }}>
                        {inUniverse
                          ? <span style={{color:"#27ae60", fontWeight:700}}>✓</span>
                          : <span style={{color:"#334155"}}>—</span>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {scores.length === 0 && data && (
        <Card>
          <div style={{ ...sans, color:"#64748b", textAlign:"center", padding:"24px 0" }}>
            No screen data yet — click <strong>Refresh Now</strong> to run the screener.
            <br/>The screener also runs automatically at 08:30 ET on weekdays.
          </div>
        </Card>
      )}
    </div>
  );
}

// ── P&L Dashboard Tab ─────────────────────────────────────────────────────
function PnLTab() {
  const [data,        setData]        = useState(null);
  const [loading,     setLoading]     = useState(true);
  const [err,         setErr]         = useState(null);
  const [countdown,   setCountdown]   = useState(15);
  const [deltaData,   setDeltaData]   = useState(null);
  const [ordersData,  setOrdersData]  = useState(null);
  const [deltaOpen,   setDeltaOpen]   = useState(false);
  const [deltaLoading,setDeltaLoading]= useState(false);
  const INTERVAL = 15;

  const loadDelta = async () => {
    setDeltaLoading(true);
    try {
      const [pos, ord] = await Promise.all([
        apiFetch("/portfolio/delta"),
        apiFetch("/orders"),
      ]);
      setDeltaData(pos); setOrdersData(ord);
    } catch(_) {}
    setDeltaLoading(false);
  };

  const cancelOrder = async (id) => {
    try {
      await apiFetch(`/orders/${id}`, {method:"DELETE"});
      await loadDelta();
    } catch(e) { alert("Cancel failed: " + e.message); }
  };

  const cancelInactiveOrders = async () => {
    try {
      const r = await apiFetch("/orders/cancel-inactive", {method:"POST"});
      alert(`Cancelled ${r.count} Inactive order(s): [${r.cancelled.join(", ")}]`);
      await loadDelta();
    } catch(e) { alert("Cancel inactive failed: " + e.message); }
  };

  const load = useCallback(async () => {
    try {
      setErr(null);
      const d = await apiFetch("/pnl/dashboard");
      setData(d);
      setCountdown(INTERVAL);
    } catch(e) { setErr(e.message); }
    finally    { setLoading(false); }
  }, []);

  useEffect(() => { load(); const iv = setInterval(load, INTERVAL * 1000); return () => clearInterval(iv); }, [load]);
  useEffect(() => { const iv = setInterval(() => setCountdown(c => c <= 1 ? INTERVAL : c - 1), 1000); return () => clearInterval(iv); }, []);

  if (loading && !data) return <div style={{...sans, padding:40, textAlign:"center", color:C.muted}}>Loading P&amp;L data…</div>;
  if (err) return <div style={{...sans, padding:40, textAlign:"center", color:C.bear}}>Error: {err}</div>;
  if (!data) return null;

  const { account, stats, open_positions, closed_trades, daily_pnl, portfolio, exit_breakdown } = data;

  const pnlCol  = v => v == null ? C.muted : v > 0 ? C.bull : v < 0 ? C.bear : C.muted;
  const fmtDol  = (v, sign=false) => {
    if (v == null) return "—";
    const abs = Math.abs(v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
    return `${v < 0 ? "-" : (sign && v > 0 ? "+" : "")}$${abs}`;
  };
  const fmtDT = s => {
    if (!s) return "—";
    return new Date(s).toLocaleString("en-US", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
  };
  const fmtDTE = expiry => {
    if (!expiry) return "—";
    const d = new Date(`${expiry.slice(0,4)}-${expiry.slice(4,6)}-${expiry.slice(6,8)}`);
    return Math.floor((d - Date.now()) / 86400000);
  };

  // ── SVG cumulative P&L chart ──────────────────────────────────────────────
  function PnLChart() {
    const pts = daily_pnl || [];
    if (pts.length === 0) return (
      <div style={{height:160, display:"flex", alignItems:"center", justifyContent:"center", color:C.muted, ...sans, fontSize:13}}>
        No closed trades yet — chart will appear after the first close
      </div>
    );
    const VW=760, VH=160, PAD={l:65,r:20,t:20,b:32};
    const pW = VW-PAD.l-PAD.r, pH = VH-PAD.t-PAD.b;
    const vals = pts.map(p => p.cumulative);
    const yMin = Math.min(0, ...vals), yMax = Math.max(0, ...vals);
    const yR   = yMax - yMin || 10;
    const xS   = i  => PAD.l + (pts.length > 1 ? (i/(pts.length-1))*pW : pW/2);
    const yS   = v  => PAD.t + pH - ((v - yMin)/yR)*pH;
    const zY   = yS(0);
    const lc   = vals[vals.length-1] >= 0 ? "#16a34a" : "#dc2626";
    const linePts = pts.map((p,i) => `${xS(i).toFixed(1)},${yS(p.cumulative).toFixed(1)}`).join(" ");
    const fillD   = `M ${xS(0)} ${zY} L ${pts.map((p,i)=>`${xS(i)} ${yS(p.cumulative)}`).join(" L ")} L ${xS(pts.length-1)} ${zY} Z`;
    const yTicks  = [yMin, yMin+yR*0.25, yMin+yR*0.5, yMin+yR*0.75, yMax];
    const xIdxs   = pts.length <= 6 ? pts.map((_,i)=>i) :
      [0,1,2,3,4,5].map(i => Math.round(i*(pts.length-1)/5));
    return (
      <svg viewBox={`0 0 ${VW} ${VH}`} style={{width:"100%",height:"auto",overflow:"visible"}}>
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={lc} stopOpacity="0.22"/>
            <stop offset="100%" stopColor={lc} stopOpacity="0.02"/>
          </linearGradient>
        </defs>
        {yTicks.map((v,i) => (
          <g key={i}>
            <line x1={PAD.l} y1={yS(v)} x2={VW-PAD.r} y2={yS(v)} stroke={C.border} strokeWidth="0.5" strokeDasharray="3,3"/>
            <text x={PAD.l-6} y={yS(v)} textAnchor="end" dominantBaseline="middle" style={{...mono,fontSize:9,fill:C.muted}}>
              {v<0?"-":""}${Math.abs(v).toFixed(0)}
            </text>
          </g>
        ))}
        <line x1={PAD.l} y1={zY} x2={VW-PAD.r} y2={zY} stroke={C.muted} strokeWidth="1" strokeOpacity="0.4"/>
        <path d={fillD} fill="url(#pg)"/>
        <polyline points={linePts} fill="none" stroke={lc} strokeWidth="2" strokeLinejoin="round"/>
        <circle cx={xS(pts.length-1)} cy={yS(vals[vals.length-1])} r="4" fill={lc} stroke="white" strokeWidth="1.5"/>
        {xIdxs.map(i => (
          <text key={i} x={xS(i)} y={VH-4} textAnchor="middle" style={{...mono,fontSize:9,fill:C.muted}}>
            {pts[i].date.slice(5)}
          </text>
        ))}
      </svg>
    );
  }

  const cards = [
    { label:"Total P&L",      value:fmtDol(stats.total_pnl,true),            color:pnlCol(stats.total_pnl),            sub:"realized + unrealized" },
    { label:"Realized P&L",   value:fmtDol(stats.total_realized_pnl,true),   color:pnlCol(stats.total_realized_pnl),   sub:`${stats.total_trades} closed trades` },
    { label:"Unrealized P&L", value:fmtDol(stats.total_unrealized_pnl,true), color:pnlCol(stats.total_unrealized_pnl), sub:`${stats.open_count} open positions` },
    { label:"Today's P&L",    value:fmtDol(stats.today_pnl,true),            color:pnlCol(stats.today_pnl),            sub:new Date().toLocaleDateString("en-US",{weekday:"short"}) },
    { label:"Win Rate",       value:stats.win_rate!=null?`${stats.win_rate}%`:"—", color:stats.win_rate>50?C.bull:stats.win_rate<50?C.bear:C.muted,
      sub:`avg W ${fmtDol(stats.avg_win)} / L ${fmtDol(stats.avg_loss)}` },
    { label:"Net Liquidation", value:fmtDol(account.net_liquidation),         color:C.accent,                           sub:account.account||"—" },
  ];

  return (
    <div style={{animation:"fadeIn 0.2s ease"}}>
      {/* Header row */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{...sans,fontSize:10,textTransform:"uppercase",letterSpacing:2,color:C.muted}}>P&amp;L Dashboard</div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          {loading && <Spinner/>}
          <span style={{...mono,fontSize:11,color:C.muted}}>refresh in {countdown}s</span>
          <Btn onClick={load} color={C.accent}>↻ Refresh Now</Btn>
        </div>
      </div>

      {/* Summary cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10,marginBottom:20}}>
        {cards.map(c => (
          <Card key={c.label} style={{textAlign:"center",padding:"12px 8px"}}>
            <div style={{...sans,fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>{c.label}</div>
            <div style={{...mono,fontSize:16,fontWeight:800,color:c.color,marginBottom:4}}>{c.value}</div>
            <div style={{...sans,fontSize:10,color:C.muted}}>{c.sub}</div>
          </Card>
        ))}
      </div>

      {/* Chart */}
      <Card style={{marginBottom:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{...sans,fontSize:10,textTransform:"uppercase",letterSpacing:2,color:C.muted}}>Cumulative Realized P&amp;L</div>
          {daily_pnl.length > 0 && (
            <div style={{display:"flex",gap:20}}>
              <span style={{...mono,fontSize:11,color:C.muted}}>Best day: <span style={{color:C.bull}}>{fmtDol(Math.max(...daily_pnl.map(d=>d.pnl)),true)}</span></span>
              <span style={{...mono,fontSize:11,color:C.muted}}>Worst day: <span style={{color:C.bear}}>{fmtDol(Math.min(...daily_pnl.map(d=>d.pnl)),true)}</span></span>
              <span style={{...mono,fontSize:11,color:C.muted}}>Total: <span style={{color:pnlCol(stats.total_realized_pnl)}}>{fmtDol(stats.total_realized_pnl,true)}</span></span>
            </div>
          )}
        </div>
        <PnLChart/>
      </Card>

      {/* Open positions + Exit breakdown */}
      <div style={{display:"grid",gridTemplateColumns:"3fr 2fr",gap:16,marginBottom:20}}>
        <Card>
          <div style={{...sans,fontSize:10,textTransform:"uppercase",letterSpacing:2,color:C.muted,marginBottom:12}}>
            Open Positions ({open_positions.length}) — IBKR live
          </div>
          {open_positions.length === 0
            ? <div style={{...sans,fontSize:13,color:C.muted,padding:"20px 0",textAlign:"center"}}>
                No open positions in IBKR portfolio
              </div>
            : <div style={{overflowX:"auto"}}>
                <table style={{fontSize:12}}>
                  <thead><tr>{["Ticker","Type","Strike","Expiry","DTE","Qty","Entry","Mkt Val","Unrealized P&L","IV","Roll#"].map(h=>(
                    <th key={h} style={{...mono,fontSize:10,color:C.muted,fontWeight:600,paddingBottom:8}}>{h}</th>
                  ))}</tr></thead>
                  <tbody>{open_positions.map((t,i) => {
                    const dte = fmtDTE(t.expiry);
                    return (
                      <tr key={t.id||i}>
                        <td style={{...mono,fontWeight:700,color:C.accent}}>{t.ticker}</td>
                        <td><Pill color={t.action==="BUY"?C.bull:C.bear}>{strategyLabel(t)}</Pill></td>
                        <td style={{...mono}}>{t.strike?`$${t.strike}`:"—"}</td>
                        <td style={{...mono,fontSize:11}}>{t.expiry?`${t.expiry.slice(0,4)}-${t.expiry.slice(4,6)}-${t.expiry.slice(6,8)}`:"—"}</td>
                        <td style={{...mono,color:dte<21?C.bear:dte<30?C.neutral:C.muted}}>{dte}</td>
                        <td style={{...mono}}>{t.qty}</td>
                        <td style={{...mono}}>{t.entry_price!=null?`$${Number(t.entry_price).toFixed(2)}`:"—"}</td>
                        <td style={{...mono}}>{t.market_value!=null?`$${Number(t.market_value).toFixed(0)}`:"—"}</td>
                        <td style={{...mono,fontWeight:700,color:pnlCol(t.unrealized_pnl)}}>
                          {t.unrealized_pnl!=null?fmtDol(t.unrealized_pnl,true):"—"}
                        </td>
                        <td style={{...mono}}>{t.live_iv_entry?`${Number(t.live_iv_entry).toFixed(0)}%`:"—"}</td>
                        <td style={{...mono,color:C.muted}}>{t.roll_count||0}</td>
                      </tr>
                    );
                  })}</tbody>
                </table>
              </div>
          }
        </Card>

        <Card>
          <div style={{...sans,fontSize:10,textTransform:"uppercase",letterSpacing:2,color:C.muted,marginBottom:12}}>Exit Breakdown</div>
          {Object.keys(exit_breakdown).length === 0
            ? <div style={{...sans,fontSize:13,color:C.muted,padding:"20px 0",textAlign:"center"}}>No closed trades yet</div>
            : <table style={{fontSize:12}}>
                <thead><tr>{["Reason","Count","Total","Avg"].map(h=>(
                  <th key={h} style={{...mono,fontSize:10,color:C.muted,fontWeight:600,paddingBottom:8}}>{h}</th>
                ))}</tr></thead>
                <tbody>{Object.entries(exit_breakdown).sort((a,b)=>b[1].count-a[1].count).map(([reason,d])=>(
                  <tr key={reason}>
                    <td><Pill color={d.pnl>=0?C.bull:C.bear}>{reason}</Pill></td>
                    <td style={{...mono}}>{d.count}</td>
                    <td style={{...mono,color:pnlCol(d.pnl)}}>{fmtDol(d.pnl,true)}</td>
                    <td style={{...mono,color:pnlCol(d.count>0?d.pnl/d.count:0)}}>{fmtDol(d.count>0?d.pnl/d.count:0,true)}</td>
                  </tr>
                ))}</tbody>
              </table>
          }

          {/* IBKR Live Portfolio data is now shown in the Open Positions table (left card) */}
        </Card>
      </div>

      {/* Closed trades table */}
      <Card>
        <div style={{...sans,fontSize:10,textTransform:"uppercase",letterSpacing:2,color:C.muted,marginBottom:12}}>
          Recent Closed Trades ({closed_trades.length})
        </div>
        {closed_trades.length === 0
          ? <div style={{...sans,fontSize:13,color:C.muted,padding:"20px 0",textAlign:"center"}}>No closed trades yet</div>
          : <div style={{overflowX:"auto"}}>
              <table style={{fontSize:12}}>
                <thead><tr>{["Ticker","Type","Strike","Opened","Closed","Days","P&L","P&L%","Exit Reason","W/L"].map(h=>(
                  <th key={h} style={{...mono,fontSize:10,color:C.muted,fontWeight:600,paddingBottom:8}}>{h}</th>
                ))}</tr></thead>
                <tbody>{closed_trades.map(t => {
                  const days = Math.max(0, Math.round((new Date(t.closed_at)-new Date(t.opened_at))/86400000));
                  const exitCol = (t.exit_reason||"").includes("profit") ? C.bull : (t.exit_reason||"").includes("stop")||( t.exit_reason||"").includes("loss") ? C.bear : C.neutral;
                  return (
                    <tr key={t.id}>
                      <td style={{...mono,fontWeight:700,color:C.accent}}>{t.ticker}</td>
                      <td><Pill color={t.action==="BUY"?C.bull:C.bear}>{strategyLabel(t)}</Pill></td>
                      <td style={{...mono}}>${t.strike}</td>
                      <td style={{...mono,fontSize:11,color:C.muted}}>{fmtDT(t.opened_at)}</td>
                      <td style={{...mono,fontSize:11,color:C.muted}}>{fmtDT(t.closed_at)}</td>
                      <td style={{...mono}}>{days}d</td>
                      <td style={{...mono,fontWeight:700,color:pnlCol(t.pnl)}}>{fmtDol(t.pnl,true)}</td>
                      <td style={{...mono,color:pnlCol(t.pnl_pct)}}>{t.pnl_pct!=null?`${Number(t.pnl_pct).toFixed(1)}%`:"—"}</td>
                      <td><Pill color={exitCol}>{t.exit_reason||"—"}</Pill></td>
                      <td style={{...mono,fontWeight:700,color:t.win===1?C.bull:t.win===0?C.bear:C.muted}}>{t.win===1?"W":t.win===0?"L":"—"}</td>
                    </tr>
                  );
                })}</tbody>
              </table>
            </div>
        }
      </Card>

      {/* Portfolio Delta + Orders — collapsible panel (replaces old Positions tab) */}
      <Card style={{ marginTop:16 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, cursor:"pointer" }}
             onClick={() => { setDeltaOpen(o => !o); if (!deltaData) loadDelta(); }}>
          <span style={{ ...sans, fontWeight:700, fontSize:13, color:C.text }}>
            {deltaOpen ? "▾" : "▸"} Portfolio Delta &amp; Open Orders
          </span>
          {deltaData && (
            <span style={{ ...mono, fontSize:14, fontWeight:700,
              color: Math.abs(deltaData.total_delta||0) > 300 ? C.bear :
                     Math.abs(deltaData.total_delta||0) < 50  ? C.bull : C.neutral }}>
              Net Δ {(deltaData.total_delta||0) >= 0 ? "+" : ""}{deltaData.total_delta||0}
            </span>
          )}
          {deltaData && ordersData?.count > 0 && (
            <span style={{ ...sans, fontSize:11, color:C.bear, fontWeight:600 }}>
              {ordersData.count} open order{ordersData.count !== 1 ? "s" : ""}
            </span>
          )}
          <button onClick={e => { e.stopPropagation(); loadDelta(); }} style={{
            ...sans, marginLeft:"auto", fontSize:11, padding:"3px 10px", borderRadius:6,
            background:C.bg, border:`1px solid ${C.border}`, color:C.muted, cursor:"pointer",
          }}>{deltaLoading ? "Loading…" : "↻ Refresh"}</button>
        </div>

        {deltaOpen && deltaData && (
          <div style={{ marginTop:14 }}>
            <div style={{ overflowX:"auto", marginBottom:16 }}>
              <table style={{ fontSize:12, width:"100%", borderCollapse:"collapse" }}>
                <thead><tr>{["Symbol","Type","Strike","Expiry","DTE","Qty","Avg Cost","Mkt Value","Unreal P&L","δ","Net Δ"].map(h=>(
                  <th key={h} style={{ ...sans, color:C.muted, fontWeight:600, borderBottom:`1px solid ${C.border}`, padding:"5px 8px", fontSize:11 }}>{h}</th>
                ))}</tr></thead>
                <tbody>{(deltaData.positions||[]).map((p,i)=>(
                  <tr key={i} style={{ borderBottom:`1px solid ${C.border}33` }}>
                    <td style={{ ...mono, color:C.accent, fontWeight:700, padding:"5px 8px" }}>{p.symbol}</td>
                    <td style={{ ...mono, fontSize:11, padding:"5px 8px",
                      color: p.right==="C"?C.bull:p.right==="P"?C.bear:C.muted, fontWeight:600 }}>
                      {strategyLabel(p)}
                    </td>
                    <td style={{ ...mono, padding:"5px 8px" }}>{p.strike ? `$${p.strike}` : "—"}</td>
                    <td style={{ ...mono, color:C.muted, padding:"5px 8px", fontSize:11 }}>{p.expiry||"—"}</td>
                    <td style={{ ...mono, padding:"5px 8px",
                      color:p.dte<21?C.bear:p.dte<30?C.neutral:C.muted }}>
                      {p.dte != null ? `${p.dte}d` : "—"}
                    </td>
                    <td style={{ ...mono, padding:"5px 8px",
                      color:p.position>=0?C.bull:C.bear, fontWeight:700 }}>{p.position}</td>
                    <td style={{ ...mono, padding:"5px 8px" }}>{p.avg_cost ? `$${Number(p.avg_cost).toFixed(2)}` : "—"}</td>
                    <td style={{ ...mono, padding:"5px 8px" }}>{p.market_value != null ? `$${Number(p.market_value).toFixed(0)}` : "—"}</td>
                    <td style={{ ...mono, padding:"5px 8px", fontWeight:600,
                      color:p.unrealized_pnl>=0?C.bull:C.bear }}>
                      {p.unrealized_pnl != null ? `${p.unrealized_pnl>=0?"+":""}$${Math.abs(p.unrealized_pnl).toFixed(0)}` : "—"}
                    </td>
                    <td style={{ ...mono, padding:"5px 8px" }}>{p.delta != null ? p.delta.toFixed(3) : "—"}</td>
                    <td style={{ ...mono, padding:"5px 8px", fontWeight:700,
                      color:p.position_delta>=0?C.bull:C.bear }}>
                      {p.position_delta != null ? `${p.position_delta>=0?"+":""}${p.position_delta.toFixed(1)}` : "—"}
                    </td>
                  </tr>
                ))}
                {(deltaData.positions||[]).length === 0 && (
                  <tr><td colSpan={11} style={{ ...sans, color:C.muted, padding:"20px", textAlign:"center" }}>
                    No positions in IBKR — refresh and ensure you are connected
                  </td></tr>
                )}
                </tbody>
              </table>
            </div>

            {/* Open orders */}
            {ordersData?.count > 0 && (
              <div>
                <div style={{ ...sans, fontSize:11, fontWeight:700, color:C.text, marginBottom:8,
                  display:"flex", alignItems:"center", gap:10 }}>
                  Open Orders ({ordersData.count})
                  {ordersData.orders.some(o => o.status === "Inactive") && (
                    <Btn onClick={cancelInactiveOrders} color={C.bear} style={{ padding:"2px 10px", fontSize:10 }}>
                      ✕ Cancel All Inactive
                    </Btn>
                  )}
                </div>
                <table style={{ fontSize:12, width:"100%", borderCollapse:"collapse" }}>
                  <thead><tr>{["ID","Ticker","Contract","Action","Qty","Limit","Status","Cancel"].map(h=>(
                    <th key={h} style={{ ...sans, color:C.muted, fontWeight:600, borderBottom:`1px solid ${C.border}`, padding:"4px 8px", fontSize:11 }}>{h}</th>
                  ))}</tr></thead>
                  <tbody>{ordersData.orders.map((o,i)=>(
                    <tr key={i} style={{ borderBottom:`1px solid ${C.border}33`,
                      background: o.status==="Inactive" ? "#fff5f5" : undefined }}>
                      <td style={{ ...mono, color:C.muted, padding:"5px 8px" }}>{o.order_id}</td>
                      <td style={{ ...mono, color:C.accent, fontWeight:700, padding:"5px 8px" }}>{o.ticker}</td>
                      <td style={{ ...mono, fontSize:10, color:C.muted, padding:"5px 8px" }}>
                        {o.right}{o.strike ? `$${o.strike}` : ""} {o.expiry ? o.expiry.slice(0,8) : ""}
                      </td>
                      <td style={{ ...mono, padding:"5px 8px",
                        color:o.action==="BUY"?C.bull:C.bear, fontWeight:700 }}>{o.action}</td>
                      <td style={{ ...mono, padding:"5px 8px" }}>{o.quantity}</td>
                      <td style={{ ...mono, padding:"5px 8px" }}>${Number(o.limit_price||0).toFixed(2)}</td>
                      <td style={{ ...mono, padding:"5px 8px",
                        color:o.status==="Inactive"?C.bear:C.neutral }}>
                        {o.status}{o.why_held ? ` (${o.why_held})` : ""}
                      </td>
                      <td style={{ padding:"5px 8px" }}>
                        <Btn onClick={() => cancelOrder(o.order_id)} color={C.bear} style={{ padding:"2px 8px", fontSize:10 }}>✕</Btn>
                      </td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            )}
            {ordersData?.count === 0 && (
              <div style={{ ...sans, fontSize:12, color:C.muted }}>No open orders</div>
            )}
          </div>
        )}
      </Card>
    </div>
  );
}

// ── Technicals Tab ────────────────────────────────────────────────────────
function TechnicalsTab() {
  const [ticker,  setTicker]  = useState("");
  const [loading, setLoading] = useState(false);
  const [result,  setResult]  = useState(null);
  const [error,   setError]   = useState(null);

  async function analyze() {
    const t = ticker.trim().toUpperCase();
    if (!t) return;
    setLoading(true); setError(null); setResult(null);
    try {
      const r = await apiFetch(`/technicals/${t}`);
      setResult(r);
    } catch(e) {
      setError(e?.detail || e?.message || String(e));
    } finally {
      setLoading(false);
    }
  }

  const overallColors = {
    strong_buy:  { bg:"#16a34a22", col:"#16a34a", label:"STRONG BUY" },
    buy:         { bg:"#22c55e22", col:"#22c55e", label:"BUY" },
    neutral:     { bg:"#94a3b822", col:"#64748b", label:"NEUTRAL" },
    sell:        { bg:"#f9731622", col:"#f97316", label:"SELL" },
    strong_sell: { bg:"#dc262622", col:"#dc2626", label:"STRONG SELL" },
  };

  const trendColors = { bullish:"#16a34a", bearish:"#dc2626", mixed:"#f97316" };

  function Pill({ label, color, bg }) {
    return (
      <span style={{ fontSize:11, fontWeight:700, padding:"2px 10px", borderRadius:10,
                     background: bg || color+"22", color, border:`1px solid ${color}44` }}>
        {label}
      </span>
    );
  }

  function GaugeBar({ value, min=0, max=100, thresholds, label }) {
    // thresholds: [{at, color}] defining color zones
    const pct = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
    const color = thresholds?.slice().reverse().find(t => value >= t.at)?.color || C.accent;
    return (
      <div>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.muted, marginBottom:3 }}>
          <span>{label}</span><span style={{ color, fontWeight:700 }}>{value?.toFixed(1)}</span>
        </div>
        <div style={{ height:8, borderRadius:4, background:C.border }}>
          <div style={{ height:"100%", borderRadius:4, width:`${pct}%`, background:color, transition:"width 0.3s" }}/>
        </div>
      </div>
    );
  }

  const ind = result?.indicators || {};
  const sum = result?.summary || {};
  const brk = result?.breakout || {};
  const oc  = overallColors[sum.overall] || overallColors.neutral;

  return (
    <div>
      <Card title="Technical Analysis — IBKR Live Data">
        <div style={{ display:"flex", gap:10, marginBottom:16, alignItems:"center" }}>
          <input
            value={ticker}
            onChange={e => setTicker(e.target.value.toUpperCase())}
            onKeyDown={e => e.key === "Enter" && analyze()}
            placeholder="Ticker symbol (e.g. AAPL)"
            style={{ ...sans, flex:1, padding:"8px 12px", borderRadius:8, border:`1px solid ${C.border}`,
                     fontSize:13, color:C.text, background:"#f8fafc", outline:"none" }}
          />
          <button
            onClick={analyze}
            disabled={loading || !ticker.trim()}
            style={{ ...sans, padding:"8px 20px", borderRadius:8, border:"none", cursor:"pointer",
                     background:C.accent, color:"#fff", fontWeight:700, fontSize:13,
                     opacity: (loading || !ticker.trim()) ? 0.6 : 1 }}
          >{loading ? "Analyzing…" : "Analyze"}</button>
        </div>
        <div style={{ fontSize:12, color:C.muted }}>
          Pulls 1 year of daily OHLCV from IBKR. Computes RSI-14, MACD (12/26/9),
          Bollinger Bands (20,2), SMA-20/50/200, and volume breakout. Requires active connection.
        </div>
      </Card>

      {error && (
        <Card style={{ borderColor:"#dc2626", marginTop:12 }}>
          <div style={{ color:"#dc2626", fontWeight:600 }}>{error}</div>
        </Card>
      )}

      {result && (
        <>
          {/* Header row */}
          <div style={{ display:"flex", alignItems:"center", gap:12, marginTop:12, marginBottom:12, flexWrap:"wrap" }}>
            <span style={{ ...sans, fontSize:22, fontWeight:800, color:C.text }}>{result.ticker}</span>
            <span style={{ ...sans, fontSize:20, fontWeight:700, color:C.text }}>${result.price?.toFixed(2)}</span>
            <span style={{ ...sans, fontSize:14, fontWeight:600,
                           color: result.change_pct >= 0 ? C.bull : C.bear }}>
              {result.change_pct >= 0 ? "+" : ""}{result.change_pct?.toFixed(2)}%
            </span>
            <Pill label={oc.label} color={oc.col} bg={oc.bg} />
            <Pill label={(sum.trend || "").toUpperCase()} color={trendColors[sum.trend] || C.muted} />
            {brk.signal !== "NORMAL" && (
              <Pill label={brk.signal} color={brk.confirmed ? "#7c3aed" : "#f97316"} />
            )}
            <span style={{ ...sans, fontSize:11, color:C.muted, marginLeft:"auto" }}>
              {result.bars_used} bars
            </span>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            {/* RSI + MACD */}
            <Card title="Momentum">
              <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                <GaugeBar
                  label="RSI-14"
                  value={ind.rsi14 || 50}
                  thresholds={[
                    { at:0,  color:"#dc2626" },
                    { at:30, color:"#64748b" },
                    { at:70, color:"#f97316" },
                  ]}
                />
                <div style={{ fontSize:11, color:C.muted, marginTop:-6 }}>
                  Zone: <span style={{ fontWeight:700, color:
                    ind.rsi_zone==="overbought" ? "#f97316" :
                    ind.rsi_zone==="oversold"   ? "#dc2626" : C.muted }}>
                    {sum.rsi_zone?.toUpperCase()}
                  </span>
                </div>
                <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:10 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:C.muted, marginBottom:6 }}>MACD (12/26/9)</div>
                  <div style={{ display:"flex", gap:16, fontSize:12 }}>
                    <div><span style={{ color:C.muted }}>Line </span>
                      <span style={{ fontWeight:700, color:C.text }}>{ind.macd?.toFixed(4)}</span></div>
                    <div><span style={{ color:C.muted }}>Signal </span>
                      <span style={{ fontWeight:700, color:C.text }}>{ind.macd_signal?.toFixed(4)}</span></div>
                    <div><span style={{ color:C.muted }}>Hist </span>
                      <span style={{ fontWeight:700, color: (ind.macd_hist||0)>0 ? C.bull : C.bear }}>
                        {ind.macd_hist?.toFixed(4)}
                      </span></div>
                  </div>
                  <div style={{ marginTop:6 }}>
                    <Pill label={(sum.macd_bias || "").toUpperCase()} color={(sum.macd_bias==="bullish") ? C.bull : C.bear} />
                  </div>
                </div>
              </div>
            </Card>

            {/* Bollinger Bands */}
            <Card title="Bollinger Bands (20, 2)">
              {ind.bb_upper != null ? (
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                    <span style={{ color:C.muted }}>Upper</span>
                    <span style={{ fontWeight:700, color:C.bear }}>${ind.bb_upper?.toFixed(2)}</span>
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                    <span style={{ color:C.muted }}>Mid (SMA-20)</span>
                    <span style={{ fontWeight:700, color:C.accent }}>${ind.bb_mid?.toFixed(2)}</span>
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                    <span style={{ color:C.muted }}>Lower</span>
                    <span style={{ fontWeight:700, color:C.bull }}>${ind.bb_lower?.toFixed(2)}</span>
                  </div>
                  <div style={{ marginTop:4 }}>
                    <GaugeBar
                      label="%B (price position in band)"
                      value={ind.pct_b || 50}
                      thresholds={[
                        { at:0,  color:"#16a34a" },
                        { at:40, color:"#64748b" },
                        { at:75, color:"#f97316" },
                        { at:90, color:"#dc2626" },
                      ]}
                    />
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:C.muted, marginTop:2 }}>
                      <span>lower band</span><span>mid</span><span>upper band</span>
                    </div>
                  </div>
                </div>
              ) : <div style={{ color:C.muted, fontSize:12 }}>Insufficient data</div>}
            </Card>

            {/* Moving Averages */}
            <Card title="Moving Averages">
              {[
                { label:"SMA-20",  value:ind.sma20,   above:ind.above_sma20  },
                { label:"SMA-50",  value:ind.sma50,   above:ind.above_sma50  },
                { label:"SMA-200", value:ind.sma200,  above:ind.above_sma200 },
              ].map(({ label, value, above }) => (
                <div key={label} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                                          fontSize:12, padding:"5px 0", borderBottom:`1px solid ${C.border}` }}>
                  <span style={{ color:C.muted, fontWeight:600 }}>{label}</span>
                  <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                    <span style={{ fontWeight:700, color:C.text }}>
                      {value != null ? `$${value.toFixed(2)}` : "—"}
                    </span>
                    {above != null && (
                      <span style={{ fontSize:10, fontWeight:700, padding:"1px 7px", borderRadius:8,
                                     background: above ? "#16a34a22" : "#dc262622",
                                     color: above ? C.bull : C.bear }}>
                        {above ? "ABOVE" : "BELOW"}
                      </span>
                    )}
                  </div>
                </div>
              ))}
              <div style={{ marginTop:8, fontSize:11, color:C.muted }}>
                {ind.above_sma20 && ind.above_sma50 && ind.above_sma200
                  ? "Full bullish MA stack — strong uptrend"
                  : !ind.above_sma20 && !ind.above_sma50 && ind.above_sma200 === false
                  ? "Full bearish MA stack — strong downtrend"
                  : "Mixed MA alignment — choppy or transitioning"}
              </div>
            </Card>

            {/* Volume & Breakout */}
            <Card title="Volume & Breakout">
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                  <span style={{ color:C.muted }}>Volume ratio (vs 20d avg)</span>
                  <span style={{ fontWeight:700, color: (ind.vol_ratio||1) >= 1.5 ? "#7c3aed" : C.text }}>
                    {ind.vol_ratio?.toFixed(2)}×
                  </span>
                </div>
                <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                  <Pill
                    label={brk.signal}
                    color={ brk.signal==="BREAKOUT" ? "#7c3aed" : brk.signal==="WATCH" ? "#f97316" : C.muted }
                  />
                  <span style={{ fontSize:11, color:C.muted }}>
                    {brk.signal==="BREAKOUT" && "Volume-confirmed upside breakout"}
                    {brk.signal==="WATCH"    && "Price at 20-day high, volume not confirmed"}
                    {brk.signal==="NORMAL"   && "No breakout pattern"}
                  </span>
                </div>
                <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:10 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:C.muted, marginBottom:6 }}>
                    CSP Implication
                  </div>
                  <div style={{ fontSize:12, color:C.text, lineHeight:1.5 }}>
                    {ind.pct_b != null && ind.pct_b < 30 && (ind.rsi14||50) < 45
                      ? "Price near lower Bollinger Band + RSI oversold → elevated vol likely → good CSP entry if IV rank is high."
                      : ind.pct_b != null && ind.pct_b > 80
                      ? "Price near upper Bollinger Band → extended move. CSP assignment risk elevated on reversal."
                      : brk.signal === "BREAKOUT"
                      ? "Breakout with volume confirms underlying strength → CSP on pullback to upper BB."
                      : "Normal range. Standard CSP criteria apply."}
                  </div>
                </div>
              </div>
            </Card>
          </div>
        </>
      )}
    </div>
  );
}


// ── Decisions Tab ─────────────────────────────────────────────────────────
function DecisionsTab() {
  const [decisions, setDecisions] = useState([]);
  const [loading,   setLoading]   = useState(true);
  const [filter,    setFilter]    = useState("ALL");

  const load = async () => {
    try {
      const r = await apiFetch("/autotrader/decisions?limit=200");
      setDecisions(r.decisions || []);
    } catch(_) {}
    finally { setLoading(false); }
  };

  useEffect(() => {
    load();
    const id = setInterval(load, 10000);
    return () => clearInterval(id);
  }, []);

  const ACTION_META = {
    ENTER:        { label:"Entry",         color:"#27ae60", bg:"#0d3321" },
    ROLL:         { label:"Roll",          color:"#3b82f6", bg:"#0c1a3a" },
    CLOSE_PROFIT: { label:"Profit ✓",      color:"#f1c40f", bg:"#2d2600" },
    CLOSE_STOP:   { label:"Stop ⚠",        color:"#e74c3c", bg:"#2d0b0b" },
    CLOSE_21DTE:  { label:"21 DTE",        color:"#f39c12", bg:"#2d1c00" },
    CLOSE_ROLL:   { label:"Roll-Close",    color:"#64748b", bg:"#1e293b" },
    CLOSE_ROTATE: { label:"Rotate",        color:"#a855f7", bg:"#1e1033" },
    CLOSE_MANUAL: { label:"Manual",        color:"#94a3b8", bg:"#1e293b" },
  };
  const ALL_FILTERS = ["ALL","ENTER","ROLL","CLOSE_PROFIT","CLOSE_STOP","CLOSE_21DTE","CLOSE_ROTATE"];

  const filtered = filter === "ALL" ? decisions : decisions.filter(d => d.action === filter);

  // Render markdown-lite: **bold** and \n\n as paragraphs
  const renderBody = body => {
    if (!body) return null;
    return body.split("\n\n").map((para, i) => {
      const parts = para.split(/(\*\*[^*]+\*\*)/g).map((p, j) =>
        p.startsWith("**") ? <strong key={j}>{p.slice(2,-2)}</strong> : p
      );
      return <p key={i} style={{ margin:"4px 0", lineHeight:1.65 }}>{parts}</p>;
    });
  };

  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16, flexWrap:"wrap" }}>
        <div style={{ ...sans, fontSize:14, fontWeight:700, color:"#f1f5f9" }}>
          Trade Decision Log
        </div>
        <div style={{ ...mono, fontSize:11, color:"#64748b" }}>
          {filtered.length} decision{filtered.length !== 1 ? "s" : ""}
          {filter !== "ALL" ? ` · ${filter}` : ""}
        </div>
        <div style={{ display:"flex", gap:6, marginLeft:"auto", flexWrap:"wrap" }}>
          {ALL_FILTERS.map(f => {
            const m = ACTION_META[f] || {};
            return (
              <button key={f} onClick={() => setFilter(f)} style={{
                ...sans, fontSize:11, padding:"3px 10px", borderRadius:12,
                cursor:"pointer", fontWeight: filter===f ? 700 : 400,
                border: `1px solid ${filter===f ? (m.color||"#3b82f6") : "#334155"}`,
                background: filter===f ? (m.bg||"#1e293b") : "transparent",
                color: filter===f ? (m.color||"#93c5fd") : "#64748b",
              }}>{f==="ALL" ? "All" : (m.label||f)}</button>
            );
          })}
        </div>
        <button onClick={load} style={{
          ...sans, fontSize:11, padding:"3px 10px", borderRadius:6,
          background:"#1e293b", color:"#94a3b8", border:"1px solid #334155", cursor:"pointer",
        }}>Refresh</button>
      </div>

      {loading && <div style={{ color:"#64748b", ...mono }}>Loading decisions…</div>}
      {!loading && filtered.length === 0 && (
        <Card>
          <div style={{ color:"#64748b", ...sans, fontSize:13 }}>
            No decisions recorded yet. The auto-trader logs a plain-English explanation
            every time it enters, rolls, or exits a trade.
          </div>
        </Card>
      )}

      <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
        {filtered.map((d, i) => {
          const m = ACTION_META[d.action] || { label:d.action, color:"#94a3b8", bg:"#1e293b" };
          return (
            <Card key={i} style={{ borderLeft:`3px solid ${m.color}`, padding:"14px 18px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                <span style={{
                  ...mono, fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:8,
                  background: m.bg, color: m.color, border:`1px solid ${m.color}55`,
                }}>{m.label}</span>
                <span style={{ ...mono, fontSize:13, fontWeight:700, color:"#f1f5f9" }}>
                  {d.ticker}
                </span>
                <span style={{ flex:1, ...sans, fontSize:13, color:"#cbd5e1" }}>
                  {d.headline}
                </span>
                <span style={{ ...mono, fontSize:11, color:"#475569", whiteSpace:"nowrap" }}>
                  {d.time}
                </span>
              </div>
              <div style={{ ...sans, fontSize:12, color:"#94a3b8", paddingLeft:4 }}>
                {renderBody(d.body)}
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}


// ── Root App ──────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]         = useState("pnl");
  const [connected, setConn]  = useState(false);
  const [netDelta, setDelta]  = useState(null);

  useEffect(() => {
    const check = async () => {
      try { const s = await apiFetch("/status"); setConn(s.connected); } catch(_) { setConn(false); }
    };
    check();
    const iv = setInterval(check, 10000);
    return () => clearInterval(iv);
  }, []);

  // Refresh portfolio delta every 60s when connected
  useEffect(() => {
    if (!connected) return;
    const load = async () => {
      try { const d = await apiFetch("/portfolio/delta"); setDelta(d.total_delta); } catch(_) {}
    };
    load();
    const iv = setInterval(load, 60000);
    return () => clearInterval(iv);
  }, [connected]);

  const tabs = [
    { id:"pnl",        label:"P&L"         },
    { id:"signals",    label:"Signals"     },
    { id:"csp",        label:"CSP Scan"    },
    { id:"leaps",      label:"LEAPs"       },
    { id:"autotrader", label:"Auto-Trade"  },
    { id:"backtest",   label:"Backtest"    },
    { id:"0dte",       label:"0DTE / EIV"  },
    { id:"learning",   label:"Learning"    },
    { id:"universe",   label:"Universe"    },
    { id:"decisions",  label:"Decisions"   },
    { id:"technicals", label:"Technicals"  },
  ];

  const deltaCol = netDelta == null ? C.muted : netDelta >= 0 ? C.bull : C.bear;

  return (
    <div style={{ minHeight:"100vh", background:C.bg, padding:"20px 16px" }}>
      <div style={{ maxWidth:1200, margin:"0 auto" }}>

        {/* Header */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10, marginBottom:20 }}>
          <div>
            <div style={{ ...mono, fontSize:10, color:C.accent, letterSpacing:3, textTransform:"uppercase", marginBottom:4 }}>
              XGBoost · IBKR Algo Trading · v6
            </div>
            <h1 style={{ ...sans, fontSize:20, fontWeight:800, color:C.white, letterSpacing:-0.5 }}>
              Options Strategy Engine — CSP + LEAP + Delta
            </h1>
          </div>
          <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
            {netDelta != null && (
              <div style={{ ...mono, fontSize:13, fontWeight:700, color:deltaCol,
                padding:"4px 12px", borderRadius:16, background:`${deltaCol}11`, border:`1px solid ${deltaCol}33` }}>
                Net Δ {netDelta >= 0 ? "+" : ""}{netDelta}
              </div>
            )}
            <StatusPill connected={connected} />
          </div>
        </div>

        {/* Nav tabs */}
        <div style={{ display:"flex", gap:4, marginBottom:20, borderBottom:`1px solid ${C.border}`, paddingBottom:0 }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              ...sans, fontSize:13, fontWeight:600, padding:"8px 20px", cursor:"pointer",
              background:"transparent", border:"none",
              color: tab===t.id ? C.accent : C.muted,
              borderBottom: tab===t.id ? `2px solid ${C.accent}` : "2px solid transparent",
              marginBottom:-1, transition:"all 0.15s",
            }}>{t.label}</button>
          ))}
        </div>

        {/* Tab content — always mounted so state (scan results, params) survives tab switches */}
        <div style={{display: tab==="pnl"        ? "" : "none"}}><PnLTab /></div>
        <div style={{display: tab==="signals"    ? "" : "none"}}><SignalsTab    connected={connected} /></div>
        <div style={{display: tab==="csp"        ? "" : "none"}}><CSPTab        connected={connected} /></div>
        <div style={{display: tab==="leaps"      ? "" : "none"}}><LEAPTab       connected={connected} /></div>
        <div style={{display: tab==="autotrader" ? "" : "none"}}><AutoTraderTab /></div>
        <div style={{display: tab==="backtest"   ? "" : "none"}}><BacktestTab   connected={connected} /></div>
        <div style={{display: tab==="0dte"       ? "" : "none"}}><ZeroDTETab    connected={connected} /></div>
        <div style={{display: tab==="learning"   ? "" : "none"}}><LearningTab /></div>
        <div style={{display: tab==="universe"   ? "" : "none"}}><UniverseTab /></div>
        <div style={{display: tab==="decisions"  ? "" : "none"}}><DecisionsTab /></div>
        <div style={{display: tab==="technicals" ? "" : "none"}}><TechnicalsTab /></div>

        <div style={{ marginTop:20, ...sans, fontSize:11, color:C.muted, lineHeight:1.7 }}>
          Auto-trader: Kelly sizing · 50% profit target · IV-adjusted stops · 21 DTE roll · 48h cooldown. Backtest: 2-yr simulation with BS pricing.
          0DTE: SPY/QQQ/IWM 0–7 DTE puts. Earnings IV: pre-earnings premium plays. Live account: LIVE (7496) button.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
