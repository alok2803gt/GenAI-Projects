<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBKR Trader — v3</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #161b22; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
    @keyframes blink    { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes fadeIn   { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes pulse-ring { 0%{box-shadow:0 0 0 0 rgba(0,120,212,0.4)} 70%{box-shadow:0 0 0 10px transparent} 100%{box-shadow:0 0 0 0 transparent} }
    .spin { animation: spin 0.9s linear infinite; display:inline-block; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 10px; white-space: nowrap; }
    tr:hover td { background: rgba(0,120,212,0.05); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const API = "http://localhost:8000";

const C = {
  bg:      "#0d1117",
  surface: "#161b22",
  card:    "#1c2128",
  border:  "#30363d",
  accent:  "#2f81f7",
  bull:    "#3fb950",
  bear:    "#f85149",
  neutral: "#e3b341",
  text:    "#e6edf3",
  muted:   "#8b949e",
  white:   "#e6edf3",
  dim:     "#1c2128",
  orange:  "#f0883e",
};
const mono = { fontFamily:"'JetBrains Mono', monospace" };
const sans = { fontFamily:"'Inter', sans-serif" };

// ── helpers ───────────────────────────────────────────────────────────────
async function apiFetch(path, opts) {
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

function fmt$(n)  { return n == null ? "—" : `$${Number(n).toFixed(2)}`; }

// Derive human strategy label from available fields.
// Works for IBKR portfolio rows (position qty + right + sec_type)
// and journal / auto-trader rows (action + right + strategy_type).
function strategyLabel({ sec_type, right, position, action, strategy_type } = {}) {
  if (strategy_type) {
    const m = { csp:"CSP", leap:"LEAP", hedge:"Hedge Put", hedge_put:"Hedge Put", short_call:"Short Call" };
    return m[strategy_type.toLowerCase()] || strategy_type.toUpperCase();
  }
  if (sec_type && sec_type !== "OPT") return sec_type;  // STK, CASH, etc.
  // Determine short/long from IBKR position qty or action string
  const isShort = position != null ? position < 0 : action === "SELL";
  if (right === "P") return isShort ? "CSP"        : "Hedge Put";
  if (right === "C") return isShort ? "Short Call"  : "LEAP";
  return "—";
}
function fmtP(n)  { return n == null ? "—" : `${Number(n).toFixed(2)}%`; }
function fmtN(n,d=3) { return n == null ? "—" : Number(n).toFixed(d); }

const RISK_COLOR = {
  "VERY LOW":   C.bull,
  "LOW":        "#4ade80",
  "LOW-MEDIUM": C.neutral,
  "MEDIUM":     C.orange,
};
const SIG_COLOR = { BUY: C.bull, SELL: C.bear, HOLD: C.neutral };

// ── reusable UI pieces ────────────────────────────────────────────────────
function Pill({ children, color }) {
  return (
    <span style={{
      ...mono, fontSize:10, padding:"2px 8px", borderRadius:12,
      background:`${color}22`, color, border:`1px solid ${color}44`,
      fontWeight:700, letterSpacing:0.5,
    }}>{children}</span>
  );
}

function Btn({ onClick, children, color, style: sx }) {
  return (
    <button onClick={onClick} style={{
      ...sans, fontSize:11, padding:"5px 14px", borderRadius:6,
      background:C.dim, border:`1px solid ${color||C.border}`,
      color: color||C.muted, cursor:"pointer", ...sx,
    }}>{children}</button>
  );
}

function Card({ children, title, style: sx }) {
  return (
    <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"16px 18px", boxShadow:"0 1px 4px rgba(0,0,0,0.07)", ...sx }}>
      {title && (
        <div style={{ ...sans, fontSize:12, fontWeight:700, color:C.muted, textTransform:"uppercase",
                      letterSpacing:"0.08em", marginBottom:12, paddingBottom:8,
                      borderBottom:`1px solid ${C.border}` }}>
          {title}
        </div>
      )}
      {children}
    </div>
  );
}

function SectionTitle({ children }) {
  return (
    <div style={{ ...sans, fontSize:10, textTransform:"uppercase", letterSpacing:2, color:C.muted, marginBottom:12 }}>
      {children}
    </div>
  );
}

function Spinner() {
  return <span className="spin" style={{ fontSize:18, color:C.accent }}>⟳</span>;
}

const REGIME_CFG = {
  BULL:    { color: C.bull,    icon: "▲", label: "BULL MARKET" },
  NEUTRAL: { color: C.neutral, icon: "●", label: "NEUTRAL" },
  BEAR:    { color: C.bear,    icon: "▼", label: "BEAR MARKET" },
  UNKNOWN: { color: C.muted,   icon: "?", label: "UNKNOWN" },
};

function RegimeBanner({ regime }) {
  if (!regime) return null;
  const cfg = REGIME_CFG[regime.regime] || REGIME_CFG.UNKNOWN;
  const bearWarn = regime.regime === "BEAR";
  // VIX color thresholds match backend: BULL<22, NEUTRAL<28, BEAR>=28
  const vixColor = regime.vix < 22 ? C.bull : regime.vix < 28 ? C.neutral : C.bear;
  const spy5d = regime.spy_5d_pct;
  const spy5dColor = spy5d >= 0 ? C.bull : C.bear;
  const spy5dLabel = spy5d != null ? `${spy5d >= 0 ? "+" : ""}${spy5d.toFixed(1)}% 5d` : null;
  return (
    <div style={{
      display:"flex", alignItems:"center", gap:14, flexWrap:"wrap",
      padding:"10px 16px", borderRadius:8, marginBottom:12,
      background:`${cfg.color}12`, border:`1px solid ${cfg.color}44`,
    }}>
      <span style={{ ...mono, fontSize:13, color:cfg.color, fontWeight:700 }}>
        {cfg.icon} {cfg.label}
      </span>
      {regime.spy_close != null && (
        <span style={{ ...sans, fontSize:11, color:C.muted }}>
          SPY <b style={{color:C.white}}>{regime.spy_close}</b>
          {" "}SMA50 <b style={{color: regime.spy_vs_50d_pct>=0?C.bull:C.bear}}>
            {regime.spy_vs_50d_pct>=0?"+":""}{regime.spy_vs_50d_pct}%
          </b>
          {regime.spy_vs_20d_pct != null && (
            <span>
              {" "}SMA20 <b style={{color: regime.spy_vs_20d_pct>=0?C.bull:C.bear}}>
                {regime.spy_vs_20d_pct>=0?"+":""}{regime.spy_vs_20d_pct}%
              </b>
            </span>
          )}
          {spy5dLabel && (
            <span> <b style={{color:spy5dColor}}>({spy5dLabel})</b></span>
          )}
        </span>
      )}
      {regime.vix != null && (
        <span style={{ ...sans, fontSize:11, color:C.muted }}>
          VIX <b style={{color:vixColor}}>{regime.vix}</b>
        </span>
      )}
      {bearWarn && (
        <span style={{ ...sans, fontSize:11, color:C.bear, fontWeight:600 }}>
          ⚠ Selling premium in a bear market carries elevated assignment risk
        </span>
      )}
    </div>
  );
}

function WarningBadges({ warnings }) {
  if (!warnings || warnings.length === 0) return <span style={{color:C.muted}}>—</span>;
  return (
    <span style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
      {warnings.map((w,i) => (
        <span key={i} style={{
          ...mono, fontSize:9, padding:"2px 6px", borderRadius:10,
          background:`${C.bear}22`, color:C.bear, border:`1px solid ${C.bear}44`,
          fontWeight:700, whiteSpace:"nowrap",
        }}>{w}</span>
      ))}
    </span>
  );
}

function StatusPill({ connected, error }) {
  const col = connected ? C.bull : C.bear;
  const label = connected ? "IBKR LIVE" : error ? "DISCONNECTED" : "CONNECTING…";
  return (
    <div style={{
      display:"inline-flex", alignItems:"center", gap:6,
      padding:"4px 10px", borderRadius:20, border:`1px solid ${col}33`, background:`${col}0e`,
    }}>
      <div style={{ width:7, height:7, borderRadius:"50%", background:col,
        animation: connected ? "blink 2s infinite" : "none" }} />
      <span style={{ ...mono, fontSize:10, color:col, letterSpacing:1 }}>{label}</span>
    </div>
  );
}

function OPRAPill({ opraActive, onRecheck }) {
  const [checking, setChecking] = React.useState(false);
  if (opraActive === null || opraActive === undefined) return null;
  const col   = opraActive ? C.bull : C.bear;
  const label = opraActive ? "OPRA LIVE" : "OPRA DELAYED";
  const tip   = opraActive
    ? "Real-time options data — Greeks and quotes are live"
    : "OPRA not subscribed — options quotes are 15-min delayed. Click ↻ to recheck after subscribing.";

  async function handleRecheck() {
    setChecking(true);
    try {
      const r = await fetch(`${API}/opra/recheck`);
      const d = await r.json();
      if (onRecheck) onRecheck(d.opra_active);
    } catch(e) { /* ignore */ }
    finally { setChecking(false); }
  }

  return (
    <div style={{ display:"inline-flex", alignItems:"center", gap:4 }}>
      <div title={tip} style={{
        display:"inline-flex", alignItems:"center", gap:5,
        padding:"4px 10px", borderRadius:20, border:`1px solid ${col}33`, background:`${col}0e`,
        cursor:"default",
      }}>
        <span style={{ fontSize:9 }}>{opraActive ? "●" : "○"}</span>
        <span style={{ ...mono, fontSize:10, color:col, letterSpacing:1 }}>{label}</span>
      </div>
      {!opraActive && (
        <button onClick={handleRecheck} disabled={checking} title="Recheck OPRA subscription" style={{
          background:"none", border:`1px solid ${C.muted}44`, borderRadius:12,
          color:C.muted, cursor:"pointer", fontSize:11, padding:"3px 8px",
          opacity: checking ? 0.5 : 1,
        }}>{checking ? "…" : "↻ Recheck"}</button>
      )}
    </div>
  );
}

// ── Signals Tab components ─────────────────────────────────────────────────
function CandleChart({ bars, signal }) {
  if (!bars || bars.length < 5) return (
    <div style={{ height:180, display:"flex", alignItems:"center", justifyContent:"center", color:C.muted, fontSize:12 }}>
      Waiting for bars…
    </div>
  );
  const W=580, H=180, padL=10, padR=50, padT=10, padB=22;
  const visible = bars.slice(-60);
  const prices = visible.flatMap(c => [+c.high, +c.low]);
  const minP = Math.min(...prices), maxP = Math.max(...prices);
  const rng = maxP - minP || 1;
  const sy = p => padT + ((maxP - p) / rng) * (H - padT - padB);
  const cw = (W - padL - padR) / visible.length;
  const bw = Math.max(2, cw * 0.65);
  const priceLabels = [minP, (minP+maxP)/2, maxP].map(p => ({ y:sy(p), val:p.toFixed(2) }));
  const timeLabels = visible
    .filter((_,i) => i % Math.ceil(visible.length/6) === 0)
    .map(b => {
      const idx = visible.indexOf(b);
      const t = new Date(b.time);
      return { x: padL + idx*cw + cw/2, label:`${t.getMonth()+1}/${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}` };
    });
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:H }}>
      <rect width={W} height={H} fill={C.card} rx={6} />
      {priceLabels.map((pl,i) => (
        <g key={i}>
          <line x1={padL} y1={pl.y} x2={W-padR+4} y2={pl.y} stroke={C.border} strokeDasharray="3 3" />
          <text x={W-padR+8} y={pl.y+4} fill={C.muted} fontSize={9} style={mono}>{pl.val}</text>
        </g>
      ))}
      {visible.map((c,i) => {
        const x = padL + i * cw;
        const isUp = +c.close >= +c.open;
        const col = isUp ? C.bull : C.bear;
        const bodyTop = sy(Math.max(+c.open, +c.close));
        const bodyBot = sy(Math.min(+c.open, +c.close));
        const bh = Math.max(1.5, bodyBot - bodyTop);
        const cx = x + cw/2;
        return (
          <g key={i} opacity={i===visible.length-1 ? 1 : 0.8}>
            <line x1={cx} y1={sy(+c.high)} x2={cx} y2={sy(+c.low)} stroke={col} strokeWidth={1} />
            <rect x={x+(cw-bw)/2} y={bodyTop} width={bw} height={bh} fill={col} rx={0.5}
              style={i===visible.length-1 ? {filter:`drop-shadow(0 0 3px ${col})`} : {}} />
          </g>
        );
      })}
      {signal && signal.label !== "HOLD" && visible.length > 0 && (() => {
        const last = visible[visible.length-1];
        const cx = padL + (visible.length-1)*cw + cw/2;
        const isBuy = signal.label === "BUY";
        const cy = isBuy ? sy(+last.low)+10 : sy(+last.high)-10;
        const col = isBuy ? C.bull : C.bear;
        return (
          <g>
            <circle cx={cx} cy={cy} r={5} fill={col} style={{filter:`drop-shadow(0 0 5px ${col})`}} />
            <text x={cx} y={isBuy ? cy+16 : cy-8} fill={col} fontSize={8} textAnchor="middle" style={mono} fontWeight={700}>
              {signal.label}
            </text>
          </g>
        );
      })()}
      {timeLabels.map((tl,i) => (
        <text key={i} x={tl.x} y={H-4} fill={C.muted} fontSize={8} textAnchor="middle" style={sans}>{tl.label}</text>
      ))}
    </svg>
  );
}

function SignalBadge({ label, prob, confidence, session }) {
  const col = label === "BUY" ? C.bull : label === "SELL" ? C.bear : C.neutral;
  const sessColor = { PRE:C.accent, RTH:C.bull, POST:C.neutral, CLOSED:C.muted }[session] || C.muted;
  return (
    <div style={{
      display:"flex", flexDirection:"column", alignItems:"center",
      padding:"14px 32px", borderRadius:10, border:`2px solid ${col}`,
      background:`${col}0e`, boxShadow:`0 0 20px ${col}33`,
      minWidth:180, animation:"pulse-ring 2s infinite",
    }}>
      <span style={{ ...mono, fontSize:30, fontWeight:800, color:col, letterSpacing:3 }}>{label}</span>
      <span style={{ ...sans, fontSize:11, color:C.muted, marginTop:4 }}>
        prob {(prob*100).toFixed(1)}% · conf {(confidence*100).toFixed(0)}%
      </span>
      {session && (
        <span style={{ ...mono, fontSize:10, color:sessColor, marginTop:4, letterSpacing:1 }}>
          ● {session}
        </span>
      )}
      <div style={{ marginTop:8, width:"100%", height:4, background:C.border, borderRadius:2, overflow:"hidden" }}>
        <div style={{ width:`${prob*100}%`, height:"100%", background:col, transition:"width 0.5s ease" }} />
      </div>
    </div>
  );
}

function Stat({ label, value, color }) {
  return (
    <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 14px", flex:"1 1 100px" }}>
      <div style={{ ...sans, fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>{label}</div>
      <div style={{ ...mono, fontSize:15, fontWeight:700, color: color||C.white }}>{value ?? "—"}</div>
    </div>
  );
}

const FEAT_INFO = {
  rsi:{label:"RSI (14)",desc:"Momentum oscillator — <30 oversold, >70 overbought"},
  sma5:{label:"SMA-5",desc:"5-bar simple moving average"},
  sma14:{label:"SMA-14",desc:"14-bar simple moving average"},
  momentum:{label:"Momentum",desc:"(close − SMA14) / SMA14"},
  vol_ratio:{label:"Vol Ratio",desc:"Current vs 14-bar avg volume"},
  body_pct:{label:"Body %",desc:"Candle body / full range"},
  upper_wick:{label:"Upper Wick",desc:"Upper shadow / full range"},
  lower_wick:{label:"Lower Wick",desc:"Lower shadow / full range"},
  volatility:{label:"Volatility",desc:"14-bar return std deviation"},
};

function FeaturePanel({ features }) {
  if (!features) return null;
  return (
    <div>
      {Object.entries(features).map(([k,v]) => {
        const info = FEAT_INFO[k] || { label:k, desc:"" };
        const norm = Math.min(1, Math.abs(+v) / (k==="rsi" ? 100 : k.includes("sma") ? Math.abs(+v)*2 : 1));
        return (
          <div key={k} style={{ marginBottom:8 }}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, marginBottom:3 }}>
              <span style={{ ...sans, color:C.text }}>{info.label}</span>
              <span style={{ ...mono, color:C.accent }}>{typeof v==="number" ? v.toFixed(4) : v}</span>
            </div>
            <div style={{ background:C.border, borderRadius:3, height:5 }}>
              <div style={{ width:`${norm*100}%`, height:"100%", background:`linear-gradient(90deg,${C.accent},${C.bull})`, transition:"width 0.6s" }} />
            </div>
            <div style={{ ...sans, fontSize:9, color:C.muted, marginTop:2 }}>{info.desc}</div>
          </div>
        );
      })}
    </div>
  );
}

function HistoryTable({ history }) {
  if (!history.length) return <div style={{ color:C.muted, fontSize:12, padding:"12px 0" }}>No signals yet…</div>;
  return (
    <div style={{ overflowX:"auto" }}>
      <table style={{ fontSize:12 }}>
        <thead>
          <tr>
            {["Time","Ticker","Close","Signal","Prob","Conf","Session"].map(h => (
              <th key={h} style={{ ...sans, color:C.muted, fontWeight:500, borderBottom:`1px solid ${C.border}` }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {history.map((r,i) => {
            const col = SIG_COLOR[r.label] || C.neutral;
            return (
              <tr key={i} style={{ opacity: 1 - i*0.06, animation:"fadeIn 0.3s ease" }}>
                <td style={{ ...mono, color:C.muted, fontSize:11 }}>{r.ts}</td>
                <td style={{ ...mono, color:C.accent }}>{r.ticker}</td>
                <td style={{ ...mono }}>${r.close}</td>
                <td style={{ ...mono, color:col, fontWeight:700 }}>{r.label}</td>
                <td style={{ ...mono }}>{(r.prob*100).toFixed(1)}%</td>
                <td style={{ ...mono }}>{(r.confidence*100).toFixed(0)}%</td>
                <td style={{ ...mono, color:C.muted, fontSize:10 }}>{r.session||"—"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Trade modal ───────────────────────────────────────────────────────────
function TradeModal({ trade, onClose, onSuccess }) {
  const [qty, setQty]           = React.useState(1);
  const [lmt, setLmt]           = React.useState(
    trade.suggested_price
      || (trade.action === "SELL"
          ? (trade.premium_collected != null ? +(trade.premium_collected / 100).toFixed(2) : trade.bid)
          : (trade.cost_per_contract  != null ? +(trade.cost_per_contract  / 100).toFixed(2) : trade.ask))
      || 0
  );
  const [loading, setLoading]   = React.useState(false);
  const [result, setResult]     = React.useState(null);
  const [error, setError]       = React.useState(null);
  const isCSP = trade.action === "SELL";

  const submit = async () => {
    setLoading(true); setError(null);
    try {
      const d = await apiFetch("/orders/place", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          ticker:      trade.ticker,
          expiry:      trade.expiry,
          strike:      trade.strike,
          right:       trade.right,
          action:      trade.action,
          quantity:    qty,
          limit_price: parseFloat(lmt),
        }),
      });
      setResult(d);
      if (onSuccess) onSuccess(d);
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", display:"flex",
      alignItems:"center", justifyContent:"center", zIndex:1000 }}>
      <Card style={{ width:500, maxWidth:"95vw", animation:"fadeIn 0.2s ease" }}>
        {/* Header */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <span style={{ ...mono, fontSize:13, color:C.accent, fontWeight:700, letterSpacing:1 }}>
            {isCSP ? "SELL PUT — Cash-Secured" : "BUY CALL — LEAP"} · PAPER
          </span>
          <button onClick={onClose} style={{ background:"none", border:"none", color:C.muted, fontSize:20, cursor:"pointer", lineHeight:1 }}>×</button>
        </div>

        {/* Contract summary */}
        <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14 }}>
          {[
            ["Ticker",  trade.ticker,                          C.accent],
            ["Strike",  fmt$(trade.strike),                    null],
            ["Expiry",  trade.expiry,                          C.muted],
            ["DTE",     `${trade.dte}d`,                       C.muted],
            ["Stock $", fmt$(trade.stock_price),               null],
            ["Delta",   trade.delta != null ? fmtN(trade.delta,3) : "—", null],
          ].map(([l,v,c]) => <Stat key={l} label={l} value={v} color={c} />)}
        </div>

        {/* Return / risk preview */}
        {isCSP ? (
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14 }}>
            {[
              ["Wkly Return",    fmtP(trade.weekly_return_pct), C.bull],
              ["Premium × qty",  fmt$(parseFloat(lmt) * 100 * qty), C.bull],
              ["Cash Required",  fmt$(trade.strike * 100 * qty), C.bear],
            ].map(([l,v,c]) => <Stat key={l} label={l} value={v} color={c} />)}
          </div>
        ) : (
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14 }}>
            {[
              ["Max Risk",   fmt$(parseFloat(lmt) * 100 * qty), C.bear],
              ["IV %",       trade.iv_pct ? fmtP(trade.iv_pct) : "—", null],
            ].map(([l,v,c]) => <Stat key={l} label={l} value={v} color={c} />)}
          </div>

// ── Recommendation filters ────────────────────────────────────────────────
function filterCSP(candidates) {
  // Mirrors backend _filter_csp_recommended:
  //   iv_rank >= 50 (IV_RANK_MIN_CSP), score >= 70, liquidity >= 50,
  //   all three SMA trend gates (None = benefit of doubt; only False = rejected),
  //   earnings > 28d (EARNINGS_BLOCK_DAYS * 2 = 14 * 2).
  //   Informational warnings (e.g. earnings 29-30d) show as badges but do NOT block Recommended.
  //   Only warnings tagged "excl. recommended" are hard blocks.
  const clean = candidates.filter(r =>
    !(r.warnings || []).some(w => w.includes("excl. recommended")) &&
    r.liquidity_score >= 50 &&
    r.iv_rank >= 50 &&
    r.score >= 70 &&
    r.above_sma20  !== false &&
    r.above_sma50  !== false &&
    r.above_sma200 !== false &&
    (r.earnings_days_out == null || r.earnings_days_out > 28)
  );
  // Best 1 per ticker (already sorted by score desc)
  const seen = new Set();
  return clean.filter(r => { if (seen.has(r.ticker)) return false; seen.add(r.ticker); return true; });
}

function filterLEAP(candidates) {
  // Mirrors backend _filter_leap_recommended:
  //   liquidity >= 60, iv_rank <= 75 (don't overpay for elevated vol on long calls).
  //   Only "excl. recommended" warnings block; informational warnings show as badges.
  const clean = candidates.filter(r =>
    !(r.warnings || []).some(w => w.includes("excl. recommended")) &&
    r.liquidity_score >= 60 &&
    (r.iv_rank == null || r.iv_rank <= 75)
  );
  const seen = new Set();
  return clean.filter(r => { if (seen.has(r.ticker)) return false; seen.add(r.ticker); return true; });
}

        </Card>

      {/* Live quote panel */}
      {selected && (
        <Card style={{ marginTop:14 }}>

          </SectionTitle>

            <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>

                ["Delta",  fmtN(quote.delta,4)],
                ["Gamma",  fmtN(quote.gamma,5)],

  );
}

// ── Signals Tab ───────────────────────────────────────────────────────────
function SignalsTab({ connected }) {
  const [status, setStatus]       = useState({ connected:false, error:null, model_accuracy:null });
  const [tickers]                  = useState(["AAPL","MSFT","NVDA","SPY"]);
  const [activeTicker, setActive]  = useState("AAPL");
  const [signals, setSignals]      = useState({});
  const [bars, setBars]            = useState({});
  const [history, setHistory]      = useState([]);
  const [newTicker, setNewTicker]  = useState("");
  const [customTickers, setCustom] = useState([]);
  const prevSigRef                 = useRef({});
  const allTickers                 = [...tickers, ...customTickers];

  const refresh = useCallback(async () => {
    try {
      const [st, sigs] = await Promise.all([apiFetch("/status"), apiFetch("/signals")]);
      setStatus(st);
      setSignals(sigs);
      try {
        const b = await apiFetch(`/bars/${activeTicker}?limit=80`);
        setBars(prev => ({ ...prev, [activeTicker]: b }));
      } catch(_) {}
      Object.entries(sigs).forEach(([ticker, sig]) => {
        const prev = prevSigRef.current[ticker];
        if (!prev || prev.timestamp !== sig.timestamp) {
          setHistory(h => [{ ts:new Date(sig.timestamp).toLocaleTimeString(), ticker, ...sig }, ...h].slice(0,50));
        }
      });
      prevSigRef.current = sigs;
    } catch(e) {
      setStatus(s => ({ ...s, connected:false, error:e.message }));
    }
  }, [activeTicker]);

  useEffect(() => { refresh(); const iv = setInterval(refresh,15000); return ()=>clearInterval(iv); }, [refresh]);

  const addTicker = async () => {
    const t = newTicker.trim().toUpperCase();
    if (!t || allTickers.includes(t)) return;
    try {
      await fetch(`${API}/add_ticker`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ticker:t}) });
      setCustom(c => [...c, t]);
      setNewTicker("");
      setActive(t);
    } catch(e) { alert("Error: " + e.message); }
  };

  const retrain = async () => {
    try {
      const d = await apiFetch(`/retrain/${activeTicker}`, { method:"POST" });
      alert(`Retrained on ${activeTicker}  accuracy=${(d.accuracy*100).toFixed(1)}%`);
      setStatus(s => ({ ...s, model_accuracy:d.accuracy }));
    } catch(e) { alert("Retrain failed: " + e.message); }
  };

  const activeSig  = signals[activeTicker];
  const activeBars = bars[activeTicker];

  return (
    <div>
      {/* Status bar */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8, marginBottom:14 }}>
        <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
          <StatusPill connected={status.connected} error={status.error} />
          <OPRAPill opraActive={status.opra_active} onRecheck={v => setStatus(s => ({...s, opra_active: v}))} />
        </div>
        <div style={{ display:"flex", gap:12, alignItems:"center" }}>
          {status.model_accuracy && (
            <span style={{ ...mono, fontSize:10, color:C.muted }}>
              model acc {(status.model_accuracy*100).toFixed(1)}%
            </span>
          )}
          {status.error && <span style={{ ...sans, fontSize:10, color:C.bear }}>{status.error}</span>}
        </div>
      </div>

      {/* Ticker tabs */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:14, alignItems:"center" }}>
        {allTickers.map(t => (
          <button key={t} onClick={() => setActive(t)} style={{
            ...mono, fontSize:12, padding:"6px 14px", borderRadius:6, cursor:"pointer",
            background: activeTicker===t ? C.accent : C.card,
            color: activeTicker===t ? C.bg : C.muted,
            border:`1px solid ${activeTicker===t ? C.accent : C.border}`,
            fontWeight: activeTicker===t ? 700 : 400, transition:"all 0.15s",
          }}>{t}</button>
        ))}
        <div style={{ display:"flex", gap:6, marginLeft:4 }}>
          <input value={newTicker} onChange={e=>setNewTicker(e.target.value.toUpperCase())}
            onKeyDown={e=>e.key==="Enter"&&addTicker()} placeholder="+ Ticker"
            style={{ ...mono, fontSize:12, padding:"6px 10px", borderRadius:6, width:90,
              background:C.card, border:`1px solid ${C.border}`, color:C.white, outline:"none" }} />
          <Btn onClick={addTicker}>Add</Btn>
        </div>
      </div>

      {/* Chart */}
      <Card style={{ marginBottom:14 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
          <span style={{ ...mono, fontSize:12, color:C.accent }}>{activeTicker} · 5-min bars</span>
          <div style={{ display:"flex", gap:8 }}>
            <Btn onClick={refresh}>↻ Refresh</Btn>
            <Btn onClick={retrain} color={C.neutral}>Retrain</Btn>
          </div>
        </div>
        <CandleChart bars={activeBars} signal={activeSig} />
      </Card>

      {/* Stats */}
      {activeSig && (
        <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:14 }}>
          <Stat label="Last Close" value={`$${activeSig.close}`} />
          <Stat label="RSI (14)"   value={activeSig.features?.rsi?.toFixed(2)}
            color={activeSig.features?.rsi<30?C.bull:activeSig.features?.rsi>70?C.bear:C.white} />
          <Stat label="Momentum"   value={`${((activeSig.features?.momentum||0)*100).toFixed(2)}%`}
            color={(activeSig.features?.momentum||0)>0?C.bull:C.bear} />
          <Stat label="Vol Ratio"  value={activeSig.features?.vol_ratio?.toFixed(2)} />
          <Stat label="Volatility" value={`${((activeSig.features?.volatility||0)*100).toFixed(3)}%`} />
          <Stat label="Session"    value={activeSig.session||"—"} color={
            {PRE:C.accent,RTH:C.bull,POST:C.neutral,CLOSED:C.muted}[activeSig.session]||C.muted
          } />
        </div>
      )}

      {/* Signal + features */}
      <div style={{ display:"flex", gap:14, flexWrap:"wrap", marginBottom:14 }}>
        <Card style={{ flex:"0 0 auto", display:"flex", flexDirection:"column", alignItems:"center", gap:14, minWidth:200 }}>
          <SectionTitle>Model Signal</SectionTitle>
          {activeSig
            ? <SignalBadge {...activeSig} />
            : <div style={{ color:C.muted, fontSize:12 }}>No signal yet</div>}
        </Card>
        <Card style={{ flex:1, minWidth:240 }}>
          <SectionTitle>Feature Values</SectionTitle>
          <FeaturePanel features={activeSig?.features} />
        </Card>
      </div>

      {/* History */}
      <Card>
        <SectionTitle>Signal History</SectionTitle>
        <HistoryTable history={history} />
      </Card>
    </div>
  );
}

// ── CSP-Leap Trader Tab ───────────────────────────────────────────────────
function AutoTraderTab() {
  const [status,      setStatus]     = useState(null);
  const [saving,      setSaving]     = useState(false);
  const [running,     setRunning]    = useState(false);
  const [reconnMode,  setReconn]     = useState(null);
  const [acctSummary, setAcctSummary] = useState(null);
  const [cfg, setCfg] = useState({
    max_positions:      5,
    profit_target_pct:  0.50,
    stop_loss_mult:     2.0,
    scan_types:         ["csp"],
    csp_capital:        20000,
    leap_capital:       5000,
    use_kelly:          true,
    total_capital:      100000,
    auto_hedge:         false,
    hedge_threshold:    100,
    tape_filter_enabled: true,
  });
  const [tapeSentiment, setTapeSentiment] = useState({});

  const load = async (syncConfig = false) => {
    try {
      const d = await apiFetch("/autotrader/status");
      setStatus(d);
      if (syncConfig) setCfg(prev => ({ ...prev, ...(d.config || {}) }));
    } catch(_) {}
  };

  const loadAcct = async () => {
    try {
      const d = await apiFetch("/account/summary");
      setAcctSummary(d);
    } catch(_) {}
  };

  const loadTapeSentiment = async () => {
    try {
      const d = await apiFetch("/tape/sentiment");
      setTapeSentiment(d || {});
    } catch(_) {}
  };

  useEffect(() => {
    load(true);  // sync config once on mount
    loadAcct();  // fetch account summary immediately
    loadTapeSentiment();
    const id  = setInterval(() => load(false), 8000);   // poll status — never overwrite user edits
    const id2 = setInterval(() => loadAcct(), 30000);   // refresh account every 30 s
    const id3 = setInterval(() => loadTapeSentiment(), 30000);  // refresh tape sentiment every 30 s
    return () => { clearInterval(id); clearInterval(id2); clearInterval(id3); };
  }, []);

  const saveConfig = async (enabled) => {
    setSaving(true);
    try {
      await apiFetch("/autotrader/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...cfg, enabled: enabled ?? status?.enabled ?? false }),
      });
      await load(true);  // sync config from server after save to confirm what was stored
    } finally { setSaving(false); }
  };

  const runNow = async () => {
    setRunning(true);
    try {
      await apiFetch("/autotrader/run-now", { method: "POST" });
      await load();
    } catch(e) { alert("Run failed: " + e.message); }
    finally { setRunning(false); }
  };

  const clearStalePositions = async () => {
    if (!window.confirm("This will remove all Inactive-order positions from the tracking dict so the CSP-Leap Trader can place fresh orders. Proceed?")) return;
    try {
      const r = await apiFetch("/autotrader/clear-stale-positions", { method: "POST" });
      alert(`Cleared ${r.removed.length} stale positions.\nKept: ${r.kept.length}\n\n${r.message}`);
      await load();
    } catch(e) { alert("Clear failed: " + e.message); }
  };

  const cleanupJournal = async () => {
    if (!window.confirm("Mark all phantom open journal entries (not tracked by CSP-Leap Trader and older than 24h) as orphaned. These entries will be closed with no P&L and excluded from stats. Proceed?")) return;
    try {
      const r = await apiFetch("/journal/cleanup", { method: "POST" });
      alert(`Journal cleanup complete.\nOrphaned entries closed: ${r.orphaned}\nActive tracked: ${r.active_tracked}\n\n${r.message}`);
    } catch(e) { alert("Cleanup failed: " + e.message); }
  };

  const enabled    = status?.enabled || false;
  const positions  = status?.positions || {};
  const untracked  = status?.untracked_positions || [];
  const stoppedOut = status?.stopped_out || {};
  const actLog     = [...(status?.log || [])].reverse();

  const inp = (extra={}) => ({
    style: { width:"100%", padding:"6px 10px", borderRadius:6,
      background:C.card, border:`1px solid ${C.border}`, color:C.text, fontSize:13, ...extra.style },
    ...extra,
  });
  const toggleScan = (type, checked) => {
    const cur = cfg.scan_types || [];
    setCfg({ ...cfg, scan_types: checked ? [...cur, type] : cur.filter(x => x !== type) });
  };

  // Kelly fraction display
  const kellyFrac = (() => {
    const p  = (status?.config?.assumed_win_rate) || 0.85;  // system-managed
    const pt = cfg.profit_target_pct ?? 0.50;
    const sl = cfg.stop_loss_mult ?? 2.0;
    const b  = pt / (sl > 0 ? sl : 5.0);
    const k  = (p * (b + 1) - 1) / b;
    return Math.max(0.02, k * 0.5);
  })();
  // Kelly base = strategy capital (not total portfolio)
  const kellyCspCapital  = Math.round((cfg.csp_capital  || 20000)  * kellyFrac);
  const kellyLeapCapital = Math.round((cfg.leap_capital || 5000)   * kellyFrac);
  const kellyCapital = kellyCspCapital;  // backward compat for display cards below

  const reconnect = async (port) => {
    setReconn(port);
    try {
      const r = await apiFetch("/reconnect", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ port }),
      });
      alert(r.message);
      await load();
    } catch(e) { alert("Reconnect failed: " + e.message); }
    finally { setReconn(null); }
  };

  return (
    <div style={{ padding:"16px 0" }}>

      {/* Toggle + Run Now + Account Mode */}
      <div style={{ display:"flex", gap:12, alignItems:"center", flexWrap:"wrap", marginBottom:20 }}>
        <button onClick={() => saveConfig(!enabled)} disabled={saving} style={{
          background: enabled ? "#c0392b" : "#27ae60", color:"#fff",
          border:"none", borderRadius:8, padding:"10px 28px", fontWeight:700,
          fontSize:15, cursor:"pointer", opacity: saving ? 0.6 : 1,
        }}>
          {enabled ? "STOP CSP-Leap" : "START CSP-Leap"}
        </button>
        <button onClick={runNow} disabled={running} style={{
          background:"#2980b9", color:"#fff", border:"none", borderRadius:8,
          padding:"10px 22px", fontWeight:600, cursor:"pointer", opacity: running ? 0.6 : 1,
        }}>
          {running ? "Running…" : "Run Now"}
        </button>
        <button onClick={clearStalePositions} style={{
          background:"#8e44ad", color:"#fff", border:"none", borderRadius:8,
          padding:"8px 16px", fontSize:12, cursor:"pointer",
        }} title="Remove Inactive-order positions from tracking dict so fresh orders can be placed">
          Clear Stale Positions
        </button>
        <button onClick={cleanupJournal} style={{
          background:"#475569", color:"#fff", border:"none", borderRadius:8,
          padding:"8px 16px", fontSize:12, cursor:"pointer",
        }} title="Mark phantom open journal entries as closed (safe, display only)">
          Fix Journal
        </button>
        <button onClick={async () => {
          try {
            const r = await fetch("/ibkr/reconcile", {method:"POST"});
            const d = await r.json();
            alert(d.message || "Reconciliation triggered — check Telegram");
          } catch(e) { alert("Reconcile failed: " + e); }
        }} style={{
          background:"#0f766e", color:"#fff", border:"none", borderRadius:8,
          padding:"8px 16px", fontSize:12, cursor:"pointer",
        }} title="Compare IBKR portfolio against all strategy states; alerts on Telegram">
          Reconcile IBKR
        </button>
        <button onClick={() => reconnect(7497)} disabled={!!reconnMode} style={{
          background:"#7f8c8d", color:"#fff", border:"none", borderRadius:8,
          padding:"8px 16px", fontSize:13, cursor:"pointer",
        }}>Paper (7497)</button>
        <button onClick={() => reconnect(7496)} disabled={!!reconnMode} style={{
          background:"#e67e22", color:"#fff", border:"none", borderRadius:8,
          padding:"8px 16px", fontSize:13, cursor:"pointer", fontWeight:700,
        }}>LIVE (7496)</button>
        <span style={{ fontWeight:700, color: enabled ? "#16a34a" : "#94a3b8", fontSize:14 }}>
          {enabled ? "ACTIVE — scanning every 5 min" : "INACTIVE"}
        </span>
        {status?.last_run && <span style={{ color:"#64748b", fontSize:12 }}>
          last: {(() => {
            const d = new Date(status.last_run);
            return d.toLocaleString("en-US", {month:"short",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
          })()}
        </span>}
      </div>

      {/* Account Summary Panel */}
      {acctSummary && (() => {
        const fmt = (v) => v == null ? "—" : "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
        const pnlColor = (v) => v == null ? "#94a3b8" : v >= 0 ? "#27ae60" : "#e74c3c";
        const cells = [
          { label:"Account",        value: acctSummary.account || "—",        color:"#f1c40f", mono:true },
          { label:"Net Liq",        value: fmt(acctSummary.net_liquidation),   color:"#ecf0f1" },
          { label:"Total Cash",     value: fmt(acctSummary.total_cash),        color:"#27ae60" },
          { label:"Avail Funds",    value: fmt(acctSummary.available_funds),   color:"#2ecc71" },
          { label:"Invested",       value: fmt(acctSummary.gross_position_value), color:"#3498db" },
          { label:"Unrealized P&L", value: fmt(acctSummary.unrealized_pnl),   color: pnlColor(acctSummary.unrealized_pnl) },
          { label:"Realized P&L",   value: fmt(acctSummary.realized_pnl),     color: pnlColor(acctSummary.realized_pnl) },
          { label:"Buying Power",   value: fmt(acctSummary.buying_power),     color:"#9b59b6" },
        ];
        return (
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:20,
                        background:"#0f172a", border:"1px solid #1e293b", borderRadius:10, padding:"12px 16px" }}>
            {cells.map(c => (
              <div key={c.label} style={{ display:"flex", flexDirection:"column", alignItems:"center",
                                          minWidth:110, flex:"1 1 110px" }}>
                <span style={{ fontSize:10, color:"#64748b", textTransform:"uppercase", letterSpacing:1, marginBottom:3 }}>
                  {c.label}
                </span>
                <span style={{ fontSize:13, fontWeight:700, color:c.color,
                               fontFamily: c.mono ? "monospace" : "inherit" }}>
                  {c.value}
                </span>
              </div>
            ))}
            <div style={{ display:"flex", alignItems:"flex-end", paddingBottom:2 }}>
              <button onClick={loadAcct} title="Refresh account data" style={{
                background:"transparent", border:"1px solid #334155", borderRadius:6,
                color:"#64748b", fontSize:11, padding:"3px 8px", cursor:"pointer",
              }}>↻</button>
            </div>
          </div>
        );
      })()}


      {/* Multi-strategy budget */}
      {(status?.premium_collected > 0 || status?.leap_budget > 0) && (
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:20 }}>
          {(() => {
            const leapPnl = status?.leap_pnl || 0;
            const leapPnlCol = leapPnl >= 0 ? "#27ae60" : "#e74c3c";

              { label:"Premium Collected", value:`$${(status?.premium_collected||0).toFixed(0)}`, col:"#27ae60", sub:null },
              { label:"LEAP Budget (net)", value:`$${(status?.leap_budget||0).toFixed(0)}`, col:"#3498db",
                sub: leapPnl !== 0 ? { text:`LEAP P&L: ${leapPnl>=0?"+":""}$${leapPnl.toFixed(0)}`, col:leapPnlCol } : null },
            ].map(s => (
              <div key={s.label} style={{ background:C.card, borderRadius:8, padding:14, textAlign:"center" }}>
                <div style={{ color:"#64748b", fontSize:11, marginBottom:6 }}>{s.label}</div>
                <div style={{ color:s.col, fontWeight:700, fontSize:20 }}>{s.value}</div>
                {s.sub && <div style={{ color:s.sub.col, fontSize:11, marginTop:4 }}>{s.sub.text}</div>}
              </div>
            ));
          })()}
        </div>
      )}

      {/* Config card */}
      <Card title="Configuration" style={{ marginBottom:20 }}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(190px, 1fr))", gap:14 }}>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Max Positions
            <input type="number" min={1} max={20} value={cfg.max_positions}
              onChange={e => setCfg({ ...cfg, max_positions: +e.target.value })} {...inp()} />
          </label>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Profit Target %
            <input type="number" min={10} max={90} step={5}
              value={Math.round((cfg.profit_target_pct ?? 0.50) * 100)}
              onChange={e => setCfg({ ...cfg, profit_target_pct: +e.target.value / 100 })} {...inp()} />
          </label>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Stop Loss (× premium, 0=hold-to-expiry)
            <input type="number" min={0} max={10} step={0.5} value={cfg.stop_loss_mult}
              onChange={e => setCfg({ ...cfg, stop_loss_mult: +e.target.value })} {...inp()} />
          </label>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Total Capital ($)
            <input type="number" min={10000} step={10000} value={cfg.total_capital}
              onChange={e => setCfg({ ...cfg, total_capital: +e.target.value })} {...inp()} />
            <span style={{ fontSize:10, color:"#94a3b8" }}>Used by Kelly formula for position sizing</span>
          </label>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            CSP Capital ($)
            <input type="number" min={5000} step={5000} value={cfg.csp_capital}
              onChange={e => setCfg({ ...cfg, csp_capital: +e.target.value })} {...inp()} />
            <span style={{ fontSize:10, color:"#94a3b8" }}>CSP deployment budget · Kelly base for short puts</span>
          </label>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            LEAP Capital ($)
            <input type="number" min={1000} step={1000} value={cfg.leap_capital}
              onChange={e => setCfg({ ...cfg, leap_capital: +e.target.value })} {...inp()} />
            <span style={{ fontSize:10, color:"#94a3b8" }}>LEAP deployment budget · Kelly base for long calls</span>
          </label>
          <div style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Kelly Win Rate
            <div style={{ padding:"6px 10px", borderRadius:6, background:C.card,
              border:`1px solid ${C.border}`, fontSize:13, color:C.text, display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontWeight:700, color:"#7c3aed" }}>
                {Math.round(((status?.config?.assumed_win_rate)||0.85)*100)}%
              </span>
              <span style={{ fontSize:11, color:"#94a3b8" }}>auto-calibrated · read-only</span>
            </div>
            <span style={{ fontSize:11, color:"#94a3b8" }}>
              Updates from real closed trades (min 10). Prior: 85% (Tastytrade research).
            </span>
          </div>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Hedge Threshold (delta)
            <input type="number" min={25} max={500} step={25} value={cfg.hedge_threshold}
              onChange={e => setCfg({ ...cfg, hedge_threshold: +e.target.value })} {...inp()} />

        </div>

        {/* Toggles row */}
        <div style={{ display:"flex", gap:24, marginTop:16, flexWrap:"wrap" }}>
          {[
            { key:"use_kelly",          label:"Kelly Sizing",     sub:`CSP ~$${kellyCspCapital.toLocaleString()} · LEAP ~$${kellyLeapCapital.toLocaleString()}` },
            { key:"auto_hedge",         label:"Auto-Hedge",        sub:"SPY option when delta > threshold" },
            { key:"tape_filter_enabled", label:"Tape CVD Filter",   sub:"Block entries when order flow is bearish" },
          ].map(t => (
            <label key={t.key} style={{ display:"flex", flexDirection:"column", gap:3, cursor:"pointer" }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <input type="checkbox" checked={!!cfg[t.key]}
                  onChange={e => setCfg({ ...cfg, [t.key]: e.target.checked })} />
                <span style={{ color:"#ddd", fontWeight:600, fontSize:13 }}>{t.label}</span>
              </div>
              <span style={{ color:"#64748b", fontSize:11, marginLeft:22 }}>{t.sub}</span>
            </label>
          ))}
          <div style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Scan Types
            <div style={{ display:"flex", gap:16 }}>
              {["csp","leap"].map(t => (
                <label key={t} style={{ display:"flex", alignItems:"center", gap:6, color:C.text, cursor:"pointer" }}>
                  <input type="checkbox"
                    checked={(cfg.scan_types||[]).includes(t)}
                    onChange={e => toggleScan(t, e.target.checked)} />
                  {t.toUpperCase()}
                </label>
              ))}
            </div>
          </div>
        </div>

        <button onClick={() => saveConfig()} disabled={saving} style={{
          marginTop:14, background:"#0078d4", color:"#fff", border:"none", borderRadius:6,
          padding:"8px 20px", cursor:"pointer", fontSize:13,
        }}>
          {saving ? "Saving…" : "Save Config"}
        </button>

        {/* Kelly info box */}
        <div style={{ marginTop:12, padding:"10px 14px", background:C.card,
          borderRadius:6, fontSize:12, color:"#64748b", lineHeight:1.7 }}>
          <strong style={{color:"#d97706"}}>Half-Kelly sizing:</strong>{" "}
          win rate <strong>{Math.round(((status?.config?.assumed_win_rate)||0.85)*100)}%</strong> (auto-calibrated),
          profit/loss ratio {(cfg.stop_loss_mult ?? 2.0) > 0 ? ((cfg.profit_target_pct??0.50)/(cfg.stop_loss_mult??2.0)).toFixed(3) : "∞ (no stop)"} →
          Kelly fraction {(kellyFrac*100).toFixed(1)}% of CSP budget ${(cfg.csp_capital||20000).toLocaleString()}
          = <strong style={{color:C.text}}>${kellyCspCapital.toLocaleString()} per CSP trade</strong>
          · LEAP: {(kellyFrac*100).toFixed(1)}% of ${(cfg.leap_capital||5000).toLocaleString()} = ${kellyLeapCapital.toLocaleString()}/trade.
          {" "}Exit rules: 50% profit target · IV-adjusted stop · roll at 21 DTE · 48h cooldown.
        </div>
      </Card>

      {/* Tape Sentiment grid — live CVD scores for subscribed tickers */}

          <div style={{ ...sans, fontSize:11, color:C.muted, marginBottom:12 }}>
            Real-time order-flow scores from IBKR reqMktData (tick 233+375) · refreshes every 30s
            {!cfg.tape_filter_enabled && (
              <span style={{ marginLeft:10, color:"#f59e0b", fontWeight:600 }}>
                ⚠ Tape CVD Filter is OFF — scores collected but not blocking trades
              </span>
            )}
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:12 }}>
            {Object.entries(tapeSentiment).map(([sym, s]) => {
              const scoreColor = !s.fresh ? C.muted
                : s.label.includes("STRONGLY BULL") ? "#4ade80"
                : s.label.includes("BULL") ? "#86efac"
                : s.label.includes("STRONGLY BEAR") ? "#f87171"
                : s.label.includes("BEAR") ? "#fca5a5"
                : C.muted;
              const bg = !s.fresh ? "#1e293b"
                : s.label.includes("BULL") ? "#14532d22"
                : s.label.includes("BEAR") ? "#450a0a22"
                : "#1e293b";
              const barWidth = `${Math.round(Math.abs(s.score || 0) * 50)}%`;
              const barColor = (s.score || 0) >= 0 ? "#22c55e" : "#ef4444";
              return (
                <div key={sym} style={{ background:bg, border:`1px solid ${C.border}`,
                  borderRadius:8, padding:"10px 14px", minWidth:160, maxWidth:200 }}>

                    {s.label || "NEUTRAL"}

                  <div style={{ marginTop:6, fontSize:13, color:scoreColor, fontFamily:"monospace" }}>
                    {(s.score || 0) >= 0 ? "+" : ""}{(s.score || 0).toFixed(3)}
                  </div>
                  {/* Score bar: center = 0, left = bearish, right = bullish */}
                  <div style={{ marginTop:6, height:4, background:"#334155", borderRadius:2, position:"relative" }}>
                    <div style={{ position:"absolute",
                      left: (s.score || 0) >= 0 ? "50%" : `${50 - Math.round(Math.abs(s.score||0)*50)}%`,
                      width: barWidth, height:"100%", background:barColor, borderRadius:2 }} />

                  <div style={{ marginTop:6, display:"flex", gap:6, fontSize:10, color:C.muted, flexWrap:"wrap" }}>

                    <span>mag {(s.components?.vol_mag||0)>=0?"+":""}{(s.components?.vol_mag||0).toFixed(2)}</span>
                    {(s.components?.div_mult||1) < 1 && (
                      <span style={{ color:"#f59e0b" }}>⚠div×0.5</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      )}

      {/* Managed positions */}
      {Object.keys(positions).length > 0 && (
        <Card title={`Managed Positions (${Object.keys(positions).length})`} style={{ marginBottom:20 }}>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
              <thead>
                <tr style={{ color:C.muted, borderBottom:`1px solid ${C.border}` }}>
                  {["Ticker","Type","Strike","Expiry / DTE","Qty","Entry","Target / Cost","Stop","Live P&L","Progress","Placed",""].map(h =>
                    <th key={h} style={{ padding:"6px 10px", textAlign:"left", fontWeight:600, fontSize:11 }}>{h}</th>
                  )}
                </tr>
              </thead>
              <tbody>
                {Object.entries(positions).map(([key, p]) => {
                  const iv = p.live_iv || 0;
                  const cfgStop = cfg.stop_loss_mult ?? 2.0;
                  const stopMult = p.action === "SELL"
                    ? (cfgStop <= 0 ? 0 : iv > 70 ? 4.0 : iv > 40 ? 3.0 : cfgStop)
                    : (iv > 70 ? 0.40 : iv > 40 ? 0.50 : 0.60);
                  const stopLoss      = stopMult > 0 ? -(stopMult * (p.max_profit || 0)) : null;
                  const livePnl       = p.live_pnl;
                  const hasLive       = livePnl != null;
                  const pnlColor      = !hasLive ? C.muted
                                      : livePnl >= 0 ? C.bull : C.bear;
                  // Progress bar only for CSPs (SELL); LEAPs exit via stop-loss / 21 DTE only
                  const isLeap       = p.action === "BUY";
                  const profitTarget  = isLeap ? 0 : (cfg.profit_target_pct ?? 0.5) * (p.max_profit || 0);
                  const progress      = !isLeap && hasLive && profitTarget > 0
                                      ? Math.min(1, Math.max(0, livePnl / profitTarget))
                                      : null;
                  const progressColor = progress == null ? C.border
                                      : progress >= 1   ? "#d97706"
                                      : progress >= 0.5 ? C.bull
                                      : livePnl < 0     ? C.bear
                                      : C.accent;
                  // Parse expiry YYYYMMDD -> friendly date + live DTE
                  const expiryRaw = p.expiry || "";
                  let expiryFmt = expiryRaw, dte = null;
                  if (/^\d{8}$/.test(expiryRaw)) {
                    const yr = expiryRaw.slice(0,4), mo = expiryRaw.slice(4,6), dy = expiryRaw.slice(6,8);
                    const expDate = new Date(`${yr}-${mo}-${dy}T12:00:00`);
                    expiryFmt = expDate.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"});
                    dte = Math.ceil((expDate - new Date()) / 86400000);
                  }
                  const dteColor = dte == null ? C.muted : dte <= 7 ? C.bear : dte <= 21 ? "#f39c12" : C.muted;
                  return (
                  <tr key={key} style={{ borderBottom:`1px solid ${C.border}` }}>
                    <td style={{ padding:"7px 10px", fontWeight:700, color:C.text }}>{p.ticker}</td>
                    <td style={{ padding:"7px 10px", fontWeight:600,
                      color: p.right==="C" ? C.bull : p.right==="P" ? "#2563eb" : C.muted }}>
                      {strategyLabel(p)}
                    </td>
                    <td style={{ padding:"7px 10px", color:C.text }}>${p.strike}</td>
                    <td style={{ padding:"7px 10px", fontSize:11 }}>
                      <div style={{ color:C.text }}>{expiryFmt}</div>
                      {dte != null && <div style={{ color:dteColor, fontWeight: dte<=21?700:400 }}>{dte}d</div>}
                    </td>
                    <td style={{ padding:"7px 10px", color:C.text }}>{p.qty}</td>
                    <td style={{ padding:"7px 10px", color:C.muted }}>${(p.entry_price||0).toFixed(2)}</td>
                    <td style={{ padding:"7px 10px" }}>
                      {p.action === "SELL" ? (
                        // CSP: max_profit = premium collected (true max profit)
                        <span style={{ color:"#d97706", fontWeight:600 }}>${(p.max_profit||0).toFixed(0)}</span>
                      ) : (
                        // LEAP: no fixed profit target — exits via stop-loss or 21 DTE
                        <div>
                          <span style={{ color:"#3b82f6", fontWeight:600 }}>
                            ${(p.max_profit||0).toFixed(0)} cost
                          </span>
                          <div style={{ color:C.muted, fontSize:10 }}>
                            stop / 21d exit
                          </div>
                        </div>
                      )}
                    </td>
                    <td style={{ padding:"7px 10px" }}>
                      {stopLoss == null ? (
                        <span style={{ color:C.muted, fontSize:11 }}>hold-to-expiry</span>
                      ) : (
                        <>
                          <span style={{ color:C.bear, fontWeight:600 }}>-${Math.abs(stopLoss).toFixed(0)}</span>
                          <span style={{ color:C.muted, fontSize:10, marginLeft:3 }}>
                            {p.action === "SELL" ? `${stopMult}×` : `${Math.round(stopMult*100)}%`}
                          </span>
                        </>
                      )}
                    </td>
                    <td style={{ padding:"7px 10px" }}>
                      {hasLive
                        ? <span style={{ fontWeight:700, color:pnlColor }}>{livePnl >= 0 ? "+" : ""}${livePnl.toFixed(0)}</span>
                        : p.order_status === "pending"
                        ? <span style={{ color:"#f39c12", fontSize:11 }}>pending fill</span>
                        : <span style={{ color:C.muted }}>—</span>
                      }
                    </td>
                    <td style={{ padding:"7px 10px", minWidth:110 }}>
                      {progress != null ? (
                        <div>
                          <div style={{ fontSize:10, color:progressColor, fontWeight:700, marginBottom:2 }}>
                            {(progress*100).toFixed(0)}% of target{progress >= 1 && " ✓"}
                          </div>
                          <div style={{ height:5, borderRadius:3, background:C.border, overflow:"hidden" }}>
                            <div style={{
                              height:"100%", borderRadius:3,
                              width:`${Math.min(100,progress*100)}%`,
                              background: progressColor,
                              transition:"width 0.5s",
                            }}/>
                          </div>
                        </div>
                      ) : isLeap && hasLive ? (
                        /* LEAP: show distance-to-stop instead of a % target */
                        (() => {
                          const distToStop = stopLoss != null ? livePnl - stopLoss : null;
                          return distToStop != null ? (
                            <div style={{ fontSize:11 }}>
                              <span style={{ color: livePnl >= 0 ? C.bull : C.bear, fontWeight:700 }}>
                                {livePnl >= 0 ? "+" : ""}${livePnl.toFixed(0)}
                              </span>
                              <span style={{ color:C.muted }}> / buf ${distToStop.toFixed(0)}</span>
                            </div>
                          ) : <span style={{ color:pnlColor, fontWeight:700 }}>{livePnl>=0?"+":""}${livePnl.toFixed(0)}</span>;
                        })()
                      ) : p.order_status === "pending"
                        ? <span style={{ color:"#f39c12", fontSize:11 }}>⏳ order pending</span>
                        : <span style={{ color:C.muted, fontSize:11 }}>awaiting data</span>}
                    </td>
                    <td style={{ padding:"7px 10px", color:C.muted, fontSize:11 }}>{p.placed_at || "—"}</td>
                    <td style={{ padding:"7px 6px" }}>
                      <button
                        title="Manually close this position"
                        onClick={async () => {
                          if (!window.confirm(`Close ${p.ticker} ${p.strike} ${p.right} manually?`)) return;
                          try {
                            await apiFetch("/autotrader/close-position", {
                              method:"POST",
                              headers:{"Content-Type":"application/json"},
                              body: JSON.stringify({ key }),
                            });
                          } catch(e) { alert("Close failed: " + e.message); }
                        }}
                        style={{
                          fontSize:11, padding:"3px 8px", borderRadius:5,
                          background:"#fee2e2", color:"#b91c1c", border:`1px solid #fca5a5`,
                          cursor:"pointer", fontWeight:700,
                        }}
                      >Close</button>
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* Untracked / manual option positions */}
      {untracked.length > 0 && (
        <Card style={{ marginBottom:20, border:`1px solid #78350f`, background:"#1a1200" }}>
          <div style={{ ...sans, fontSize:11, fontWeight:700, color:"#d97706", marginBottom:10 }}>
            MANUAL / UNTRACKED POSITIONS ({untracked.length}) — in IBKR portfolio but not entered by CSP-Leap Trader
          </div>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
              <thead>
                <tr style={{ color:C.muted, borderBottom:`1px solid ${C.border}` }}>
                  {["Ticker","Type","Strike","Expiry","Qty","Avg Cost","Live P&L","Mkt Value"].map(h =>
                    <th key={h} style={{ padding:"5px 10px", textAlign:"left", fontWeight:600, fontSize:11 }}>{h}</th>
                  )}
                </tr>
              </thead>
              <tbody>
                {untracked.map((p, i) => {
                  const pnlColor = p.live_pnl > 0 ? C.bull : p.live_pnl < 0 ? C.bear : C.muted;
                  const expFmt = p.expiry ? `${p.expiry.slice(0,4)}-${p.expiry.slice(4,6)}-${p.expiry.slice(6,8)}` : "—";
                  return (
                    <tr key={i} style={{ borderBottom:`1px solid ${C.border}` }}>
                      <td style={{ padding:"6px 10px", fontWeight:700, color:C.text }}>{p.ticker}</td>
                      <td style={{ padding:"6px 10px", fontWeight:600,
                        color: p.right==="C" ? C.bull : "#2563eb" }}>
                        {p.action} {p.right==="C" ? "Call" : p.right==="P" ? "Put" : p.right}
                      </td>
                      <td style={{ padding:"6px 10px" }}>${p.strike}</td>
                      <td style={{ padding:"6px 10px", color:C.muted, fontSize:11 }}>{expFmt}</td>
                      <td style={{ padding:"6px 10px" }}>{p.qty}</td>
                      <td style={{ padding:"6px 10px", color:C.muted }}>${(p.avg_cost||0).toFixed(2)}</td>
                      <td style={{ padding:"6px 10px", fontWeight:700, color:pnlColor }}>
                        {p.live_pnl >= 0 ? "+" : ""}${(p.live_pnl||0).toFixed(0)}
                      </td>
                      <td style={{ padding:"6px 10px", color:C.muted }}>${(p.market_value||0).toFixed(0)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* Stop-loss cooldown tickers */}
      {Object.keys(stoppedOut).length > 0 && (
        <Card title={`48h Cooldown — Stopped-Out Tickers (${Object.keys(stoppedOut).length})`}
              style={{ marginBottom:20, border:"1px solid #e74c3c44", background:"#e74c3c08" }}>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
            {Object.entries(stoppedOut).map(([ticker, ts]) => {
              const elapsed = (Date.now() - new Date(ts + "Z").getTime()) / 3600000;
              const remaining = Math.max(0, 48 - elapsed);
              const pct = Math.min(1, elapsed / 48);
              return (
                <div key={ticker} style={{
                  padding:"8px 12px", borderRadius:8, border:"1px solid #e74c3c66",
                  background:"#e74c3c11", minWidth:130,
                }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
                    <span style={{ fontWeight:700, fontSize:13, color:"#e74c3c" }}>{ticker}</span>
                    <span
                      title="Clear cooldown — allow immediate re-entry"
                      onClick={async () => {
                        await apiFetch("/autotrader/clear-cooldown", {
                          method:"POST", headers:{"Content-Type":"application/json"},
                          body: JSON.stringify({ ticker }),
                        });
                        await load(false);  // refresh stopped_out map immediately
                      }}
                      style={{ cursor:"pointer", color:"#94a3b8", fontSize:14, fontWeight:700,
                               lineHeight:1, padding:"0 2px" }}
                    >×</span>
                  </div>
                  <div style={{ fontSize:11, color:"#64748b", marginTop:2 }}>
                    {remaining > 0
                      ? `${remaining.toFixed(1)}h remaining`
                      : "cooldown expired"}
                  </div>
                  <div style={{ marginTop:5, height:3, borderRadius:2, background:"#e2e8f0" }}>
                    <div style={{
                      height:"100%", borderRadius:2,
                      width:`${pct*100}%`,
                      background: remaining > 24 ? "#e74c3c" : remaining > 8 ? "#f39c12" : "#27ae60",
                    }}/>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ marginTop:8, fontSize:11, color:"#64748b" }}>
            Stop-loss or max-roll exit — blocked from re-entry for 48 hours to avoid chasing losing tickers.
          </div>
        </Card>
      )}

      {/* Activity log */}
      <Card title="Activity Log">
        {actLog.length === 0 ? (
          <div style={{ color:"#64748b", fontStyle:"italic" }}>
            No activity yet. Click "Run Now" or enable the CSP-Leap Trader.
          </div>
        ) : (
          <div style={{ maxHeight:320, overflowY:"auto", fontFamily:"'Fira Mono', monospace", fontSize:12 }}>
            {actLog.map((e, i) => {
              const col = (e.action==="ERROR"||e.action==="IBKR-ERR") ? "#e74c3c"
                        : (e.action==="TRADE"||e.action==="CLOSED")  ? "#27ae60"
                        : e.action==="CLOSE"                         ? "#f1c40f"
                        : e.action==="ROLL"                          ? "#3b82f6"
                        : e.action==="ROTATE"                        ? "#a855f7"
                        : e.action==="HEDGE"                         ? "#06b6d4"
                        : e.action==="LEARN"                         ? "#8b5cf6"
                        : e.action==="SYSTEM"                        ? "#9b59b6"
                        : e.action==="WARN"                          ? "#f39c12"
                        : e.action==="BUDGET"                        ? "#3b82f6"
                        : e.action==="SCAN"                          ? "#64748b"
                        : e.action==="SKIP"                          ? "#94a3b8"
                        : "#94a3b8";
              return (
                <div key={i} style={{ padding:"4px 6px", borderBottom:`1px solid ${C.border}`, color:col }}>
                  <span style={{ color:"#64748b" }}>[{e.time}]</span>
                  {" "}<strong>{e.action}</strong>: {e.detail}
                </div>
              );
            })}
          </div>
        )}
      </Card>
    </div>
  );
}

// ── Alert Backtest (Watchlist signal outcomes) ────────────────────────────
function AlertBacktestSection() {
  const [result,  setResult]  = useState(null);
  const [loading, setLoading] = useState(false);
  const [history, setHistory] = useState(null);

  const runBacktest = async () => {
    setLoading(true);
    try { setResult(await apiFetch("/backtest/watchlist")); }
    catch(e) { alert("Alert backtest failed: " + e.message); }
    finally { setLoading(false); }
  };

  const loadHistory = async () => {
    try { setHistory(await apiFetch("/alerts/history?limit=200")); }
    catch(_) {}
  };

  React.useEffect(() => { loadHistory(); }, []);

  const wrCol  = v => v == null ? C.muted : v >= 70 ? "#15803d" : v >= 60 ? "#16a34a" : v >= 50 ? "#f97316" : "#dc2626";
  const retCol = v => v == null ? C.muted : v > 0 ? "#16a34a" : v < 0 ? "#dc2626" : C.muted;
  const fmt    = v => v == null ? "—" : v.toFixed(1) + "%";
  const fmtR   = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";
  const TH = { padding:"6px 8px", textAlign:"left", fontWeight:600, color:C.muted,
               borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap", fontSize:11 };
  const TD = { padding:"5px 8px", fontSize:11 };

  const LAYER_META = [
    { key:"baseline",      label:"Baseline"    },
    { key:"regime",        label:"+Regime"     },
    { key:"rel_strength",  label:"+Rel Str"    },
    { key:"pullback",      label:"+Pullback"   },
    { key:"cvd_proxy",     label:"+CVD"        },
    { key:"close_quality", label:"+Quality"    },
    { key:"with_stops",    label:"+5% Stop"    },
  ];

  const os = result?.outcome_summary || {};
  const allOs = os.all || {};
  const boOs  = os.breakout || {};
  const preOs = os.pre_breakout || {};

  return (
    <div style={{ marginTop: 28 }}>
      <Card title="Backtest My Alerts — Real Outcomes + Filter Analysis">
        <div style={{ fontSize:12, color:C.muted, marginBottom:14 }}>
          <b>Part 1</b>: computes the actual forward return of every breakout alert that
          was generated (from the alert price). Shows true paper-trading performance of
          each signal. <b>Part 2</b>: 6-filter walk-forward analysis on all alerted
          tickers — shows which filters would have improved signal quality.
          {history && (
            <span style={{ marginLeft:8, color:"#7c3aed", fontWeight:600 }}>
              {history.total} alert{history.total !== 1 ? "s" : ""} in history
            </span>
          )}
        </div>

        <button onClick={runBacktest} disabled={loading} style={{
          background:"#0369a1", color:"#fff", border:"none", borderRadius:8,
          padding:"10px 28px", fontWeight:700, cursor:"pointer",
          opacity:loading?0.6:1, marginBottom:14,
        }}>
          {loading ? "Running (~60s)…" : "Run Alert Backtest"}
        </button>

        {/* ── Raw alert history preview ──────────────────────────────── */}
        {history && history.alerts.length > 0 && !result && (
          <div style={{ overflowX:"auto", marginBottom:14 }}>
            <div style={{ fontSize:11, fontWeight:600, color:C.text, marginBottom:6 }}>
              Recent Alerts (logged since last restart)
            </div>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
              <thead>
                <tr style={{ background:C.card }}>
                  {["Date","Ticker","Signal","Price","%B","RSI","Vol Ratio","Tape"].map(h => (
                    <th key={h} style={TH}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {history.alerts.slice(0, 20).map(a => (
                  <tr key={a.id} style={{ borderBottom:`1px solid ${C.border}` }}>
                    <td style={{ ...TD, color:C.muted }}>{a.session_date}</td>
                    <td style={{ ...TD, fontWeight:700, color:C.text }}>{a.ticker}</td>
                    <td style={{ ...TD, color: a.signal_type==="BREAKOUT"?"#7c3aed":"#0369a1",
                                 fontWeight:600, fontSize:10 }}>{a.signal_type}</td>
                    <td style={{ ...TD }}>{a.price != null ? "$"+a.price.toFixed(2) : "—"}</td>
                    <td style={{ ...TD, color:C.muted }}>{a.pct_b != null ? a.pct_b.toFixed(1) : "—"}</td>
                    <td style={{ ...TD, color:C.muted }}>{a.rsi != null ? a.rsi.toFixed(1) : "—"}</td>
                    <td style={{ ...TD, color:C.muted }}>{a.vol_ratio != null ? a.vol_ratio.toFixed(2)+"×" : "—"}</td>
                    <td style={{ ...TD, fontSize:10,
                                 color: (a.tape_label||"").includes("BULL") ? "#16a34a"
                                      : (a.tape_label||"").includes("BEAR") ? "#dc2626" : C.muted }}>
                      {a.tape_label || "—"}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {result && (
          <>
            {/* ── Outcome Summary ──────────────────────────────────── */}
            <div style={{ marginBottom:20 }}>
              <div style={{ fontSize:12, fontWeight:700, color:C.text, marginBottom:10 }}>
                Actual Alert Outcomes (real prices, not simulated)
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10 }}>
                {[
                  { label:"All Signals", data: allOs },
                  { label:"BREAKOUT only", data: boOs },
                  { label:"PRE-BREAKOUT only", data: preOs },
                ].map(({ label, data }) => (
                  <div key={label} style={{ background:C.card, borderRadius:8, padding:12,
                                            border:`1px solid ${C.border}` }}>
                    <div style={{ fontSize:11, fontWeight:700, color:C.text, marginBottom:8 }}>{label}</div>
                    {["5d","10d","20d"].map(h => {
                      const d = data[h] || {};
                      return (
                        <div key={h} style={{ display:"flex", justifyContent:"space-between",
                                              fontSize:11, marginBottom:4 }}>
                          <span style={{ color:C.muted }}>{h} ({d.n || 0} signals)</span>
                          <span>
                            <span style={{ color:wrCol(d.win_rate), fontWeight:700, marginRight:8 }}>
                              {fmt(d.win_rate)}
                            </span>
                            <span style={{ color:retCol(d.avg_ret) }}>{fmtR(d.avg_ret)}</span>
                          </span>
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>

            {/* ── Per-alert outcomes table ──────────────────────────── */}
            {result.actual_outcomes.length > 0 && (
              <div style={{ marginBottom:24 }}>
                <div style={{ fontSize:12, fontWeight:700, color:C.text, marginBottom:8 }}>
                  Per-Alert Detail
                </div>
                <div style={{ overflowX:"auto" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
                    <thead>
                      <tr style={{ background:C.card }}>
                        {["Date","Ticker","Signal","Alert $","%B","RSI","Tape","Ret 5d","Ret 10d","Ret 20d"].map(h => (
                          <th key={h} style={TH}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {result.actual_outcomes
                        .slice().reverse()
                        .map((r, i) => (
                        <tr key={i} style={{ borderBottom:`1px solid ${C.border}`,
                          background: r.win_10d ? "#f0fdf4" : r.ret_10d != null ? "#fff7f7" : "transparent" }}>
                          <td style={{ ...TD, color:C.muted }}>{r.session_date}</td>
                          <td style={{ ...TD, fontWeight:700 }}>{r.ticker}</td>
                          <td style={{ ...TD, fontSize:10,
                                       color: r.signal_type==="BREAKOUT"?"#7c3aed":"#0369a1",
                                       fontWeight:600 }}>{r.signal_type}</td>
                          <td style={{ ...TD }}>${r.price?.toFixed(2) ?? "—"}</td>
                          <td style={{ ...TD, color:C.muted }}>{r.pct_b?.toFixed(1) ?? "—"}</td>
                          <td style={{ ...TD, color:C.muted }}>{r.rsi?.toFixed(1) ?? "—"}</td>
                          <td style={{ ...TD, fontSize:10,
                                       color: (r.tape_label||"").includes("BULL") ? "#16a34a"
                                            : (r.tape_label||"").includes("BEAR") ? "#dc2626" : C.muted }}>
                            {r.tape_label || "—"}
                          </td>
                          <td style={{ ...TD, fontWeight:600, color:retCol(r.ret_5d)  }}>{fmtR(r.ret_5d)}</td>
                          <td style={{ ...TD, fontWeight:600, color:retCol(r.ret_10d) }}>{fmtR(r.ret_10d)}</td>
                          <td style={{ ...TD, fontWeight:600, color:retCol(r.ret_20d) }}>{fmtR(r.ret_20d)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ── 6-Filter analysis on alerted tickers ─────────────── */}
            {result.filter_results.length > 0 && (
              <div>
                <div style={{ fontSize:12, fontWeight:700, color:C.text, marginBottom:10 }}>
                  Filter Analysis on Alerted Tickers ({result.tickers.length} tickers)
                </div>
                {/* Layer summary cards */}
                <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:16 }}>
                  {LAYER_META.map(({ key, label }) => {
                    const ls = result.filter_summary[key] || {};
                    return (
                      <div key={key} style={{
                        flex:"1 1 100px", background: key==="with_stops"?"#0f2a1a":C.card,
                        border:`1px solid ${key==="with_stops"?"#bbf7d0":C.border}`,
                        borderRadius:8, padding:"8px 6px", textAlign:"center",
                      }}>
                        <div style={{ fontSize:9, fontWeight:800, color:C.muted,
                                      textTransform:"uppercase", letterSpacing:1, marginBottom:2 }}>{label}</div>

                {/* Per-ticker table */}
                <div style={{ overflowX:"auto" }}>

                      <tr style={{ background:C.card }}>
