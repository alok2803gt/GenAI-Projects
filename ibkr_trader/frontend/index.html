                      </tr>
                      <tr style={{ background:C.card }}>
                        <th style={TH}></th>
                        {LAYER_META.map(({ key }) => (
                          <React.Fragment key={key}>
                            <th style={{ ...TH, fontSize:9, color:"#94a3b8", textAlign:"center" }}>Sigs</th>
                            <th style={{ ...TH, fontSize:9, color:"#94a3b8", textAlign:"center" }}>WR10</th>
                          </React.Fragment>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {result.filter_results
                        .sort((a,b) => (b.baseline?.signals||0)-(a.baseline?.signals||0))
                        .map(r => (
                        <tr key={r.ticker} style={{ borderBottom:`1px solid ${C.border}` }}>
                          <td style={{ ...TD, fontWeight:700, color:C.text }}>{r.ticker}</td>
                          {LAYER_META.map(({ key }) => {
                            const lyr = r[key] || {};
                            const s = lyr.signals || 0;
                            return (
                              <React.Fragment key={key}>
                                <td style={{ ...TD, textAlign:"center",
                                  color: s>0?"#7c3aed":"#cbd5e1", fontWeight:s>0?700:400 }}>{s||"—"}</td>
                                <td style={{ ...TD, textAlign:"center", fontWeight:600,
                                  color: s>0?wrCol(lyr.win_rate_10d):"#cbd5e1" }}>
                                  {s>0?fmt(lyr.win_rate_10d):"—"}
                                </td>
                              </React.Fragment>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {result.tickers.length === 0 && (
              <div style={{ padding:20, textAlign:"center", color:C.muted, fontSize:12 }}>
                No alert history found. Alerts will be logged automatically going forward
                as the breakout scanner generates signals.
              </div>
            )}
          </>
        )}
      </Card>
    </div>
  );
}

// ── Backtest Tab ──────────────────────────────────────────────────────────
function BacktestTab({ connected }) {
  const [tickers, setTickers] = useState("AMD,LLY,AAPL,NVDA,SPY");
  const [weeks,   setWeeks]   = useState(26);
  const [ptPct,   setPt]      = useState(65);
  const [slMult,  setSl]      = useState(5.0);
  const [result,  setResult]  = useState(null);
  const [loading, setLoading] = useState(false);

  const run = async () => {
    if (!connected) return alert("Connect IBKR first.");
    setLoading(true);
    try {
      const d = await apiFetch(
        `/backtest/csp?tickers=${encodeURIComponent(tickers)}&weeks=${weeks}&profit_target_pct=${ptPct/100}&stop_loss_mult=${slMult}`
      );
      setResult(d);
    } catch(e) { alert("Backtest failed: " + e.message); }
    finally { setLoading(false); }
  };

  const pnlCol = v => v > 0 ? "#27ae60" : v < 0 ? "#e74c3c" : "#888";
  const tdS = { padding:"6px 10px", borderBottom:`1px solid ${C.border}` };

  return (
    <div style={{ padding:"16px 0" }}>
      <Card title="Backtest Settings" style={{ marginBottom:20 }}>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:12, marginBottom:14 }}>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Tickers (comma-sep, max 8)
            <input value={tickers} onChange={e=>setTickers(e.target.value)}
              style={{ padding:"7px 10px", background:C.card, border:`1px solid ${C.border}`, color:C.text, borderRadius:6, fontSize:13 }} />
          </label>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Lookback Weeks
            <input type="number" min={4} max={104} value={weeks} onChange={e=>setWeeks(+e.target.value)}
              style={{ padding:"7px 10px", background:C.card, border:`1px solid ${C.border}`, color:C.text, borderRadius:6, fontSize:13 }} />
          </label>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Profit Target %
            <input type="number" min={10} max={90} step={5} value={ptPct} onChange={e=>setPt(+e.target.value)}
              style={{ padding:"7px 10px", background:C.card, border:`1px solid ${C.border}`, color:C.text, borderRadius:6, fontSize:13 }} />
          </label>
          <label style={{ display:"flex", flexDirection:"column", gap:4, fontSize:13, color:C.muted }}>
            Stop Loss (× premium, 0=hold-to-expiry)
            <input type="number" min={0} max={10} step={0.5} value={slMult} onChange={e=>setSl(+e.target.value)}
              style={{ padding:"7px 10px", background:C.card, border:`1px solid ${C.border}`, color:C.text, borderRadius:6, fontSize:13 }} />
          </label>
        </div>
        <button onClick={run} disabled={loading} style={{
          background:"#2980b9", color:"#fff", border:"none", borderRadius:8,
          padding:"10px 28px", fontWeight:700, cursor:"pointer", opacity:loading?0.6:1,
        }}>
          {loading ? "Running backtest…" : "Run Backtest"}
        </button>
        <div style={{ marginTop:10, fontSize:12, color:"#64748b" }}>
          Uses 2 yr of daily prices. Simulates weekly 20-delta CSP with BS pricing + realized vol.
          No survivorship bias — uses actual historical closes.
        </div>
      </Card>

      {result && (
        <>
          {/* Summary row */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12, marginBottom:20 }}>
            {[
              { label:"Avg Win Rate",  value:`${result.summary.avg_win_rate}%`,  col:"#27ae60" },
              { label:"Avg Sharpe",    value:result.summary.avg_sharpe,           col:"#f1c40f" },
              { label:"Total P&L",     value:`$${result.summary.total_pnl}`,      col:pnlCol(result.summary.total_pnl) },
            ].map(s => (
              <div key={s.label} style={{ background:C.card, borderRadius:8, padding:14, textAlign:"center" }}>
                <div style={{ color:"#64748b", fontSize:11, marginBottom:6 }}>{s.label}</div>
                <div style={{ color:s.col, fontWeight:700, fontSize:22 }}>{s.value}</div>
              </div>
            ))}
          </div>

          {/* Per-ticker results */}
          {result.results.map(r => (
            <Card key={r.ticker} title={`${r.ticker} — ${r.weeks} weeks`} style={{ marginBottom:16 }}>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:10, marginBottom:14, textAlign:"center" }}>
                {[
                  { label:"Win Rate",     value:`${r.win_rate}%`,      col:"#27ae60" },
                  { label:"Total P&L",    value:`$${r.total_pnl}`,     col:pnlCol(r.total_pnl) },
                  { label:"Avg Win",      value:`$${r.avg_win}`,       col:"#27ae60" },
                  { label:"Avg Loss",     value:`$${r.avg_loss}`,      col:"#e74c3c" },
                  { label:"Max Drawdown", value:`$${r.max_drawdown}`,  col:"#e74c3c" },
                ].map(s => (
                  <div key={s.label} style={{ background:C.card, borderRadius:6, padding:10 }}>
                    <div style={{ color:"#64748b", fontSize:10 }}>{s.label}</div>
                    <div style={{ color:s.col, fontWeight:700, fontSize:15 }}>{s.value}</div>
                  </div>
                ))}
              </div>
              <div style={{ overflowX:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                  <thead>
                    <tr style={{ color:"#64748b", borderBottom:`1px solid ${C.border}` }}>
                      {["Date","Spot","Strike","IV%","Premium","P&L","Result"].map(h =>
                        <th key={h} style={{ ...tdS, fontWeight:600, textAlign:"left" }}>{h}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {r.trades.map((t,i) => (
                      <tr key={i} style={{ background: t.win ? "#f0fdf4" : "#fef2f2" }}>
                        <td style={tdS}>{t.date}</td>
                        <td style={tdS}>${t.spot}</td>
                        <td style={tdS}>${t.strike}</td>
                        <td style={tdS}>{t.iv_pct}%</td>
                        <td style={tdS}>${t.premium}</td>
                        <td style={{ ...tdS, color:pnlCol(t.exit_pnl), fontWeight:700 }}>${t.exit_pnl}</td>
                        <td style={{ ...tdS, color:t.win?"#27ae60":"#e74c3c", fontWeight:700 }}>{t.win?"WIN":"LOSS"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          ))}
        </>
      )}

      {/* ── Breakout Backtest ─────────────────────────────────────────── */}
      <BreakoutBacktest />

      {/* ── Alert Backtest ────────────────────────────────────────────── */}
      <AlertBacktestSection />
    </div>
  );
}

// ── Breakout Backtest (embedded in BacktestTab) ────────────────────────────
function BreakoutBacktest() {
  const [result,          setResult]          = useState(null);
  const [loading,         setLoading]         = useState(false);
  const [filteredResult,  setFilteredResult]  = useState(null);
  const [filteredLoading, setFilteredLoading] = useState(false);

  const run = async () => {
    setLoading(true);
    try { setResult(await apiFetch("/backtest/breakout")); }
    catch(e) { alert("Breakout backtest failed: " + e.message); }
    finally { setLoading(false); }
  };

  const runFiltered = async () => {
    setFilteredLoading(true);
    try { setFilteredResult(await apiFetch("/backtest/breakout/filtered")); }
    catch(e) { alert("Filter analysis failed: " + e.message); }
    finally { setFilteredLoading(false); }
  };

  const wrCol  = v => v == null ? C.muted : v >= 70 ? "#15803d" : v >= 60 ? "#16a34a" : v >= 50 ? "#f97316" : "#dc2626";
  const retCol = v => v == null ? C.muted : v > 0 ? "#16a34a" : v < 0 ? "#dc2626" : C.muted;
  const fmt    = v => v == null ? "—" : v.toFixed(1) + "%";
  const fmtR   = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";

  const s = result?.summary || {};

  // Filter layer metadata — defines order + display labels
  const LAYER_META = [
    { key:"baseline",      label:"Baseline",     desc:"%B>95 + Vol≥90pct" },
    { key:"regime",        label:"+Regime",      desc:"SPY>SMA200, VIX<25" },
    { key:"rel_strength",  label:"+Rel Str",     desc:"Stock 20d > SPY 20d" },
    { key:"pullback",      label:"+Pullback",    desc:"%B<50 in prior 10d" },
    { key:"cvd_proxy",     label:"+CVD",         desc:"Close > Open" },
    { key:"close_quality", label:"+Close Qual",  desc:"Close in top 25% range" },
    { key:"with_stops",    label:"+5% Stop",     desc:"5% hard stop on returns" },
  ];

  const TH = { padding:"6px 8px", textAlign:"left", fontWeight:600, color:C.muted,
                borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap", fontSize:11 };
  const TD = { padding:"5px 8px", fontSize:11 };

  return (
    <div style={{ marginTop: 28 }}>
      {/* ── Baseline Backtest ─────────────────────────────────────────── */}
      <Card title="Breakout Backtest — Universe Tickers (Walk-Forward, 2Y)">
        <div style={{ fontSize:12, color:C.muted, marginBottom:14 }}>
          Signal: price at/above upper Bollinger Band <b>AND</b> volume ratio ≥ per-ticker 90th-percentile
          (rolling 252-day window, no look-ahead bias). Measures raw forward returns at 5d / 10d / 20d.
          Uses yfinance — no IBKR connection required.
        </div>
        <div style={{ display:"flex", gap:10, marginBottom:14, flexWrap:"wrap" }}>
          <button onClick={run} disabled={loading} style={{
            background:"#7c3aed", color:"#fff", border:"none", borderRadius:8,
            padding:"10px 24px", fontWeight:700, cursor:"pointer", opacity:loading?0.6:1,
          }}>
            {loading ? "Running…" : "Run Baseline Backtest"}
          </button>
          <button onClick={runFiltered} disabled={filteredLoading} style={{
            background:"#0f766e", color:"#fff", border:"none", borderRadius:8,
            padding:"10px 24px", fontWeight:700, cursor:"pointer", opacity:filteredLoading?0.6:1,
          }}>
            {filteredLoading ? "Running (~45s)…" : "Run 6-Filter Analysis"}
          </button>
        </div>

        {result && (
          <>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:10, marginBottom:20 }}>
              {[
                { label:"Signals",      value: s.total_signals,      col: C.text    },
                { label:"Tickers",      value: s.tickers_tested,     col: C.text    },
                { label:"Win Rate 5d",  value: fmt(s.win_rate_5d),   col: wrCol(s.win_rate_5d)  },
                { label:"Win Rate 10d", value: fmt(s.win_rate_10d),  col: wrCol(s.win_rate_10d) },
                { label:"Win Rate 20d", value: fmt(s.win_rate_20d),  col: wrCol(s.win_rate_20d) },
                { label:"Avg Ret 10d",  value: fmtR(s.avg_ret_10d), col: retCol(s.avg_ret_10d) },
                { label:"Avg Ret 20d",  value: fmtR(s.avg_ret_20d), col: retCol(s.avg_ret_20d) },
              ].map(stat => (
                <div key={stat.label} style={{ background:C.card, borderRadius:8, padding:"10px 8px", textAlign:"center" }}>
                  <div style={{ color:C.muted, fontSize:10, marginBottom:4 }}>{stat.label}</div>
                  <div style={{ color:stat.col, fontWeight:700, fontSize:16 }}>{stat.value ?? "—"}</div>
                </div>
              ))}
            </div>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                <thead>
                  <tr style={{ background:C.card }}>
                    {["Ticker","Signals","Vol 90pct","WR 5d","WR 10d","WR 20d","Avg Ret 5d","Avg Ret 10d","Avg Ret 20d","Recent Signals"].map(h => (
                      <th key={h} style={TH}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {result.results.sort((a,b) => (b.signals||0)-(a.signals||0)).map(r => (
                    <tr key={r.ticker} style={{ borderBottom:`1px solid ${C.border}` }}>
                      <td style={{ ...TD, fontWeight:700, color:C.text }}>{r.ticker}</td>
                      <td style={{ ...TD, color: r.signals>0?"#7c3aed":C.muted, fontWeight:700 }}>{r.signals}</td>
                      <td style={{ ...TD, color:C.muted }}>{r.avg_vol_90pct!=null ? r.avg_vol_90pct.toFixed(2)+"×" : "—"}</td>
                      <td style={{ ...TD, color:wrCol(r.win_rate_5d),  fontWeight:600 }}>{fmt(r.win_rate_5d)}</td>
                      <td style={{ ...TD, color:wrCol(r.win_rate_10d), fontWeight:600 }}>{fmt(r.win_rate_10d)}</td>
                      <td style={{ ...TD, color:wrCol(r.win_rate_20d), fontWeight:600 }}>{fmt(r.win_rate_20d)}</td>
                      <td style={{ ...TD, color:retCol(r.avg_ret_5d)  }}>{fmtR(r.avg_ret_5d)}</td>
                      <td style={{ ...TD, color:retCol(r.avg_ret_10d) }}>{fmtR(r.avg_ret_10d)}</td>
                      <td style={{ ...TD, color:retCol(r.avg_ret_20d) }}>{fmtR(r.avg_ret_20d)}</td>
                      <td style={{ ...TD, color:C.muted }}>{(r.recent_signals||[]).join(", ")||"—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{ marginTop:10, fontSize:11, color:C.muted }}>
              Win = forward close higher than entry. No stops applied. Run "6-Filter Analysis" to see filtered win rates.
            </div>
          </>
        )}
      </Card>

      {/* ── 6-Filter Comparison ───────────────────────────────────────── */}
      {filteredResult && (
        <div style={{ marginTop:24 }}>
          <Card title="6-Filter Analysis — Signal Quality vs Quantity Trade-off">
            <div style={{ fontSize:12, color:C.muted, marginBottom:16 }}>
              Each column adds one more filter on top of the previous. Signal count drops, win rate rises.
              <b> Expectancy</b> = (win% × avg_win) + (loss% × avg_loss) — the expected return per signal.
              "+5% Stop" uses same signals as "+Close Qual" but caps any loss at −5% if the daily Low
              triggers the stop during the holding period.
            </div>

            {/* Summary strip — one card per layer */}
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:20 }}>
              {LAYER_META.map(({ key, label, desc }) => {
                const ls = filteredResult.summary[key] || {};

                    flex:"1 1 110px", background: key==="with_stops" ? "#f0fdf4" : "#f8fafc",
                    border:`1px solid ${key==="with_stops" ? "#bbf7d0" : C.border}`,
                    borderRadius:10, padding:"10px 8px", textAlign:"center",
                  }}>
                    <div style={{ fontSize:9, fontWeight:800, color:C.muted, textTransform:"uppercase",
                                  letterSpacing:1, marginBottom:2 }}>{label}</div>
                    <div style={{ fontSize:9, color:C.muted, marginBottom:6 }}>{desc}</div>
                    <div style={{ fontSize:18, fontWeight:800, color:wrCol(ls.win_rate_10d) }}>
                      {fmt(ls.win_rate_10d)}
                    </div>
                    <div style={{ fontSize:10, color:C.muted }}>WR 10d</div>
                    <div style={{ fontSize:11, color:retCol(ls.expectancy_10d), fontWeight:700, marginTop:4 }}>
                      {fmtR(ls.expectancy_10d)}
                    </div>
                    <div style={{ fontSize:9, color:C.muted }}>expectancy</div>
                    <div style={{ fontSize:10, color:"#7c3aed", fontWeight:700, marginTop:4 }}>
                      {ls.signals || 0} signals
                    </div>
                    <div style={{ fontSize:9, color:C.muted }}>{ls.tickers_active || 0} tickers</div>
                  </div>
                );
              })}
            </div>

            {/* Per-ticker detail table */}
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
                <thead>
                  <tr style={{ background:C.card }}>
                    <th style={{ ...TH, minWidth:60 }}>Ticker</th>
                    {LAYER_META.map(({ key, label }) => (
                      <th key={key} style={{ ...TH, textAlign:"center" }} colSpan={3}>{label}</th>
                    ))}
                  </tr>
                  <tr style={{ background:C.card }}>
                    <th style={TH}></th>
                    {LAYER_META.map(({ key }) => (
                      <React.Fragment key={key}>
                        <th style={{ ...TH, fontSize:9, color:"#94a3b8", textAlign:"center" }}>Sigs</th>
                        <th style={{ ...TH, fontSize:9, color:"#94a3b8", textAlign:"center" }}>WR10</th>
                        <th style={{ ...TH, fontSize:9, color:"#94a3b8", textAlign:"center" }}>Exp</th>
                      </React.Fragment>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filteredResult.results
                    .sort((a,b) => (b.baseline?.signals||0)-(a.baseline?.signals||0))
                    .map(r => (
                    <tr key={r.ticker} style={{ borderBottom:`1px solid ${C.border}` }}>
                      <td style={{ ...TD, fontWeight:700, color:C.text }}>{r.ticker}</td>
                      {LAYER_META.map(({ key }) => {
                        const lyr = r[key] || {};
                        const sigs = lyr.signals || 0;
                        return (
                          <React.Fragment key={key}>
                            <td style={{ ...TD, textAlign:"center",
                              color: sigs > 0 ? "#7c3aed" : "#cbd5e1", fontWeight: sigs>0?700:400 }}>
                              {sigs || "—"}
                            </td>
                            <td style={{ ...TD, textAlign:"center", fontWeight:600,
                              color: sigs > 0 ? wrCol(lyr.win_rate_10d) : "#cbd5e1" }}>
                              {sigs > 0 ? fmt(lyr.win_rate_10d) : "—"}
                            </td>
                            <td style={{ ...TD, textAlign:"center",
                              color: sigs > 0 ? retCol(lyr.expectancy_10d) : "#cbd5e1" }}>
                              {sigs > 0 ? fmtR(lyr.expectancy_10d) : "—"}
                            </td>
                          </React.Fragment>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Filter legend */}
            <div style={{ marginTop:16, padding:12, background:C.card, borderRadius:8,
                          fontSize:11, color:C.muted, lineHeight:1.8 }}>
              <b style={{ color:C.text }}>Filter definitions:</b><br/>
              {(filteredResult.meta?.filters || []).map((f,i) => (
                <span key={i}>{f}<br/></span>
              ))}
              <span style={{ color:"#7c3aed" }}>
                Stop scan: daily Low checked each holding day — if Low ≤ entry × 0.95, return = −5%.
              </span>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

            Targets 1–2% OTM puts, DTE 0–7. Close at 50% profit same/next day.
          </span>
        </div>
        {result && (result.candidates.length === 0
          ? <div style={{ color:"#64748b" }}>No 0DTE candidates found for today.</div>
          : <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                <thead>
                  <tr>{["Ticker","Expiry","DTE","Strike","OTM%","Bid","Ask","Mid","IV%","OI","Vol","Daily Ret%","Trade"].map(h =>
                    <th key={h} style={thS}>{h}</th>)}</tr>
                </thead>
                <tbody>
                  {result.candidates.map((r,i) => (
                    <tr key={i} style={{ background: i%2===0?C.card:"transparent" }}>
                      <td style={{ ...tdS, fontWeight:700 }}>{r.ticker}</td>
                      <td style={tdS}>{r.expiry_display}</td>
                      <td style={{ ...tdS, color:r.dte===0?"#e74c3c":"#f1c40f" }}>{r.dte}d</td>
                      <td style={tdS}>${r.strike}</td>
                      <td style={tdS}>{r.otm_pct}%</td>
                      <td style={tdS}>${r.bid}</td>
                      <td style={tdS}>${r.ask}</td>
                      <td style={{ ...tdS, fontWeight:700 }}>${r.mid}</td>
                      <td style={tdS}>{r.iv_pct}%</td>
                      <td style={tdS}>{r.oi}</td>
                      <td style={tdS}>{r.volume}</td>
                      <td style={{ ...tdS, color:"#27ae60", fontWeight:700 }}>{r.daily_return_pct}%</td>
                      <td style={tdS}>
                        <button onClick={() => setTradeTgt(r)} style={{
                          background:"#27ae60", color:"#fff", border:"none", borderRadius:4,
                          padding:"3px 10px", cursor:"pointer", fontSize:12,
                        }}>Trade</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
        )}
      </Card>

      {/* Earnings IV Section */}
      <Card title="Earnings IV-Crush Plays (sell after announcement)">
        <div style={{ marginBottom:14 }}>
          <button onClick={scanEIV} disabled={eivLoad} style={{
            background:"#d35400", color:"#fff", border:"none", borderRadius:8,
            padding:"10px 24px", fontWeight:700, cursor:"pointer", opacity:eivLoad?0.6:1,
          }}>
            {eivLoad ? "Scanning…" : "Scan Earnings IV"}
          </button>
          <span style={{ marginLeft:12, fontSize:12, color:"#64748b" }}>
            Finds CSP universe tickers with earnings in 2–7 days and IV rank ≥ 50.
          </span>
        </div>
        {eivRes && (eivRes.candidates.length === 0
          ? <div style={{ color:"#64748b" }}>No earnings IV plays found right now.</div>
          : <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                <thead>
                  <tr>{["Ticker","Expiry","DTE","Strike","Bid","Mid","Prem%","IV Rank","Earnings In","Note","Trade"].map(h =>
                    <th key={h} style={thS}>{h}</th>)}</tr>
                </thead>
                <tbody>
                  {eivRes.candidates.map((r,i) => (
                    <tr key={i} style={{ background: i%2===0?C.card:"transparent" }}>
                      <td style={{ ...tdS, fontWeight:700 }}>{r.ticker}</td>
                      <td style={tdS}>{r.expiry_display}</td>
                      <td style={tdS}>{r.dte}d</td>
                      <td style={tdS}>${r.strike}</td>
                      <td style={tdS}>${r.bid}</td>
                      <td style={{ ...tdS, fontWeight:700 }}>${r.mid}</td>
                      <td style={tdS}>{r.premium_pct}%</td>
                      <td style={{ ...tdS, color:"#f1c40f", fontWeight:700 }}>{r.iv_rank}</td>
                      <td style={{ ...tdS, color:"#e74c3c" }}>{r.earnings_days}d</td>
                      <td style={{ ...tdS, color:"#64748b", fontSize:11 }}>{r.note}</td>
                      <td style={tdS}>
                        <button onClick={() => setTradeTgt(r)} style={{
                          background:"#d35400", color:"#fff", border:"none", borderRadius:4,
                          padding:"3px 10px", cursor:"pointer", fontSize:12,
                        }}>Trade</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
        )}
      </Card>

      {tradeTarget && <TradeModal trade={tradeTarget} onClose={() => setTradeTgt(null)} onSuccess={() => setTradeTgt(null)} />}
    </div>
  );
}

// ── Learning Tab ──────────────────────────────────────────────────────────
function LearningTab() {
  const [stats,    setStats]   = useState(null);
  const [journal,  setJournal] = useState(null);
  const [training, setTraining]= useState(false);

  const load = async () => {
    try {
      const [s, j] = await Promise.all([
        apiFetch("/journal/stats"),
        apiFetch("/journal?limit=30"),
      ]);
      setStats(s);
      setJournal(j);
    } catch(_) {}
  };

  useEffect(() => { load(); const id = setInterval(load, 15000); return () => clearInterval(id); }, []);

  const retrain = async () => {
    setTraining(true);
    try {
      const r = await apiFetch("/journal/retrain", { method: "POST" });
      if (r.error) alert(r.error);
      else alert(`Model v${r.version} trained: ${r.win_rate}% win rate, ${r.cv_accuracy}% CV accuracy`);
      await load();
    } catch(e) { alert("Retrain failed: " + e.message); }
    finally { setTraining(false); }
  };

  const pnlCol = v => v > 0 ? "#27ae60" : v < 0 ? "#e74c3c" : "#888";
  const thS = { padding:"7px 10px", textAlign:"left", color:"#64748b", borderBottom:`1px solid ${C.border}`, fontWeight:600 };
  const tdS = { padding:"7px 10px", borderBottom:`1px solid ${C.border}`, fontSize:12 };

  // Feature importance bar chart
  const FeatureBar = ({ name, val, max }) => (
    <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
      <div style={{ width:130, fontSize:12, color:C.muted, textAlign:"right" }}>{name}</div>
      <div style={{ flex:1, background:C.card, borderRadius:4, height:16, position:"relative" }}>
        <div style={{ width:`${(val/max)*100}%`, background:"#3498db", borderRadius:4, height:"100%",
          minWidth:2, transition:"width 0.3s" }} />
      </div>
      <div style={{ width:45, fontSize:11, color:"#3498db", textAlign:"right" }}>{(val*100).toFixed(1)}%</div>
    </div>
  );

  const latestModel = stats?.model_log?.[0];
  const importances = latestModel?.importances
    ? (typeof latestModel.importances === "string"
        ? JSON.parse(latestModel.importances) : latestModel.importances)
    : null;
  const maxImp = importances ? Math.max(...Object.values(importances)) : 1;

  return (
    <div style={{ padding:"16px 0" }}>

      {/* KPI strip */}
      {stats && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:12, marginBottom:20 }}>
          {[
            { label:"Total Trades",    value: stats.total_trades,           col:"#eee" },
            { label:"Win Rate",        value: stats.win_rate != null ? `${stats.win_rate}%` : "—", col:"#27ae60" },
            { label:"Total P&L",       value: stats.total_pnl != null ? `$${stats.total_pnl}` : "—", col:pnlCol(stats.total_pnl) },
            { label:"Model Version",   value: `v${stats.model_version}`,   col:"#f1c40f" },
            { label:"Kelly Win Rate",  value: stats.assumed_win_rate ? `${(stats.assumed_win_rate*100).toFixed(1)}%` : "—", col:"#9b59b6" },
          ].map(s => (
            <div key={s.label} style={{ background:C.card, borderRadius:8, padding:14, textAlign:"center" }}>
              <div style={{ color:"#64748b", fontSize:11, marginBottom:6 }}>{s.label}</div>
              <div style={{ color:s.col, fontWeight:700, fontSize:19 }}>{s.value}</div>
            </div>
          ))}
        </div>
      )}

      {/* Strategy breakdown (CSP vs LEAP) */}
      {stats?.by_strategy && Object.keys(stats.by_strategy).length > 0 && (
        <div style={{ display:"flex", gap:12, marginBottom:20, flexWrap:"wrap" }}>
          {Object.entries(stats.by_strategy).map(([st, d]) => {
            const wr = d.total > 0 ? (d.wins / d.total * 100).toFixed(1) : "—";
            const pnlCol = d.pnl >= 0 ? "#27ae60" : "#e74c3c";
            const stLabel = st === "leap" ? "LEAP Calls" : "CSP Puts";
            const stColor = st === "leap" ? "#3b82f6" : "#d97706";
            return (
              <div key={st} style={{ background:C.card, borderRadius:8, padding:"12px 20px",
                display:"flex", flexDirection:"column", gap:4, minWidth:160 }}>
                <div style={{ color:stColor, fontWeight:700, fontSize:12 }}>{stLabel}</div>
                <div style={{ display:"flex", gap:20 }}>
                  <div>
                    <div style={{ color:"#64748b", fontSize:10 }}>Trades</div>
                    <div style={{ fontWeight:700 }}>{d.total}</div>
                  </div>
                  <div>
                    <div style={{ color:"#64748b", fontSize:10 }}>Win %</div>
                    <div style={{ color:"#27ae60", fontWeight:700 }}>{wr}%</div>
                  </div>
                  <div>
                    <div style={{ color:"#64748b", fontSize:10 }}>Total P&L</div>
                    <div style={{ color:pnlCol, fontWeight:700 }}>${d.pnl.toFixed(0)}</div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginBottom:20 }}>

        {/* Feature importances */}
        <Card title={`Feature Importances ${latestModel ? `(model v${latestModel.id})` : "(no model yet)"}`}>
          {!importances ? (
            <div style={{ color:"#64748b", fontStyle:"italic" }}>
              Need {20} completed trades to train first model.
              <br/>Run the CSP-Leap Trader and come back after 20 closes.
            </div>
          ) : (
            <>
              {Object.entries(importances)
                .sort((a,b) => b[1]-a[1])
                .map(([name, val]) => (
                  <FeatureBar key={name} name={name} val={val} max={maxImp} />
                ))}
              <button onClick={retrain} disabled={training} style={{
                marginTop:12, background:"#2980b9", color:"#fff", border:"none",
                borderRadius:6, padding:"7px 18px", cursor:"pointer", fontSize:13,
              }}>
                {training ? "Training…" : "Retrain Now"}
              </button>
            </>
          )}
        </Card>

        {/* Exit breakdown */}
        <Card title="Exit Breakdown">
          {!stats?.exit_breakdown || Object.keys(stats.exit_breakdown).length === 0 ? (
            <div style={{ color:"#64748b", fontStyle:"italic" }}>No closed trades yet.</div>
          ) : (
            <>
              {Object.entries(stats.exit_breakdown).map(([reason, d]) => {
                const wr = d.total > 0 ? (d.wins/d.total*100).toFixed(0) : 0;
                const col = reason.includes("profit") || reason.includes("trailing") ? "#27ae60" : "#e74c3c";
                return (
                  <div key={reason} style={{ display:"flex", justifyContent:"space-between",
                    padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
                    <span style={{ color:C.text, fontSize:13 }}>{reason}</span>
                    <span style={{ color:"#64748b", fontSize:12 }}>{d.total} trades</span>
                    <span style={{ color:col, fontWeight:700, fontSize:13 }}>{wr}% win</span>
                  </div>
                );
              })}
              <div style={{ marginTop:14, fontSize:12, color:"#64748b" }}>
                Avg win: ${stats.avg_win_pnl?.toFixed(0) || "—"} &nbsp;|&nbsp;
                Avg loss: ${stats.avg_loss_pnl?.toFixed(0) || "—"}
              </div>
            </>
          )}
        </Card>
      </div>

      {/* Model training log */}
      {stats?.model_log?.length > 0 && (
        <Card title="Model Training History" style={{ marginBottom:20 }}>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
              <thead>
                <tr>{["Version","Trained","Trades","Win Rate","CV Accuracy","Top Feature"].map(h =>
                  <th key={h} style={thS}>{h}</th>)}</tr>
              </thead>
              <tbody>
                {stats.model_log.map((m, i) => {
                  const imp = m.importances ? (typeof m.importances === "string"
                    ? JSON.parse(m.importances) : m.importances) : {};
                  const top = Object.entries(imp).sort((a,b)=>b[1]-a[1])[0]?.[0] || "—";
                  return (
                    <tr key={i} style={{ background: i===0 ? "#f0fdf4" : "transparent" }}>
                      <td style={{ ...tdS, color:"#f1c40f", fontWeight:700 }}>{m.notes}</td>
                      <td style={tdS}>{m.trained_at?.slice(0,19)}</td>
                      <td style={tdS}>{m.n_trades}</td>
                      <td style={{ ...tdS, color:"#27ae60" }}>{(m.win_rate*100).toFixed(1)}%</td>
                      <td style={{ ...tdS, color:"#3498db" }}>{(m.cv_accuracy*100).toFixed(1)}%</td>
                      <td style={{ ...tdS, color:"#9b59b6" }}>{top}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* Trade journal */}
      <Card title={`Trade Journal (last ${journal?.trades?.length || 0})`}>
        {!journal?.trades?.length ? (
          <div style={{ color:"#64748b", fontStyle:"italic" }}>
            No trades recorded yet. Trades placed by the CSP-Leap Trader appear here.
          </div>
        ) : (
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
              <thead>
                <tr style={{ color:"#64748b", borderBottom:`1px solid ${C.border}` }}>
                  {["#","Ticker","Type","Strike","Expiry","Hold","Entry","Exit","P&L","Win","Exit Reason",
                    "IV Rank","IV Exit","Regime","Score","Opened"].map(h =>
                    <th key={h} style={{ padding:"6px 8px", textAlign:"left", fontWeight:600 }}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {journal.trades.map((t, i) => {
                  const fmtExpiry = expStr => {
                    if (!expStr || !/^\d{8}$/.test(expStr)) return expStr || "—";
                    return new Date(`${expStr.slice(0,4)}-${expStr.slice(4,6)}-${expStr.slice(6,8)}T12:00:00`)
                      .toLocaleDateString("en-US", {month:"short", day:"numeric", year:"2-digit"});
                  };
                  const holdDays = t.opened_at && t.closed_at
                    ? Math.round((new Date(t.closed_at) - new Date(t.opened_at)) / 86400000)
                    : t.opened_at ? Math.round((Date.now() - new Date(t.opened_at)) / 86400000) : null;
                  return (
                  <tr key={i} style={{
                    background: t.win === 1 ? "#f0fdf4" : t.win === 0 ? "#fef2f2" : "transparent",
                    borderBottom:`1px solid ${C.border}`,
                  }}>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>{t.id}</td>
                    <td style={{ padding:"5px 8px", fontWeight:700 }}>{t.ticker}</td>
                    <td style={{ padding:"5px 8px", fontWeight:600,
                      color: t.right==="C"?"#27ae60":t.right==="P"?"#2563eb":"#475569" }}>
                      {strategyLabel(t)}
                    </td>
                    <td style={{ padding:"5px 8px" }}>${t.strike}</td>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>{fmtExpiry(t.expiry)}</td>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>
                      {holdDays != null ? `${holdDays}d${t.closed_at ? "" : " (open)"}` : "—"}
                    </td>
                    <td style={{ padding:"5px 8px" }}>${t.entry_price?.toFixed(2) || "—"}</td>
                    <td style={{ padding:"5px 8px" }}>{t.exit_price ? `$${t.exit_price.toFixed(2)}` : "open"}</td>
                    <td style={{ padding:"5px 8px", color:pnlCol(t.pnl), fontWeight:700 }}>
                      {t.pnl != null ? `$${t.pnl.toFixed(0)}` : "—"}
                    </td>
                    <td style={{ padding:"5px 8px", color: t.win===1?"#27ae60":t.win===0?"#e74c3c":"#888", fontWeight:700 }}>
                      {t.win===1?"W":t.win===0?"L":"—"}
                    </td>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>{t.exit_reason || "—"}</td>
                    <td style={{ padding:"5px 8px" }}>{t.iv_rank?.toFixed(0) || "—"}</td>
                    <td style={{ padding:"5px 8px", color: t.live_iv_exit != null ? (t.live_iv_exit > (t.live_iv_entry||0) ? "#e74c3c" : "#27ae60") : "#64748b" }}>
                      {t.live_iv_exit != null ? `${t.live_iv_exit.toFixed(0)}%` : "—"}
                    </td>
                    <td style={{ padding:"5px 8px" }}>
                      {t.market_regime
                        ? <span style={{ fontSize:10, fontWeight:700, padding:"1px 5px", borderRadius:4,
                            background: t.market_regime==="BULL"?"#dcfce7":t.market_regime==="BEAR"?"#fee2e2":"#fef3c7",
                            color: t.market_regime==="BULL"?"#166534":t.market_regime==="BEAR"?"#991b1b":"#92400e" }}>
                            {t.market_regime}
                          </span>
                        : <span style={{ color:"#64748b" }}>—</span>}
                    </td>
                    <td style={{ padding:"5px 8px" }}>{t.score || "—"}</td>
                    <td style={{ padding:"5px 8px", color:"#64748b" }}>{t.opened_at?.slice(0,10) || "—"}</td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

// ── Universe Tab ──────────────────────────────────────────────────────────
function UniverseTab() {
  const [data,       setData]      = useState(null);
  const [screening,  setScreening] = useState(false);
  const [topN,       setTopN]      = useState(25);
  const [addTicker,  setAddTicker] = useState("");

  const load = async () => {
    try { setData(await apiFetch("/csp/universe")); } catch(_) {}
  };

  // Poll every 15 s so the tab picks up the startup screen once it completes
  useEffect(() => {
    load();
    const id = setInterval(load, 15000);
    return () => clearInterval(id);
  }, []);

  const runRefresh = async () => {
    setScreening(true);
    try {
      const r = await apiFetch(`/csp/universe/refresh?top_n=${topN}`, { method: "POST" });
      if (!r.ok) alert("Screen returned no results — universe unchanged");
      await load();
    } catch(e) { alert("Refresh failed: " + e.message); }
    finally { setScreening(false); }
  };

  const thS = { padding:"7px 12px", textAlign:"left", color:"#64748b",
                borderBottom:"1px solid #1e293b", fontWeight:600, fontSize:11, whiteSpace:"nowrap" };
  const tdS = { padding:"6px 12px", borderBottom:"1px solid #0f172a", fontSize:12 };

  const scores = data?.scores || [];
  const active = new Set(data?.universe || []);

  const fmtVol = v => {
    if (!v) return "—";
    if (v >= 1_000_000) return `${(v/1_000_000).toFixed(1)}M`;
    return `${(v/1_000).toFixed(0)}K`;
  };

  return (
    <div>
      {/* Header row */}
      <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:16, flexWrap:"wrap" }}>
        <div style={{ ...sans, fontSize:14, fontWeight:700, color:"#f1f5f9" }}>
          Dynamic Universe Screener
        </div>
        <div style={{ ...mono, fontSize:11, color:"#64748b" }}>
          Pool: {data?.candidate_pool ?? "…"} tickers →
          Active: {data?.count ?? "…"} tickers
        </div>
        {data?.last_screened && (
          <div style={{ ...mono, fontSize:11, color:"#94a3b8" }}>
            Last screened: {new Date(data.last_screened).toLocaleString()}
          </div>
        )}
        <div style={{ display:"flex", alignItems:"center", gap:8, marginLeft:"auto" }}>
          <label style={{ ...sans, fontSize:12, color:"#94a3b8" }}>Top</label>
          <select value={topN} onChange={e => setTopN(Number(e.target.value))}
            style={{ background:"#1e293b", color:"#f1f5f9", border:"1px solid #334155",
                     borderRadius:6, padding:"3px 8px", fontSize:12 }}>
            {[15,20,25,30].map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          <button onClick={runRefresh} disabled={screening} style={{
            ...sans, fontSize:12, fontWeight:700, padding:"6px 18px", borderRadius:8,
            cursor: screening ? "default" : "pointer", opacity: screening ? 0.6 : 1,
            background: screening ? "#334155" : "#3498db", color:"#fff", border:"none",
          }}>
            {screening ? "Screening…" : "Refresh Now"}
          </button>
        </div>
      </div>

      {/* Active universe chips with remove buttons */}
      <Card style={{ marginBottom:16 }}>
        <div style={{ ...sans, fontSize:11, color:"#64748b", marginBottom:8, fontWeight:600 }}>
          ACTIVE SCAN UNIVERSE ({(data?.universe || []).length} tickers)
        </div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
          {(data?.universe || []).map(t => (
            <span key={t} style={{
              ...mono, fontSize:12, fontWeight:700,
              padding:"3px 6px 3px 10px", borderRadius:12,
              background:"#0f4c8133", border:"1px solid #3498db55",
              color:"#93c5fd", display:"flex", alignItems:"center", gap:5,
            }}>
              {t}
              <span
                title={`Remove ${t}`}
                onClick={async () => {
                  await apiFetch("/csp/universe/remove", {
                    method:"POST", headers:{"Content-Type":"application/json"},
                    body: JSON.stringify({ ticker: t }),
                  });
                  load();
                }}
                style={{ cursor:"pointer", color:"#e74c3c", fontWeight:900, fontSize:13, lineHeight:1 }}
              >×</span>
            </span>
          ))}
          {!data && <span style={{ color:C.muted }}>Loading…</span>}
        </div>
        {/* Add custom ticker */}
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          <input
            value={addTicker}
            onChange={e => setAddTicker(e.target.value.toUpperCase())}
            onKeyDown={async e => {
              if (e.key !== "Enter" || !addTicker.trim()) return;
              await apiFetch("/csp/universe/add", {
                method:"POST", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ ticker: addTicker.trim() }),
              });
              setAddTicker(""); load();
            }}
            placeholder="Add ticker (e.g. TSLA)"
            style={{ ...mono, fontSize:13, padding:"5px 10px", borderRadius:6,
                     border:"1px solid #334155", background:"#1e293b", color:"#f1f5f9",
                     width:160 }}
          />
          <button
            onClick={async () => {
              if (!addTicker.trim()) return;
              await apiFetch("/csp/universe/add", {
                method:"POST", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ ticker: addTicker.trim() }),
              });
              setAddTicker(""); load();
            }}
            style={{ ...sans, fontSize:12, padding:"5px 14px", borderRadius:6,
                     background:"#27ae60", color:"#fff", border:"none", cursor:"pointer" }}
          >+ Add</button>
          <span style={{ fontSize:11, color:"#64748b" }}>
            Add ticker to active scan universe · Enter key or click + Add
          </span>
        </div>
      </Card>

      {/* Scores table */}
      {scores.length > 0 && (
        <Card style={{ padding:0, overflow:"hidden" }}>

function PnLTab() {
  const [data,        setData]        = useState(null);
  const [loading,     setLoading]     = useState(true);
  const [err,         setErr]         = useState(null);
  const [countdown,   setCountdown]   = useState(15);
  const [deltaData,   setDeltaData]   = useState(null);
  const [ordersData,  setOrdersData]  = useState(null);
  const [deltaOpen,   setDeltaOpen]   = useState(false);
  const [deltaLoading,setDeltaLoading]= useState(false);
  const [modeFilter,  setModeFilter]  = useState("all");
  const INTERVAL = 15;

  const loadDelta = async () => {
    setDeltaLoading(true);
    try {
      const [pos, ord] = await Promise.all([
        apiFetch("/portfolio/delta"),
        apiFetch("/orders"),
      ]);
      setDeltaData(pos); setOrdersData(ord);
    } catch(_) {}
    setDeltaLoading(false);
  };

  const cancelOrder = async (id) => {
    try {
      await apiFetch(`/orders/${id}`, {method:"DELETE"});
      await loadDelta();
    } catch(e) { alert("Cancel failed: " + e.message); }
  };

  const cancelInactiveOrders = async () => {
    try {
      const r = await apiFetch("/orders/cancel-inactive", {method:"POST"});
      alert(`Cancelled ${r.count} Inactive order(s): [${r.cancelled.join(", ")}]`);
      await loadDelta();
    } catch(e) { alert("Cancel inactive failed: " + e.message); }
  };

  const load = useCallback(async () => {
    try {
      setErr(null);
      const d = await apiFetch("/pnl/dashboard");
      setData(d);
      setCountdown(INTERVAL);
    } catch(e) { setErr(e.message); }
    finally    { setLoading(false); }
  }, []);

  useEffect(() => { load(); const iv = setInterval(load, INTERVAL * 1000); return () => clearInterval(iv); }, [load]);
  useEffect(() => { const iv = setInterval(() => setCountdown(c => c <= 1 ? INTERVAL : c - 1), 1000); return () => clearInterval(iv); }, []);

  if (loading && !data) return <div style={{...sans, padding:40, textAlign:"center", color:C.muted}}>Loading P&amp;L data…</div>;
  if (err) return <div style={{...sans, padding:40, textAlign:"center", color:C.bear}}>Error: {err}</div>;
  if (!data) return null;

  const { account, stats, open_positions, closed_trades, daily_pnl, portfolio, exit_breakdown, strategy_today, is_live, mt_open, mt_closed } = data;

  const pnlCol  = v => v == null ? C.muted : v > 0 ? C.bull : v < 0 ? C.bear : C.muted;
  const fmtDol  = (v, sign=false) => {
    if (v == null) return "—";
    const abs = Math.abs(v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
    return `${v < 0 ? "-" : (sign && v > 0 ? "+" : "")}$${abs}`;
  };
  const fmtDT = s => {
    if (!s) return "—";
    return new Date(s).toLocaleString("en-US", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
  };
  const fmtDTE = expiry => {
    if (!expiry) return "—";
    // Use T12:00:00 (noon local) so DTE stays ≥0 throughout the expiry trading day,
    // matching the AutoTrader tab convention. Plain date strings parse as UTC midnight
    // which produces -1 DTE after 8 PM ET on the eve of expiry.
    const d = new Date(`${expiry.slice(0,4)}-${expiry.slice(4,6)}-${expiry.slice(6,8)}T12:00:00`);
    return Math.floor((d - Date.now()) / 86400000);
  };

  // ── SVG cumulative P&L chart ──────────────────────────────────────────────
  function PnLChart({ pts: pts }) {
    if (pts.length === 0) return (
      <div style={{height:160, display:"flex", alignItems:"center", justifyContent:"center", color:C.muted, ...sans, fontSize:13}}>
        No closed trades yet — chart will appear after the first close
      </div>
    );
    const VW=760, VH=160, PAD={l:65,r:20,t:20,b:32};
    const pW = VW-PAD.l-PAD.r, pH = VH-PAD.t-PAD.b;
    const vals = pts.map(p => p.cumulative);
    const yMin = Math.min(0, ...vals), yMax = Math.max(0, ...vals);
    const yR   = yMax - yMin || 10;
    const xS   = i  => PAD.l + (pts.length > 1 ? (i/(pts.length-1))*pW : pW/2);
    const yS   = v  => PAD.t + pH - ((v - yMin)/yR)*pH;
    const zY   = yS(0);
    const lc   = vals[vals.length-1] >= 0 ? "#16a34a" : "#dc2626";
    const linePts = pts.map((p,i) => `${xS(i).toFixed(1)},${yS(p.cumulative).toFixed(1)}`).join(" ");
    const fillD   = `M ${xS(0)} ${zY} L ${pts.map((p,i)=>`${xS(i)} ${yS(p.cumulative)}`).join(" L ")} L ${xS(pts.length-1)} ${zY} Z`;
    const yTicks  = [yMin, yMin+yR*0.25, yMin+yR*0.5, yMin+yR*0.75, yMax];
    const xIdxs   = pts.length <= 6 ? pts.map((_,i)=>i) :
      [0,1,2,3,4,5].map(i => Math.round(i*(pts.length-1)/5));
    return (
      <svg viewBox={`0 0 ${VW} ${VH}`} style={{width:"100%",height:"auto",overflow:"visible"}}>
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={lc} stopOpacity="0.22"/>
            <stop offset="100%" stopColor={lc} stopOpacity="0.02"/>
          </linearGradient>
        </defs>
        {yTicks.map((v,i) => (
          <g key={i}>
            <line x1={PAD.l} y1={yS(v)} x2={VW-PAD.r} y2={yS(v)} stroke={C.border} strokeWidth="0.5" strokeDasharray="3,3"/>
            <text x={PAD.l-6} y={yS(v)} textAnchor="end" dominantBaseline="middle" style={{...mono,fontSize:9,fill:C.muted}}>
              {v<0?"-":""}${Math.abs(v).toFixed(0)}
            </text>
          </g>
        ))}
        <line x1={PAD.l} y1={zY} x2={VW-PAD.r} y2={zY} stroke={C.muted} strokeWidth="1" strokeOpacity="0.4"/>
        <path d={fillD} fill="url(#pg)"/>
        <polyline points={linePts} fill="none" stroke={lc} strokeWidth="2" strokeLinejoin="round"/>
        <circle cx={xS(pts.length-1)} cy={yS(vals[vals.length-1])} r="4" fill={lc} stroke="white" strokeWidth="1.5"/>
        {xIdxs.map(i => (
          <text key={i} x={xS(i)} y={VH-4} textAnchor="middle" style={{...mono,fontSize:9,fill:C.muted}}>
            {pts[i].date.slice(5)}
          </text>
        ))}
      </svg>
    );
  }

  // ── Paper / Live filter ───────────────────────────────────────────────────
  const matchesMode = t =>
    modeFilter === "all"  ? true :
    modeFilter === "live" ? t.is_paper === 0 :
    (t.is_paper == null || t.is_paper !== 0);  // paper: is_paper=1 or legacy null
  const filteredClosed = (closed_trades || []).filter(matchesMode);
  const filteredOpen   = (open_positions || []).filter(matchesMode);

  // Recompute stats from filtered closed trades
  const todayStr = new Date().toISOString().slice(0,10);
  const fWins    = filteredClosed.filter(t => t.win === 1);
  const fLosses  = filteredClosed.filter(t => t.win === 0);
  const fPnls    = filteredClosed.map(t => t.pnl).filter(p => p != null);
  const fTotalR  = fPnls.reduce((s,p) => s+p, 0);
  const fToday   = filteredClosed
    .filter(t => (t.closed_at||"").slice(0,10) === todayStr)
    .reduce((s,t) => s+(t.pnl||0), 0);
  const fWinRate = filteredClosed.length ? Math.round(fWins.length/filteredClosed.length*1000)/10 : null;
  const fAvgW    = fWins.length   ? Math.round(fWins.reduce((s,t)=>s+(t.pnl||0),0)/fWins.length*100)/100 : 0;
  const fAvgL    = fLosses.length ? Math.round(fLosses.reduce((s,t)=>s+(t.pnl||0),0)/fLosses.length*100)/100 : 0;

  // Filtered per-strategy today summary (used by tiles + StratSection)
  const filteredStrategyToday = {};
  for (const t of filteredClosed) {
    if ((t.closed_at||"").slice(0,10) !== todayStr || t.pnl == null) continue;
    const k = t.strategy_type || "OTHER";
    if (!filteredStrategyToday[k]) filteredStrategyToday[k] = {pnl:0,trades:0,wins:0,losses:0};
    filteredStrategyToday[k].pnl += t.pnl; filteredStrategyToday[k].trades++;
    if (t.win===1) filteredStrategyToday[k].wins++; else filteredStrategyToday[k].losses++;
  }
  if (modeFilter !== "live" && strategy_today?.["SPX_0DTE"] && !filteredStrategyToday["SPX_0DTE"]) {
    filteredStrategyToday["SPX_0DTE"] = strategy_today["SPX_0DTE"];
  }

  // Filtered chart series
  const filteredDailyPnl = (() => {
    if (modeFilter === "all") return daily_pnl;
    const byDay = {};
    for (const t of filteredClosed) {
      const d = (t.closed_at||"").slice(0,10);
      if (d && t.pnl != null) byDay[d] = (byDay[d]||0) + t.pnl;
    }
    let cum = 0;
    return Object.keys(byDay).sort().map(day => {
      cum += byDay[day];
      return { date:day, pnl:Math.round(byDay[day]*100)/100, cumulative:Math.round(cum*100)/100 };
    });
  })();

  const commTracked = stats.total_commission != null && stats.total_commission > 0;
  const cards = [
    { label:"Total P&L",      value:fmtDol(fTotalR,true),                    color:pnlCol(fTotalR),                    sub:`${filteredClosed.length} closed trades` },
    { label:"Unrealized P&L", value:fmtDol(stats.total_unrealized_pnl,true), color:pnlCol(stats.total_unrealized_pnl), sub:`${filteredOpen.length} open · live` },
    { label:"Net P&L",        value:fmtDol(fTotalR + (stats.total_unrealized_pnl||0),true), color:pnlCol(fTotalR + (stats.total_unrealized_pnl||0)), sub:"realized + unrealized" },
    { label:"Today's P&L",    value:fmtDol(fToday,true),                     color:pnlCol(fToday),                     sub:new Date().toLocaleDateString("en-US",{weekday:"short"}) },
    { label:"Win Rate",       value:fWinRate!=null?`${fWinRate}%`:"—",       color:fWinRate>50?C.bull:fWinRate<50?C.bear:C.muted,
      sub:`avg W ${fmtDol(fAvgW)} / L ${fmtDol(fAvgL)}` },
    { label: commTracked ? "Net (after fees)" : "Net Liquidation",
      value: commTracked ? fmtDol(Math.round((fTotalR-(stats.total_commission||0))*100)/100,true) : fmtDol(account.net_liquidation),
      color: commTracked ? pnlCol(fTotalR-(stats.total_commission||0)) : C.accent,
      sub: commTracked ? `fees: ${fmtDol(stats.total_commission)} · liq: ${fmtDol(account.net_liquidation)}` : (account.account||"—") },
  ];

  // ── Group closed trades + open positions by strategy ──────────────────────
  const byStrategy = {};
  for (const t of filteredClosed) {
    const k = t.strategy_type || "OTHER";
    if (!byStrategy[k]) byStrategy[k] = { closed:[], open:[] };
    byStrategy[k].closed.push(t);
  }
  for (const p of filteredOpen) {
    const k = p.strategy_type || "UNTRACKED";
    if (!byStrategy[k]) byStrategy[k] = { closed:[], open:[] };
    byStrategy[k].open.push(p);
  }

  return (
    <div style={{animation:"fadeIn 0.2s ease"}}>
      {/* Header row */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{...sans,fontSize:10,textTransform:"uppercase",letterSpacing:2,color:C.muted}}>P&amp;L Dashboard</div>
          <span style={{
            ...sans, fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:10,
            background: is_live ? "#ff000022" : "#0088ff22",
            color:      is_live ? C.bear       : C.accent,
            border:     `1px solid ${is_live ? C.bear : C.accent}44`,
          }}>{is_live ? "LIVE" : "PAPER"}</span>
          {/* Mode filter toggle */}
          <div style={{display:"flex",gap:4,background:"#00000022",borderRadius:8,padding:3}}>
            {[["all","All"],["paper","📄 Paper"],["live","🔴 Live"]].map(([v,lbl])=>(
              <button key={v} onClick={()=>setModeFilter(v)} style={{
                ...sans, fontSize:11, fontWeight:modeFilter===v?700:400,
                padding:"3px 10px", borderRadius:6, border:"none", cursor:"pointer",
                background: modeFilter===v ? (v==="live"?"#ff000033":v==="paper"?"#0088ff33":"#ffffff22") : "transparent",
                color: modeFilter===v ? (v==="live"?C.bear:v==="paper"?C.accent:C.text) : C.muted,
              }}>{lbl}</button>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          {loading && <Spinner/>}
          <span style={{...mono,fontSize:11,color:C.muted}}>refresh in {countdown}s</span>
          <Btn onClick={load} color={C.accent}>↻ Refresh Now</Btn>
        </div>
      </div>

      {/* Summary cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10,marginBottom:20}}>
        {cards.map(c => (
          <Card key={c.label} style={{textAlign:"center",padding:"12px 8px"}}>
            <div style={{...sans,fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>{c.label}</div>
            <div style={{...mono,fontSize:16,fontWeight:800,color:c.color,marginBottom:4}}>{c.value}</div>
            <div style={{...sans,fontSize:10,color:C.muted}}>{c.sub}</div>
          </Card>
        ))}
      </div>

      {/* Chart */}
      <Card style={{marginBottom:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{...sans,fontSize:10,textTransform:"uppercase",letterSpacing:2,color:C.muted}}>Cumulative Realized P&amp;L</div>
          {filteredDailyPnl.length > 0 && (
            <div style={{display:"flex",gap:20}}>
              <span style={{...mono,fontSize:11,color:C.muted}}>Best day: <span style={{color:C.bull}}>{fmtDol(Math.max(...filteredDailyPnl.map(d=>d.pnl)),true)}</span></span>
              <span style={{...mono,fontSize:11,color:C.muted}}>Worst day: <span style={{color:C.bear}}>{fmtDol(Math.min(...filteredDailyPnl.map(d=>d.pnl)),true)}</span></span>
              <span style={{...mono,fontSize:11,color:C.muted}}>Total: <span style={{color:pnlCol(fTotalR)}}>{fmtDol(fTotalR,true)}</span></span>
            </div>
          )}
        </div>
        <PnLChart pts={filteredDailyPnl}/>
      </Card>

      {/* Today by Strategy — compact tiles */}
      {(() => {
        if (Object.keys(filteredStrategyToday).length === 0) return null;
        const totalToday = Object.values(filteredStrategyToday).reduce((s,v)=>s+(v.pnl||0),0);
        const strategy_today_display = filteredStrategyToday;
        return (
          <Card style={{marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{...sans,fontSize:10,textTransform:"uppercase",letterSpacing:2,color:C.muted}}>Today by Strategy</div>
              <div style={{...mono,fontSize:14,fontWeight:700,color:totalToday>=0?C.bull:C.bear}}>
                {fmtDol(totalToday,true)} total
              </div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {Object.entries(strategy_today_display).sort((a,b)=>Math.abs(b[1].pnl)-Math.abs(a[1].pnl)).map(([key,val])=>{
                const m = STRAT_META[key] || { label:key, color:C.muted };
                const pnl = val.pnl || 0;
                return (
                  <div key={key} style={{
                    display:"flex", alignItems:"center", gap:10, padding:"8px 14px",
                    background:C.bg, border:`1px solid ${m.color}44`, borderLeft:`3px solid ${m.color}`,
                    borderRadius:8, minWidth:170,
                  }}>
                    <div>
                      <div style={{...sans,fontSize:10,color:C.muted,marginBottom:2}}>{m.label}</div>
                      <div style={{...mono,fontSize:15,fontWeight:700,color:pnl>=0?C.bull:C.bear}}>
                        {fmtDol(pnl,true)}
                      </div>
                    </div>
                    <div style={{marginLeft:"auto",textAlign:"right"}}>
                      <div style={{...mono,fontSize:10,color:C.muted}}>{val.trades||0} trade{val.trades!==1?"s":""}</div>
                      {(val.wins||0)+(val.losses||0) > 0 && (
                        <div style={{...mono,fontSize:10}}>
                          <span style={{color:C.bull}}>{val.wins||0}W</span>
                          <span style={{color:C.muted}}> / </span>
                          <span style={{color:C.bear}}>{val.losses||0}L</span>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        );
      })()}

      {/* ── Per-Strategy Sections ─────────────────────────────────────────── */}
      <div style={{...sans,fontSize:10,textTransform:"uppercase",letterSpacing:2,color:C.muted,marginBottom:10,marginTop:4}}>
        Per-Strategy P&amp;L
      </div>
      {STRAT_ORDER.filter(k => byStrategy[k]).map(k => (
        <StratSection
          key={k}
          stratKey={k}
          closed={byStrategy[k].closed}
          openPos={byStrategy[k].open}
          todaySummary={filteredStrategyToday[k]}
          fmtDol={fmtDol}
          pnlCol={pnlCol}
          fmtDT={fmtDT}
          fmtDTE={fmtDTE}
        />
      ))}
      {Object.keys(byStrategy).filter(k => !STRAT_ORDER.includes(k)).map(k => (
        <StratSection
          key={k}
          stratKey={k}
          closed={byStrategy[k].closed}
          openPos={byStrategy[k].open}
          todaySummary={filteredStrategyToday[k]}
          fmtDol={fmtDol}
          pnlCol={pnlCol}
          fmtDT={fmtDT}
          fmtDTE={fmtDTE}
        />
      ))}

      {/* ── Manual Trader spreads (spread-level P&L, authoritative) ─────────── */}
      {((mt_open && mt_open.length > 0) || (mt_closed && mt_closed.length > 0)) && (() => {
        const effPnl = pos => {
          const hasFills = pos.close_fills && Object.keys(pos.close_fills).length > 0;
          return hasFills ? (pos.close_pnl ?? 0) : (pos.live_pnl ?? pos.close_pnl ?? 0);
        };
        const totalOpen   = (mt_open   || []).reduce((s,p) => s + (p.live_pnl   ?? 0), 0);
        const totalClosed = (mt_closed || []).reduce((s,p) => s + (effPnl(p) ?? 0), 0);
        return (
          <Card style={{marginBottom:10, marginTop:4}}>
            <div style={{display:"flex", alignItems:"baseline", gap:12, marginBottom:10}}>
              <span style={{...sans, fontSize:13, fontWeight:700, color:C.text}}>Manual Trader</span>
              <span style={{...mono, fontSize:12, color:pnlCol(totalOpen), fontWeight:700}}>
                Open: {totalOpen >= 0 ? "+" : ""}{totalOpen.toFixed(2)}
              </span>
              <span style={{...mono, fontSize:12, color:pnlCol(totalClosed), fontWeight:700}}>
                Closed: {totalClosed >= 0 ? "+" : ""}{totalClosed.toFixed(2)}
              </span>
              <span style={{...sans, fontSize:10, color:C.muted}}>spread-level P&L</span>
            </div>

            {/* Open spreads */}
            {(mt_open || []).length > 0 && (
              <div style={{marginBottom:8}}>
                <div style={{...sans, fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:1, marginBottom:4}}>Open</div>
                <table style={{width:"100%", borderCollapse:"collapse", fontSize:12}}>
                  <thead>
                    <tr style={{color:C.muted}}>
                      {["Name","Ticker","Strategy","Expiry","Entry Credit","Live P&L","Target","Stop"].map(h => (
                        <th key={h} style={{...sans, fontWeight:600, fontSize:10, textAlign:"left", padding:"2px 8px 4px 0", borderBottom:`1px solid ${C.border}`}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {(mt_open || []).map(pos => (
                      <tr key={pos.pos_id} style={{borderBottom:`1px solid ${C.border}22`}}>
                        <td style={{...sans, padding:"4px 8px 4px 0", color:C.text}}>{pos.name}</td>
                        <td style={{...mono, padding:"4px 8px 4px 0", color:C.accent}}>{pos.ticker}</td>
                        <td style={{...sans, padding:"4px 8px 4px 0", color:C.muted, fontSize:11}}>{(pos.strategy||"").replace(/_/g," ")}</td>
                        <td style={{...mono, padding:"4px 8px 4px 0", color:C.muted, fontSize:11}}>{pos.expiry ? `${pos.expiry.slice(4,6)}/${pos.expiry.slice(6,8)}` : "—"}</td>
                        <td style={{...mono, padding:"4px 8px 4px 0", color:C.bull, fontVariantNumeric:"tabular-nums"}}>{pos.net_entry != null ? `+${pos.net_entry.toFixed(2)}` : "—"}</td>
                        <td style={{...mono, padding:"4px 8px 4px 0", color:pnlCol(pos.live_pnl), fontWeight:700, fontVariantNumeric:"tabular-nums"}}>
                          {pos.live_pnl != null ? (pos.live_pnl >= 0 ? "+" : "") + pos.live_pnl.toFixed(2) : "—"}
                        </td>
                        <td style={{...mono, padding:"4px 8px 4px 0", color:C.bull, fontSize:11}}>{pos.profit_target_usd != null ? `+${pos.profit_target_usd.toFixed(0)}` : "—"}</td>
                        <td style={{...mono, padding:"4px 8px 4px 0", color:C.bear, fontSize:11}}>{pos.stop_loss_usd != null ? pos.stop_loss_usd.toFixed(0) : "—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {/* Closed spreads */}
            {(mt_closed || []).length > 0 && (
              <div>
                <div style={{...sans, fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:1, marginBottom:4}}>Closed</div>
                <table style={{width:"100%", borderCollapse:"collapse", fontSize:12}}>
                  <thead>
                    <tr style={{color:C.muted}}>
                      {["Name","Ticker","Entry Credit","Realized P&L","Exit Reason","Closed At"].map(h => (
                        <th key={h} style={{...sans, fontWeight:600, fontSize:10, textAlign:"left", padding:"2px 8px 4px 0", borderBottom:`1px solid ${C.border}`}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {(mt_closed || []).map((pos,i) => {
                      const pnl = effPnl(pos);
                      const hasFills = pos.close_fills && Object.keys(pos.close_fills).length > 0;
                      return (
                        <tr key={pos.pos_id || i} style={{borderBottom:`1px solid ${C.border}22`}}>
                          <td style={{...sans, padding:"4px 8px 4px 0", color:C.text}}>{pos.name}</td>
                          <td style={{...mono, padding:"4px 8px 4px 0", color:C.accent}}>{pos.ticker}</td>
                          <td style={{...mono, padding:"4px 8px 4px 0", color:C.bull, fontVariantNumeric:"tabular-nums"}}>{pos.net_entry != null ? `+${pos.net_entry.toFixed(2)}` : "—"}</td>
                          <td style={{...mono, padding:"4px 8px 4px 0", color:pnlCol(pnl), fontWeight:700, fontVariantNumeric:"tabular-nums"}}>
                            {pnl != null ? (pnl >= 0 ? "+" : "") + pnl.toFixed(2) + (!hasFills ? "*" : "") : "—"}
                          </td>
                          <td style={{...sans, padding:"4px 8px 4px 0", color:C.muted, fontSize:11}}>{pos.close_reason || "—"}</td>
                          <td style={{...mono, padding:"4px 8px 4px 0", color:C.muted, fontSize:11}}>{pos.closed_at ? pos.closed_at.slice(0,10) : "—"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div style={{...sans, fontSize:10, color:C.muted, marginTop:4}}>* mark-to-market at close (no fill record)</div>
              </div>
            )}
          </Card>
        );
      })()}

      {/* Exit breakdown — compact, collapsible */}
      {Object.keys(exit_breakdown).length > 0 && (
        <ExitBreakdown exit_breakdown={exit_breakdown} fmtDol={fmtDol} pnlCol={pnlCol} />
      )}

      {/* Portfolio Delta + Orders — collapsible */}
      <Card style={{ marginTop:10 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, cursor:"pointer" }}
             onClick={() => { setDeltaOpen(o => !o); if (!deltaData) loadDelta(); }}>
          <span style={{ ...sans, fontWeight:700, fontSize:13, color:C.text }}>
            {deltaOpen ? "▾" : "▸"} Portfolio Delta &amp; Open Orders
          </span>
          {deltaData && (
            <span style={{ ...mono, fontSize:14, fontWeight:700,
              color: Math.abs(deltaData.total_delta||0) > 300 ? C.bear :
                     Math.abs(deltaData.total_delta||0) < 50  ? C.bull : C.neutral }}>
              Net Δ {(deltaData.total_delta||0) >= 0 ? "+" : ""}{deltaData.total_delta||0}
            </span>
          )}
          {deltaData && ordersData?.count > 0 && (
            <span style={{ ...sans, fontSize:11, color:C.bear, fontWeight:600 }}>
              {ordersData.count} open order{ordersData.count !== 1 ? "s" : ""}
            </span>
          )}
          <button onClick={e => { e.stopPropagation(); loadDelta(); }} style={{
            ...sans, marginLeft:"auto", fontSize:11, padding:"3px 10px", borderRadius:6,
            background:C.bg, border:`1px solid ${C.border}`, color:C.muted, cursor:"pointer",
          }}>{deltaLoading ? "Loading…" : "↻ Refresh"}</button>
        </div>

        {deltaOpen && deltaData && (
          <div style={{ marginTop:14 }}>
            <div style={{ overflowX:"auto", marginBottom:16 }}>
              <table style={{ fontSize:12, width:"100%", borderCollapse:"collapse" }}>
                <thead><tr>{["Symbol","Type","Strike","Expiry","DTE","Qty","Avg Cost","Mkt Value","Unreal P&L","δ","Net Δ"].map(h=>(
                  <th key={h} style={{ ...sans, color:C.muted, fontWeight:600, borderBottom:`1px solid ${C.border}`, padding:"5px 8px", fontSize:11 }}>{h}</th>
                ))}</tr></thead>
                <tbody>{(deltaData.positions||[]).map((p,i)=>(
                  <tr key={i} style={{ borderBottom:`1px solid ${C.border}33` }}>
                    <td style={{ ...mono, color:C.accent, fontWeight:700, padding:"5px 8px" }}>{p.symbol}</td>
                    <td style={{ ...mono, fontSize:11, padding:"5px 8px",
                      color: p.right==="C"?C.bull:p.right==="P"?C.bear:C.muted, fontWeight:600 }}>
                      {strategyLabel(p)}
                    </td>
                    <td style={{ ...mono, padding:"5px 8px" }}>{p.strike ? `$${p.strike}` : "—"}</td>
                    <td style={{ ...mono, color:C.muted, padding:"5px 8px", fontSize:11 }}>{p.expiry||"—"}</td>
                    <td style={{ ...mono, padding:"5px 8px",
                      color:p.dte<21?C.bear:p.dte<30?C.neutral:C.muted }}>
                      {p.dte != null ? `${p.dte}d` : "—"}
                    </td>
                    <td style={{ ...mono, padding:"5px 8px",
                      color:p.position>=0?C.bull:C.bear, fontWeight:700 }}>{p.position}</td>
                    <td style={{ ...mono, padding:"5px 8px" }}>{p.avg_cost ? `$${Number(p.avg_cost).toFixed(2)}` : "—"}</td>
                    <td style={{ ...mono, padding:"5px 8px" }}>{p.market_value != null ? `$${Number(p.market_value).toFixed(0)}` : "—"}</td>
                    <td style={{ ...mono, padding:"5px 8px", fontWeight:600,
                      color:p.unrealized_pnl>=0?C.bull:C.bear }}>
                      {p.unrealized_pnl != null ? `${p.unrealized_pnl>=0?"+":""}$${Math.abs(p.unrealized_pnl).toFixed(0)}` : "—"}
                    </td>
                    <td style={{ ...mono, padding:"5px 8px" }}>{p.delta != null ? p.delta.toFixed(3) : "—"}</td>
                    <td style={{ ...mono, padding:"5px 8px", fontWeight:700,
                      color:p.position_delta>=0?C.bull:C.bear }}>
                      {p.position_delta != null ? `${p.position_delta>=0?"+":""}${p.position_delta.toFixed(1)}` : "—"}
                    </td>
                  </tr>
                ))}
                {(deltaData.positions||[]).length === 0 && (
                  <tr><td colSpan={11} style={{ ...sans, color:C.muted, padding:"20px", textAlign:"center" }}>
                    No positions in IBKR — refresh and ensure you are connected
                  </td></tr>
                )}
                </tbody>
              </table>
            </div>

            {/* Open orders */}
            {ordersData?.count > 0 && (
              <div>
                <div style={{ ...sans, fontSize:11, fontWeight:700, color:C.text, marginBottom:8,
                  display:"flex", alignItems:"center", gap:10 }}>
                  Open Orders ({ordersData.count})
                  {ordersData.orders.some(o => o.status === "Inactive") && (
                    <Btn onClick={cancelInactiveOrders} color={C.bear} style={{ padding:"2px 10px", fontSize:10 }}>
                      ✕ Cancel All Inactive
                    </Btn>
                  )}
                </div>
                <table style={{ fontSize:12, width:"100%", borderCollapse:"collapse" }}>
                  <thead><tr>{["ID","Ticker","Contract","Action","Qty","Limit","Status","Cancel"].map(h=>(
                    <th key={h} style={{ ...sans, color:C.muted, fontWeight:600, borderBottom:`1px solid ${C.border}`, padding:"4px 8px", fontSize:11 }}>{h}</th>
                  ))}</tr></thead>
                  <tbody>{ordersData.orders.map((o,i)=>(
                    <tr key={i} style={{ borderBottom:`1px solid ${C.border}33`,
                      background: o.status==="Inactive" ? "#fff5f5" : undefined }}>
                      <td style={{ ...mono, color:C.muted, padding:"5px 8px" }}>{o.order_id}</td>
                      <td style={{ ...mono, color:C.accent, fontWeight:700, padding:"5px 8px" }}>{o.ticker}</td>
                      <td style={{ ...mono, fontSize:10, color:C.muted, padding:"5px 8px" }}>
                        {o.right}{o.strike ? `$${o.strike}` : ""} {o.expiry ? o.expiry.slice(0,8) : ""}
                      </td>
                      <td style={{ ...mono, padding:"5px 8px",
                        color:o.action==="BUY"?C.bull:C.bear, fontWeight:700 }}>{o.action}</td>
                      <td style={{ ...mono, padding:"5px 8px" }}>{o.quantity}</td>
                      <td style={{ ...mono, padding:"5px 8px" }}>${Number(o.limit_price||0).toFixed(2)}</td>
                      <td style={{ ...mono, padding:"5px 8px",
                        color:o.status==="Inactive"?C.bear:C.neutral }}>
                        {o.status}{o.why_held ? ` (${o.why_held})` : ""}
                      </td>
                      <td style={{ padding:"5px 8px" }}>
                        <Btn onClick={() => cancelOrder(o.order_id)} color={C.bear} style={{ padding:"2px 8px", fontSize:10 }}>✕</Btn>
                      </td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            )}
            {ordersData?.count === 0 && (
              <div style={{ ...sans, fontSize:12, color:C.muted }}>No open orders</div>
            )}
          </div>
        )}
      </Card>
    </div>
  );
}

// ── Technicals Tab ────────────────────────────────────────────────────────
function TechnicalsTab() {
  const [ticker,  setTicker]  = useState("");
  const [loading, setLoading] = useState(false);
  const [result,  setResult]  = useState(null);
  const [error,   setError]   = useState(null);

  async function analyze() {
    const t = ticker.trim().toUpperCase();
    if (!t) return;
    setLoading(true); setError(null); setResult(null);
    try {
      const r = await apiFetch(`/technicals/${t}`);
      setResult(r);
    } catch(e) {
      setError(e?.detail || e?.message || String(e));
    } finally {
      setLoading(false);
    }
  }

  const overallColors = {
    strong_buy:  { bg:"#16a34a22", col:"#16a34a", label:"STRONG BUY" },
    buy:         { bg:"#22c55e22", col:"#22c55e", label:"BUY" },
    neutral:     { bg:"#94a3b822", col:"#64748b", label:"NEUTRAL" },
    sell:        { bg:"#f9731622", col:"#f97316", label:"SELL" },
    strong_sell: { bg:"#dc262622", col:"#dc2626", label:"STRONG SELL" },
  };

  const trendColors = { bullish:"#16a34a", bearish:"#dc2626", mixed:"#f97316" };

  function Pill({ label, color, bg }) {
    return (
      <span style={{ fontSize:11, fontWeight:700, padding:"2px 10px", borderRadius:10,
                     background: bg || color+"22", color, border:`1px solid ${color}44` }}>
        {label}
      </span>
    );
  }

  function GaugeBar({ value, min=0, max=100, thresholds, label }) {
    // thresholds: [{at, color}] defining color zones
    const pct = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
    const color = thresholds?.slice().reverse().find(t => value >= t.at)?.color || C.accent;
    return (
      <div>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.muted, marginBottom:3 }}>
          <span>{label}</span><span style={{ color, fontWeight:700 }}>{value?.toFixed(1)}</span>
        </div>
        <div style={{ height:8, borderRadius:4, background:C.border }}>
          <div style={{ height:"100%", borderRadius:4, width:`${pct}%`, background:color, transition:"width 0.3s" }}/>
        </div>
      </div>
    );
  }

  const ind = result?.indicators || {};
  const sum = result?.summary || {};
  const brk = result?.breakout || {};
  const ivr = result?.iv_rank  || {};
  const oc  = overallColors[sum.overall] || overallColors.neutral;

  return (
    <div>
      <Card title="Technical Analysis — IBKR Live Data">
        <div style={{ display:"flex", gap:10, marginBottom:16, alignItems:"center" }}>
          <input
            value={ticker}
            onChange={e => setTicker(e.target.value.toUpperCase())}
            onKeyDown={e => e.key === "Enter" && analyze()}
            placeholder="Ticker symbol (e.g. AAPL)"
