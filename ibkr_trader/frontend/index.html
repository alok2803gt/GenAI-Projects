                              e.tape_label.includes("BULL") ? "#16a34a44"
                              : e.tape_label.includes("BEAR") ? "#7f1d1d44" : C.border}`,
                            borderRadius:4, padding:"2px 6px", fontSize:10, fontWeight:700,
                            whiteSpace:"nowrap"
                          }}>
                          {e.tape_confirmed ? "✓ " : ""}{e.tape_label.replace("STRONGLY ", "S.")}
                        </span>
                      ) : (
                        <span style={{ color:C.muted, fontSize:11 }}>—</span>
                      )}
                    </td>
                    <td style={{ padding:"8px 10px", minWidth:120 }}>
                      {(() => {
                        const px = e.current_price || e.price_at_alert || 1;
                        return (
                          <div style={{ fontFamily:"monospace", fontSize:11, lineHeight:1.6 }}>
                            {e.sr_resistance != null ? (
                              <div title="Nearest swing resistance above price">
                                <span style={{ color:"#fca5a5", fontWeight:700 }}>R</span>
                                <span style={{ color:C.white }}> ${e.sr_resistance.toFixed(2)}</span>
                                <span style={{ color:C.muted }}> +{((e.sr_resistance/px-1)*100).toFixed(1)}%</span>
                              </div>
                            ) : null}
                            {e.sr_support != null ? (
                              <div title="Nearest swing support below price">
                                <span style={{ color:"#86efac", fontWeight:700 }}>S</span>
                                <span style={{ color:C.white }}> ${e.sr_support.toFixed(2)}</span>
                                <span style={{ color:C.muted }}> -{((px/e.sr_support-1)*100).toFixed(1)}%</span>
                              </div>
                            ) : null}
                            {e.sr_resistance == null && e.sr_support == null
                              ? <span style={{ color:C.muted }}>—</span>
                              : null}
                          </div>
                        );
                      })()}
                    </td>
                    <td style={{ padding:"8px 10px" }}>
                      <button onClick={() => remove(e.ticker)} style={{
                        background:"none", border:"none", color:C.muted, cursor:"pointer",
                        fontSize:16, lineHeight:1, padding:"2px 6px",
                      }} title="Remove">×</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}


// ── Live Tape Tab ─────────────────────────────────────────────────────────
function TapeTab() {
  const [ticker,    setTicker]  = useState("MSFT");
  const [blockSize, setBlock]   = useState(5000);
  const [running,   setRunning] = useState(false);
  const [status,    setStatus]  = useState("idle");   // idle|connecting|live|error
  const [errMsg,    setErrMsg]  = useState("");
  const [ticks,     setTicks]   = useState([]);        // newest first, max 200
  const [stats,     setStats]   = useState(null);
  const wsRef = useRef(null);

  const stop = useCallback(() => {
    if (wsRef.current) { wsRef.current.close(); wsRef.current = null; }
    setRunning(false);
    setStatus("idle");
  }, []);

  const start = useCallback(() => {
    stop();
    const sym = ticker.trim().toUpperCase();
    if (!sym) return;
    setStatus("connecting");
    setTicks([]);
    setStats(null);
    setErrMsg("");

    const ws = new WebSocket(`ws://localhost:8000/ws/tape/${sym}?block=${blockSize}`);
    wsRef.current = ws;

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "connected") {
        setRunning(true);
        setStatus("live");
      } else if (msg.type === "error") {
        setErrMsg(msg.message);
        setStatus("error");
        setRunning(false);
      } else if (msg.type === "tick") {
        setStats({
          price:         msg.price,
          vwap:          msg.vwap,
          cum_vol:       msg.cum_vol,
          buy_vol:       msg.buy_vol,
          sell_vol:      msg.sell_vol,
          delta:         msg.delta,
          block_count:   msg.block_count,
          open_price:    msg.open_price,
          pct_from_open: msg.pct_from_open,
          vwap_story:    msg.vwap_story,
          delta_story:   msg.delta_story,
          direction:     msg.direction,
        });
        setTicks(prev => [msg, ...prev].slice(0, 200));
      }
    };
    ws.onclose = () => { setRunning(false); };
    ws.onerror = () => {
      setErrMsg("WebSocket connection failed — is the backend running on port 8000?");
      setStatus("error");
      setRunning(false);
    };
  }, [ticker, blockSize, stop]);

  useEffect(() => () => stop(), [stop]);

  const dirArrow = (d) => d > 0 ? "↑" : d < 0 ? "↓" : "→";
  const dirCol   = (d) => d > 0 ? C.bull : d < 0 ? C.bear : C.neutral;

  const fmtV = (v) => {
    if (v == null) return "—";
    if (v >= 1e6)  return `${(v/1e6).toFixed(2)}M`;
    if (v >= 1e3)  return `${(v/1e3).toFixed(1)}K`;
    return String(v);
  };

  const statusBadge = () => {
    if (status === "live")       return { label:"● LIVE",          color:C.bull };
    if (status === "connecting") return { label:"○ CONNECTING…",   color:C.neutral };
    if (status === "error")      return { label:"✕ ERROR",         color:C.bear };
    return                              { label:"○ NOT STARTED",   color:C.muted };
  };
  const badge = statusBadge();

  const MetricBox = ({ label, value, sub, color }) => (
    <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10,
      padding:"14px 12px", textAlign:"center", boxShadow:"0 1px 4px rgba(0,0,0,0.07)" }}>
      <div style={{ ...sans, fontSize:10, color:C.muted, textTransform:"uppercase",
        letterSpacing:1, marginBottom:6 }}>{label}</div>
      <div style={{ ...mono, fontSize:22, fontWeight:800, color: color||C.white }}>{value}</div>
      {sub && <div style={{ ...sans, fontSize:10, color:color||C.muted, marginTop:3 }}>{sub}</div>}
    </div>
  );

  return (
    <div>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start",
        marginBottom:16, flexWrap:"wrap", gap:10 }}>
        <div>
          <div style={{ ...sans, fontSize:17, fontWeight:700, color:C.white }}>Live Tape Reader</div>
          <div style={{ ...sans, fontSize:12, color:C.muted, marginTop:2 }}>
            Every trade that happens in real time — who is buying, who is selling, and what it means
          </div>
        </div>
        <span style={{ ...mono, fontSize:11, color:badge.color, padding:"4px 12px",
          border:`1px solid ${badge.color}44`, borderRadius:20,
          background:`${badge.color}11`, whiteSpace:"nowrap" }}>
          {badge.label}
        </span>
      </div>

      {/* Controls */}
      <Card style={{ marginBottom:14 }}>
        <div style={{ display:"flex", gap:12, alignItems:"flex-end", flexWrap:"wrap" }}>
          <div>
            <div style={{ ...sans, fontSize:11, color:C.muted, marginBottom:4 }}>Ticker</div>
            <input
              value={ticker}
              onChange={e => setTicker(e.target.value.toUpperCase())}
              onKeyDown={e => e.key==="Enter" && !running && start()}
              disabled={running}
              placeholder="MSFT"
              style={{ ...mono, fontSize:15, fontWeight:700, width:90, padding:"6px 10px",
                border:`1px solid ${C.border}`, borderRadius:6, background:C.dim,
                color:C.text, outline:"none" }}
            />
          </div>
          <div>
            <div style={{ ...sans, fontSize:11, color:C.muted, marginBottom:4 }}>
              Block alert ≥ (shares)
            </div>
            <input
              type="number"
              value={blockSize}
              onChange={e => setBlock(Number(e.target.value))}
              disabled={running}
              style={{ ...mono, fontSize:13, width:100, padding:"6px 10px",
                border:`1px solid ${C.border}`, borderRadius:6, background:C.dim,
                color:C.text, outline:"none" }}
            />
          </div>
          {!running ? (
            <button onClick={start} style={{
              ...sans, fontSize:13, fontWeight:700, padding:"8px 22px", borderRadius:6,
              background:C.accent, border:"none", color:"#fff", cursor:"pointer" }}>
              ▶ Start
            </button>
          ) : (
            <button onClick={stop} style={{
              ...sans, fontSize:13, fontWeight:700, padding:"8px 22px", borderRadius:6,
              background:C.bear, border:"none", color:"#fff", cursor:"pointer" }}>
              ■ Stop
            </button>
          )}
          {status === "connecting" && (
            <span style={{ ...sans, fontSize:12, color:C.muted }}>
              <span className="spin">⟳</span> Connecting to TWS…
            </span>
          )}
        </div>

        {errMsg && (
          <div style={{ marginTop:10, padding:"8px 12px", background:`${C.bear}11`,
            border:`1px solid ${C.bear}33`, borderRadius:6, ...sans, fontSize:12, color:C.bear }}>
            ⚠ {errMsg}
          </div>
        )}

        <div style={{ marginTop:12, padding:"10px 12px", background:C.dim, borderRadius:6,
          ...sans, fontSize:11, color:C.muted, lineHeight:1.7 }}>
          <b>What is the tape?</b> The tape shows every single trade that executes for this stock —
          the exact price, number of shares, and which direction the price moved. Small trades (under {blockSize.toLocaleString()} shares)
          are usually individual investors. Large "block" trades come from institutions like funds and banks
          moving serious money. Watching the tape tells you who is in control of the price right now.
        </div>
      </Card>

      {/* Live stats bar */}
      {stats && (() => {
        const priceCol = dirCol(stats.direction);
        const deltaCol = stats.delta >= 0 ? C.bull : C.bear;
        const pctStr   = stats.pct_from_open != null
          ? `${stats.pct_from_open >= 0 ? "+" : ""}${stats.pct_from_open.toFixed(2)}% from open`
          : null;
        return (
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",
            gap:10, marginBottom:14 }}>
            <MetricBox
              label="Last Trade Price"
              value={`$${stats.price.toFixed(2)}`}
              sub={pctStr}
              color={priceCol}
            />
            <MetricBox
              label="VWAP (Today's Avg)"
              value={`$${stats.vwap.toFixed(2)}`}
              sub="Volume-weighted avg price"
              color={C.neutral}
            />
            <MetricBox
              label="Volume Seen"
              value={fmtV(stats.cum_vol)}
              sub="Shares captured on tape"
            />
            <MetricBox
              label={stats.delta >= 0 ? "Net Buyers" : "Net Sellers"}
              value={`${stats.delta >= 0 ? "+" : ""}${fmtV(Math.abs(stats.delta))}`}
              sub={stats.delta >= 0 ? "More bought than sold" : "More sold than bought"}
              color={deltaCol}
            />
            <MetricBox
              label="Block Trades"
              value={stats.block_count}
              sub={`Large prints ≥ ${blockSize.toLocaleString()}`}
              color="#8b5cf6"
            />
          </div>
        );
      })()}

      {/* Plain-English market story */}
      {stats && (
        <Card title="What Is The Market Telling Us Right Now?" style={{ marginBottom:14 }}>
          <div style={{ ...sans, fontSize:13, color:C.text, lineHeight:1.8 }}>
            <p style={{ marginBottom:8 }}>
              <b style={{ color: stats.delta >= 0 ? C.bull : C.bear }}>
                {stats.delta >= 0 ? "Buyers" : "Sellers"} are currently in control.&nbsp;
              </b>
              {stats.delta_story}.
            </p>
            <p style={{ marginBottom:8 }}>
              <b>Price vs. today's average: </b>{stats.vwap_story}.
            </p>
            {stats.block_count > 0 && (
              <p style={{ color:"#7c3aed", fontWeight:600 }}>
                {stats.block_count} large block trade{stats.block_count > 1 ? "s" : ""} detected —
                institutional money (funds, banks, desks) is active in this name today.
              </p>
            )}
          </div>

          <div style={{ marginTop:12, padding:"10px 12px", background:C.dim, borderRadius:6,
            ...sans, fontSize:11, color:C.muted, lineHeight:1.7 }}>
            <b>Reading guide:</b>&nbsp;
            <b style={{color:C.bull}}>↑ green rows</b> = the last trade happened at a higher price (buyers stepping up).&nbsp;
            <b style={{color:C.bear}}>↓ red rows</b> = the last trade happened at a lower price (sellers pushing down).&nbsp;
            <b style={{color:"#8b5cf6"}}>🏦 BLOCK rows</b> = a large institution traded.
            These moves often signal conviction — watch whether they happen above or below VWAP.
          </div>
        </Card>
      )}

      {/* Live tape table */}
      {ticks.length > 0 && (
        <Card style={{ padding:0, overflow:"hidden" }}>
          <div style={{ padding:"12px 16px", borderBottom:`1px solid ${C.border}`,
            display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <span style={{ ...sans, fontSize:13, fontWeight:700, color:C.white }}>
              Trade Prints — {ticker.toUpperCase()}&nbsp;
              <span style={{ ...mono, fontSize:11, color:C.muted }}>
                ({ticks.length} prints shown, newest first)
              </span>
            </span>
            <span style={{ ...sans, fontSize:11, color:C.muted }}>
              Newest at top · Max 200 rows kept in view
            </span>
          </div>

          <div style={{ overflowX:"auto", maxHeight:500, overflowY:"auto" }}>
            <table style={{ fontSize:12, width:"100%" }}>
              <thead style={{ position:"sticky", top:0, background:C.surface, zIndex:1 }}>
                <tr>
                  {["Time","Price","Shares","Dir","Exchange","What Happened"].map(h => (
                    <th key={h} style={{ ...mono, fontSize:10, color:C.muted, fontWeight:600,
                      textTransform:"uppercase", letterSpacing:0.5,
                      borderBottom:`1px solid ${C.border}`, padding:"7px 10px",
                      whiteSpace:"nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {ticks.map((t, i) => {
                  const col = dirCol(t.direction);
                  if (t.is_block) {
                    return (
                      <tr key={i} style={{
                        background: t.direction >= 0 ? `${C.bull}14` : `${C.bear}14`,
                        borderLeft: `4px solid ${col}`,
                      }}>
                        <td style={{ ...mono, fontSize:11, color:col, padding:"9px 10px", whiteSpace:"nowrap" }}>
                          {t.time}
                        </td>
                        <td style={{ ...mono, fontSize:14, fontWeight:800, color:col, padding:"9px 10px" }}>
                          ${t.price.toFixed(2)}
                        </td>
                        <td style={{ ...mono, fontSize:13, fontWeight:700, color:col, padding:"9px 10px" }}>
                          {t.size.toLocaleString()}
                        </td>
                        <td style={{ ...mono, fontSize:16, color:col, padding:"9px 10px" }}>
                          {dirArrow(t.direction)}
                        </td>
                        <td style={{ ...mono, fontSize:11, padding:"9px 10px" }}>
                          <span style={{ color:col }}>{t.exchange}</span>
                          {t.is_after_hours && (
                            <span style={{ ...mono, fontSize:9, color:"#8b5cf6",
                              marginLeft:4, background:"#8b5cf611", padding:"1px 5px", borderRadius:8 }}>
                              AH
                            </span>
                          )}
                        </td>
                        <td style={{ ...sans, fontSize:12, color:col, fontWeight:600, padding:"9px 10px" }}>
                          🏦 {t.block_story || t.what_happened}
                        </td>
                      </tr>
                    );
                  }
                  return (
                    <tr key={i} style={{ borderBottom:`1px solid ${C.border}` }}>
                      <td style={{ ...mono, fontSize:11, color:C.muted, padding:"5px 10px", whiteSpace:"nowrap" }}>
                        {t.time}
                      </td>
                      <td style={{ ...mono, fontSize:12, fontWeight:700, color:col, padding:"5px 10px" }}>
                        ${t.price.toFixed(2)}
                      </td>
                      <td style={{ ...mono, fontSize:12, color:C.text, padding:"5px 10px" }}>
                        {t.size.toLocaleString()}
                      </td>
                      <td style={{ ...mono, fontSize:14, color:col, padding:"5px 10px" }}>
                        {dirArrow(t.direction)}
                      </td>
                      <td style={{ ...mono, fontSize:11, color:C.muted, padding:"5px 10px" }}>
                        {t.exchange}
                        {t.is_after_hours && (
                          <span style={{ ...mono, fontSize:9, color:"#8b5cf6",
                            marginLeft:4, background:"#8b5cf611", padding:"1px 5px", borderRadius:8 }}>
                            AH
                          </span>
                        )}
                      </td>
                      <td style={{ ...sans, fontSize:12, color:C.muted, padding:"5px 10px" }}>
                        {t.what_happened}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* Empty states */}
      {running && ticks.length === 0 && (
        <div style={{ textAlign:"center", padding:"60px 20px" }}>
          <div style={{ fontSize:32, marginBottom:12 }}>📡</div>
          <div style={{ ...sans, fontSize:15, color:C.muted }}>Waiting for trade prints…</div>
          <div style={{ ...sans, fontSize:12, color:C.muted, marginTop:6 }}>
            Ticks will appear as soon as shares trade. During pre-market or after-hours,
            volume is lower so prints may be infrequent — this is normal.
          </div>
        </div>
      )}

      {!running && status === "idle" && (
        <div style={{ textAlign:"center", padding:"60px 20px" }}>
          <div style={{ fontSize:32, marginBottom:12 }}>📈</div>
          <div style={{ ...sans, fontSize:15, color:C.muted }}>Enter a ticker and press Start</div>
          <div style={{ ...sans, fontSize:12, color:C.muted, marginTop:6 }}>
            Requires TWS or IB Gateway to be running and connected on port {7497}.
          </div>
        </div>
      )}
    </div>
  );
}


// ── Institutional Flow Tab ────────────────────────────────────────────────
function InstFlowTab() {
  const today = new Date().toISOString().slice(0, 10);
  const [date,    setDate]    = useState(today);
  const [data,    setData]    = useState(null);
  const [loading, setLoading] = useState(false);
  const [lastAt,  setLastAt]  = useState(null);
  const [sortCol, setSortCol] = useState("size");
  const [sortDir, setSortDir] = useState(-1);  // -1 = desc

  const load = async (d) => {
    setLoading(true);
    try {
      const res = await apiFetch(`/tape/blocks?date=${d}&limit=500`);
      setData(res);
      setLastAt(new Date().toLocaleTimeString());
    } catch(_) { setData(null); }
    setLoading(false);
  };

  useEffect(() => { load(date); }, []);

  const fmtV = (v) => {
    if (v == null) return "—";
    if (Math.abs(v) >= 1e9)  return `${(v/1e9).toFixed(2)}B`;
    if (Math.abs(v) >= 1e6)  return `${(v/1e6).toFixed(2)}M`;
    if (Math.abs(v) >= 1e3)  return `${(v/1e3).toFixed(1)}K`;
    return v.toLocaleString();
  };
  const fmt$ = (v) => v == null ? "—" : `$${(v/1e6).toFixed(2)}M`;
  const fmt$k = (v) => v == null ? "—" : v >= 1e6 ? `$${(v/1e6).toFixed(2)}M` : v >= 1e3 ? `$${(v/1e3).toFixed(1)}K` : `$${v}`;

  const biasColor = (b) => b && b.includes("BULL") ? C.bull : b && b.includes("BEAR") ? C.bear : C.neutral;
  const biasShort = (b) => b === "STRONGLY BULLISH" ? "S.BULL" : b === "STRONGLY BEARISH" ? "S.BEAR" : b || "—";

  // Sort the prints
  const prints = data?.prints ? [...data.prints].sort((a, b) => {
    const av = a[sortCol] ?? 0, bv = b[sortCol] ?? 0;
    return sortDir * (typeof av === "string" ? av.localeCompare(bv) : bv - av) * -1;
  }) : [];

  const Th = ({ col, label }) => (
    <th onClick={() => { if (sortCol === col) setSortDir(d => -d); else { setSortCol(col); setSortDir(-1); } }}
      style={{ ...mono, fontSize:10, color: sortCol===col ? C.accent : C.muted, fontWeight:600,
        textTransform:"uppercase", letterSpacing:0.5, padding:"8px 10px", whiteSpace:"nowrap",
        borderBottom:`1px solid ${C.border}`, cursor:"pointer", userSelect:"none" }}>
      {label}{sortCol===col ? (sortDir<0 ? " ↓" : " ↑") : ""}
    </th>
  );

  const noData = !data || data.total_blocks === 0;
  const buyPct = data && data.total_shares > 0
    ? Math.round(data.buy_shares / data.total_shares * 100) : 50;

  return (
    <div>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start",
        marginBottom:16, flexWrap:"wrap", gap:10 }}>
        <div>
          <div style={{ ...sans, fontSize:17, fontWeight:700, color:C.white }}>
            Institutional Block Flow
          </div>
          <div style={{ ...sans, fontSize:12, color:C.muted, marginTop:2 }}>
            Large prints ≥ 5,000 shares captured from all subscribed tickers · stored in tape_data.db
          </div>
        </div>
        <div style={{ display:"flex", gap:10, alignItems:"center" }}>
          <input type="date" value={date} max={today}
            onChange={e => setDate(e.target.value)}
            style={{ ...mono, fontSize:12, padding:"6px 10px", borderRadius:6,
              background:C.dim, border:`1px solid ${C.border}`, color:C.text, outline:"none" }} />
          <button onClick={() => load(date)} disabled={loading}
            style={{ ...sans, fontSize:12, fontWeight:700, padding:"7px 18px", borderRadius:6,
              background:C.accent, border:"none", color:"#fff", cursor:"pointer", opacity:loading?0.6:1 }}>
            {loading ? "⟳ Loading…" : "↻ Refresh"}
          </button>
          {lastAt && <span style={{ ...sans, fontSize:10, color:C.muted }}>Updated {lastAt}</span>}
        </div>
      </div>

      {/* Summary strip */}
      {data && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",
          gap:12, marginBottom:20 }}>
          {[
            { label:"Block Prints",     value: data.total_blocks.toLocaleString(),
              sub:"Total institutional prints",  color: C.white },
            { label:"Institutional Vol",value: fmtV(data.total_shares),
              sub:"Total shares in blocks",       color:"#8b5cf6" },
            { label:"Dollar Volume",    value: fmt$(data.total_dollar_vol),
              sub:"Estimated $ traded in blocks", color:"#f59e0b" },
            { label:"Buy Pressure",     value: `${buyPct}%`,
              sub: `${fmtV(data.buy_shares)} buy vs ${fmtV(data.sell_shares)} sell`,
              color: buyPct >= 55 ? C.bull : buyPct <= 45 ? C.bear : C.neutral },
            { label:"Tickers Active",   value: data.by_ticker?.length ?? 0,
              sub:"Unique tickers with blocks",   color: C.text },
          ].map(s => (
            <div key={s.label} style={{ background:C.card, border:`1px solid ${C.border}`,
              borderRadius:10, padding:"14px 12px", textAlign:"center" }}>
              <div style={{ ...sans, fontSize:10, color:C.muted, textTransform:"uppercase",
                letterSpacing:1, marginBottom:6 }}>{s.label}</div>
              <div style={{ ...mono, fontSize:22, fontWeight:800, color:s.color }}>{s.value}</div>
              <div style={{ ...sans, fontSize:10, color:C.muted, marginTop:3 }}>{s.sub}</div>
            </div>
          ))}
        </div>
      )}

      {/* Buy/Sell flow bar */}
      {data && data.total_shares > 0 && (
        <Card style={{ marginBottom:16, padding:"12px 16px" }}>
          <div style={{ ...sans, fontSize:11, fontWeight:700, color:C.muted,
            textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>
            Session Buy vs Sell Flow (Block Trades Only)
          </div>
          <div style={{ display:"flex", height:18, borderRadius:6, overflow:"hidden", gap:1 }}>
            <div style={{ width:`${buyPct}%`, background:C.bull, borderRadius:"6px 0 0 6px",
              transition:"width 0.4s", position:"relative" }}>
              {buyPct > 15 && <span style={{ ...mono, fontSize:10, color:"#fff", fontWeight:700,
                position:"absolute", left:8, top:"50%", transform:"translateY(-50%)" }}>
                BUY {buyPct}%
              </span>}
            </div>
            <div style={{ flex:1, background:C.bear, borderRadius:"0 6px 6px 0" }}>
              {(100-buyPct) > 15 && <span style={{ ...mono, fontSize:10, color:"#fff", fontWeight:700,
                position:"absolute", right:8, top:"50%", transform:"translateY(-50%)" }}>
                SELL {100-buyPct}%
              </span>}
            </div>
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", marginTop:4 }}>
            <span style={{ ...mono, fontSize:10, color:C.bull }}>
              {fmtV(data.buy_shares)} shares bought
            </span>
            <span style={{ ...mono, fontSize:10, color:C.bear }}>
              {fmtV(data.sell_shares)} shares sold
            </span>
          </div>
        </Card>
      )}

      {/* Per-ticker summary grid */}
      {data && data.by_ticker?.length > 0 && (
        <Card title="Block Flow by Ticker" style={{ marginBottom:16 }}>
          <div style={{ overflowX:"auto" }}>
            <table style={{ fontSize:12, width:"100%", borderCollapse:"collapse" }}>
              <thead>
                <tr style={{ background:C.surface }}>
                  {["Ticker","Blocks","Total Shares","Buy Shares","Sell Shares","Net Flow","$ Volume","Bias","First","Last"].map(h => (
                    <th key={h} style={{ ...mono, fontSize:10, color:C.muted, fontWeight:600,
                      textTransform:"uppercase", letterSpacing:0.5,
                      borderBottom:`1px solid ${C.border}`, padding:"7px 10px",
                      textAlign:"left", whiteSpace:"nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {data.by_ticker.map((t, i) => {
                  const netCol = t.net_flow >= 0 ? C.bull : C.bear;
                  const bc     = biasColor(t.bias);
                  return (
                    <tr key={t.ticker} style={{
                      borderBottom:`1px solid ${C.border}`,
                      background: i % 2 === 0 ? "transparent" : C.surface,
                    }}>
                      <td style={{ ...mono, fontWeight:800, fontSize:13, color:C.white,
                        padding:"8px 10px" }}>{t.ticker}</td>
                      <td style={{ ...mono, color:C.muted, padding:"8px 10px" }}>
                        {t.block_count}</td>
                      <td style={{ ...mono, color:"#8b5cf6", fontWeight:700, padding:"8px 10px" }}>
                        {fmtV(t.total_shares)}</td>
                      <td style={{ ...mono, color:C.bull, padding:"8px 10px" }}>
                        {fmtV(t.buy_shares)}</td>
                      <td style={{ ...mono, color:C.bear, padding:"8px 10px" }}>
                        {fmtV(t.sell_shares)}</td>
                      <td style={{ ...mono, color:netCol, fontWeight:700, padding:"8px 10px" }}>
                        {t.net_flow >= 0 ? "+" : ""}{fmtV(t.net_flow)}</td>
                      <td style={{ ...mono, color:"#f59e0b", padding:"8px 10px" }}>
                        {fmt$k(t.dollar_vol)}</td>
                      <td style={{ padding:"8px 10px" }}>
                        <span style={{ ...mono, fontSize:10, fontWeight:700, color:bc,
                          background:`${bc}15`, border:`1px solid ${bc}33`,
                          borderRadius:4, padding:"2px 7px" }}>
                          {biasShort(t.bias)}
                        </span>
                      </td>
                      <td style={{ ...mono, fontSize:10, color:C.muted, padding:"8px 10px" }}>
                        {t.first_seen?.slice(11,19) || "—"}</td>
                      <td style={{ ...mono, fontSize:10, color:C.muted, padding:"8px 10px" }}>
                        {t.last_seen?.slice(11,19) || "—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* Ranked individual block prints */}
      {data && prints.length > 0 && (
        <Card style={{ padding:0, overflow:"hidden" }}>
          <div style={{ padding:"12px 16px", borderBottom:`1px solid ${C.border}`,
            display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <span style={{ ...sans, fontSize:13, fontWeight:700, color:C.white }}>
              Individual Block Prints &nbsp;
              <span style={{ ...mono, fontSize:11, color:C.muted }}>
                ({prints.length} total · click column header to sort)
              </span>
            </span>
            <span style={{ ...sans, fontSize:10, color:C.muted }}>
              Blocks ≥ 5,000 shares · CVD score at time of print
            </span>
          </div>
          <div style={{ overflowX:"auto", maxHeight:600, overflowY:"auto" }}>
            <table style={{ fontSize:12, width:"100%", borderCollapse:"collapse" }}>
              <thead style={{ position:"sticky", top:0, background:C.surface, zIndex:1 }}>
                <tr>
                  <Th col="rank"        label="#"          />
                  <Th col="ticker"      label="Ticker"     />
                  <Th col="ts"          label="Time"       />
                  <Th col="price"       label="Price"      />
                  <Th col="size"        label="Shares"     />
                  <Th col="dollar_value"label="$ Value"    />
                  <Th col="side"        label="Side"       />
                  <Th col="exchange"    label="Exch"       />
                  <Th col="pct_from_open" label="% Open"  />
                  <Th col="cvd_score"   label="CVD Score"  />
                </tr>
              </thead>
              <tbody>
                {prints.map((p, i) => {
                  const sideCol = p.side === "BUY" ? C.bull : C.bear;
                  const cvdCol  = p.cvd_score == null ? C.muted
                    : p.cvd_score > 0.25 ? C.bull : p.cvd_score < -0.25 ? C.bear : C.neutral;
                  return (
                    <tr key={i} style={{
                      borderBottom:`1px solid ${C.border}`,
                      borderLeft:`3px solid ${sideCol}`,
                      background: p.side === "BUY" ? `${C.bull}08` : `${C.bear}08`,
                    }}>
                      <td style={{ ...mono, color:C.muted, padding:"7px 10px", fontSize:11 }}>
                        {p.rank}</td>
                      <td style={{ ...mono, fontWeight:800, fontSize:13, color:C.white,
                        padding:"7px 10px" }}>{p.ticker}</td>
                      <td style={{ ...mono, fontSize:11, color:C.muted, padding:"7px 10px",
                        whiteSpace:"nowrap" }}>
                        {p.ts?.slice(11,19) || p.ts}</td>
                      <td style={{ ...mono, fontWeight:700, color:sideCol, padding:"7px 10px" }}>
                        ${parseFloat(p.price).toFixed(2)}</td>
                      <td style={{ ...mono, fontWeight:700, color:"#8b5cf6", padding:"7px 10px" }}>
                        {parseInt(p.size).toLocaleString()}</td>
                      <td style={{ ...mono, color:"#f59e0b", fontWeight:600, padding:"7px 10px" }}>
                        {fmt$k(p.dollar_value)}</td>
                      <td style={{ padding:"7px 10px" }}>
                        <span style={{ ...mono, fontSize:11, fontWeight:800, color:sideCol,
                          background:`${sideCol}18`, border:`1px solid ${sideCol}44`,
                          borderRadius:4, padding:"2px 8px" }}>
                          {p.side}
                        </span>
                      </td>
                      <td style={{ ...mono, fontSize:11, color:C.muted, padding:"7px 10px" }}>
                        {p.exchange || "—"}
                        {p.is_after_hours ? (
                          <span style={{ marginLeft:4, fontSize:9, color:"#8b5cf6",
                            background:"#8b5cf611", padding:"1px 4px", borderRadius:6 }}>AH</span>
                        ) : null}
                      </td>
                      <td style={{ ...mono, fontSize:11, padding:"7px 10px",
                        color: p.pct_from_open == null ? C.muted
                          : p.pct_from_open >= 0 ? C.bull : C.bear }}>
                        {p.pct_from_open != null
                          ? `${p.pct_from_open >= 0 ? "+" : ""}${p.pct_from_open.toFixed(2)}%`
                          : "—"}
                      </td>
                      <td style={{ ...mono, fontSize:11, fontWeight:700, color:cvdCol,
                        padding:"7px 10px" }}>
                        {p.cvd_score != null
                          ? `${p.cvd_score >= 0 ? "+" : ""}${parseFloat(p.cvd_score).toFixed(3)}`
                          : "—"}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* Empty state */}
      {!loading && noData && (
        <div style={{ textAlign:"center", padding:"80px 20px" }}>
          <div style={{ fontSize:40, marginBottom:14 }}>🏦</div>
          <div style={{ ...sans, fontSize:15, color:C.muted, marginBottom:8 }}>
            No block trades captured for {date}
          </div>
          <div style={{ ...sans, fontSize:12, color:C.muted, lineHeight:1.7, maxWidth:480, margin:"0 auto" }}>
            Block prints are captured automatically once the backend is running and tickers are
            subscribed. Open the <b>Live Tape</b> tab for additional tickers to start accumulating.
          </div>
        </div>
      )}
    </div>
  );
}


// ── Market Index Banner ───────────────────────────────────────────────────
function IndexBanner() {
  const [indexes, setIndexes] = useState([]);
  const [err,     setErr]     = useState(null);

  useEffect(() => {
    const load = async () => {
      try {
        const data = await apiFetch("/market/indexes");
        if (Array.isArray(data) && data.length) { setIndexes(data); setErr(null); }
      } catch(e) { setErr(String(e)); }
    };
    load();
    const iv = setInterval(load, 5000);
    return () => clearInterval(iv);
  }, []);

  const NAMES = { SPX:"SPX", NDX:"NDX", SPY:"S&P 500", QQQ:"Nasdaq", DIA:"Dow", IWM:"Russell", VIX:"VIX" };
  const PLACEHOLDERS = ["SPX","NDX","SPY","QQQ","DIA","IWM","VIX"];

  // Always render the bar — show skeleton chips while loading
  const items = indexes.length ? indexes : PLACEHOLDERS.map(s => ({
    sym: s, name: NAMES[s], price: null, prev_close: null,
    change: null, change_pct: null, is_live: false,
  }));

  return (
    <div style={{
      position: "fixed", top: 0, left: 0, right: 0, zIndex: 9999,
      background: "#0f172a",
      borderBottom: "1px solid #1e3a5f",
      display: "flex", alignItems: "center",
      padding: "0 16px", height: 40,
      overflowX: "auto", overflowY: "hidden",
      boxShadow: "0 1px 8px rgba(0,0,0,0.4)",
      userSelect: "none",
    }}>
      {/* Label */}
      <div style={{ ...mono, fontSize: 9, color: "#475569",
        textTransform: "uppercase", letterSpacing: 2,
        paddingRight: 14, borderRight: "1px solid #1e3a5f",
        marginRight: 14, whiteSpace: "nowrap", flexShrink: 0 }}>
        Markets
      </div>

      {items.map((idx, i) => {
        const loading  = idx.price == null;
        const up       = !loading && idx.change_pct >= 0;
        const isVix    = idx.sym === "VIX";
        const isIndex  = idx.sym === "SPX" || idx.sym === "NDX";
        const col      = loading ? "#475569" : up ? "#22c55e" : "#ef4444";
        // VIX inverted: rising = red (bearish), falling = green (calmer)
        const dispCol  = isVix && !loading ? (up ? "#ef4444" : "#22c55e") : col;
        const arrow    = loading ? "" : up ? "▲" : "▼";
        const pctStr   = loading ? "···"
          : `${up ? "+" : ""}${idx.change_pct.toFixed(2)}%`;
        const priceStr = loading ? "···"
          : isVix   ? idx.price.toFixed(2)
          : isIndex ? Math.round(idx.price).toLocaleString()
          : `$${idx.price.toFixed(2)}`;

        return (
          <div key={idx.sym} style={{
            display: "flex", alignItems: "center", gap: 7,
            padding: "0 14px",
            borderRight: i < items.length - 1 ? "1px solid #1e3a5f" : "none",
            flexShrink: 0,
          }}>
            <span style={{ ...sans, fontSize: 10, color: "#64748b",
              fontWeight: 700, whiteSpace: "nowrap", letterSpacing: 0.3 }}>
              {idx.name}
            </span>
            <span style={{ ...mono, fontSize: 13, fontWeight: 800,
              color: loading ? "#334155" : "#e2e8f0", whiteSpace: "nowrap" }}>
              {priceStr}
            </span>
            <span style={{ ...mono, fontSize: 11, fontWeight: 700,
              color: dispCol, whiteSpace: "nowrap" }}>
              {arrow}{arrow ? " " : ""}{pctStr}
            </span>
            {idx.is_live && (
              <span title="Live — IBKR real-time" style={{
                width: 5, height: 5, borderRadius: "50%",
                background: "#22c55e", boxShadow: "0 0 5px #22c55e88",
                display: "inline-block", flexShrink: 0,
              }} />
            )}
          </div>
        );
      })}

      <div style={{ flex: 1 }} />
      {err && (
        <span style={{ ...mono, fontSize: 9, color: "#ef4444", paddingLeft: 10,
          flexShrink: 0, whiteSpace: "nowrap" }} title={err}>
          ✕ {err.slice(0, 40)}
        </span>
      )}
      <div style={{ ...mono, fontSize: 9, color: "#1e3a5f",
        paddingLeft: 14, flexShrink: 0, whiteSpace: "nowrap" }}>
        ● 5s
      </div>
    </div>
  );
}

  useEffect(() => {
    apiFetch("/gex-vex/universe").then(res => setUniverse(res.tickers || [])).catch(() => {});
  }, []);

  const load = async (refresh) => {
    setLoading(true);
    setError(null);
    try {
      const res = await apiFetch(`/gex-vex/by-strike/${ticker}${refresh ? "?refresh=true" : ""}`);
      setData(res);
    } catch (e) {
      setError(e.message || "Failed to load — check the ticker has a listed 25-45 DTE option chain");
      setData(null);
    }
    setLoading(false);
  };

  const fmtD = (v) => {
    const sign = v < 0 ? "-" : "+";
    const av = Math.abs(v);
    if (av >= 1e9) return `${sign}$${(av/1e9).toFixed(2)}B`;
    if (av >= 1e6) return `${sign}$${(av/1e6).toFixed(2)}M`;
    if (av >= 1e3) return `${sign}$${(av/1e3).toFixed(1)}K`;
    return `${sign}$${av.toFixed(0)}`;
  };

  const Chart = ({ strikes, spot, dataKey, title, sub }) => {
    if (!strikes || strikes.length === 0) return null;
    const W = Math.max(700, strikes.length * 58);
    const H = 240;
    const padTop = 30, padBottom = 30;
    const plotH = H - padTop - padBottom;
    const barW = W / strikes.length;
    const maxAbs = Math.max(...strikes.map(s => Math.abs(s[dataKey])), 1);
    const midY = padTop + plotH / 2;
    const scale = (plotH / 2 - 4) / maxAbs;

    let spotX = null;
    for (let i = 0; i < strikes.length - 1; i++) {
      if (spot >= strikes[i].strike && spot <= strikes[i+1].strike) {
        const frac = (spot - strikes[i].strike) / (strikes[i+1].strike - strikes[i].strike);
        spotX = (i + 0.5 + frac) * barW;
        break;
      }
    }
    if (spotX === null) spotX = (strikes.length / 2) * barW;

    return (
      <div style={{ marginBottom: 20 }}>
        <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
          <span style={{ ...mono, fontSize:13, fontWeight:700, color:C.white }}>{title}</span>
          <span style={{ ...sans, fontSize:11, color:C.muted }}>{sub}</span>
        </div>
        <div style={{ overflowX:"auto" }}>
          <svg viewBox={`0 0 ${W} ${H}`} width={W} height={H} style={{ display:"block" }}>
            <line x1={0} x2={W} y1={midY} y2={midY} stroke={C.border} strokeWidth={1} />
            <line x1={spotX} x2={spotX} y1={padTop-12} y2={H-padBottom+2} stroke={C.accent} strokeWidth={1.5} strokeDasharray="4 3" />
            <text x={spotX} y={padTop-16} textAnchor="middle" style={{ ...mono, fontSize:10, fill:C.accent }}>spot {spot.toFixed(2)}</text>
            {strikes.map((s, i) => {
              const val = s[dataKey];
              const x = i * barW + barW * 0.18;
              const w = barW * 0.64;
              const h = Math.abs(val) * scale;
              const y = val >= 0 ? midY - h : midY;
              return (
                <g key={s.strike}
                   onMouseEnter={() => setHover(s)}
                   onMouseLeave={() => setHover(null)}
                   style={{ cursor:"pointer" }}>
                  <rect x={x} y={y} width={w} height={Math.max(h, 1.5)} rx={2}
                        fill={val >= 0 ? C.bull : C.bear}
                        opacity={hover && hover.strike===s.strike ? 1 : 0.85} />
                  <text x={x + w/2} y={H - padBottom + 16} textAnchor="middle"
                        style={{ ...mono, fontSize:10, fill:C.muted }}>{s.strike}</text>
                </g>
              );
            })}
          </svg>
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start",
        marginBottom:16, flexWrap:"wrap", gap:10 }}>
        <div>
          <div style={{ ...sans, fontSize:17, fontWeight:700, color:C.white }}>GEX / VEX by Strike</div>
          <div style={{ ...sans, fontSize:12, color:C.muted, marginTop:2 }}>
            Per-strike dealer gamma/vanna exposure, live from IBKR — pick any ticker from the curated universe
          </div>
        </div>
        <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
          <select value={ticker} onChange={e => setTicker(e.target.value)}
            style={{ ...mono, fontSize:12, padding:"6px 10px", borderRadius:6,
              background:C.dim, border:`1px solid ${C.border}`, color:C.text, outline:"none", minWidth:180 }}>
            {universe.map(u => <option key={u.ticker} value={u.ticker}>{u.ticker} — {u.sector}</option>)}
          </select>
          <button onClick={() => load(false)} disabled={loading}
            style={{ ...sans, fontSize:12, fontWeight:700, padding:"7px 18px", borderRadius:6,
              background:C.accent, border:"none", color:"#fff",
              cursor: loading ? "default" : "pointer", opacity:loading?0.6:1 }}>
            {loading ? "⟳ Scanning… (1-2 min)" : "Load"}
          </button>
          {data && !loading && (
            <button onClick={() => load(true)}
              style={{ ...sans, fontSize:11, padding:"7px 12px", borderRadius:6,
                background:"transparent", border:`1px solid ${C.border}`, color:C.muted, cursor:"pointer" }}>
              ↻ Refresh
            </button>
          )}
        </div>
      </div>

      {error && (
        <div style={{ ...sans, fontSize:12, color:C.bear, padding:"10px 14px",
          background:"#2d1214", borderRadius:8, marginBottom:16 }}>
          {error}
        </div>
      )}

      {data && (
        <React.Fragment>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",
            gap:12, marginBottom:20 }}>
            {[
              { label:"Spot",     value:`$${data.spot.toFixed(2)}` },
              { label:"Expiry",   value:data.expiry },
              { label:"DTE",      value:`${data.dte}d` },
              { label:"Net GEX",  value:fmtD(data.net_gex), color: data.net_gex>=0 ? C.bull : C.bear },
              { label:"Net VEX",  value:fmtD(data.net_vex), color: data.net_vex>=0 ? C.bull : C.bear },
              { label:"Regime",   value:data.gex_regime.replace("_"," "),
                color: data.gex_regime==="positive_gamma" ? C.bull : C.bear },
            ].map(s => (
              <div key={s.label} style={{ background:C.card, border:`1px solid ${C.border}`,
                borderRadius:8, padding:"10px 14px" }}>
                <div style={{ ...sans, fontSize:10, color:C.muted, textTransform:"uppercase",
                  letterSpacing:0.5, marginBottom:4 }}>{s.label}</div>
                <div style={{ ...mono, fontSize:15, color:s.color || C.white }}>{s.value}</div>
              </div>
            ))}
          </div>

          <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10,
            padding:16, position:"relative" }}>
            <Chart strikes={data.strikes} spot={data.spot} dataKey="net_gex"
              title="Net GEX by strike" sub="$ per 1% underlying move" />
            <Chart strikes={data.strikes} spot={data.spot} dataKey="net_vex"
              title="Net VEX by strike" sub="$ vanna exposure, same convention" />

            {hover && (
              <div style={{ position:"absolute", top:8, right:16, background:C.dim,
                border:`1px solid ${C.border}`, borderRadius:6, padding:"8px 12px",
                ...mono, fontSize:11, lineHeight:1.6 }}>
                <div style={{ color:C.accent, fontWeight:700 }}>{hover.strike} strike</div>
                <div>GEX: <span style={{ color: hover.net_gex>=0?C.bull:C.bear }}>{fmtD(hover.net_gex)}</span></div>
                <div>VEX: <span style={{ color: hover.net_vex>=0?C.bull:C.bear }}>{fmtD(hover.net_vex)}</span></div>
                <div style={{ color:C.muted }}>Call OI {hover.call_oi} · Put OI {hover.put_oi}</div>
              </div>
            )}
          </div>

          <div style={{ ...sans, fontSize:11, color:C.muted, lineHeight:1.7, marginTop:14 }}>
            Regime context, not a precise forecast. Net GEX/VEX rest on a standard dealer-positioning sign
            convention (call OI×gamma positive, put OI×gamma negative), a flat 4.5% risk-free rate for
            vanna, a single near-term expiry (25–45 DTE), and only the near-the-money strikes shown —
            not observed dealer inventory.
          </div>
        </React.Fragment>
      )}

      {!data && !loading && !error && (
        <div style={{ ...sans, fontSize:13, color:C.muted, padding:"40px 0", textAlign:"center" }}>
          Select a ticker and click Load. This scans live option chain data (~1-2 minutes for a full strike band).
        </div>
      )}
    </div>
  );
}


// ── Performance Tab ──────────────────────────────────────────────────────
function PerformanceTab() {
  const todayET = () => {
    const d = new Date();
    const et = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
    return et;
  };
  const [selDate, setSelDate]       = useState(todayET());
  const [data, setData]             = useState(null);
  const [loading, setLoading]       = useState(false);
  const [enriching, setEnriching]   = useState(false);
  const [showAnalysis, setShowAnalysis] = useState(false);
  const [analysis, setAnalysis]     = useState(null);
  const [analysisLoading, setAnalysisLoading] = useState(false);
  const [recentDays, setRecentDays] = useState([]);
  const [showStateOutcomes, setShowStateOutcomes] = useState(false);
  const [stateOutcomes, setStateOutcomes]         = useState(null);
  const [stateOutcomesLoading, setStateOutcomesLoading] = useState(false);

  const loadDay = async (d) => {
    setLoading(true);
    try {
      const r = await apiFetch(`/performance/daily?date=${d}`);
      setData(r);
    } catch(_) { setData(null); }
    finally { setLoading(false); }
  };

  const loadRecentDays = async () => {
    try {
      const r = await apiFetch("/performance/summary?days=14");
      setRecentDays((r.daily || []).slice().reverse().slice(0, 10));
    } catch(_) {}
  };

  useEffect(() => { loadDay(selDate); }, [selDate]);
  useEffect(() => { loadRecentDays(); }, []);

  const enrich = async () => {
    setEnriching(true);
    try {
      await apiFetch(`/performance/enrich?date=${selDate}`, { method: "POST" });
      await loadDay(selDate);
    } catch(_) {}
    finally { setEnriching(false); }
  };

  const loadAnalysis = async () => {
    if (analysis) { setShowAnalysis(s => !s); return; }
    setShowAnalysis(true);
    setAnalysisLoading(true);
    try {
      const r = await apiFetch("/performance/indicators?days=30");
      setAnalysis(r);
    } catch(_) {}
    finally { setAnalysisLoading(false); }
  };

  const loadStateOutcomes = async () => {
    if (stateOutcomes) { setShowStateOutcomes(s => !s); return; }
    setShowStateOutcomes(true);
    setStateOutcomesLoading(true);
    try {
      const r = await apiFetch("/performance/state-outcomes?days=30");
      setStateOutcomes(r);
    } catch(_) {}
    finally { setStateOutcomesLoading(false); }
  };

  const fmtRet = (v) => v == null ? "—" : `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`;
  const retColor = (v) => v == null ? C.muted : v > 0 ? "#16a34a" : "#dc2626";
  const winColor = (wr) => wr >= 65 ? "#16a34a" : wr >= 45 ? "#d97706" : "#dc2626";

  const rows = data?.rows || [];
  const sum  = data?.summary || {};

  const best  = sum.best  ? `${sum.best.ticker} ${fmtRet(sum.best.eod_return_pct)}`  : "—";
  const worst = sum.worst ? `${sum.worst.ticker} ${fmtRet(sum.worst.eod_return_pct)}` : "—";

  const IndicatorTable = ({ title, rows: trows, keyField }) => {
    if (!trows || trows.length === 0) return null;
    return (
      <div style={{ marginBottom: 20 }}>
        <div style={{ ...sans, fontSize: 11, fontWeight: 700, color: C.muted, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>{title}</div>
        <table style={{ width: "100%", borderCollapse: "collapse", ...sans, fontSize: 12 }}>
          <thead>
            <tr style={{ borderBottom: `1px solid ${C.border}` }}>
              {["Label", "Count", "Win %", "Avg Return"].map(h => (
                <th key={h} style={{ padding: "5px 8px", textAlign: "left", color: C.muted, fontSize: 10, fontWeight: 600, textTransform: "uppercase" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {trows.map((r, i) => (
              <tr key={i} style={{ borderBottom: `1px solid ${C.border}33` }}>
                <td style={{ padding: "5px 8px", color: C.white, ...mono, fontSize: 11 }}>{r[keyField]}</td>
                <td style={{ padding: "5px 8px", color: C.muted }}>{r.count}</td>
                <td style={{ padding: "5px 8px", color: winColor(r.win_rate), fontWeight: 700 }}>{r.win_rate}%</td>
                <td style={{ padding: "5px 8px", color: retColor(r.avg_return), fontWeight: 600 }}>{fmtRet(r.avg_return)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  };

  const keyInsight = () => {
    if (!analysis) return null;
    const candidates = [];
    const push = (rows, key) => (rows || []).filter(r => r.count >= 5).forEach(r => candidates.push({ label: `${key}: ${r[Object.keys(r)[0]]}`, win_rate: r.win_rate, count: r.count }));
    push(analysis.by_signal_type, "Signal");
    push(analysis.by_rsi, "RSI");
    push(analysis.by_pct_b, "%B");
    push(analysis.by_vol_ratio, "Vol Ratio");
    push(analysis.by_tape, "Tape");
    push(analysis.by_hour, "Hour");
    if (!candidates.length) return null;
    const best = candidates.reduce((a, b) => b.win_rate > a.win_rate ? b : a);
    return best;
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ ...sans, fontSize: 17, fontWeight: 700, color: C.white }}>Alert Performance</div>
          <div style={{ ...sans, fontSize: 12, color: C.muted, marginTop: 2 }}>EOD return from alert price · auto-enriched at 16:15 ET</div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <input type="date" value={selDate} onChange={e => setSelDate(e.target.value)}
            style={{ ...mono, fontSize: 12, padding: "5px 10px", borderRadius: 6, background: C.surface, border: `1px solid ${C.border}`, color: C.text, cursor: "pointer" }} />
          <button onClick={enrich} disabled={enriching}
            style={{ ...sans, fontSize: 12, padding: "6px 14px", borderRadius: 6, background: C.accent, border: "none", color: "#fff", cursor: "pointer", opacity: enriching ? 0.6 : 1 }}>
            {enriching ? "Refreshing…" : "Refresh EOD Data"}
          </button>
        </div>
      </div>

      {recentDays.length > 0 && (
        <div style={{ marginBottom: 20, overflowX: "auto" }}>
          <div style={{ ...sans, fontSize: 11, fontWeight: 700, color: C.muted, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Recent Days — click to view</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {recentDays.map(d => {
              const isSel = d.date === selDate;
              const wr = d.win_rate;
              const wrColor = wr >= 65 ? "#16a34a" : wr >= 45 ? "#d97706" : "#dc2626";
              return (
                <button key={d.date} onClick={() => setSelDate(d.date)}
                  style={{ ...sans, fontSize: 11, padding: "6px 10px", borderRadius: 6, cursor: "pointer",
                    background: isSel ? C.accent : C.surface,
                    border: `1px solid ${isSel ? C.accent : C.border}`,
                    color: isSel ? "#fff" : C.text, textAlign: "left", minWidth: 90 }}>
                  <div style={{ fontWeight: 700, marginBottom: 2 }}>{d.date.slice(5)}</div>
                  <div style={{ color: isSel ? "#ffffffcc" : wrColor, fontWeight: 700 }}>{wr}% win</div>
                  <div style={{ color: isSel ? "#ffffff88" : C.muted, fontSize: 10 }}>{d.count} alerts · {d.avg_return >= 0 ? "+" : ""}{d.avg_return.toFixed(1)}%</div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {loading ? (
        <div style={{ color: C.muted, ...sans, fontSize: 13, padding: "40px 0", textAlign: "center" }}>Loading…</div>
      ) : (
        <>
          <div style={{ display: "flex", gap: 12, marginBottom: 20, flexWrap: "wrap" }}>
            {[
              { label: "Total Alerts", value: sum.total ?? "—", color: C.white },
              { label: "Win Rate",     value: sum.win_rate != null ? `${sum.win_rate}%` : "—", color: sum.win_rate != null ? (sum.win_rate > 50 ? "#16a34a" : "#dc2626") : C.muted },
              { label: "Avg Return",   value: fmtRet(sum.avg_return), color: retColor(sum.avg_return) },
              { label: "Best",         value: best, color: "#16a34a" },
              { label: "Worst",        value: worst, color: "#dc2626" },
            ].map(({ label, value, color }) => (
              <div key={label} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "12px 16px", minWidth: 120, flex: "1 1 120px" }}>
                <div style={{ ...sans, fontSize: 10, color: C.muted, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>{label}</div>
                <div style={{ ...mono, fontSize: 15, fontWeight: 700, color }}>{value}</div>
              </div>
            ))}
          </div>

          {rows.length === 0 ? (
            <div style={{ textAlign: "center", padding: "60px 20px", color: C.muted, ...sans, fontSize: 14 }}>No alerts found for {selDate}</div>
          ) : (
            <div style={{ overflowX: "auto", marginBottom: 24 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", ...sans, fontSize: 13 }}>
                <thead>
                  <tr style={{ borderBottom: `2px solid ${C.border}` }}>
                    {["Time (ET)", "Ticker", "Signal", "Alert $", "EOD $", "Return %", "Result"].map(h => (
                      <th key={h} style={{ padding: "8px 10px", textAlign: "left", color: C.muted, fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => {
                    const enriched = r.eod_return_pct != null;
                    const rowBg = !enriched ? `${C.muted}11` : r.is_win ? "#16a34a11" : "#dc262611";
                    const sigColor = r.signal_type === "BREAKOUT" ? "#ef4444" : "#f59e0b";
                    return (
                      <tr key={i} style={{ background: rowBg, borderBottom: `1px solid ${C.border}33` }}>
                        <td style={{ padding: "7px 10px", ...mono, fontSize: 11, color: C.muted }}>{r.alert_time_et || "—"}</td>
                        <td style={{ padding: "7px 10px", fontWeight: 700, color: C.white }}>{r.ticker}</td>
                        <td style={{ padding: "7px 10px" }}>
                          <span style={{ ...mono, fontSize: 10, padding: "2px 7px", borderRadius: 10, background: `${sigColor}22`, color: sigColor, border: `1px solid ${sigColor}44`, fontWeight: 700 }}>{r.signal_type}</span>
                        </td>
                        <td style={{ padding: "7px 10px", ...mono, fontSize: 12 }}>{r.alert_price != null ? `$${r.alert_price.toFixed(2)}` : "—"}</td>
                        <td style={{ padding: "7px 10px", ...mono, fontSize: 12 }}>{r.eod_price != null ? `$${r.eod_price.toFixed(2)}` : "—"}</td>
                        <td style={{ padding: "7px 10px", ...mono, fontSize: 12, fontWeight: 700, color: retColor(r.eod_return_pct) }}>{fmtRet(r.eod_return_pct)}</td>
                        <td style={{ padding: "7px 10px" }}>
                          {!enriched ? (
                            <span style={{ ...sans, fontSize: 11, color: C.muted }}>Pending</span>
                          ) : r.is_win ? (
                            <span style={{ ...mono, fontSize: 10, padding: "2px 7px", borderRadius: 10, background: "#16a34a22", color: "#16a34a", border: "1px solid #16a34a44", fontWeight: 700 }}>WIN</span>
                          ) : (
                            <span style={{ ...mono, fontSize: 10, padding: "2px 7px", borderRadius: 10, background: "#dc262622", color: "#dc2626", border: "1px solid #dc262644", fontWeight: 700 }}>LOSS</span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          <div style={{ border: `1px solid ${C.border}`, borderRadius: 8, overflow: "hidden", marginBottom: 10 }}>
            <button onClick={loadStateOutcomes} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "12px 16px", background: C.surface, border: "none", cursor: "pointer", ...sans, fontSize: 13, fontWeight: 600, color: C.white }}>
              <span>State Machine Outcomes (last 30 days)</span>
              <span style={{ ...mono, fontSize: 14, color: C.accent }}>{showStateOutcomes ? "▲" : "▼"}</span>
            </button>
            {showStateOutcomes && (
              <div style={{ padding: "16px", borderTop: `1px solid ${C.border}`, background: C.bg }}>
                {stateOutcomesLoading ? (
                  <div style={{ color: C.muted, ...sans, fontSize: 13, textAlign: "center", padding: "20px 0" }}>Loading…</div>
                ) : !stateOutcomes ? (
                  <div style={{ color: C.muted, ...sans, fontSize: 13 }}>No data</div>
                ) : (
                  <>
                    <div style={{ ...sans, fontSize: 11, color: C.muted, marginBottom: 16 }}>
                      {stateOutcomes.total_transitions} total transitions · {stateOutcomes.setup_entries} setup entries · {stateOutcomes.breakout_entries} breakout entries
                      <span style={{ marginLeft: 8, color: "#f59e0b" }}>· Intraday returns available only for transitions recorded after today's update</span>
                    </div>

                    {/* Conversion Funnel */}
                    {stateOutcomes.funnel?.length > 0 && (
                      <div style={{ marginBottom: 20 }}>
                        <div style={{ ...sans, fontSize: 11, fontWeight: 700, color: C.muted, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Setup Funnel — Pre-Breakout Entries</div>
                        <table style={{ width: "100%", borderCollapse: "collapse", ...sans, fontSize: 12 }}>
                          <thead>
                            <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                              {["Entry Transition","Count","→ BREAKOUT","Failed","Still Active","Intra Win%","Intra Avg Ret","EOD Win%","EOD Avg Ret"].map(h => (
                                <th key={h} style={{ padding: "5px 8px", textAlign: "left", color: C.muted, fontSize: 10, fontWeight: 600, textTransform: "uppercase" }}>{h}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {stateOutcomes.funnel.map((r, i) => (
                              <tr key={i} style={{ borderBottom: `1px solid ${C.border}33` }}>
                                <td style={{ padding: "6px 8px", ...mono, fontSize: 11, color: "#f59e0b", fontWeight: 700 }}>{r.entry}</td>
                                <td style={{ padding: "6px 8px", color: C.muted }}>{r.count}</td>
                                <td style={{ padding: "6px 8px", color: "#16a34a", fontWeight: 700 }}>{r.pct_converted}%</td>
                                <td style={{ padding: "6px 8px", color: "#dc2626" }}>{r.pct_failed}%</td>
                                <td style={{ padding: "6px 8px", color: C.muted }}>{r.pct_still_active}%</td>

                                <td style={{ padding: "6px 8px", color: "#16a34a" }}>{d.pct_held ?? "—"}%</td>
                                <td style={{ padding: "6px 8px", color: d.win_rate != null ? winColor(d.win_rate) : C.muted, fontWeight: 700 }}>{d.win_rate != null ? `${d.win_rate}%` : "—"}</td>
                                <td style={{ padding: "6px 8px", color: retColor(d.avg_return), fontWeight: 600 }}>{d.avg_return != null ? fmtRet(d.avg_return) : "—"}</td>

                        </table>
                      </div>
                    )}

                    {/* Exit analysis */}
                    {stateOutcomes.exits?.length > 0 && (
                      <div>

                          <tbody>

            )}
          </div>

          <div style={{ border: `1px solid ${C.border}`, borderRadius: 8, overflow: "hidden" }}>
            <button onClick={loadAnalysis} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "12px 16px", background: C.surface, border: "none", cursor: "pointer", ...sans, fontSize: 13, fontWeight: 600, color: C.white }}>

                  <div style={{ color: C.muted, ...sans, fontSize: 13, textAlign: "center", padding: "20px 0" }}>Loading analysis…</div>

                    <div style={{ ...sans, fontSize: 11, color: C.muted, marginBottom: 16 }}>

                    </div>

                      <IndicatorTable title="By Signal Type" rows={analysis.by_signal_type} keyField="label" />

                      <IndicatorTable title="By Tape Label" rows={analysis.by_tape} keyField="label" />

                    <div style={{ marginTop: 4 }}>

            )}

        </>
      )}
    </div>
  );
}

function _newsTimeAgo(isoStr) {
  if (!isoStr) return null;
  try {
    const mins = Math.floor((Date.now() - new Date(isoStr)) / 60000);
    if (mins <  1)  return "just now";
    if (mins < 60)  return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs  < 24)  return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  } catch { return null; }
}

function _newsFreshnessColor(isoStr) {
  if (!isoStr) return "#475569";
  try {
    const mins = (Date.now() - new Date(isoStr)) / 60000;
    if (mins < 20)  return "#4ade80";   // green  — breaking (< 20 min)
    if (mins < 90)  return "#fbbf24";   // amber  — recent   (< 90 min)
    if (mins < 360) return "#94a3b8";   // slate  — today
    return "#475569";                    // dim    — older
  } catch { return "#475569"; }
}

function SourceLogo({ domain, name }) {
  const [ok, setOk] = React.useState(true);
  if (!ok) return (
    <span style={{...sans, fontSize:10, color:C.muted, background:C.surface,
      borderRadius:3, padding:"1px 4px", border:`1px solid ${C.border}`}}>
      {name.slice(0,3).toUpperCase()}
    </span>
  );
  return (
    <img
      src={`https://www.google.com/s2/favicons?domain=${domain}&sz=16`}
      title={name}
      alt={name}
      onError={() => setOk(false)}
      style={{width:14, height:14, borderRadius:2, verticalAlign:"middle",
        imageRendering:"crisp-edges"}}
    />
  );
}

            {a.excerpt && a.excerpt.length > 20 && (

            {/* Row 4: source logo chips · read link */}
            <div style={{display:"flex", gap:6, alignItems:"center", flexWrap:"wrap"}}>
              {(a.sources||[]).map((name, si) => (
                <div key={si} style={{display:"flex", alignItems:"center", gap:4,

                  border:`1px solid ${C.border}`}}>
                  <SourceLogo domain={domains[si] || ""} name={name} />
                  <span style={{...sans, fontSize:10, color:C.muted}}>{name}</span>
                </div>

              {a.url && (
                <a href={a.url} target="_blank" rel="noopener noreferrer"
                  style={{...sans, fontSize:11, color:"#60a5fa", textDecoration:"none",
                    marginLeft:"auto", flexShrink:0}}>
                  Read ↗
                </a>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}
